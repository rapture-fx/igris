# DRAGONFLY VERIFICATION STAGING ENVIRONMENT
# Run Redis and Dragonfly side-by-side for safe testing
# Once tests pass 100% → proceed to production migration

version: '3.8'

services:
  # EXISTING: Redis (keep running for safety)
  redis:
    image: redis:7-alpine
    container_name: schlep-redis-staging
    ports:
      - "6379:6379"  # Redis on default port
    command: redis-server --appendonly yes
    volumes:
      - redis-staging-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - schlep-network

  # NEW: Dragonfly (side-by-side for testing)
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: schlep-dragonfly-staging
    ports:
      - "6380:6379"  # Dragonfly on port 6380 (different from Redis)
    command: >
      dragonfly
      --logtostderr
      --maxmemory 4gb
      --cache_mode
      --proactor_threads 8
    volumes:
      - dragonfly-staging-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - schlep-network

volumes:
  redis-staging-data:
  dragonfly-staging-data:

networks:
  schlep-network:
    driver: bridge
