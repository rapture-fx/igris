groups:
  - name: igris_api_alerts
    interval: 30s
    rules:

      # -----------------------------------------------------------------------
      # APIDown — critical if the API has been unreachable for 1 minute
      # -----------------------------------------------------------------------
      - alert: APIDown
        expr: up{job="api"} == 0
        for: 1m
        labels:
          severity: critical
          team: oncall
        annotations:
          summary: "Igris API is down"
          description: >
            The Igris Overture API (job={{ $labels.job }}) has been unreachable
            for more than 1 minute. Prometheus cannot scrape /metrics.
            Check: docker compose ps api && docker compose logs api
          runbook_url: "https://github.com/Igris-inertial/system/blob/main/ops/runbook.md#apidown"

      # -----------------------------------------------------------------------
      # HighAPIErrorRate — warning when 5xx rate exceeds 1% of traffic
      # -----------------------------------------------------------------------
      - alert: HighAPIErrorRate
        expr: >
          (
            rate(http_requests_total{status=~"5.."}[5m])
            /
            rate(http_requests_total[5m])
          ) > 0.01
        for: 5m
        labels:
          severity: warning
          team: engineering
        annotations:
          summary: "High API 5xx error rate ({{ $value | humanizePercentage }})"
          description: >
            The 5xx error rate over the last 5 minutes is {{ $value | humanizePercentage }},
            which exceeds the 1% threshold.
            Instance: {{ $labels.instance }}
          runbook_url: "https://github.com/Igris-inertial/system/blob/main/ops/runbook.md#highapierrorrate"

      # -----------------------------------------------------------------------
      # BillingWebhookFailure — critical on any Polar webhook processing error
      # -----------------------------------------------------------------------
      - alert: BillingWebhookFailure
        expr: increase(billing_webhook_failures_total[5m]) > 0
        for: 0m
        labels:
          severity: critical
          team: oncall
        annotations:
          summary: "Billing webhook processing failure detected"
          description: >
            {{ $value }} billing webhook failure(s) recorded in the last 5 minutes.
            This means Polar subscription events are not being processed correctly.
            Subscription activations and tier upgrades may be broken.
          runbook_url: "https://github.com/Igris-inertial/system/blob/main/ops/runbook.md#billingwebhookfailure"

      # -----------------------------------------------------------------------
      # InstallSuccessDrop — warning when install completion rate drops below 80%
      # Only fires when there is meaningful install traffic (>0 attempts).
      # -----------------------------------------------------------------------
      - alert: InstallSuccessDrop
        expr: >
          (
            rate(runtime_install_completions_total[30m])
            /
            rate(runtime_install_attempts_total[30m])
          ) < 0.8
          and
          rate(runtime_install_attempts_total[30m]) > 0
        for: 10m
        labels:
          severity: warning
          team: engineering
        annotations:
          summary: "Runtime install success rate dropped below 80%"
          description: >
            The runtime binary install completion rate over the last 30 minutes is
            {{ $value | humanizePercentage }}, below the 80% threshold.
            This may indicate missing binaries, filesystem errors, or redirect misconfiguration.
          runbook_url: "https://github.com/Igris-inertial/system/blob/main/ops/runbook.md#installsuccessdrop"

  - name: igris_host_alerts
    interval: 60s
    rules:

      # -----------------------------------------------------------------------
      # DiskSpaceCritical — critical when root filesystem has less than 15% free
      # -----------------------------------------------------------------------
      - alert: DiskSpaceCritical
        expr: >
          (
            node_filesystem_avail_bytes{mountpoint="/"}
            /
            node_filesystem_size_bytes{mountpoint="/"}
          ) < 0.15
        for: 5m
        labels:
          severity: critical
          team: oncall
        annotations:
          summary: "Disk space critically low on {{ $labels.instance }}"
          description: >
            Available disk space on mountpoint {{ $labels.mountpoint }} is
            {{ $value | humanizePercentage }} of total capacity.
            Docker images and database WAL files will fail to write when disk is full.
          runbook_url: "https://github.com/Igris-inertial/system/blob/main/ops/runbook.md#diskspacecritical"

      # -----------------------------------------------------------------------
      # HighMemoryUsage — warning when host memory usage exceeds 90%
      # -----------------------------------------------------------------------
      - alert: HighMemoryUsage
        expr: >
          (
            1 - (
              node_memory_MemAvailable_bytes
              /
              node_memory_MemTotal_bytes
            )
          ) > 0.90
        for: 5m
        labels:
          severity: warning
          team: engineering
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: >
            Memory usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}.
            OOM kills may occur for running containers.

      # -----------------------------------------------------------------------
      # HighCPULoad — warning when 5-minute load average exceeds CPU count
      # -----------------------------------------------------------------------
      - alert: HighCPULoad
        expr: node_load5 / count without(cpu, mode)(node_cpu_seconds_total{mode="idle"}) > 1.5
        for: 10m
        labels:
          severity: warning
          team: engineering
        annotations:
          summary: "High CPU load on {{ $labels.instance }}"
          description: >
            5-minute load average is {{ $value }} times the number of CPUs.
            System may be CPU-saturated.
