global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s
  external_labels:
    environment: production
    project: igris-inertial

# Load alert rules
rule_files:
  - "/etc/prometheus/alert-rules.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      timeout: 10s

scrape_configs:
  # Igris Overture Go API
  # Prometheus joins igris-network so it can reach api:8080 directly by service name
  - job_name: "api"
    static_configs:
      - targets:
          - "api:8080"
        labels:
          service: igris-overture
          component: api
    metrics_path: /metrics
    scrape_interval: 15s
    scrape_timeout: 10s

  # Node exporter — host-level metrics (disk, memory, CPU, load)
  - job_name: "node"
    static_configs:
      - targets:
          - "node-exporter:9100"
        labels:
          service: node-exporter
          component: host
    metrics_path: /metrics
    scrape_interval: 15s

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"
        labels:
          service: prometheus
          component: monitoring

  # Alertmanager self-monitoring
  - job_name: "alertmanager"
    static_configs:
      - targets:
          - "alertmanager:9093"
        labels:
          service: alertmanager
          component: monitoring
