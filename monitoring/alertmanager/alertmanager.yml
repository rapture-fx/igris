global:
  # How long to wait before sending a notification again if it has already been sent
  resolve_timeout: 5m
  # Slack API URL will be overridden per receiver via env var substitution
  # AlertManager supports env var substitution in config values using ${VAR} syntax
  # when started with --config.file and env vars set in the process environment.

route:
  # Default grouping — group by alertname and severity to reduce noise
  group_by: ["alertname", "severity"]
  # Wait before sending the first notification (allows grouping of related alerts)
  group_wait: 30s
  # Wait before sending a notification about new alerts in an existing group
  group_interval: 5m
  # Wait before resending a notification for an alert that is still firing
  repeat_interval: 4h
  # Default receiver for unmatched alerts
  receiver: "slack-warnings"

  routes:
    # Critical alerts go to both Slack critical channel and PagerDuty
    - match:
        severity: critical
      receiver: "slack-critical"
      continue: true

    - match:
        severity: critical
      receiver: "pagerduty"
      group_wait: 0s
      repeat_interval: 1h

    # Warning alerts go to Slack warnings channel
    - match:
        severity: warning
      receiver: "slack-warnings"
      group_wait: 1m
      repeat_interval: 6h

receivers:
  # Critical alerts Slack channel
  - name: "slack-critical"
    slack_configs:
      - api_url: "${SLACK_ALERTS_WEBHOOK}"
        channel: "#alerts"
        send_resolved: true
        username: "Igris Alertmanager"
        icon_emoji: ":rotating_light:"
        title: |-
          [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
        text: |-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Severity:* `{{ .Labels.severity }}`
          *Description:* {{ .Annotations.description }}
          {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
          *Started:* {{ .StartsAt | since }}
          {{ end }}
        color: |-
          {{ if eq .Status "firing" }}danger{{ else }}good{{ end }}

  # Warning alerts Slack channel
  - name: "slack-warnings"
    slack_configs:
      - api_url: "${SLACK_ALERTS_WEBHOOK}"
        channel: "#alerts"
        send_resolved: true
        username: "Igris Alertmanager"
        icon_emoji: ":warning:"
        title: |-
          [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}
        text: |-
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Severity:* `{{ .Labels.severity }}`
          *Description:* {{ .Annotations.description }}
          {{ if .Annotations.runbook_url }}*Runbook:* {{ .Annotations.runbook_url }}{{ end }}
          {{ end }}
        color: |-
          {{ if eq .Status "firing" }}warning{{ else }}good{{ end }}

  # PagerDuty — critical alerts only
  - name: "pagerduty"
    pagerduty_configs:
      - service_key: "${PAGERDUTY_KEY}"
        send_resolved: true
        description: |-
          {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}
        details:
          firing: |-
            {{ range .Alerts }}{{ .Annotations.description }}{{ end }}
          severity: |-
            {{ .CommonLabels.severity }}
          environment: production
          project: igris-inertial

inhibit_rules:
  # If the API is completely down, suppress error rate alerts (they're redundant)
  - source_match:
      alertname: "APIDown"
    target_match:
      alertname: "HighAPIErrorRate"
    equal: ["job"]
