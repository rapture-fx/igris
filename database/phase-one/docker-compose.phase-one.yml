version: '3.8'

# Schlep Engine Phase One Database & Cache Infrastructure
# Optimized for <$300/month, 1000 concurrent users, with migration path to YugabyteDB + DragonflyDB

services:
  # PostgreSQL - Primary Database (YugabyteDB-ready schema)
  postgres:
    image: postgres:16-alpine
    container_name: schlep_postgres_phase_one
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schlep_engine}
      POSTGRES_USER: ${POSTGRES_USER:-schlep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schlep_postgres_dev_2024}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      # Performance tuning for 1000+ concurrent users
      POSTGRES_SHARED_BUFFERS: ${POSTGRES_SHARED_BUFFERS:-512MB}
      POSTGRES_EFFECTIVE_CACHE_SIZE: ${POSTGRES_EFFECTIVE_CACHE_SIZE:-2GB}
      POSTGRES_MAX_CONNECTIONS: ${POSTGRES_MAX_CONNECTIONS:-200}
    volumes:
      # Persistent data
      - postgres_data:/var/lib/postgresql/data
      # Schema initialization
      - ./schemas:/docker-entrypoint-initdb.d:ro
      # Custom PostgreSQL configuration
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - schlep_db_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schlep_user} -d ${POSTGRES_DB:-schlep_engine}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'

  # Redis - Cache & Session Store (DragonflyDB-compatible configuration)
  redis:
    image: redis:7-alpine
    container_name: schlep_redis_phase_one
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-schlep_redis_dev_2024}
    volumes:
      # Persistent data with AOF + RDB
      - redis_data:/data
      # Custom Redis configuration
      - ./redis/redis.conf:/etc/redis/redis.conf:ro
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - schlep_db_network
    command: >
      redis-server /etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD:-schlep_redis_dev_2024}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-schlep_redis_dev_2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # Redis Initialization Service
  redis_init:
    image: redis:7-alpine
    container_name: schlep_redis_init
    networks:
      - schlep_db_network
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-schlep_redis_dev_2024}
    volumes:
      - ./redis/init-scripts.sh:/init-scripts.sh:ro
    command: >
      sh -c "
        apk add --no-cache bash &&
        chmod +x /init-scripts.sh &&
        /init-scripts.sh
      "
    restart: "no"

  # MinIO - S3-Compatible Object Storage
  minio:
    image: minio/minio:latest
    container_name: schlep_minio_phase_one
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-schlep_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-schlep_minio_dev_password_2024}
      MINIO_DOMAIN: ${MINIO_DOMAIN:-minio.schlep-local.dev}
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_COMPRESS: "on"
      MINIO_COMPRESS_EXTENSIONS: ".txt,.log,.csv,.json,.xml"
    volumes:
      - minio_data:/data
      - minio_config:/root/.minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks:
      - schlep_db_network
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'

  # MinIO Client for Bucket Setup
  minio_setup:
    image: minio/mc:latest
    container_name: schlep_minio_setup
    networks:
      - schlep_db_network
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_HOST: minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-schlep_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-schlep_minio_dev_password_2024}
    volumes:
      - ./minio/setup-buckets.sh:/setup-buckets.sh:ro
    command: >
      sh -c "
        chmod +x /setup-buckets.sh &&
        /setup-buckets.sh
      "
    restart: "no"

  # PostgreSQL Exporter for Prometheus monitoring
  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: schlep_postgres_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-schlep_user}:${POSTGRES_PASSWORD:-schlep_postgres_dev_2024}@postgres:5432/${POSTGRES_DB:-schlep_engine}?sslmode=disable"
      # Custom queries for Schlep Engine specific metrics
      PG_EXPORTER_EXTEND_QUERY_PATH: "/etc/postgres_exporter/queries.yaml"
    volumes:
      - ./monitoring/postgres_exporter_queries.yaml:/etc/postgres_exporter/queries.yaml:ro
    ports:
      - "${POSTGRES_EXPORTER_PORT:-9187}:9187"
    networks:
      - schlep_db_network
      - schlep_monitoring_network
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'

  # Redis Exporter for Prometheus monitoring
  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: schlep_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: "redis://redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-schlep_redis_dev_2024}
      REDIS_EXPORTER_INCL_SYSTEM_METRICS: "true"
    ports:
      - "${REDIS_EXPORTER_PORT:-9121}:9121"
    networks:
      - schlep_db_network
      - schlep_monitoring_network
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: schlep_prometheus
    restart: unless-stopped
    volumes:
      - prometheus_data:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/rules:/etc/prometheus/rules:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - schlep_db_network
      - schlep_monitoring_network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}'
      - '--web.enable-lifecycle'
      - '--storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-10GB}'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 1G
          cpus: '0.5'

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: schlep_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-schlep_grafana_dev_2024}
      GF_INSTALL_PLUGINS: "grafana-clock-panel,grafana-simple-json-datasource"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - schlep_monitoring_network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  # Nginx - Reverse Proxy and Load Balancer
  nginx:
    image: nginx:alpine
    container_name: schlep_nginx_proxy
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_logs:/var/log/nginx
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    networks:
      - schlep_db_network
      - schlep_monitoring_network
    depends_on:
      - postgres
      - redis
      - minio
      - grafana
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  # Database Backup Service
  backup_service:
    image: postgres:16-alpine
    container_name: schlep_backup_service
    restart: "no" # Run only when triggered
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-schlep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-schlep_postgres_dev_2024}
      POSTGRES_DB: ${POSTGRES_DB:-schlep_engine}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-schlep_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-schlep_minio_dev_password_2024}
    volumes:
      - backup_data:/backup
      - ./scripts/backup.sh:/backup.sh:ro
    networks:
      - schlep_db_network
    depends_on:
      - postgres
      - minio
    command: >
      sh -c "
        apk add --no-cache curl &&
        chmod +x /backup.sh &&
        /backup.sh
      "

# Volumes for persistent data
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${POSTGRES_DATA_PATH:-./data/postgres}

  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${REDIS_DATA_PATH:-./data/redis}

  minio_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${MINIO_DATA_PATH:-./data/minio}

  minio_config:
    driver: local

  prometheus_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${PROMETHEUS_DATA_PATH:-./data/prometheus}

  grafana_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${GRAFANA_DATA_PATH:-./data/grafana}

  backup_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${BACKUP_DATA_PATH:-./data/backups}

  nginx_logs:
    driver: local

# Networks
networks:
  schlep_db_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
          gateway: 172.20.0.1

  schlep_monitoring_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
          gateway: 172.21.0.1