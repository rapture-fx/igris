# Redis Configuration for Schlep Engine Phase One
# Optimized for DragonflyDB migration compatibility
#
# This configuration uses Redis features that are compatible with DragonflyDB
# to ensure smooth migration in Phase Two

# ============================ BASIC SETTINGS ============================

# Bind to specific interfaces for security
bind 127.0.0.1 ::1

# Port configuration
port 6379

# Enable protected mode for security
protected-mode yes

# Require authentication
requirepass ${REDIS_PASSWORD:-schlep_redis_dev_password}

# Database configuration
databases 16

# ============================ MEMORY MANAGEMENT ============================

# Memory limit (set to 2GB for development, easily scalable)
maxmemory 2gb

# Eviction policy optimized for session/cache workloads
# Using allkeys-lru which is supported by DragonflyDB
maxmemory-policy allkeys-lru

# Memory usage samples (DragonflyDB compatible)
maxmemory-samples 10

# ============================ PERSISTENCE ============================

# RDB Snapshots (supported by both Redis and DragonflyDB)
save 900 1     # Save if at least 1 key changed in 900 seconds
save 300 10    # Save if at least 10 keys changed in 300 seconds
save 60 10000  # Save if at least 10000 keys changed in 60 seconds

# RDB compression
rdbcompression yes

# RDB checksum
rdbchecksum yes

# RDB filename
dbfilename schlep-dump.rdb

# Working directory
dir /data

# AOF (Append Only File) - for better durability
appendonly yes
appendfilename "schlep-appendonly.aof"

# AOF sync policy (fsync every second)
appendfsync everysec

# AOF rewrite configuration
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ============================ LOGGING ============================

# Log level
loglevel notice

# Log file
logfile /data/redis.log

# ============================ CLIENT MANAGEMENT ============================

# Maximum number of clients
maxclients 10000

# Client timeout (0 = disabled)
timeout 0

# TCP keepalive
tcp-keepalive 300

# ============================ PERFORMANCE TUNING ============================

# TCP backlog
tcp-backlog 511

# Hash table size optimizations
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

list-max-ziplist-size -2
list-compress-depth 0

set-max-intset-entries 512

zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog sparse representation
hll-sparse-max-bytes 3000

# Streams configuration
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# ============================ SLOW LOG ============================

# Slow queries log
slowlog-log-slower-than 10000
slowlog-max-len 128

# ============================ LATENCY MONITORING ============================

# Latency monitoring
latency-monitor-threshold 100

# ============================ EVENT NOTIFICATION ============================

# Keyspace notifications (useful for task queues)
# K = Keyspace events (events for keys)
# E = Keyevent events (events for commands)
# x = Expired events
# e = Evicted events
# d = DEL command events
notify-keyspace-events "Kxed"

# ============================ SECURITY ============================

# Rename dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command EVAL ""
rename-command DEBUG ""

# ============================ MODULES & EXTENSIONS ============================

# Reserved for future module loading
# (DragonflyDB has built-in modules that don't require explicit loading)

# ============================ NETWORKING ============================

# Disable TCP nodelay for better performance
tcp-nodelay yes

# SO_KEEPALIVE
tcp-keepalive 300

# ============================ THREADING (Redis 6.0+) ============================

# IO threads (for better multi-core utilization)
# DragonflyDB handles multi-threading automatically
io-threads 4
io-threads-do-reads yes

# ============================ TLS/SSL CONFIGURATION ============================

# TLS configuration (disabled for Phase One, can be enabled for production)
# tls-port 6380
# tls-cert-file /tls/redis.crt
# tls-key-file /tls/redis.key
# tls-ca-cert-file /tls/ca.crt

# ============================ REPLICATION ============================

# Replication settings (for future HA setup)
# Currently single-instance, but ready for replication
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-diskless-load disabled

# Replica serve stale data
replica-serve-stale-data yes
replica-read-only yes

# Replica priority
replica-priority 100

# ============================ SENTINEL COMPATIBILITY ============================

# Settings for future Sentinel integration
# (Both Redis Sentinel and DragonflyDB support similar HA patterns)

# ============================ CUSTOM CONFIGURATIONS ============================

# Custom settings for Schlep Engine workloads

# Optimize for session storage patterns
# Short TTLs for session data
# maxmemory-policy optimized for LRU eviction

# Task queue optimizations
# Using Redis streams for task queuing (compatible with DragonflyDB)

