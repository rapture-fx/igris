[package]
name = "schlep-kernel"
version = "0.1.0"
edition = "2021"
authors = ["Schlep-Engine Team"]
description = "Minimal Rust kernel for Go FFI prototype"

[lib]
name = "schlep_kernel"
crate-type = ["cdylib", "staticlib"]  # Both for compatibility

[dependencies]
chrono = "0.4.42"
libc = "0.2"
serde_json = "1.0.145"
serde = { version = "1.0", features = ["derive"] }
csv = "1.3"  # CSV parsing support
polars = "0.51.0"  # Parquet support (Phase 1)
arrow = "56.2.0"  # Arrow format support (Phase 1)
parquet = "56.2.0"  # Parquet file format (Phase 1)
avro-rs = "0.13.0"  # Avro serialization (Phase 1)
tokio = { version = "1.47", features = ["full"] }  # Async runtime (Phase 1)

[dev-dependencies]
tokio-test = "0.4"  # Testing utilities for async code

[profile.release]
lto = true              # Link-time optimization
codegen-units = 1       # Single codegen unit for better optimization
panic = "abort"         # Smaller binaries
opt-level = 3           # Maximum optimization
strip = true            # Strip symbols for smaller binary
