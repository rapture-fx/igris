[workspace]
members = [
    "crates/igris-core",
    "crates/igris-routing",
    "crates/igris-server",
    "crates/igris-emergency",
    "crates/igris-local-llm",
    "crates/igris-lora-trainer",
    "crates/igris-reflection",
    "crates/igris-tools",
    "crates/igris-planning",
    "crates/mcp-server",
    "crates/mcp-client",
]
resolver = "2"

[workspace.package]
version = "1.6.0"
edition = "2021"
rust-version = "1.75"
authors = ["Igris Runtime Team"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.35", features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util = "0.7"

# Web framework
axum = { version = "0.7", features = ["macros"] }
tower = { version = "0.4", features = ["timeout", "limit", "buffer"] }
tower-http = { version = "0.5", features = ["trace", "cors", "compression-gzip"] }

# OpenAPI documentation
utoipa = { version = "4.2", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "6.0", features = ["axum"] }

# TLS with post-quantum crypto
rustls = { version = "0.22", features = ["aws_lc_rs"] }
aws-lc-rs = "1.6"

# Embedded database
redb = "2.0"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
json5 = "0.4"

# Cryptography
ed25519-dalek = "2.1"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"

# Utilities
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# HTTP client for providers
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json", "stream"] }

# Async utilities
futures = "0.3"

# Regex for env var expansion
regex = "1.10"

# UUID generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Async streaming
async-stream = "0.3"

# mDNS service discovery
mdns-sd = "0.11"

[profile.release]
opt-level = "z"        # Optimize for size
lto = "fat"            # Full link-time optimization
codegen-units = 1      # Single codegen unit for max optimization
panic = "abort"        # No unwinding
strip = true           # Strip symbols

[profile.release.package."*"]
opt-level = "z"        # Aggressive size optimization for all dependencies
