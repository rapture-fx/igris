apiVersion: v1
kind: ConfigMap
metadata:
  name: igris-runtime-config
data:
  config.json5: |
    {
      server: { host: "0.0.0.0", port: 8080 },
      auth: {
        enabled: false,
        api_key: "default-api-key",
        jwt_hs256_secret: null,
        rate_limit_per_minute: 0,
        rate_limit_burst: 0
      },
      providers: [
        // Configure your cloud providers here OR enable local fallback.
        { id: "openai", provider_type: "openai", api_key: "${OPENAI_API_KEY}", model: "gpt-4o-mini" }
      ],
      tools: {
        enabled: false,
        enable_http: false,
        enable_shell: false,
        enable_filesystem: false,
        allowed_http_domains: [],
        allowed_shell_commands: [],
        allowed_shell_working_dirs: [],
        allowed_filesystem_paths: [],
        max_execution_time_ms: 30000,
        max_concurrent_executions: 4
      }
    }


