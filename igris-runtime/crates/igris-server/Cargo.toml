[package]
name = "igris-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "igris-runtime"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true, features = ["v7"] }
futures = { workspace = true }
async-stream = { workspace = true }
async-trait = "0.1"
sha2 = { workspace = true }
base64 = { workspace = true }
hex = "0.4"
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage"] }
ed25519-dalek = { workspace = true }
rand = { workspace = true }

# Internal dependencies
igris-core = { path = "../igris-core" }
igris-routing = { path = "../igris-routing", features = ["local-llm"] }
igris-emergency = { path = "../igris-emergency" }
igris-local-llm = { path = "../igris-local-llm" }
igris-license-client = { path = "../igris-license-client" }
igris-mcp-server = { path = "../mcp-server" }
igris-mcp-client = { path = "../mcp-client" }
igris-reflection = { path = "../igris-reflection" }
igris-tools = { path = "../igris-tools" }
igris-planning = { path = "../igris-planning" }
igris-lora-trainer = { path = "../igris-lora-trainer" }
igris-fleet = { path = "../igris-fleet" }
igris-federated = { path = "../igris-federated" }
igris-swarm = { path = "../igris-swarm" }
igris-btree = { path = "../igris-btree", features = ["wal"] }
igris-memory = { path = "../igris-memory", optional = true }
igris-hitl = { path = "../igris-hitl", optional = true }
igris-ros2 = { path = "../igris-ros2", optional = true }
igris-safety = { path = "../igris-safety" }
igris-wal = { path = "../igris-wal" }

[features]
default = ["agent-platform"]
memory = ["dep:igris-memory"]
hitl = ["dep:igris-hitl"]
agent-platform = ["memory", "hitl"]
robotics-platform = ["igris-btree/ros2", "dep:igris-ros2"]
full-platform = ["agent-platform", "robotics-platform"]
ros2 = ["robotics-platform"]

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
