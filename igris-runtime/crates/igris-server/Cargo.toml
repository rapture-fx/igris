[package]
name = "igris-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "igris-runtime"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
uuid = { workspace = true }
futures = { workspace = true }
async-trait = "0.1"
sha2 = { workspace = true }
base64 = { workspace = true }

# Internal dependencies
igris-core = { path = "../igris-core" }
igris-routing = { path = "../igris-routing", features = ["local-llm"] }
igris-emergency = { path = "../igris-emergency" }
igris-local-llm = { path = "../igris-local-llm" }
igris-mcp-server = { path = "../mcp-server" }
igris-mcp-client = { path = "../mcp-client" }
igris-reflection = { path = "../igris-reflection" }
igris-tools = { path = "../igris-tools" }
igris-planning = { path = "../igris-planning" }
igris-lora-trainer = { path = "../igris-lora-trainer" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
