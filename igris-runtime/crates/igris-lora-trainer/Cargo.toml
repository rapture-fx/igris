[package]
name = "igris-lora-trainer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Workspace dependencies (with additional features)
tokio = { workspace = true, features = ["fs", "process"] }
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
redb.workspace = true
aes-gcm.workspace = true
sha2.workspace = true
rand.workspace = true
base64.workspace = true

# For training data management
bincode = "1.3"

# For device identification
hostname = "0.4"

# Native Rust LoRA training (Phase 2A: Solution A)
metal-candle = { version = "1.3", optional = true }
candle-core = { version = "0.9", optional = true }
candle-nn = { version = "0.9", optional = true }
tokenizers = { version = "0.15", optional = true }
safetensors = { version = "0.4", optional = true }

[features]
default = []
# Enable native Rust training with metal-candle (recommended for Apple Silicon)
native-training = ["metal-candle", "candle-core", "candle-nn", "tokenizers", "safetensors"]

[dev-dependencies]
tempfile = "3.8"

[build-dependencies]
# Build script for FFI bindings
cc = "1.0"
bindgen = "0.70"
