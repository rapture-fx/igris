[package]
name = "igris-routing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Path dependency to existing Rust optimizer (Thompson Sampling)
# CRITICAL: This reuses the production-ready Thompson Sampling implementation
schlep-kernel = { path = "../../../rust-core/rust_kernel", default-features = false }

# Workspace dependencies
tokio = { workspace = true }
futures = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
reqwest = { workspace = true }
async-stream = { workspace = true }

# Core dependency
igris-core = { path = "../igris-core" }

# Local LLM support (optional)
igris-local-llm = { path = "../igris-local-llm", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[features]
default = []
local-llm = ["igris-local-llm"]
