[package]
name = "igris-license-client"
version = "1.6.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
reqwest = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tracing = "0.1"
sha2 = "0.10"
hex = "0.4"
gethostname = "0.4"
mac_address = "1.1"
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
