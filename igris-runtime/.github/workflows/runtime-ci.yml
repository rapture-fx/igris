name: igris-runtime CI

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Test
        run: cargo test -q

  build:
    runs-on: ubuntu-latest
    needs: [ test ]
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.75"

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Install cross
        run: cargo install -q cross --locked

      - name: Build (static musl)
        run: cross build -q -p igris-server --bin igris-runtime --release --target ${{ matrix.target }}

      - name: Install UPX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends upx-ucl

      - name: Compress
        run: |
          BIN=target/${{ matrix.target }}/release/igris-runtime
          upx --best --lzma "$BIN"
          ls -lh "$BIN"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: igris-runtime-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/igris-runtime

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [ build ]
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Prepare release assets
        run: |
          mkdir -p release
          cp dist/igris-runtime-x86_64-unknown-linux-musl/igris-runtime release/igris-runtime-x86_64-unknown-linux-musl
          cp dist/igris-runtime-aarch64-unknown-linux-musl/igris-runtime release/igris-runtime-aarch64-unknown-linux-musl
          ls -lh release/*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*


