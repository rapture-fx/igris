name: Build Igris Runtime

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl

    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          override: true

      - name: Install cross
        run: cargo install cross

      - name: Build
        run: |
          cd runtime
          cross build --release --target ${{ matrix.target }}

      - name: Install UPX
        run: sudo apt-get update && sudo apt-get install -y upx-ucl

      - name: Compress binary
        run: |
          upx --best --lzma runtime/target/${{ matrix.target }}/release/igris-runtime

      - name: Get binary size
        run: |
          ls -lh runtime/target/${{ matrix.target }}/release/igris-runtime

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: igris-runtime-${{ matrix.target }}
          path: runtime/target/${{ matrix.target }}/release/igris-runtime

  docker:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        run: |
          cd runtime
          docker build -f Dockerfile.runtime -t igris-runtime:latest .

      - name: Get image size
        run: docker images igris-runtime:latest
