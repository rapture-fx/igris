name: OpenAPI Client Generation

on:
  # Trigger on API changes
  push:
    paths:
      - 'apps/api/app/**/*.py'
      - 'apps/api/app/schemas/**'
      - 'apps/api/app/core/openapi.py'
      - 'tools/openapi-client-generator/configs/**'
    branches:
      - main
      - develop
  
  # Manual trigger
  workflow_dispatch:
    inputs:
      languages:
        description: 'Languages to generate (comma-separated, or "all")'
        required: false
        default: 'all'
        type: string
      publish:
        description: 'Publish generated clients'
        required: false
        default: false
        type: boolean
      test_only:
        description: 'Publish to test registries only'
        required: false
        default: true
        type: boolean

  # Scheduled regeneration (weekly)
  schedule:
    - cron: '0 2 * * 1'  # Every Monday at 2 AM UTC

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  GO_VERSION: '1.21'
  JAVA_VERSION: '11'
  DOTNET_VERSION: '6.0'

jobs:
  detect-changes:
    name: Detect API Changes
    runs-on: ubuntu-latest
    outputs:
      api-changed: ${{ steps.changes.outputs.api }}
      config-changed: ${{ steps.changes.outputs.config }}
      should-generate: ${{ steps.decision.outputs.should-generate }}
      languages: ${{ steps.decision.outputs.languages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            api:
              - 'apps/api/app/**/*.py'
              - 'apps/api/app/schemas/**'
              - 'apps/api/app/core/openapi.py'
            config:
              - 'tools/openapi-client-generator/configs/**'

      - name: Make generation decision
        id: decision
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should-generate=true" >> $GITHUB_OUTPUT
            echo "languages=${{ github.event.inputs.languages }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "schedule" ]; then
            echo "should-generate=true" >> $GITHUB_OUTPUT
            echo "languages=all" >> $GITHUB_OUTPUT
          elif [ "${{ steps.changes.outputs.api }}" == "true" ] || [ "${{ steps.changes.outputs.config }}" == "true" ]; then
            echo "should-generate=true" >> $GITHUB_OUTPUT
            echo "languages=all" >> $GITHUB_OUTPUT
          else
            echo "should-generate=false" >> $GITHUB_OUTPUT
            echo "languages=" >> $GITHUB_OUTPUT
          fi

  extract-openapi-spec:
    name: Extract OpenAPI Specification
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.should-generate == 'true'
    outputs:
      spec-hash: ${{ steps.spec.outputs.hash }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt

      - name: Extract OpenAPI specification
        id: spec
        run: |
          cd apps/api
          
          # Set minimal environment variables
          export DATABASE_URL="sqlite:///:memory:"
          export SECRET_KEY="temp-key-for-spec-generation"
          export ENVIRONMENT="development"
          
          # Create extraction script
          cat > extract_openapi.py << 'EOF'
          import sys
          import os
          sys.path.append('.')
          
          try:
              from app.main import app
              import json
              
              # Get the OpenAPI spec
              openapi_spec = app.openapi()
              
              # Save to file
              with open('openapi.json', 'w') as f:
                  json.dump(openapi_spec, f, indent=2)
              
              print("OpenAPI specification extracted successfully")
              
          except Exception as e:
              print(f"Error extracting OpenAPI spec: {e}")
              # Create minimal spec for testing
              minimal_spec = {
                  "openapi": "3.0.0",
                  "info": {"title": "Igris-engine API", "version": "2.0.0"},
                  "paths": {},
                  "components": {"securitySchemes": {"ApiKeyAuth": {"type": "apiKey", "in": "header", "name": "X-API-Key"}}},
                  "security": [{"ApiKeyAuth": []}]
              }
              with open('openapi.json', 'w') as f:
                  json.dump(minimal_spec, f, indent=2)
              print("Created minimal OpenAPI specification")
          EOF
          
          python extract_openapi.py
          
          # Generate hash of the spec
          SPEC_HASH=$(sha256sum openapi.json | cut -d' ' -f1)
          echo "hash=$SPEC_HASH" >> $GITHUB_OUTPUT
          
          echo "OpenAPI spec hash: $SPEC_HASH"

      - name: Upload OpenAPI specification
        uses: actions/upload-artifact@v3
        with:
          name: openapi-spec
          path: apps/api/openapi.json
          retention-days: 30

  generate-clients:
    name: Generate Client Libraries
    runs-on: ubuntu-latest
    needs: [detect-changes, extract-openapi-spec]
    if: needs.detect-changes.outputs.should-generate == 'true'
    strategy:
      matrix:
        language: [python, typescript, go, java, csharp]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download OpenAPI specification
        uses: actions/download-artifact@v3
        with:
          name: openapi-spec
          path: apps/api

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Set up .NET
        if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install OpenAPI Generator
        run: |
          npm install @openapitools/openapi-generator-cli -g

      - name: Install yq for YAML processing
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Generate client library
        run: |
          cd tools/openapi-client-generator
          
          # Skip if language not in target list (for manual triggers)
          if [ "${{ needs.detect-changes.outputs.languages }}" != "all" ]; then
            LANGUAGES_LIST="${{ needs.detect-changes.outputs.languages }}"
            if [[ ! "$LANGUAGES_LIST" =~ "${{ matrix.language }}" ]]; then
              echo "Skipping ${{ matrix.language }} as it's not in the target list"
              exit 0
            fi
          fi
          
          ./scripts/generate.sh --language ${{ matrix.language }} --validate

      - name: Upload generated client
        uses: actions/upload-artifact@v3
        with:
          name: client-${{ matrix.language }}
          path: tools/openapi-client-generator/generated/${{ matrix.language }}
          retention-days: 30

      - name: Generate validation report
        run: |
          cd tools/openapi-client-generator
          ./scripts/validate.sh ${{ matrix.language }} --report validation-report-${{ matrix.language }}.json

      - name: Upload validation report
        uses: actions/upload-artifact@v3
        with:
          name: validation-report-${{ matrix.language }}
          path: tools/openapi-client-generator/validation-report-${{ matrix.language }}.json
          retention-days: 30

  test-clients:
    name: Test Generated Clients
    runs-on: ubuntu-latest
    needs: generate-clients
    strategy:
      matrix:
        language: [python, typescript, go, java, csharp]
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download generated client
        uses: actions/download-artifact@v3
        with:
          name: client-${{ matrix.language }}
          path: tools/openapi-client-generator/generated/${{ matrix.language }}

      - name: Set up language environment
        run: |
          case "${{ matrix.language }}" in
            python)
              pip install pytest requests
              ;;
            typescript)
              npm install -g jest @types/jest
              ;;
            go)
              # Go is already set up
              ;;
            java)
              # Java is already set up
              ;;
            csharp)
              # .NET is already set up
              ;;
          esac

      - name: Run integration tests
        run: |
          cd tools/openapi-client-generator/tests
          
          case "${{ matrix.language }}" in
            python)
              if [ -f "test_python_client.py" ]; then
                python -m pytest test_python_client.py -v
              else
                echo "No Python integration tests found"
              fi
              ;;
            typescript)
              if [ -f "test_typescript_client.js" ]; then
                jest test_typescript_client.js
              else
                echo "No TypeScript integration tests found"
              fi
              ;;
            go)
              if [ -f "test_go_client.go" ]; then
                go test -v ./test_go_client.go
              else
                echo "No Go integration tests found"
              fi
              ;;
            java)
              if [ -f "TestJavaClient.java" ]; then
                javac TestJavaClient.java && java TestJavaClient
              else
                echo "No Java integration tests found"
              fi
              ;;
            csharp)
              if [ -f "TestCSharpClient.cs" ]; then
                dotnet test
              else
                echo "No C# integration tests found"
              fi
              ;;
          esac

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: generate-clients
    strategy:
      matrix:
        language: [python, typescript, go, java, csharp]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download generated client
        uses: actions/download-artifact@v3
        with:
          name: client-${{ matrix.language }}
          path: tools/openapi-client-generator/generated/${{ matrix.language }}

      - name: Run security scan
        run: |
          case "${{ matrix.language }}" in
            python)
              pip install bandit safety
              cd tools/openapi-client-generator/generated/python
              bandit -r . -f json -o bandit-report.json || true
              safety check --json --output safety-report.json || true
              ;;
            typescript)
              cd tools/openapi-client-generator/generated/typescript
              npm audit --json > npm-audit-report.json || true
              ;;
            go)
              cd tools/openapi-client-generator/generated/go
              if command -v gosec &> /dev/null; then
                gosec -fmt json -out gosec-report.json ./... || true
              fi
              ;;
            java)
              # Java security scanning would go here
              echo "Java security scanning not implemented yet"
              ;;
            csharp)
              # C# security scanning would go here
              echo "C# security scanning not implemented yet"
              ;;
          esac

      - name: Upload security reports
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-reports-${{ matrix.language }}
          path: tools/openapi-client-generator/generated/${{ matrix.language }}/*-report.json
          retention-days: 30

  publish-clients:
    name: Publish Clients
    runs-on: ubuntu-latest
    needs: [test-clients, security-scan]
    if: |
      github.ref == 'refs/heads/main' && 
      (github.event.inputs.publish == 'true' || github.event_name == 'schedule')
    strategy:
      matrix:
        language: [python, typescript, go, java, csharp]
    environment: 
      name: ${{ github.event.inputs.test_only == 'true' && 'test' || 'production' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download generated client
        uses: actions/download-artifact@v3
        with:
          name: client-${{ matrix.language }}
          path: tools/openapi-client-generator/generated/${{ matrix.language }}

      - name: Set up publishing environment
        run: |
          case "${{ matrix.language }}" in
            python)
              pip install twine
              ;;
            typescript)
              echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc
              ;;
            java)
              # Maven settings would be configured here
              ;;
            csharp)
              # NuGet configuration would be set here
              ;;
          esac

      - name: Publish client
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          cd tools/openapi-client-generator
          
          PUBLISH_FLAGS="--language ${{ matrix.language }}"
          
          if [ "${{ github.event.inputs.test_only }}" == "true" ]; then
            PUBLISH_FLAGS="$PUBLISH_FLAGS --test"
          fi
          
          ./scripts/publish.sh $PUBLISH_FLAGS

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [publish-clients]
    if: |
      github.ref == 'refs/heads/main' && 
      github.event.inputs.publish == 'true' &&
      github.event.inputs.test_only != 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Create release notes
        run: |
          cat > release-notes.md << 'EOF'
          # OpenAPI Client Libraries Release
          
          ## Generated Clients
          
          This release includes automatically generated client libraries for the Igris-engine API.
          
          ### Languages Supported
          - Python (PyPI: `igris-inertial-client`)
          - TypeScript/JavaScript (NPM: `@igris-inertial/client`)
          - Go (GitHub: `github.com/igris-inertial/go-client`)
          - Java (Maven Central: `com.igris:igris-inertial-client`)
          - C# (NuGet: `Igris.Client`)
          
          ### Changes in This Release
          - Updated API specification
          - Improved type safety and validation
          - Enhanced error handling
          - Updated dependencies
          
          ### Installation
          
          **Python:**
          ```bash
          pip install igris-inertial-client
          ```
          
          **TypeScript/JavaScript:**
          ```bash
          npm install @igris-inertial/client
          ```
          
          **Go:**
          ```bash
          go get github.com/igris-inertial/go-client
          ```
          
          **Java:**
          ```xml
          <dependency>
            <groupId>com.igris</groupId>
            <artifactId>igris-inertial-client</artifactId>
            <version>2.0.0</version>
          </dependency>
          ```
          
          **C#:**
          ```bash
          dotnet add package Igris.Client
          ```
          
          EOF

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: client-libraries-${{ github.run_number }}
          name: Client Libraries Release ${{ github.run_number }}
          bodyFile: release-notes.md
          artifacts: "client-*/**"
          token: ${{ secrets.GITHUB_TOKEN }}

  notify-completion:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [create-release]
    if: always()
    steps:
      - name: Notify Slack
        if: contains(needs.*.result, 'failure')
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: 'OpenAPI client generation failed'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Success
        if: needs.create-release.result == 'success'
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: 'OpenAPI client libraries published successfully'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}