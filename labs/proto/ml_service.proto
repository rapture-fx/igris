syntax = "proto3";

package ml;

option go_package = "github.com/schlep-engine/schlep-engine/proto/ml";
option java_package = "com.schlepengine.ml";
option java_multiple_files = true;

// ============================================================================
// Schlep-Engine ML Service - Unified Proto Contract
// ============================================================================
//
// Version: v1.0.0
// Last Updated: 2025-10-09
// Source of Truth: This file is the canonical proto definition
//
// Migration Notes:
// - Consolidated from go_gateway/proto/ml_service.proto and
//   apps/python-ml-service/proto/ml_service_extended.proto
// - Fixed field name inconsistency: inference_time_ms → latency_ms (standardized)
// - Added proto versioning via api_version field in requests
// ============================================================================

// ML Service with full inference, training, and management capabilities
service MLService {
  // ========================================
  // Core Inference (Phase 1 - Production)
  // ========================================

  // Single prediction - Primary inference method
  rpc Predict (PredictRequest) returns (PredictResponse);

  // Batch prediction for multiple inputs
  rpc BatchPredict (BatchPredictRequest) returns (BatchPredictResponse);

  // Service health check with optional detailed metrics
  rpc HealthCheck (HealthCheckRequest) returns (HealthCheckResponse);

  // Get model metadata and info
  rpc GetModelInfo (ModelInfoRequest) returns (ModelInfoResponse);

  // ========================================
  // Model Management (Phase 2)
  // ========================================

  // Load model into memory (hot loading)
  rpc LoadModel (LoadModelRequest) returns (LoadModelResponse);

  // Unload model from memory (resource cleanup)
  rpc UnloadModel (UnloadModelRequest) returns (UnloadModelResponse);

  // List all available models
  rpc ListModels (ListModelsRequest) returns (ListModelsResponse);

  // Delete model from storage
  rpc DeleteModel (DeleteModelRequest) returns (DeleteModelResponse);

  // ========================================
  // Advanced Inference (Phase 2)
  // ========================================

  // Streaming prediction for real-time use cases
  rpc StreamPredict (stream PredictRequest) returns (stream PredictResponse);

  // Explain prediction with feature importance
  rpc ExplainPrediction (ExplainRequest) returns (ExplainResponse);

  // A/B test prediction across multiple models
  rpc ABTestPredict (ABTestRequest) returns (ABTestResponse);

  // ========================================
  // Model Training (Phase 3 - Future)
  // ========================================

  // Train a new model
  rpc TrainModel (TrainModelRequest) returns (TrainModelResponse);

  // Retrain existing model with new data
  rpc RetrainModel (RetrainModelRequest) returns (RetrainModelResponse);

  // Get training job status
  rpc GetTrainingStatus (TrainingStatusRequest) returns (TrainingStatusResponse);

  // Cancel ongoing training job
  rpc CancelTraining (CancelTrainingRequest) returns (CancelTrainingResponse);

  // ========================================
  // Model Evaluation (Phase 3 - Future)
  // ========================================

  // Evaluate model performance on test data
  rpc EvaluateModel (EvaluationRequest) returns (EvaluationResponse);

  // Get model performance metrics
  rpc GetModelMetrics (MetricsRequest) returns (MetricsResponse);

  // Validate model against acceptance criteria
  rpc ValidateModel (ValidationRequest) returns (ValidationResponse);
}

// ============================================================================
// Core Inference Messages (Phase 1)
// ============================================================================

message PredictRequest {
  // API version for compatibility checking (e.g., "v1.0.0")
  string api_version = 1;

  // Model identifier (e.g., "iris", "fraud-detector-v2")
  string model_id = 2;

  // Feature vector for prediction
  repeated double features = 3;

  // Optional metadata (request ID, user context, etc.)
  map<string, string> metadata = 4;
}

message PredictResponse {
  // API version of the response
  string api_version = 1;

  // Prediction value (regression) or primary class score (classification)
  double prediction = 2;

  // Confidence score [0.0, 1.0]
  double confidence = 3;

  // Model ID that generated this prediction
  string model_id = 4;

  // Inference latency in milliseconds (FIXED: was inference_time_ms in Go)
  int64 latency_ms = 5;

  // Class probabilities for classification (class_name -> probability)
  map<string, double> probabilities = 6;

  // Error message if prediction failed (empty if successful)
  string error = 7;

  // Optional metadata (trace ID, model version, etc.)
  map<string, string> metadata = 8;
}

message BatchPredictRequest {
  string api_version = 1;
  string model_id = 2;
  repeated FeatureSet feature_sets = 3;
  map<string, string> metadata = 4;
}

message FeatureSet {
  repeated double features = 1;
  string sample_id = 2;  // Optional identifier for each sample
}

message BatchPredictResponse {
  string api_version = 1;
  repeated PredictResponse predictions = 2;
  int64 total_latency_ms = 3;
  int32 success_count = 4;
  int32 error_count = 5;
}

message HealthCheckRequest {
  bool detailed = 1;  // If true, return detailed system metrics
}

message HealthCheckResponse {
  string status = 1;  // "healthy", "degraded", "unhealthy"
  string version = 2;  // Service version
  int64 uptime_seconds = 3;
  int32 loaded_models_count = 4;
  repeated string loaded_models = 5;
  map<string, string> system_metrics = 6;  // CPU, memory, GPU usage
}

message ModelInfoRequest {
  string model_id = 1;
}

message ModelInfoResponse {
  string model_id = 1;
  string model_type = 2;  // "sklearn", "pytorch", "tensorflow", "onnx"
  string version = 3;
  repeated string input_features = 4;
  repeated string output_classes = 5;
  bool loaded = 6;
  int64 size_bytes = 7;
  string created_at = 8;  // ISO 8601 timestamp
  map<string, string> metadata = 9;
}

// ============================================================================
// Model Management Messages (Phase 2)
// ============================================================================

message LoadModelRequest {
  string model_id = 1;
  string model_path = 2;  // Path to model file or artifact
  map<string, string> config = 3;  // Runtime configuration
  bool force_reload = 4;  // Force reload if already loaded
}

message LoadModelResponse {
  bool success = 1;
  string message = 2;
  string model_id = 3;
  int64 load_time_ms = 4;
  int64 model_size_bytes = 5;
  string model_version = 6;
}

message UnloadModelRequest {
  string model_id = 1;
  bool force = 2;  // Force unload even if in use
}

message UnloadModelResponse {
  bool success = 1;
  string message = 2;
  string model_id = 3;
  int64 freed_memory_bytes = 4;
}

message ListModelsRequest {
  bool include_unloaded = 1;
  string filter = 2;  // Filter pattern (e.g., "fraud-*")
}

message ListModelsResponse {
  repeated ModelSummary models = 1;
  int32 total_count = 2;
}

message ModelSummary {
  string model_id = 1;
  string model_type = 2;
  string version = 3;
  bool loaded = 4;
  int64 size_bytes = 5;
  int64 last_used_timestamp = 6;
  int64 prediction_count = 7;
  double avg_latency_ms = 8;
}

message DeleteModelRequest {
  string model_id = 1;
  bool delete_artifacts = 2;  // Also delete training artifacts
}

message DeleteModelResponse {
  bool success = 1;
  string message = 2;
  int64 deleted_files_count = 3;
}

// ============================================================================
// Advanced Inference Messages (Phase 2)
// ============================================================================

message ExplainRequest {
  string model_id = 1;
  repeated double features = 2;
  string method = 3;  // "shap", "lime", "feature_importance"
}

message ExplainResponse {
  map<string, double> feature_importance = 1;
  repeated string top_features = 2;
  string visualization_url = 3;
  string explanation_text = 4;
}

message ABTestRequest {
  repeated string model_ids = 1;
  repeated double features = 2;
  string split_strategy = 3;  // "random", "canary", "champion_challenger"
}

message ABTestResponse {
  repeated ABTestResult results = 1;
  string selected_model_id = 2;
  string selection_reason = 3;
}

message ABTestResult {
  string model_id = 1;
  double prediction = 2;
  double confidence = 3;
  int64 latency_ms = 4;
}

// ============================================================================
// Training Messages (Phase 3 - Future)
// ============================================================================

message TrainModelRequest {
  string model_id = 1;
  string model_type = 2;
  string algorithm = 3;
  repeated string feature_names = 4;
  repeated string target_classes = 5;
  repeated TrainingSample training_data = 6;
  map<string, string> hyperparameters = 7;
  TrainingConfig config = 8;
}

message TrainingSample {
  repeated double features = 1;
  oneof label {
    double numeric_label = 2;
    string categorical_label = 3;
  }
}

message TrainingConfig {
  int32 max_epochs = 1;
  double learning_rate = 2;
  int32 batch_size = 3;
  double validation_split = 4;
  bool early_stopping = 5;
  string optimizer = 6;
  string loss_function = 7;
}

message TrainModelResponse {
  bool success = 1;
  string message = 2;
  string model_id = 3;
  string training_job_id = 4;
  int64 estimated_duration_sec = 5;
}

message RetrainModelRequest {
  string model_id = 1;
  repeated TrainingSample new_data = 2;
  bool incremental = 3;
  map<string, string> hyperparameters = 4;
}

message RetrainModelResponse {
  bool success = 1;
  string message = 2;
  string training_job_id = 3;
  ModelComparison comparison = 4;
}

message ModelComparison {
  double old_accuracy = 1;
  double new_accuracy = 2;
  double improvement_pct = 3;
  map<string, double> metric_changes = 4;
}

message TrainingStatusRequest {
  string training_job_id = 1;
}

message TrainingStatusResponse {
  string job_id = 1;
  string status = 2;  // "pending", "running", "completed", "failed", "cancelled"
  double progress_pct = 3;
  int64 elapsed_sec = 4;
  int64 remaining_sec = 5;
  TrainingMetrics current_metrics = 6;
  string error_message = 7;
}

message TrainingMetrics {
  int32 epoch = 1;
  double loss = 2;
  double accuracy = 3;
  double val_loss = 4;
  double val_accuracy = 5;
  map<string, double> custom_metrics = 6;
}

message CancelTrainingRequest {
  string training_job_id = 1;
}

message CancelTrainingResponse {
  bool success = 1;
  string message = 2;
  string job_id = 3;
}

// ============================================================================
// Evaluation Messages (Phase 3 - Future)
// ============================================================================

message EvaluationRequest {
  string model_id = 1;
  repeated TrainingSample test_data = 2;
  repeated string metrics = 3;  // ["accuracy", "precision", "recall", "f1"]
}

message EvaluationResponse {
  string model_id = 1;
  map<string, double> metrics = 2;
  ConfusionMatrix confusion_matrix = 3;
  repeated ClassMetrics class_metrics = 4;
}

message ConfusionMatrix {
  repeated int32 matrix = 1;  // Flattened row-major matrix
  int32 num_classes = 2;
  repeated string class_labels = 3;
}

message ClassMetrics {
  string class_name = 1;
  double precision = 2;
  double recall = 3;
  double f1_score = 4;
  int32 support = 5;
}

message MetricsRequest {
  string model_id = 1;
  int64 time_range_start = 2;  // Unix timestamp
  int64 time_range_end = 3;
}

message MetricsResponse {
  string model_id = 1;
  int64 total_predictions = 2;
  double avg_latency_ms = 3;
  double avg_confidence = 4;
  map<string, int64> prediction_distribution = 5;
  repeated LatencyBucket latency_histogram = 6;
}

message LatencyBucket {
  int32 bucket_ms = 1;
  int64 count = 2;
}

message ValidationRequest {
  string model_id = 1;
  repeated TrainingSample validation_data = 2;
  double acceptable_accuracy = 3;
}

message ValidationResponse {
  bool passed = 1;
  double achieved_accuracy = 2;
  double required_accuracy = 3;
  string message = 4;
  repeated string failing_samples = 5;
}
