name: ML Model Training Pipeline

on:
  push:
    branches: [main, develop]
    paths: ['models/**', 'data/**', 'config/**']
  schedule:
    - cron: '0 2 * * *'  # Daily at 2 AM
  workflow_dispatch:
    inputs:
      model_type:
        description: 'Model type to train'
        required: true
        default: 'fraud-detection'
        type: choice
        options:
        - fraud-detection
        - recommendation
        - sentiment-analysis
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - production

env:
  IGRIS_OVERTURE_VERSION: "1.0.0"
  PYTHON_VERSION: "3.9"

jobs:
  validate-data:
    runs-on: ubuntu-latest
    outputs:
      data-validation-passed: ${{ steps.validate.outputs.passed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install igris-inertial-cli
          pip install -r requirements.txt
          
      - name: Validate training data
        id: validate
        run: |
          schlep process batch "data/training/*.csv" --validate --dry-run
          echo "passed=true" >> $GITHUB_OUTPUT
          
      - name: Upload data validation report
        uses: actions/upload-artifact@v3
        with:
          name: data-validation-report
          path: validation-report.json

  train-model:
    needs: validate-data
    if: needs.validate-data.outputs.data-validation-passed == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, staging]
    environment: ${{ matrix.environment }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install igris-inertial-cli
          pip install -r requirements.txt
          
      - name: Authenticate with Igris Overture
        run: schlep auth login --api-key ${{ secrets.IGRIS_OVERTURE_API_KEY }}
        
      - name: Process training data
        run: |
          schlep process batch "data/training/*.csv" \
            --parallel 4 \
            --clean \
            --profile \
            --output-dir processed_data_${{ matrix.environment }}
            
      - name: Start ML training pipeline
        id: training
        run: |
          MODEL_TYPE=${{ github.event.inputs.model_type || 'fraud-detection' }}
          PIPELINE_ID=$(schlep pipeline create config/${MODEL_TYPE}-${{ matrix.environment }}.yml --auto-start | grep "Pipeline ID" | cut -d: -f2 | xargs)
          echo "pipeline-id=$PIPELINE_ID" >> $GITHUB_OUTPUT
          
      - name: Monitor training progress
        run: |
          schlep pipeline status ${{ steps.training.outputs.pipeline-id }} --watch
          
      - name: Validate model performance
        run: |
          schlep monitoring job ${{ steps.training.outputs.pipeline-id }}
          
      - name: Upload model artifacts
        uses: actions/upload-artifact@v3
        if: success()
        with:
          name: model-${{ matrix.environment }}-${{ github.sha }}
          path: |
            models/
            metrics/
            logs/

  deploy-model:
    needs: train-model
    if: success() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download model artifacts
        uses: actions/download-artifact@v3
        with:
          name: model-staging-${{ github.sha }}
          path: ./artifacts
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install igris-inertial-cli
          
      - name: Authenticate with Igris Overture
        run: schlep auth login --api-key ${{ secrets.IGRIS_OVERTURE_API_KEY }}
        
      - name: Deploy model to production
        run: |
          schlep devops deploy infrastructure/ml-serving/ \
            --env production \
            --parallel 3 \
            --rollback-on-failure
            
      - name: Run health checks
        run: |
          schlep devops health-check infrastructure/ml-serving/*.yml \
            --health-check-url "https://{service}.api.igris-inertial.com/health" \
            --timeout 60 \
            --max-retries 3

  notify-completion:
    needs: [validate-data, train-model, deploy-model]
    if: always()
    runs-on: ubuntu-latest
    
    steps:
      - name: Notify success
        if: needs.deploy-model.result == 'success'
        run: |
          echo "✅ ML training and deployment completed successfully!"
          echo "Model deployed to production and health checks passed."
          
      - name: Notify failure
        if: failure()
        run: |
          echo "❌ ML training pipeline failed!"
          echo "Please check the logs and retry."