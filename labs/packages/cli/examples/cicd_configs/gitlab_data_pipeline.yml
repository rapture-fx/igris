stages:
  - validate
  - process
  - quality-check
  - deploy

variables:
  IGRIS_OVERTURE_VERSION: "1.0.0"
  PYTHON_VERSION: "3.9"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

cache:
  paths:
    - .cache/pip/
    - venv/

# Validate data sources and configurations
validate-data:
  stage: validate
  image: python:${PYTHON_VERSION}
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install --upgrade pip
    - pip install igris-inertial-cli
    - pip install -r requirements.txt
  script:
    - schlep auth login --api-key $IGRIS_OVERTURE_API_KEY
    - schlep process batch "data/raw/*.csv" --validate --dry-run
    - schlep process batch "data/raw/*.json" --validate --dry-run
  artifacts:
    reports:
      junit: validation-report.xml
    paths:
      - validation-report.json
    expire_in: 1 day
  only:
    - main
    - develop
    - merge_requests

# Process data files in parallel batches
process-data-dev:
  stage: process
  image: python:${PYTHON_VERSION}
  dependencies:
    - validate-data
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install igris-inertial-cli
    - pip install -r requirements.txt
  script:
    - schlep auth login --api-key $IGRIS_OVERTURE_API_KEY
    - |
      # Submit batch processing jobs
      schlep batch submit-files "data/raw/*.csv" \
        --batch-size 50 \
        --parallel-jobs 6 \
        --priority normal \
        --tags data-processing dev-environment
    - |
      # Start the batch processor
      schlep batch start-processor --max-workers 4
    - |
      # Monitor processing jobs
      schlep batch list-jobs --status running --watch
  environment:
    name: dev
  artifacts:
    paths:
      - processed_data/
    expire_in: 3 days
  only:
    - develop

process-data-staging:
  stage: process
  image: python:${PYTHON_VERSION}
  dependencies:
    - validate-data
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install igris-inertial-cli
    - pip install -r requirements.txt
  script:
    - schlep auth login --api-key $IGRIS_OVERTURE_API_KEY
    - |
      # Process with higher batch size for staging
      schlep batch submit-files "data/raw/*.csv" \
        --batch-size 100 \
        --parallel-jobs 8 \
        --priority high \
        --tags data-processing staging-environment \
        --timeout 1800
    - schlep batch start-processor --max-workers 6
    - schlep batch list-jobs --status running --watch
  environment:
    name: staging
  artifacts:
    paths:
      - processed_data/
    expire_in: 7 days
  only:
    - main

# Data quality checks and profiling
quality-check:
  stage: quality-check
  image: python:${PYTHON_VERSION}
  dependencies:
    - process-data-dev
    - process-data-staging
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install igris-inertial-cli
  script:
    - schlep auth login --api-key $IGRIS_OVERTURE_API_KEY
    - |
      # Generate data quality reports
      schlep process batch "processed_data/*.parquet" \
        --profile \
        --clean \
        --config config/data-quality.yml
    - |
      # Monitor data quality metrics
      schlep monitoring metrics --json > quality-metrics.json
  artifacts:
    reports:
      junit: quality-report.xml
    paths:
      - quality-metrics.json
      - data-profile-*.html
    expire_in: 1 week

# Deploy data pipeline to production
deploy-pipeline-prod:
  stage: deploy
  image: python:${PYTHON_VERSION}
  dependencies:
    - quality-check
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install igris-inertial-cli
  script:
    - schlep auth login --api-key $IGRIS_OVERTURE_API_KEY
    - |
      # Deploy infrastructure components
      schlep devops deploy infrastructure/data-pipeline/ \
        --env production \
        --parallel 3 \
        --validate-only
    - |
      # Actual deployment after validation
      schlep devops deploy infrastructure/data-pipeline/ \
        --env production \
        --parallel 3 \
        --rollback-on-failure
    - |
      # Health checks
      schlep devops health-check infrastructure/data-pipeline/*.yml \
        --timeout 120 \
        --max-retries 3
  environment:
    name: production
    url: https://data-pipeline.igris-inertial.com
  when: manual
  only:
    - main

# Infrastructure monitoring
monitor-infrastructure:
  stage: deploy
  image: python:${PYTHON_VERSION}
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install igris-inertial-cli
  script:
    - schlep auth login --api-key $IGRIS_OVERTURE_API_KEY
    - |
      # Monitor infrastructure status
      schlep devops status --provider kubernetes --output-format json > infrastructure-status.json
    - |
      # Monitor batch job queue
      schlep batch queue-stats > queue-stats.json
  artifacts:
    paths:
      - infrastructure-status.json
      - queue-stats.json
    expire_in: 1 day
  allow_failure: true
  only:
    - schedules

# Cleanup old batch jobs
cleanup-jobs:
  stage: deploy
  image: python:${PYTHON_VERSION}
  before_script:
    - python -m venv venv
    - source venv/bin/activate
    - pip install igris-inertial-cli
  script:
    - schlep auth login --api-key $IGRIS_OVERTURE_API_KEY
    - |
      # Clean up old completed jobs (older than 7 days)
      schlep batch cleanup \
        --older-than 7d \
        --status completed \
        --status failed
  allow_failure: true
  only:
    - schedules