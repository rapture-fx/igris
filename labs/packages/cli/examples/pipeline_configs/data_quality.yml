# Data Quality Pipeline Configuration
name: data-quality-assessment
description: Comprehensive data quality assessment and cleaning pipeline

# Pipeline Type
pipeline_type: data_quality

# Data Sources
data_sources:
  - type: csv
    path: "data/raw/*.csv"
    delimiter: ","
    encoding: utf-8
  - type: json
    path: "data/raw/*.json"
  - type: parquet
    path: "data/raw/*.parquet"

# Quality Checks
quality_checks:
  completeness:
    - check_missing_values
    - check_null_values
    - check_empty_strings
    
  consistency:
    - check_data_types
    - check_format_patterns
    - check_value_ranges
    
  accuracy:
    - check_duplicates
    - check_outliers
    - validate_business_rules
    
  uniqueness:
    - check_primary_keys
    - identify_duplicate_records

# Data Profiling
profiling:
  generate_statistics: true
  create_histograms: true
  correlation_analysis: true
  pattern_detection: true
  
# Cleaning Rules
cleaning:
  missing_values:
    strategy: smart_imputation
    numeric_strategy: median
    categorical_strategy: mode
    
  outliers:
    method: iqr
    action: cap # or 'remove'
    
  duplicates:
    action: remove_exact
    keep: first
    
  formatting:
    standardize_text: true
    normalize_whitespace: true
    convert_case: lower

# Output Configuration
output:
  cleaned_data:
    format: parquet
    path: "data/cleaned/"
    
  quality_report:
    format: html
    path: "reports/quality_report.html"
    
  metadata:
    format: json
    path: "metadata/data_profile.json"

# Thresholds
thresholds:
  completeness_threshold: 0.95
  accuracy_threshold: 0.98
  consistency_threshold: 0.99

# Notifications
notifications:
  on_completion: true
  on_failure: true
  quality_alerts: true
  threshold_violations: true

# Tags
tags:
  - data-quality
  - data-cleaning
  - data-profiling
  - preprocessing