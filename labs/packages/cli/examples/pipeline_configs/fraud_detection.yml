# Fraud Detection Pipeline Configuration
name: fraud-detection-pipeline
description: Machine learning pipeline for credit card fraud detection

# Model Configuration
model_type: random_forest
parameters:
  n_estimators: 100
  max_depth: 10
  min_samples_split: 2
  min_samples_leaf: 1
  random_state: 42

# Feature Engineering
features:
  - amount
  - merchant_category_code
  - time_of_day
  - day_of_week
  - location_risk_score
  - user_spending_pattern
  - transaction_frequency
  - amount_deviation

# Target variable
target: is_fraud

# Data Processing
data_processing:
  clean_missing_values: true
  normalize_features: true
  handle_outliers: true
  feature_selection: true
  
# Training Configuration
training:
  test_size: 0.2
  validation_size: 0.1
  cross_validation_folds: 5
  stratify: true

# Model Evaluation
evaluation:
  metrics:
    - accuracy
    - precision
    - recall
    - f1_score
    - roc_auc
    - confusion_matrix
  
# Deployment Settings
deployment:
  model_name: fraud_detector_v1
  environment: production
  auto_deploy: false
  monitoring: true

# Pipeline Tags
tags:
  - fraud-detection
  - machine-learning
  - production
  - financial-services