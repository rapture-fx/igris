[package]
name = "slo_enforcer"
version = "1.0.0"
edition = "2021"
authors = ["Igris Inertial Team"]

[lib]
name = "slo_enforcer"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
