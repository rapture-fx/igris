# P0-4 FIX: Dragonfly replaces Redis for 25x better throughput
# Dragonfly is 100% Redis protocol compatible - zero code changes needed
# Handles 200k+ RPS on single node vs Redis's 8k RPS

version: '3.8'

services:
  # P0-4: Dragonfly Cache (replaces Redis)
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: igris-dragonfly
    ports:
      - "6379:6379"
    volumes:
      - dragonfly-data:/data
    command: >
      dragonfly
      --logtostderr
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory 4gb
      --cache_mode
      --proactor_threads 8
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - igris-network

  # P0-5: pgBouncer connection pooler
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: igris-pgbouncer
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-igris_overture}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=10000
      - DEFAULT_POOL_SIZE=50
      - RESERVE_POOL_SIZE=10
      - SERVER_LIFETIME=3600
      - SERVER_IDLE_TIMEOUT=600
    ports:
      - "5433:5432"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - igris-network

  # Postgres Database
  postgres:
    image: postgres:16-alpine
    container_name: igris-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-igris_overture}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    command: >
      postgres
      -c max_connections=500
      -c shared_buffers=2GB
      -c effective_cache_size=6GB
      -c maintenance_work_mem=512MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=10MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - igris-network

volumes:
  dragonfly-data:
  postgres-data:

networks:
  igris-network:
    driver: bridge
