services:
  # Schlep Engine API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.minimal
    image: schlep-engine:2.0.0-minimal
    container_name: schlep-engine-api
    ports:
      - "8000:8000"
      - "9090:9090"  # Metrics port
    environment:
      # Application Configuration
      - APP_NAME=Schlep Engine
      - APP_VERSION=2.0.0
      - APP_ENV=development
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000

      # Database Configuration
      - DATABASE_HOST=postgresql
      - DATABASE_PORT=5432
      - DATABASE_NAME=schlepengine
      - DATABASE_USER=schlep_user
      - DATABASE_PASSWORD=schlep_password_dev

      # Redis Configuration
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=redis_password_dev

      # Storage Configuration
      - STORAGE_BACKEND=filesystem
      - STORAGE_PATH=/data

      # Processing Configuration
      - CSV_MAX_SIZE_MB=1000
      - CSV_PROCESSING_ENGINE=polars

      # ML Configuration
      - ENABLE_TORCH=false
      - ENABLE_TF=false
      - ENABLE_GPU=false

      # Security
      - JWT_SECRET=development_jwt_secret_change_in_production
      - SECRET_KEY=development_secret_key_change_in_production

      # Monitoring
      - PROMETHEUS_ENABLED=true
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - schlep-network

  # PostgreSQL Database
  postgresql:
    image: postgres:15-alpine
    container_name: schlep-postgresql
    environment:
      - POSTGRES_DB=schlepengine
      - POSTGRES_USER=schlep_user
      - POSTGRES_PASSWORD=schlep_password_dev
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgresql_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schlep_user -d schlepengine"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - schlep-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: schlep-redis
    command: redis-server --requirepass redis_password_dev --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "redis_password_dev", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - schlep-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: schlep-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - schlep-network

  # Grafana Visualization
  grafana:
    image: grafana/grafana:10.2.0
    container_name: schlep-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - schlep-network

  # Optional: MinIO S3-Compatible Storage
  minio:
    image: minio/minio:latest
    container_name: schlep-minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - schlep-network

volumes:
  postgresql_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  minio_data:
    driver: local

networks:
  schlep-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16