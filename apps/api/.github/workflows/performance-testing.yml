name: Performance Testing and Regression Detection

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run performance tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of performance test to run'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - load
        - volume
        - memory
        - regression
      concurrent_users:
        description: 'Number of concurrent users for load testing'
        required: false
        default: '50'
      test_duration:
        description: 'Test duration in seconds'
        required: false
        default: '300'

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'

jobs:
  performance-baseline:
    name: Performance Baseline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schlep_engine_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        cd apps/api
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Set up test environment
      run: |
        cd apps/api
        cp env.development.template .env
        # Configure test database
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/schlep_engine_test" >> .env
        echo "REDIS_URL=redis://localhost:6379/0" >> .env
        echo "TESTING=true" >> .env
        
    - name: Initialize test database
      run: |
        cd apps/api
        python -c "
        import asyncio
        from app.core.database import create_tables
        asyncio.run(create_tables())
        "
        
    - name: Start API server in background
      run: |
        cd apps/api
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
        
    - name: Wait for API to be ready
      run: |
        timeout 30 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'
        
    - name: Run performance framework tests
      run: |
        cd apps/api
        python -m pytest tests/performance_framework.py -v -s --tb=short
        
    - name: Archive performance results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-baseline-results
        path: |
          apps/api/performance_reports/
          apps/api/performance_benchmarks.db
        retention-days: 30

  load-testing:
    name: Load Testing with Locust
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: performance-baseline
    if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'load' || github.event_name != 'workflow_dispatch' }}
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schlep_engine_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        cd apps/api
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Set up test environment
      run: |
        cd apps/api
        cp env.development.template .env
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/schlep_engine_test" >> .env
        echo "REDIS_URL=redis://localhost:6379/0" >> .env
        echo "TESTING=true" >> .env
        
    - name: Initialize test database
      run: |
        cd apps/api
        python init_db.py
        
    - name: Start API server
      run: |
        cd apps/api
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 15
        
    - name: Wait for API to be ready
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'
        
    - name: Run Locust load tests
      env:
        CONCURRENT_USERS: ${{ github.event.inputs.concurrent_users || '25' }}
        TEST_DURATION: ${{ github.event.inputs.test_duration || '180' }}
      run: |
        cd apps/api
        locust -f tests/locust_load_tests.py \
          --host http://localhost:8000 \
          --users $CONCURRENT_USERS \
          --spawn-rate 5 \
          --run-time ${TEST_DURATION}s \
          --headless \
          --html load_test_report.html \
          --csv load_test_results
        
    - name: Validate performance thresholds
      run: |
        cd apps/api
        python -c "
        import json
        import sys
        
        # Load the latest metrics file
        import glob
        metrics_files = glob.glob('load_test_metrics_*.json')
        if not metrics_files:
            print('No metrics file found')
            sys.exit(1)
            
        with open(max(metrics_files), 'r') as f:
            data = json.load(f)
        
        summary = data.get('test_summary', {})
        locust_stats = data.get('locust_stats', {})
        
        # Check thresholds
        success_rate = summary.get('success_rate', 0)
        avg_response_time = summary.get('avg_response_time', 999999)
        rps = summary.get('requests_per_second', 0)
        
        print(f'Success Rate: {success_rate:.2f}%')
        print(f'Avg Response Time: {avg_response_time:.2f}ms')
        print(f'Requests/Second: {rps:.2f}')
        
        # Performance thresholds
        if success_rate < 95:
            print(f'FAIL: Success rate {success_rate:.2f}% below threshold (95%)')
            sys.exit(1)
            
        if avg_response_time > 500:
            print(f'FAIL: Average response time {avg_response_time:.2f}ms above threshold (500ms)')
            sys.exit(1)
            
        if rps < 10:
            print(f'FAIL: Requests per second {rps:.2f} below threshold (10 RPS)')
            sys.exit(1)
            
        print('✅ All performance thresholds passed')
        "
        
    - name: Archive load test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: load-test-results
        path: |
          apps/api/load_test_report.html
          apps/api/load_test_results*.csv
          apps/api/load_test_metrics_*.json
        retention-days: 30

  volume-testing:
    name: Data Volume Performance Testing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: performance-baseline
    if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'volume' || github.event_name != 'workflow_dispatch' }}
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schlep_engine_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        cd apps/api
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Set up test environment
      run: |
        cd apps/api
        cp env.development.template .env
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/schlep_engine_test" >> .env
        echo "REDIS_URL=redis://localhost:6379/0" >> .env
        echo "TESTING=true" >> .env
        
    - name: Initialize test database
      run: |
        cd apps/api
        python init_db.py
        
    - name: Start API server
      run: |
        cd apps/api
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 15
        
    - name: Wait for API to be ready
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'
        
    - name: Run volume tests (1K, 10K, 25K records)
      run: |
        cd apps/api
        python tests/data_volume_tests.py --volumes 1000 10000 25000 --dataset employees
        
    - name: Run pytest volume tests
      run: |
        cd apps/api
        python -m pytest tests/data_volume_tests.py -v -s --tb=short
        
    - name: Archive volume test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: volume-test-results
        path: |
          apps/api/volume_test_results_*.json
        retention-days: 30

  memory-profiling:
    name: Memory Profiling Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: performance-baseline
    if: ${{ github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'memory' || github.event_name != 'workflow_dispatch' }}
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schlep_engine_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        cd apps/api
        pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Set up test environment
      run: |
        cd apps/api
        cp env.development.template .env
        echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/schlep_engine_test" >> .env
        echo "REDIS_URL=redis://localhost:6379/0" >> .env
        echo "TESTING=true" >> .env
        
    - name: Initialize test database
      run: |
        cd apps/api
        python init_db.py
        
    - name: Start API server
      run: |
        cd apps/api
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 15
        
    - name: Wait for API to be ready
      run: |
        timeout 60 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'
        
    - name: Run memory profiling tests
      run: |
        cd apps/api
        python -m pytest tests/memory_profiling_tests.py -v -s --tb=short
        
    - name: Generate memory profiling report
      run: |
        cd apps/api
        python tests/memory_profiling_tests.py --profile-report --iterations 30
        
    - name: Check for memory leaks
      run: |
        cd apps/api
        python -c "
        import json
        import glob
        import sys
        
        # Find the latest memory report
        json_files = glob.glob('memory_reports/memory_data_*.json')
        if not json_files:
            print('No memory profiling data found')
            sys.exit(1)
        
        with open(max(json_files), 'r') as f:
            data = json.load(f)
        
        summary = data.get('summary', {})
        leaks = summary.get('memory_leaks_detected', 0)
        avg_efficiency = summary.get('average_efficiency_score', 0)
        
        print(f'Memory leaks detected: {leaks}')
        print(f'Average efficiency score: {avg_efficiency:.1f}/100')
        
        if leaks > 0:
            print(f'FAIL: {leaks} memory leak(s) detected')
            sys.exit(1)
            
        if avg_efficiency < 50:
            print(f'FAIL: Memory efficiency too low: {avg_efficiency:.1f}/100')
            sys.exit(1)
            
        print('✅ Memory profiling passed')
        "
        
    - name: Archive memory profiling results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: memory-profiling-results
        path: |
          apps/api/memory_reports/
        retention-days: 30

  regression-detection:
    name: Performance Regression Detection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [load-testing, volume-testing, memory-profiling]
    if: ${{ always() && (github.event.inputs.test_type == 'all' || github.event.inputs.test_type == 'regression' || github.event_name != 'workflow_dispatch') }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        pip install pandas numpy matplotlib requests
        
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: artifacts/
        
    - name: Analyze performance regression
      run: |
        cd artifacts
        python -c "
        import json
        import glob
        import os
        import pandas as pd
        import sys
        from pathlib import Path
        
        print('🔍 Analyzing performance regression...')
        
        # Look for performance results
        results_found = False
        
        # Check load test results
        load_files = glob.glob('**/load_test_metrics_*.json', recursive=True)
        if load_files:
            print(f'Found {len(load_files)} load test result(s)')
            results_found = True
            
            for file in load_files:
                with open(file, 'r') as f:
                    data = json.load(f)
                
                summary = data.get('test_summary', {})
                success_rate = summary.get('success_rate', 0)
                avg_response_time = summary.get('avg_response_time', 0)
                rps = summary.get('requests_per_second', 0)
                
                print(f'Load Test - Success: {success_rate:.1f}%, Response: {avg_response_time:.1f}ms, RPS: {rps:.1f}')
        
        # Check volume test results
        volume_files = glob.glob('**/volume_test_results_*.json', recursive=True)
        if volume_files:
            print(f'Found {len(volume_files)} volume test result(s)')
            results_found = True
            
            for file in volume_files:
                with open(file, 'r') as f:
                    data = json.load(f)
                
                results = data.get('results', [])
                if results:
                    avg_throughput = sum(r['throughput_records_per_second'] for r in results) / len(results)
                    print(f'Volume Test - Avg Throughput: {avg_throughput:.1f} records/sec')
        
        # Check memory profiling results
        memory_files = glob.glob('**/memory_data_*.json', recursive=True)
        if memory_files:
            print(f'Found {len(memory_files)} memory profiling result(s)')
            results_found = True
            
            for file in memory_files:
                with open(file, 'r') as f:
                    data = json.load(f)
                
                summary = data.get('summary', {})
                leaks = summary.get('memory_leaks_detected', 0)
                efficiency = summary.get('average_efficiency_score', 0)
                
                print(f'Memory Test - Leaks: {leaks}, Efficiency: {efficiency:.1f}/100')
        
        if not results_found:
            print('⚠️ No performance results found for regression analysis')
            sys.exit(0)
        
        print('✅ Performance regression analysis completed')
        
        # In a real implementation, you would compare with historical baselines
        # and detect significant regressions
        "
        
    - name: Create performance summary
      run: |
        cd artifacts
        echo '# Performance Test Summary' > performance_summary.md
        echo '' >> performance_summary.md
        echo '## Test Results' >> performance_summary.md
        echo '' >> performance_summary.md
        
        # Add load test results if available
        if ls **/load_test_metrics_*.json 2>/dev/null; then
            echo '### Load Testing Results' >> performance_summary.md
            python -c "
            import json
            import glob
            
            files = glob.glob('**/load_test_metrics_*.json', recursive=True)
            for file in files:
                with open(file, 'r') as f:
                    data = json.load(f)
                
                summary = data.get('test_summary', {})
                print(f'- Success Rate: {summary.get(\"success_rate\", 0):.1f}%')
                print(f'- Average Response Time: {summary.get(\"avg_response_time\", 0):.1f}ms')
                print(f'- Requests per Second: {summary.get(\"requests_per_second\", 0):.1f}')
            " >> performance_summary.md
            echo '' >> performance_summary.md
        fi
        
        # Add volume test results if available  
        if ls **/volume_test_results_*.json 2>/dev/null; then
            echo '### Volume Testing Results' >> performance_summary.md
            python -c "
            import json
            import glob
            
            files = glob.glob('**/volume_test_results_*.json', recursive=True)
            for file in files:
                with open(file, 'r') as f:
                    data = json.load(f)
                
                results = data.get('results', [])
                for result in results:
                    records = result.get('record_count', 0)
                    throughput = result.get('throughput_records_per_second', 0)
                    grade = result.get('performance_grade', 'N/A')
                    print(f'- {records:,} records: {throughput:.1f} records/sec (Grade: {grade})')
            " >> performance_summary.md
            echo '' >> performance_summary.md
        fi
        
        cat performance_summary.md
        
    - name: Archive regression analysis
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: regression-analysis
        path: |
          artifacts/performance_summary.md
        retention-days: 30

  performance-report:
    name: Generate Performance Report
    runs-on: ubuntu-latest
    needs: [regression-detection]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v3
      with:
        path: artifacts/
        
    - name: Generate comprehensive report
      run: |
        echo "# Schlep-engine Performance Test Report" > PERFORMANCE_REPORT.md
        echo "" >> PERFORMANCE_REPORT.md
        echo "**Generated:** $(date)" >> PERFORMANCE_REPORT.md
        echo "**Commit:** ${{ github.sha }}" >> PERFORMANCE_REPORT.md
        echo "**Branch:** ${{ github.ref_name }}" >> PERFORMANCE_REPORT.md
        echo "" >> PERFORMANCE_REPORT.md
        
        echo "## Test Summary" >> PERFORMANCE_REPORT.md
        echo "" >> PERFORMANCE_REPORT.md
        
        # Check which tests ran successfully
        if [ -d "artifacts/performance-baseline-results" ]; then
            echo "✅ Performance baseline tests completed" >> PERFORMANCE_REPORT.md
        fi
        
        if [ -d "artifacts/load-test-results" ]; then
            echo "✅ Load testing completed" >> PERFORMANCE_REPORT.md
        fi
        
        if [ -d "artifacts/volume-test-results" ]; then
            echo "✅ Volume testing completed" >> PERFORMANCE_REPORT.md
        fi
        
        if [ -d "artifacts/memory-profiling-results" ]; then
            echo "✅ Memory profiling completed" >> PERFORMANCE_REPORT.md
        fi
        
        echo "" >> PERFORMANCE_REPORT.md
        echo "## Detailed Results" >> PERFORMANCE_REPORT.md
        echo "" >> PERFORMANCE_REPORT.md
        echo "Detailed performance reports and metrics are available in the workflow artifacts." >> PERFORMANCE_REPORT.md
        echo "" >> PERFORMANCE_REPORT.md
        
        # Add performance summary if available
        if [ -f "artifacts/regression-analysis/performance_summary.md" ]; then
            echo "## Performance Metrics" >> PERFORMANCE_REPORT.md
            cat artifacts/regression-analysis/performance_summary.md >> PERFORMANCE_REPORT.md
        fi
        
        cat PERFORMANCE_REPORT.md
        
    - name: Comment PR with results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          
          if (fs.existsSync('PERFORMANCE_REPORT.md')) {
            const report = fs.readFileSync('PERFORMANCE_REPORT.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
          }
          
    - name: Archive final report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: performance-report
        path: |
          PERFORMANCE_REPORT.md
        retention-days: 90