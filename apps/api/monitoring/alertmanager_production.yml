global:
  resolve_timeout: 5m
  slack_api_url: 'https://hooks.slack.com/services/YOUR_SLACK_WEBHOOK_URL'
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@schlep-engine.com'
  smtp_auth_username: 'alerts@schlep-engine.com'
  smtp_auth_password: 'your-smtp-password'

route:
  group_by: ['alertname', 'environment', 'service', 'severity']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 12h
  receiver: 'default-team'
  routes:
    # Critical alerts - immediate response required
    - match:
        severity: critical
      receiver: 'critical-alerts'
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 15m
      routes:
        - match:
            alertname: ServiceDown
          receiver: 'service-down-critical'
          repeat_interval: 5m
        - match:
            alertname: DatabaseDown
          receiver: 'database-critical'
          repeat_interval: 5m
        - match:
            alertname: SecurityBreach
          receiver: 'security-critical'
          repeat_interval: 1m
    
    # High severity alerts - response within 30 minutes
    - match:
        severity: high
      receiver: 'high-priority-alerts'
      group_wait: 5s
      group_interval: 2m
      repeat_interval: 1h
    
    # Warning alerts - response within 2 hours
    - match:
        severity: warning
      receiver: 'warning-alerts'
      repeat_interval: 2h
    
    # Info alerts - daily summary
    - match:
        severity: info
      receiver: 'info-alerts'
      repeat_interval: 24h
    
    # Business alerts - specific routing
    - match:
        category: business
      receiver: 'business-alerts'
      repeat_interval: 4h
    
    # Data quality alerts
    - match:
        category: data_quality
      receiver: 'data-quality-alerts'
      repeat_interval: 6h
    
    # Performance alerts
    - match:
        category: performance
      receiver: 'performance-alerts'
      repeat_interval: 1h

inhibit_rules:
  # Critical alerts suppress lower severity alerts for the same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'high'
    equal: ['alertname', 'service', 'instance']
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service', 'instance']
  - source_match:
      severity: 'high'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service', 'instance']
  
  # Service down alerts suppress other alerts from the same service
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '.*'
    equal: ['service', 'instance']
  
  # Database down alerts suppress database-related alerts
  - source_match:
      alertname: 'DatabaseDown'
    target_match_re:
      alertname: 'Database.*'
    equal: ['database', 'instance']

receivers:
  - name: 'default-team'
    slack_configs:
      - channel: '#alerts'
        title: '{{ template "slack.default.title" . }}'
        text: '{{ template "slack.default.text" . }}'
        send_resolved: true
        icon_emoji: ':warning:'

  - name: 'critical-alerts'
    slack_configs:
      - channel: '#critical-alerts'
        title: '🚨 CRITICAL ALERT: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Service:* {{ .Labels.service }}
          *Environment:* {{ .Labels.environment }}
          *Severity:* {{ .Labels.severity }}
          *Started:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          {{ if .Labels.runbook_url }}*Runbook:* {{ .Labels.runbook_url }}{{ end }}
          {{ if .Labels.dashboard_url }}*Dashboard:* {{ .Labels.dashboard_url }}{{ end }}
          {{ end }}
        send_resolved: true
        icon_emoji: ':rotating_light:'
    email_configs:
      - to: 'oncall@schlep-engine.com, devops@schlep-engine.com'
        send_resolved: true
        headers:
          Subject: '🚨 CRITICAL: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        html: |
          <h2>🚨 Critical Alert</h2>
          {{ range .Alerts }}
          <h3>{{ .Annotations.summary }}</h3>
          <p><strong>Description:</strong> {{ .Annotations.description }}</p>
          <p><strong>Service:</strong> {{ .Labels.service }}</p>
          <p><strong>Environment:</strong> {{ .Labels.environment }}</p>
          <p><strong>Severity:</strong> {{ .Labels.severity }}</p>
          <p><strong>Started:</strong> {{ .StartsAt.Format "2006-01-02 15:04:05" }}</p>
          {{ if .Labels.runbook_url }}<p><strong>Runbook:</strong> <a href="{{ .Labels.runbook_url }}">{{ .Labels.runbook_url }}</a></p>{{ end }}
          {{ if .Labels.dashboard_url }}<p><strong>Dashboard:</strong> <a href="{{ .Labels.dashboard_url }}">{{ .Labels.dashboard_url }}</a></p>{{ end }}
          {{ end }}
    pagerduty_configs:
      - routing_key: 'your-pagerduty-routing-key'
        description: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        severity: 'critical'
        client: 'Schlep Engine AlertManager'
        client_url: 'https://grafana.schlep-engine.com'

  - name: 'service-down-critical'
    slack_configs:
      - channel: '#service-down'
        title: '🚨 SERVICE DOWN: {{ range .Alerts }}{{ .Labels.service }}{{ end }}'
        text: |
          🚨 *SERVICE DOWN ALERT*
          {{ range .Alerts }}
          *Service:* {{ .Labels.service }}
          *Instance:* {{ .Labels.instance }}
          *Environment:* {{ .Labels.environment }}
          *Duration:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          *Runbook:* https://runbooks.schlep-engine.com/service-down
          {{ end }}
        send_resolved: true
        icon_emoji: ':red_circle:'
    pagerduty_configs:
      - routing_key: 'service-down-routing-key'
        description: 'Service Down: {{ range .Alerts }}{{ .Labels.service }}{{ end }}'
        severity: 'critical'

  - name: 'database-critical'
    slack_configs:
      - channel: '#database-alerts'
        title: '🚨 DATABASE CRITICAL: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        send_resolved: true
        icon_emoji: ':database:'
    pagerduty_configs:
      - routing_key: 'database-routing-key'
        description: 'Database Critical: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        severity: 'critical'

  - name: 'security-critical'
    slack_configs:
      - channel: '#security-alerts'
        title: '🔒 SECURITY ALERT: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: |
          🔒 *SECURITY ALERT*
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Source IP:* {{ .Labels.source_ip }}
          *Event Type:* {{ .Labels.event_type }}
          *Severity:* {{ .Labels.severity }}
          *Time:* {{ .StartsAt.Format "2006-01-02 15:04:05" }}
          *Immediate Action Required*
          {{ end }}
        send_resolved: true
        icon_emoji: ':lock:'
    email_configs:
      - to: 'security@schlep-engine.com, oncall@schlep-engine.com'
        send_resolved: true
        headers:
          Subject: '🔒 SECURITY ALERT: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

  - name: 'high-priority-alerts'
    slack_configs:
      - channel: '#high-priority'
        title: '⚠️ HIGH PRIORITY: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: '{{ template "slack.high.text" . }}'
        send_resolved: true
        icon_emoji: ':exclamation:'
    email_configs:
      - to: 'devops@schlep-engine.com'
        send_resolved: true

  - name: 'warning-alerts'
    slack_configs:
      - channel: '#warnings'
        title: '⚠️ WARNING: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: '{{ template "slack.warning.text" . }}'
        send_resolved: true
        icon_emoji: ':warning:'

  - name: 'info-alerts'
    slack_configs:
      - channel: '#info-alerts'
        title: 'ℹ️ INFO: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: '{{ template "slack.info.text" . }}'
        send_resolved: true
        icon_emoji: ':information_source:'

  - name: 'business-alerts'
    slack_configs:
      - channel: '#business-metrics'
        title: '📊 BUSINESS ALERT: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: |
          📊 *Business Metrics Alert*
          {{ range .Alerts }}
          *Metric:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Current Value:* {{ .Annotations.value }}
          *Threshold:* {{ .Annotations.threshold }}
          *Impact:* {{ .Annotations.impact }}
          *Dashboard:* https://grafana.schlep-engine.com/d/business-metrics
          {{ end }}
        send_resolved: true
        icon_emoji: ':chart_with_upwards_trend:'
    email_configs:
      - to: 'business@schlep-engine.com, product@schlep-engine.com'
        send_resolved: true

  - name: 'data-quality-alerts'
    slack_configs:
      - channel: '#data-quality'
        title: '📈 DATA QUALITY: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: |
          📈 *Data Quality Alert*
          {{ range .Alerts }}
          *Dataset:* {{ .Labels.dataset_id }}
          *Quality Dimension:* {{ .Labels.quality_dimension }}
          *Score:* {{ .Annotations.score }}
          *Threshold:* {{ .Annotations.threshold }}
          *Description:* {{ .Annotations.description }}
          {{ end }}
        send_resolved: true
        icon_emoji: ':bar_chart:'

  - name: 'performance-alerts'
    slack_configs:
      - channel: '#performance'
        title: '⚡ PERFORMANCE: {{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
        text: |
          ⚡ *Performance Alert*
          {{ range .Alerts }}
          *Service:* {{ .Labels.service }}
          *Metric:* {{ .Annotations.metric }}
          *Current Value:* {{ .Annotations.value }}
          *Threshold:* {{ .Annotations.threshold }}
          *Impact:* {{ .Annotations.impact }}
          {{ end }}
        send_resolved: true
        icon_emoji: ':zap:'

templates:
  - '/etc/alertmanager/templates/*.tmpl'