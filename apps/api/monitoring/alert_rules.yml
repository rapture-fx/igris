groups:
  - name: schlep_engine_debug_service
    rules:
      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state == 2
        for: 1m
        labels:
          severity: critical
          service: debug
        annotations:
          summary: "Circuit breaker {{ $labels.circuit_name }} is open"
          description: "Circuit breaker {{ $labels.circuit_name }} has been open for more than 1 minute, indicating service degradation."

      - alert: HighCircuitBreakerFailureRate
        expr: rate(circuit_breaker_failures_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          service: debug
        annotations:
          summary: "High circuit breaker failure rate for {{ $labels.circuit_name }}"
          description: "Circuit breaker {{ $labels.circuit_name }} is failing at a rate of {{ $value }} failures per second."

      - alert: ServiceUnhealthy
        expr: service_status == 0
        for: 30s
        labels:
          severity: critical
          service: debug
        annotations:
          summary: "Service {{ $labels.service }} is unhealthy"
          description: "Service {{ $labels.service }} has been unhealthy for more than 30 seconds."

      - alert: HighHealthCheckDuration
        expr: histogram_quantile(0.95, health_check_duration_seconds_bucket) > 5
        for: 5m
        labels:
          severity: warning
          service: debug
        annotations:
          summary: "High health check duration for {{ $labels.service }}"
          description: "95th percentile health check duration for {{ $labels.service }} is {{ $value }}s, which is above the 5s threshold."

      - alert: HighRetryRate
        expr: rate(retry_attempts_total{status="failure"}[5m]) > 1
        for: 3m
        labels:
          severity: warning
          service: debug
        annotations:
          summary: "High retry failure rate for {{ $labels.operation }}"
          description: "Operation {{ $labels.operation }} is failing and retrying at a rate of {{ $value }} per second."

      - alert: HighTimeoutRate
        expr: rate(request_timeouts_total[5m]) > 0.01
        for: 2m
        labels:
          severity: warning
          service: debug
        annotations:
          summary: "High request timeout rate for {{ $labels.endpoint }}"
          description: "Endpoint {{ $labels.endpoint }} is timing out at a rate of {{ $value }} per second."

      - alert: DatabaseConnectionFailure
        expr: service_status{service="database"} == 0
        for: 15s
        labels:
          severity: critical
          service: debug
        annotations:
          summary: "Database connection failure"
          description: "Database connection has been failing for more than 15 seconds."

      - alert: RedisConnectionFailure
        expr: service_status{service="redis"} == 0
        for: 15s
        labels:
          severity: critical
          service: debug
        annotations:
          summary: "Redis connection failure"
          description: "Redis connection has been failing for more than 15 seconds."

      - alert: SystemResourcesHigh
        expr: service_status{service="system"} == 0
        for: 5m
        labels:
          severity: warning
          service: debug
        annotations:
          summary: "System resources are critically high"
          description: "System resources (CPU, Memory, or Disk) have been critically high for more than 5 minutes."

  - name: schlep_engine_debug_service_degradation
    rules:
      - alert: ServiceDegraded
        expr: increase(circuit_breaker_failures_total[10m]) > 10
        for: 5m
        labels:
          severity: warning
          service: debug
        annotations:
          summary: "Service degradation detected for {{ $labels.circuit_name }}"
          description: "Circuit breaker {{ $labels.circuit_name }} has recorded {{ $value }} failures in the last 10 minutes."

      - alert: HealthCheckFailureSpike
        expr: increase(health_check_total{status!="healthy"}[5m]) > 5
        for: 2m
        labels:
          severity: warning
          service: debug
        annotations:
          summary: "Health check failure spike for {{ $labels.service }}"
          description: "Service {{ $labels.service }} has had {{ $value }} health check failures in the last 5 minutes."

      - alert: CachePerformanceDegradation
        expr: rate(cache_misses_total[5m]) / rate(cache_hits_total[5m]) > 0.5
        for: 10m
        labels:
          severity: warning
          service: debug
        annotations:
          summary: "Cache performance degradation"
          description: "Cache miss rate is {{ $value | humanizePercentage }}, indicating potential performance issues."

  # Cost Monitoring Alerts - Integrated with existing infrastructure
  - name: schlep_engine_cost_monitoring
    rules:
      # Overall Budget Alerts
      - alert: MonthlyBudgetThreshold80Percent
        expr: sum(cost_current_month_dollars) >= 116
        for: 5m
        labels:
          severity: warning
          service: cost_monitoring
          alert_type: budget
        annotations:
          summary: "Monthly budget utilization at 80% threshold"
          description: "Total monthly cost of ${{ $value }} has reached 80% of the $145 budget. Current utilization: {{ $value / 145 * 100 | humanizePercentage }}%"
          runbook_url: "https://docs.schlep-engine.com/runbooks/cost-management"
          dashboard_url: "https://grafana.schlep-engine.com/d/cost-monitoring/cost-monitoring"

      - alert: MonthlyBudgetThreshold90Percent
        expr: sum(cost_current_month_dollars) >= 130.5
        for: 2m
        labels:
          severity: critical
          service: cost_monitoring
          alert_type: budget
        annotations:
          summary: "Monthly budget utilization at 90% threshold - CRITICAL"
          description: "Total monthly cost of ${{ $value }} has reached 90% of the $145 budget. Immediate cost optimization required!"
          runbook_url: "https://docs.schlep-engine.com/runbooks/cost-management"
          dashboard_url: "https://grafana.schlep-engine.com/d/cost-monitoring/cost-monitoring"

      - alert: MonthlyBudgetExceeded
        expr: sum(cost_current_month_dollars) > 145
        for: 1m
        labels:
          severity: critical
          service: cost_monitoring
          alert_type: budget_exceeded
        annotations:
          summary: "MONTHLY BUDGET EXCEEDED"
          description: "Total monthly cost of ${{ $value }} has exceeded the $145 budget by ${{ $value - 145 | humanize }}. Emergency cost reduction measures required!"
          runbook_url: "https://docs.schlep-engine.com/runbooks/emergency-cost-reduction"
          dashboard_url: "https://grafana.schlep-engine.com/d/cost-monitoring/cost-monitoring"

      # Service-Specific Budget Alerts
      - alert: ServiceBudgetThreshold80Percent
        expr: cost_budget_utilization_percent >= 80
        for: 5m
        labels:
          severity: warning
          service: "{{ $labels.service }}"
          alert_type: service_budget
        annotations:
          summary: "{{ $labels.service }} budget at 80% threshold"
          description: "{{ $labels.service }} budget utilization at {{ $value }}%"
          runbook_url: "https://docs.schlep-engine.com/runbooks/service-cost-optimization"

      - alert: ServiceBudgetExceeded
        expr: cost_budget_utilization_percent > 100
        for: 2m
        labels:
          severity: critical
          service: "{{ $labels.service }}"
          alert_type: service_budget_exceeded
        annotations:
          summary: "Service budget exceeded for {{ $labels.service }}"
          description: "{{ $labels.service }} has exceeded its budget with {{ $value }}% utilization"
          runbook_url: "https://docs.schlep-engine.com/runbooks/emergency-cost-reduction"

      # Usage-Based Alerts
      - alert: APIRequestsApproachingLimit
        expr: api_requests_monthly >= 40000
        for: 10m
        labels:
          severity: warning
          service: api
          alert_type: usage_limit
        annotations:
          summary: "API requests approaching monthly limit"
          description: "Monthly API requests ({{ $value }}) are at {{ $value / 50000 * 100 | humanizePercentage }}% of the 50,000 limit"
          runbook_url: "https://docs.schlep-engine.com/runbooks/api-rate-limiting"

      - alert: StorageApproachingLimit
        expr: storage_used_gb >= 80
        for: 10m
        labels:
          severity: warning
          service: storage
          alert_type: usage_limit
        annotations:
          summary: "Storage usage approaching limit"
          description: "Storage usage ({{ $value }}GB) is at {{ $value / 100 * 100 | humanizePercentage }}% of the 100GB limit"
          runbook_url: "https://docs.schlep-engine.com/runbooks/storage-management"

      # Cost Forecast Alerts
      - alert: MonthlyForecastExceedsBudget
        expr: sum(cost_forecast_month_dollars) > 145
        for: 15m
        labels:
          severity: warning
          service: cost_monitoring
          alert_type: forecast
        annotations:
          summary: "Monthly cost forecast exceeds budget"
          description: "Based on current usage trends, projected monthly cost of ${{ $value }} will exceed the $145 budget by ${{ $value - 145 | humanize }}"
          runbook_url: "https://docs.schlep-engine.com/runbooks/cost-forecasting"

      # Rapid cost increases
      - alert: RapidCostIncrease
        expr: increase(cost_current_month_dollars[1h]) > 5
        for: 5m
        labels:
          severity: critical
          service: "{{ $labels.service }}"
          alert_type: rapid_increase
        annotations:
          summary: "Rapid cost increase detected for {{ $labels.service }}"
          description: "{{ $labels.service }} cost increased by ${{ $value }} in the last hour"
          runbook_url: "https://docs.schlep-engine.com/runbooks/cost-spike-investigation"

  # Application Performance Alerts
  - name: schlep_engine_application_performance
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_requests_total{status_code=~"5.."}[5m])) / sum(rate(http_requests_total[5m])) * 100 > 5
        for: 2m
        labels:
          severity: critical
          service: api
          category: performance
        annotations:
          summary: "High HTTP error rate detected"
          description: "HTTP error rate is {{ $value | humanizePercentage }}%, above the 5% threshold"
          runbook_url: "https://docs.schlep-engine.com/runbooks/high-error-rate"
          dashboard_url: "https://grafana.schlep-engine.com/d/application-overview"

      - alert: SlowResponseTime
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, endpoint)) > 5
        for: 5m
        labels:
          severity: warning
          service: api
          category: performance
        annotations:
          summary: "Slow API response time on {{ $labels.endpoint }}"
          description: "95th percentile response time is {{ $value }}s, above the 5s threshold"
          runbook_url: "https://docs.schlep-engine.com/runbooks/slow-response-time"

      - alert: HighMemoryUsage
        expr: avg(system_memory_usage_bytes{type="used"}) / avg(system_memory_usage_bytes{type="total"}) * 100 > 85
        for: 5m
        labels:
          severity: warning
          service: system
          category: performance
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is {{ $value | humanizePercentage }}%, above the 85% threshold"
          runbook_url: "https://docs.schlep-engine.com/runbooks/high-memory-usage"

      - alert: HighCPUUsage
        expr: avg(system_cpu_usage_percent) > 80
        for: 10m
        labels:
          severity: warning
          service: system
          category: performance
        annotations:
          summary: "High CPU usage detected"
          description: "CPU usage is {{ $value }}%, above the 80% threshold for 10 minutes"
          runbook_url: "https://docs.schlep-engine.com/runbooks/high-cpu-usage"

  # Business Logic Alerts
  - name: schlep_engine_business_metrics
    rules:
      - alert: LowDataQualityScore
        expr: avg(data_quality_score) by (dataset_id, quality_dimension) < 70
        for: 15m
        labels:
          severity: warning
          service: data_processing
          category: data_quality
        annotations:
          summary: "Low data quality score for {{ $labels.dataset_id }}"
          description: "Data quality score for {{ $labels.quality_dimension }} is {{ $value }}%, below the 70% threshold"
          runbook_url: "https://docs.schlep-engine.com/runbooks/data-quality-issues"
          dashboard_url: "https://grafana.schlep-engine.com/d/business-metrics"

      - alert: HighJobFailureRate
        expr: sum(rate(data_files_processed_total{processing_status="failed"}[1h])) / sum(rate(data_files_processed_total[1h])) * 100 > 10
        for: 30m
        labels:
          severity: warning
          service: data_processing
          category: business
        annotations:
          summary: "High job failure rate detected"
          description: "Job failure rate is {{ $value | humanizePercentage }}%, above the 10% threshold"
          runbook_url: "https://docs.schlep-engine.com/runbooks/job-failures"

      - alert: MLModelAccuracyDrop
        expr: avg(model_prediction_accuracy) by (model_name) < 0.8
        for: 1h
        labels:
          severity: warning
          service: ml_pipeline
          category: business
        annotations:
          summary: "ML model accuracy drop for {{ $labels.model_name }}"
          description: "Model {{ $labels.model_name }} accuracy is {{ $value | humanizePercentage }}%, below the 80% threshold"
          runbook_url: "https://docs.schlep-engine.com/runbooks/ml-model-degradation"

      - alert: LowUserEngagement
        expr: avg(user_session_duration_seconds) < 300
        for: 2h
        labels:
          severity: info
          service: user_analytics
          category: business
        annotations:
          summary: "Low user engagement detected"
          description: "Average session duration is {{ $value }}s, below the 5-minute threshold"
          impact: "Potential user experience issues or product engagement problems"

  # Security Alerts
  - name: schlep_engine_security
    rules:
      - alert: HighAuthenticationFailures
        expr: sum(rate(auth_failed_attempts_total[5m])) > 10
        for: 2m
        labels:
          severity: high
          service: authentication
          category: security
        annotations:
          summary: "High authentication failure rate"
          description: "Authentication failures at {{ $value }} attempts per second, indicating potential brute force attack"
          runbook_url: "https://docs.schlep-engine.com/runbooks/authentication-attacks"

      - alert: SecurityEventSpike
        expr: sum(rate(security_events_total{severity="critical"}[5m])) > 1
        for: 1m
        labels:
          severity: critical
          service: security
          category: security
        annotations:
          summary: "Critical security events detected"
          description: "{{ $value }} critical security events per second detected"
          runbook_url: "https://docs.schlep-engine.com/runbooks/security-incidents"

      - alert: SuspiciousAPIUsage
        expr: sum(rate(api_rate_limit_hits_total[5m])) by (user_type) > 50
        for: 5m
        labels:
          severity: warning
          service: api
          category: security
        annotations:
          summary: "Suspicious API usage pattern for {{ $labels.user_type }}"
          description: "Rate limit hits at {{ $value }} per second for {{ $labels.user_type }} users"
          runbook_url: "https://docs.schlep-engine.com/runbooks/suspicious-api-usage"

  # Database and Infrastructure Alerts
  - name: schlep_engine_infrastructure
    rules:
      - alert: DatabaseConnectionPoolExhausted
        expr: sum(database_connections_active) / 50 * 100 > 90
        for: 5m
        labels:
          severity: critical
          service: database
          category: infrastructure
        annotations:
          summary: "Database connection pool near exhaustion"
          description: "{{ $value | humanizePercentage }}% of database connections in use"
          runbook_url: "https://docs.schlep-engine.com/runbooks/database-connections"

      - alert: SlowDatabaseQueries
        expr: histogram_quantile(0.95, sum(rate(database_query_duration_seconds_bucket[5m])) by (le, operation)) > 1
        for: 10m
        labels:
          severity: warning
          service: database
          category: performance
        annotations:
          summary: "Slow database queries for {{ $labels.operation }}"
          description: "95th percentile query time is {{ $value }}s for {{ $labels.operation }}"
          runbook_url: "https://docs.schlep-engine.com/runbooks/slow-queries"

      - alert: LowCacheHitRatio
        expr: avg(cache_hit_ratio) by (cache_type) < 0.8
        for: 15m
        labels:
          severity: warning
          service: cache
          category: performance
        annotations:
          summary: "Low cache hit ratio for {{ $labels.cache_type }}"
          description: "Cache hit ratio is {{ $value | humanizePercentage }}%, below the 80% threshold"
          runbook_url: "https://docs.schlep-engine.com/runbooks/cache-performance"

      - alert: HighStorageUsage
        expr: sum(storage_usage_bytes) by (storage_provider) / 1024 / 1024 / 1024 > 80
        for: 30m
        labels:
          severity: warning
          service: storage
          category: infrastructure
        annotations:
          summary: "High storage usage for {{ $labels.storage_provider }}"
          description: "Storage usage is {{ $value }}GB, approaching capacity limits"
          runbook_url: "https://docs.schlep-engine.com/runbooks/storage-management"

  # Service Health Alerts
  - name: schlep_engine_service_health
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 30s
        labels:
          severity: critical
          category: infrastructure
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Service {{ $labels.job }} has been down for more than 30 seconds"
          runbook_url: "https://docs.schlep-engine.com/runbooks/service-down"

      - alert: HealthCheckFailing
        expr: avg(up) by (job) < 0.8
        for: 2m
        labels:
          severity: warning
          category: infrastructure
        annotations:
          summary: "Health check failing for {{ $labels.job }}"
          description: "{{ $labels.job }} health check success rate is {{ $value | humanizePercentage }}%"
          runbook_url: "https://docs.schlep-engine.com/runbooks/health-check-failures"

  # Data Pipeline Alerts
  - name: schlep_engine_data_pipelines
    rules:
      - alert: PipelineExecutionFailure
        expr: increase(pipeline_execution_time_seconds_count{status="failed"}[1h]) > 0
        for: 5m
        labels:
          severity: high
          service: data_pipeline
          category: business
        annotations:
          summary: "Data pipeline {{ $labels.pipeline_name }} execution failed"
          description: "Pipeline {{ $labels.pipeline_name }} stage {{ $labels.stage }} has failed"
          runbook_url: "https://docs.schlep-engine.com/runbooks/pipeline-failures"

      - alert: LowDataThroughput
        expr: avg(pipeline_data_throughput_records_per_second) by (pipeline_name) < 100
        for: 15m
        labels:
          severity: warning
          service: data_pipeline
          category: performance
        annotations:
          summary: "Low data throughput for {{ $labels.pipeline_name }}"
          description: "Pipeline {{ $labels.pipeline_name }} throughput is {{ $value }} records/second"
          runbook_url: "https://docs.schlep-engine.com/runbooks/low-throughput"

      - alert: HighPipelineErrorRate
        expr: avg(pipeline_error_rate) by (pipeline_name) > 0.05
        for: 10m
        labels:
          severity: warning
          service: data_pipeline
          category: business
        annotations:
          summary: "High error rate for pipeline {{ $labels.pipeline_name }}"
          description: "Pipeline {{ $labels.pipeline_name }} error rate is {{ $value | humanizePercentage }}%"
          runbook_url: "https://docs.schlep-engine.com/runbooks/pipeline-errors"