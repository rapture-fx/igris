groups:
  - name: schlep_engine_debug_service
    rules:
      - alert: CircuitBreakerOpen
        expr: circuit_breaker_state == 2
        for: 1m
        labels:
          severity: critical
          service: debug
        annotations:
          summary: "Circuit breaker {{ $labels.circuit_name }} is open"
          description: "Circuit breaker {{ $labels.circuit_name }} has been open for more than 1 minute, indicating service degradation."

      - alert: HighCircuitBreakerFailureRate
        expr: rate(circuit_breaker_failures_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
          service: debug
        annotations:
          summary: "High circuit breaker failure rate for {{ $labels.circuit_name }}"
          description: "Circuit breaker {{ $labels.circuit_name }} is failing at a rate of {{ $value }} failures per second."

      - alert: ServiceUnhealthy
        expr: service_status == 0
        for: 30s
        labels:
          severity: critical
          service: debug
        annotations:
          summary: "Service {{ $labels.service }} is unhealthy"
          description: "Service {{ $labels.service }} has been unhealthy for more than 30 seconds."

      - alert: HighHealthCheckDuration
        expr: histogram_quantile(0.95, health_check_duration_seconds_bucket) > 5
        for: 5m
        labels:
          severity: warning
          service: debug
        annotations:
          summary: "High health check duration for {{ $labels.service }}"
          description: "95th percentile health check duration for {{ $labels.service }} is {{ $value }}s, which is above the 5s threshold."

      - alert: HighRetryRate
        expr: rate(retry_attempts_total{status="failure"}[5m]) > 1
        for: 3m
        labels:
          severity: warning
          service: debug
        annotations:
          summary: "High retry failure rate for {{ $labels.operation }}"
          description: "Operation {{ $labels.operation }} is failing and retrying at a rate of {{ $value }} per second."

      - alert: HighTimeoutRate
        expr: rate(request_timeouts_total[5m]) > 0.01
        for: 2m
        labels:
          severity: warning
          service: debug
        annotations:
          summary: "High request timeout rate for {{ $labels.endpoint }}"
          description: "Endpoint {{ $labels.endpoint }} is timing out at a rate of {{ $value }} per second."

      - alert: DatabaseConnectionFailure
        expr: service_status{service="database"} == 0
        for: 15s
        labels:
          severity: critical
          service: debug
        annotations:
          summary: "Database connection failure"
          description: "Database connection has been failing for more than 15 seconds."

      - alert: RedisConnectionFailure
        expr: service_status{service="redis"} == 0
        for: 15s
        labels:
          severity: critical
          service: debug
        annotations:
          summary: "Redis connection failure"
          description: "Redis connection has been failing for more than 15 seconds."

      - alert: SystemResourcesHigh
        expr: service_status{service="system"} == 0
        for: 5m
        labels:
          severity: warning
          service: debug
        annotations:
          summary: "System resources are critically high"
          description: "System resources (CPU, Memory, or Disk) have been critically high for more than 5 minutes."

  - name: schlep_engine_debug_service_degradation
    rules:
      - alert: ServiceDegraded
        expr: increase(circuit_breaker_failures_total[10m]) > 10
        for: 5m
        labels:
          severity: warning
          service: debug
        annotations:
          summary: "Service degradation detected for {{ $labels.circuit_name }}"
          description: "Circuit breaker {{ $labels.circuit_name }} has recorded {{ $value }} failures in the last 10 minutes."

      - alert: HealthCheckFailureSpike
        expr: increase(health_check_total{status!="healthy"}[5m]) > 5
        for: 2m
        labels:
          severity: warning
          service: debug
        annotations:
          summary: "Health check failure spike for {{ $labels.service }}"
          description: "Service {{ $labels.service }} has had {{ $value }} health check failures in the last 5 minutes."

      - alert: CachePerformanceDegradation
        expr: rate(cache_misses_total[5m]) / rate(cache_hits_total[5m]) > 0.5
        for: 10m
        labels:
          severity: warning
          service: debug
        annotations:
          summary: "Cache performance degradation"
          description: "Cache miss rate is {{ $value | humanizePercentage }}, indicating potential performance issues."

  # Cost Monitoring Alerts - Integrated with existing infrastructure
  - name: schlep_engine_cost_monitoring
    rules:
      # Overall Budget Alerts
      - alert: MonthlyBudgetThreshold80Percent
        expr: sum(cost_current_month_dollars) >= 116
        for: 5m
        labels:
          severity: warning
          service: cost_monitoring
          alert_type: budget
        annotations:
          summary: "Monthly budget utilization at 80% threshold"
          description: "Total monthly cost of ${{ $value }} has reached 80% of the $145 budget. Current utilization: {{ $value / 145 * 100 | humanizePercentage }}%"
          runbook_url: "https://docs.schlep-engine.com/runbooks/cost-management"
          dashboard_url: "https://grafana.schlep-engine.com/d/cost-monitoring/cost-monitoring"

      - alert: MonthlyBudgetThreshold90Percent
        expr: sum(cost_current_month_dollars) >= 130.5
        for: 2m
        labels:
          severity: critical
          service: cost_monitoring
          alert_type: budget
        annotations:
          summary: "Monthly budget utilization at 90% threshold - CRITICAL"
          description: "Total monthly cost of ${{ $value }} has reached 90% of the $145 budget. Immediate cost optimization required!"
          runbook_url: "https://docs.schlep-engine.com/runbooks/cost-management"
          dashboard_url: "https://grafana.schlep-engine.com/d/cost-monitoring/cost-monitoring"

      - alert: MonthlyBudgetExceeded
        expr: sum(cost_current_month_dollars) > 145
        for: 1m
        labels:
          severity: critical
          service: cost_monitoring
          alert_type: budget_exceeded
        annotations:
          summary: "MONTHLY BUDGET EXCEEDED"
          description: "Total monthly cost of ${{ $value }} has exceeded the $145 budget by ${{ $value - 145 | humanize }}. Emergency cost reduction measures required!"
          runbook_url: "https://docs.schlep-engine.com/runbooks/emergency-cost-reduction"
          dashboard_url: "https://grafana.schlep-engine.com/d/cost-monitoring/cost-monitoring"

      # Service-Specific Budget Alerts
      - alert: ServiceBudgetThreshold80Percent
        expr: cost_budget_utilization_percent >= 80
        for: 5m
        labels:
          severity: warning
          service: "{{ $labels.service }}"
          alert_type: service_budget
        annotations:
          summary: "{{ $labels.service }} budget at 80% threshold"
          description: "{{ $labels.service }} budget utilization at {{ $value }}%"
          runbook_url: "https://docs.schlep-engine.com/runbooks/service-cost-optimization"

      - alert: ServiceBudgetExceeded
        expr: cost_budget_utilization_percent > 100
        for: 2m
        labels:
          severity: critical
          service: "{{ $labels.service }}"
          alert_type: service_budget_exceeded
        annotations:
          summary: "Service budget exceeded for {{ $labels.service }}"
          description: "{{ $labels.service }} has exceeded its budget with {{ $value }}% utilization"
          runbook_url: "https://docs.schlep-engine.com/runbooks/emergency-cost-reduction"

      # Usage-Based Alerts
      - alert: APIRequestsApproachingLimit
        expr: api_requests_monthly >= 40000
        for: 10m
        labels:
          severity: warning
          service: api
          alert_type: usage_limit
        annotations:
          summary: "API requests approaching monthly limit"
          description: "Monthly API requests ({{ $value }}) are at {{ $value / 50000 * 100 | humanizePercentage }}% of the 50,000 limit"
          runbook_url: "https://docs.schlep-engine.com/runbooks/api-rate-limiting"

      - alert: StorageApproachingLimit
        expr: storage_used_gb >= 80
        for: 10m
        labels:
          severity: warning
          service: storage
          alert_type: usage_limit
        annotations:
          summary: "Storage usage approaching limit"
          description: "Storage usage ({{ $value }}GB) is at {{ $value / 100 * 100 | humanizePercentage }}% of the 100GB limit"
          runbook_url: "https://docs.schlep-engine.com/runbooks/storage-management"

      # Cost Forecast Alerts
      - alert: MonthlyForecastExceedsBudget
        expr: sum(cost_forecast_month_dollars) > 145
        for: 15m
        labels:
          severity: warning
          service: cost_monitoring
          alert_type: forecast
        annotations:
          summary: "Monthly cost forecast exceeds budget"
          description: "Based on current usage trends, projected monthly cost of ${{ $value }} will exceed the $145 budget by ${{ $value - 145 | humanize }}"
          runbook_url: "https://docs.schlep-engine.com/runbooks/cost-forecasting"

      # Rapid cost increases
      - alert: RapidCostIncrease
        expr: increase(cost_current_month_dollars[1h]) > 5
        for: 5m
        labels:
          severity: critical
          service: "{{ $labels.service }}"
          alert_type: rapid_increase
        annotations:
          summary: "Rapid cost increase detected for {{ $labels.service }}"
          description: "{{ $labels.service }} cost increased by ${{ $value }} in the last hour"
          runbook_url: "https://docs.schlep-engine.com/runbooks/cost-spike-investigation"