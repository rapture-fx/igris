groups:
  - name: rl_optimization_alerts
    rules:
      # High-level system alerts
      - alert: RLSystemHighLoad
        expr: rl_active_sessions_count > 4
        for: 5m
        labels:
          severity: warning
          service: rl_optimization
        annotations:
          summary: "High number of active RL optimization sessions"
          description: "Currently {{ $value }} RL optimization sessions are active, which may impact system performance."

      - alert: RLQueueBacklog
        expr: rl_optimization_queue_size > 10
        for: 2m
        labels:
          severity: warning
          service: rl_optimization
        annotations:
          summary: "RL optimization queue backlog"
          description: "{{ $value }} RL optimization jobs are waiting in queue."

      - alert: RLLowSuccessRate
        expr: (rate(rl_optimization_sessions_total{status="completed"}[10m]) / rate(rl_optimization_sessions_total[10m])) * 100 < 70
        for: 5m
        labels:
          severity: critical
          service: rl_optimization
        annotations:
          summary: "Low RL optimization success rate"
          description: "RL optimization success rate is {{ $value }}%, below 70% threshold."

      # Resource utilization alerts
      - alert: RLHighCPUUsage
        expr: rl_resource_utilization_percent{resource_type="cpu"} > 85
        for: 3m
        labels:
          severity: warning
          service: rl_optimization
        annotations:
          summary: "High CPU usage during RL optimization"
          description: "Session {{ $labels.session_id }} is using {{ $value }}% CPU."

      - alert: RLHighMemoryUsage
        expr: rl_resource_utilization_percent{resource_type="memory"} > 90
        for: 2m
        labels:
          severity: critical
          service: rl_optimization
        annotations:
          summary: "High memory usage during RL optimization"
          description: "Session {{ $labels.session_id }} is using {{ $value }}% memory."

      - alert: RLDiskSpaceLow
        expr: rl_resource_utilization_percent{resource_type="disk"} > 85
        for: 5m
        labels:
          severity: warning
          service: rl_optimization
        annotations:
          summary: "Low disk space during RL optimization"
          description: "Disk usage is at {{ $value }}% during RL optimization."

      # Performance alerts
      - alert: RLSlowConvergence
        expr: rl_convergence_episode_number > 80
        for: 0m
        labels:
          severity: warning
          service: rl_optimization
        annotations:
          summary: "RL agent slow to converge"
          description: "Session {{ $labels.session_id }} took {{ $value }} episodes to converge."

      - alert: RLLongEpisodeDuration
        expr: rl_episode_duration_seconds > 300
        for: 0m
        labels:
          severity: warning
          service: rl_optimization
        annotations:
          summary: "Long RL episode duration"
          description: "Episode in session {{ $labels.session_id }} took {{ $value }} seconds."

      - alert: RLLowPerformance
        expr: rl_session_best_performance < 0.3
        for: 5m
        labels:
          severity: warning
          service: rl_optimization
        annotations:
          summary: "Low RL optimization performance"
          description: "Session {{ $labels.session_id }} achieved only {{ $value }} performance."

      # Error rate alerts
      - alert: RLHighErrorRate
        expr: rate(rl_system_errors_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
          service: rl_optimization
        annotations:
          summary: "High RL system error rate"
          description: "RL system error rate is {{ $value }} errors per second."

      - alert: RLComponentFailure
        expr: increase(rl_system_errors_total{component!=""}[5m]) > 5
        for: 0m
        labels:
          severity: critical
          service: rl_optimization
        annotations:
          summary: "RL component failure detected"
          description: "Component {{ $labels.component }} has {{ $value }} errors in the last 5 minutes."

      # Training quality alerts
      - alert: RLNoImprovementDetected
        expr: increase(rl_episode_reward[10m]) == 0 and rl_active_sessions_count > 0
        for: 10m
        labels:
          severity: warning
          service: rl_optimization
        annotations:
          summary: "No improvement in RL training"
          description: "No improvement detected in active RL sessions for 10 minutes."

      - alert: RLModelAccuracyDegraded
        expr: rl_optimized_model_accuracy < 0.5
        for: 0m
        labels:
          severity: warning
          service: rl_optimization
        annotations:
          summary: "RL optimized model accuracy degraded"
          description: "Model accuracy for session {{ $labels.session_id }} is {{ $value }}, below 50%."

      # Business impact alerts
      - alert: RLOptimizationStalled
        expr: rl_active_sessions_count > 0 and rate(rl_episode_duration_seconds_count[5m]) == 0
        for: 10m
        labels:
          severity: critical
          service: rl_optimization
        annotations:
          summary: "RL optimization appears stalled"
          description: "Active sessions detected but no episode completions in the last 10 minutes."

      - alert: RLResourceWaste
        expr: rl_resource_utilization_percent{resource_type="cpu"} < 10 and rl_active_sessions_count > 0
        for: 15m
        labels:
          severity: warning
          service: rl_optimization
        annotations:
          summary: "Low resource utilization during RL optimization"
          description: "CPU usage is only {{ $value }}% despite active RL sessions."

  - name: rl_infrastructure_alerts
    rules:
      # Infrastructure health
      - alert: RLServiceDown
        expr: up{job="rl_optimization_service"} == 0
        for: 1m
        labels:
          severity: critical
          service: rl_optimization
        annotations:
          summary: "RL optimization service is down"
          description: "RL optimization service has been down for more than 1 minute."

      - alert: RLMetricsCollectionFailure
        expr: increase(rl_system_errors_total{error_type="metrics_collection"}[5m]) > 3
        for: 0m
        labels:
          severity: warning
          service: rl_optimization
        annotations:
          summary: "RL metrics collection failure"
          description: "{{ $value }} metrics collection errors in the last 5 minutes."

      # Database connectivity
      - alert: RLDatabaseConnectionIssues
        expr: increase(rl_system_errors_total{component="database"}[5m]) > 2
        for: 0m
        labels:
          severity: critical
          service: rl_optimization
        annotations:
          summary: "RL database connection issues"
          description: "{{ $value }} database errors detected for RL system."

  - name: rl_business_alerts
    rules:
      # Business KPI alerts
      - alert: RLOptimizationImprovementLow
        expr: rl_optimization_improvement_percent < 5
        for: 0m
        labels:
          severity: warning
          service: rl_optimization
        annotations:
          summary: "Low optimization improvement detected"
          description: "RL optimization only achieved {{ $value }}% improvement for session {{ $labels.session_id }}."

      - alert: RLCostEfficiencyLow
        expr: (rate(rl_training_time_seconds_total[1h]) * 0.10) / rate(rl_optimization_improvement_percent[1h]) > 100
        for: 0m
        labels:
          severity: warning
          service: rl_optimization
        annotations:
          summary: "Low cost efficiency in RL optimization"
          description: "Cost per improvement point is high, consider optimization strategy review."

      # Industry-specific alerts
      - alert: RLEcommercePerformanceDrop
        expr: rl_optimized_model_accuracy{industry="ecommerce"} < 0.7
        for: 0m
        labels:
          severity: warning
          service: rl_optimization
          industry: ecommerce
        annotations:
          summary: "E-commerce RL model performance drop"
          description: "E-commerce model accuracy dropped to {{ $value }} for session {{ $labels.session_id }}."

      - alert: RLManufacturingAccuracyLow
        expr: rl_optimized_model_accuracy{industry="manufacturing"} < 0.85
        for: 0m
        labels:
          severity: warning
          service: rl_optimization
          industry: manufacturing
        annotations:
          summary: "Manufacturing RL model accuracy low"
          description: "Manufacturing model accuracy is {{ $value }}, below required 85%."

      - alert: RLFinanceRiskThreshold
        expr: rl_optimized_model_accuracy{industry="finance"} < 0.9
        for: 0m
        labels:
          severity: critical
          service: rl_optimization
          industry: finance
        annotations:
          summary: "Finance RL model accuracy below risk threshold"
          description: "Finance model accuracy is {{ $value }}, below critical 90% threshold."