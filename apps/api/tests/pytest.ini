[tool:pytest]
# Pytest configuration for Schlep-engine integration tests

# Test discovery
testpaths = integration_tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers
markers =
    integration: Integration tests that test multiple components together
    performance: Performance and load testing
    slow: Tests that take a long time to run (>30 seconds)
    load_test: Load testing scenarios
    rate_limiting: Rate limiting specific tests
    ml_pipeline: ML pipeline and model testing
    rl_optimization: Reinforcement learning optimization tests
    database: Database integration tests
    redis: Redis cache and session tests
    s3: Cloud storage integration tests
    auth: Authentication and authorization tests
    ci_cd: CI/CD deployment validation tests

# Asyncio configuration
asyncio_mode = auto

# Test output configuration
addopts =
    -v
    --strict-markers
    --strict-config
    --tb=short
    --maxfail=10
    --durations=10
    --color=yes
    --disable-warnings

# Coverage configuration
# Uncomment to enable coverage reporting
# addopts =
#     -v
#     --cov=app
#     --cov-report=html:htmlcov
#     --cov-report=term-missing
#     --cov-fail-under=80

# Timeout configuration (requires pytest-timeout)
# timeout = 300
# timeout_method = thread

# Logging configuration
log_cli = true
log_cli_level = WARNING
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filter out common warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::RuntimeWarning:multiprocessing
    ignore::pytest.PytestUnraisableExceptionWarning

# Minimum Python version
minversion = 3.8

# Test collection configuration
collect_ignore = [
    "setup.py",
    "conftest.py"
]

# Parallel test execution (requires pytest-xdist)
# addopts = -n auto

# Test environment variables
env =
    ENVIRONMENT=test
    REDIS_URL=redis://localhost:6379/1
    SECRET_KEY=test-secret-key-for-integration-tests
    LOG_LEVEL=WARNING
    ENABLE_STREAM_PRODUCERS=false
    ENABLE_MODEL_SERVING=false