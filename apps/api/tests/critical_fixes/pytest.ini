[tool:pytest]
# Pytest configuration for Critical P0 Fixes Validation Testing
# Configures comprehensive test execution, coverage reporting, and CI/CD integration

# Basic test configuration
minversion = 6.0
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test discovery and collection
addopts =
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-report=json:coverage.json
    --cov-branch
    --cov-fail-under=80
    --durations=10
    --junitxml=test-results.xml

# Asyncio configuration
asyncio_mode = auto

# Test markers for categorization
markers =
    critical_fix: Tests validating critical P0 fixes
    rl_optimization: Tests for RL optimization system
    data_quality: Tests for data quality API
    security: Tests for security configuration
    integration: Integration tests across systems
    performance: Performance and benchmark tests
    load_test: Load testing and scalability tests
    database: Database-related tests
    slow: Tests that take more than 30 seconds
    smoke: Quick smoke tests for basic functionality
    regression: Regression tests for previously fixed bugs

# Test filtering
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*unclosed.*:ResourceWarning

# Logging configuration for tests
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test timeout configuration
timeout = 300
timeout_method = thread

# Coverage configuration
[coverage:run]
source = app
omit =
    */tests/*
    */test_*
    */conftest.py
    */venv/*
    */node_modules/*
    */__pycache__/*
    */migrations/*
    */alembic/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstract

[coverage:html]
directory = htmlcov
title = Critical P0 Fixes Test Coverage Report

[coverage:xml]
output = coverage.xml

[coverage:json]
output = coverage.json