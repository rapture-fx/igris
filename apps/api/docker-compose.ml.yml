version: '3.8'

services:
  # Core API Service (Optimized - 24 dependencies)
  schlep-engine-api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: schlep-engine-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://schlep-engine:password@schlep-engine-postgres:5432/schlep-engine
      - REDIS_URL=redis://schlep-engine-redis:6379/0
      - ML_SERVICE_URL=http://schlep-engine-ml:8001
      - ENVIRONMENT=production
    volumes:
      - .:/app
    depends_on:
      - schlep-engine-postgres
      - schlep-engine-redis
      - schlep-engine-ml
    networks:
      - schlep-engine-network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  # ML Service (Heavy ML dependencies - separate service)
  schlep-engine-ml:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: schlep-engine-ml
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://schlep-engine:password@schlep-engine-postgres:5432/schlep-engine
      - REDIS_URL=redis://schlep-engine-redis:6379/0
      - ENVIRONMENT=production
    volumes:
      - .:/app
    networks:
      - schlep-engine-network
    command: uvicorn ml_service_main:app --host 0.0.0.0 --port 8001

  # PostgreSQL Database
  schlep-engine-postgres:
    image: postgres:15-alpine
    container_name: schlep-engine-postgres
    environment:
      - POSTGRES_DB=schlep-engine
      - POSTGRES_USER=schlep-engine
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - schlep-engine-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schlep-engine -d schlep-engine"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Session Store
  schlep-engine-redis:
    image: redis:7-alpine
    container_name: schlep-engine-redis
    volumes:
      - redis_data:/data
    networks:
      - schlep-engine-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NGINX Load Balancer & Reverse Proxy
  schlep-engine-nginx:
    image: nginx:1.25-alpine
    container_name: schlep-engine-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - schlep-engine-api
      - schlep-engine-ml
    networks:
      - schlep-engine-network

  # Monitoring & Metrics
  schlep-engine-prometheus:
    image: prom/prometheus:v2.47.0
    container_name: schlep-engine-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - schlep-engine-network

  schlep-engine-grafana:
    image: grafana/grafana:10.1.5
    container_name: schlep-engine-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=password
    networks:
      - schlep-engine-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  schlep-engine-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 