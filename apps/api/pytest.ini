[tool:pytest]
# Pytest configuration for Schlep Engine API tests

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# Minimum version
minversion = 6.0

# Add markers
markers =
    unit: Unit tests
    integration: Integration tests
    performance: Performance tests
    slow: Slow running tests
    auth: Authentication related tests
    processing: Data processing tests
    config: Configuration tests
    error_handling: Error handling tests
    database: Database related tests
    api: API endpoint tests

# Test output options
addopts = 
    -v
    --strict-markers
    --tb=short
    --durations=10
    --color=yes
    --cov=app
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80

# Async test configuration
asyncio_default_fixture_loop_scope = function
asyncio_mode = auto

# Ignore warnings
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test environment
env =
    TESTING = true
    SCHLEP_ENGINE_ENVIRONMENT = testing
    SCHLEP_ENGINE_DEBUG = false
    SCHLEP_ENGINE_METRICS_ENABLED = false
    SCHLEP_ENGINE_AI_ANALYSIS_ENABLED = false