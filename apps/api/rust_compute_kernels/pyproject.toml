[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "schlep-compute-kernels"
version = "0.1.0"
description = "High-performance compute kernels for Schlep-engine"
authors = [
    {name = "Schlep-engine Team"},
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Rust",
]

[project.urls]
Repository = "https://github.com/your-org/schlep-engine"

[tool.maturin]
bindings = "pyo3"
features = ["pyo3/extension-module"]

# Development profile for faster builds during development
[tool.maturin.target.dev]
features = ["pyo3/extension-module"]
strip = false

# Release profile for production builds
[tool.maturin.target.release]
features = ["pyo3/extension-module", "fast-csv", "parallel-agg", "string-ops"]
strip = true