apiVersion: v1
kind: Secret
metadata:
  name: schlep-engine-secrets
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: secrets
type: Opaque
stringData:
  # Database Credentials
  DATABASE_USER: "schlep_user"
  DATABASE_PASSWORD: "change_me_in_production"

  # Redis Authentication (if enabled)
  REDIS_PASSWORD: "change_me_in_production"

  # JWT Secret for API Authentication
  JWT_SECRET: "change_me_to_a_secure_random_string_in_production"

  # S3-Compatible Storage Credentials (MinIO/Ceph)
  S3_ACCESS_KEY_ID: "minioadmin"
  S3_SECRET_ACCESS_KEY: "minioadmin123"

  # Application Secret Key
  SECRET_KEY: "change_me_to_a_secure_random_string_in_production"

  # API Keys for External Services (if needed)
  MONITORING_API_KEY: "optional_monitoring_key"

  # SSL/TLS Certificates (if using custom certs)
  TLS_CERT: ""
  TLS_KEY: ""

---
# Separate secret for SSL certificates if using TLS
apiVersion: v1
kind: Secret
metadata:
  name: schlep-engine-tls
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: tls
type: kubernetes.io/tls
data:
  # Base64 encoded certificate and key
  # Generate these with: kubectl create secret tls schlep-engine-tls --cert=path/to/cert.pem --key=path/to/key.pem
  tls.crt: ""
  tls.key: ""