# Advanced HPA Configuration with Custom Metrics
# Scales based on CPU, Memory, and Application-specific metrics
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: schlep-engine-advanced-hpa
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: autoscaling-advanced
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: schlep-engine-api
  minReplicas: 3
  maxReplicas: 50  # Higher limit for burst traffic
  metrics:
  # CPU-based scaling (primary trigger)
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60  # More aggressive scaling

  # Memory-based scaling (secondary trigger)
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 75

  # Custom metrics for application-specific scaling
  - type: Pods
    pods:
      metric:
        name: schlep_api_requests_per_second
      target:
        type: AverageValue
        averageValue: "50"  # Scale when avg > 50 RPS per pod

  - type: Pods
    pods:
      metric:
        name: schlep_csv_processing_queue_length
      target:
        type: AverageValue
        averageValue: "5"  # Scale when avg > 5 queued CSV files per pod

  - type: Pods
    pods:
      metric:
        name: schlep_api_response_time_p95
      target:
        type: AverageValue
        averageValue: "1000m"  # Scale when p95 latency > 1000ms

  # Object-based scaling for system load
  - type: Object
    object:
      metric:
        name: schlep_active_connections
      describedObject:
        apiVersion: v1
        kind: Service
        name: schlep-engine-service
      target:
        type: Value
        value: "1000"  # Scale when total connections > 1000

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # 10 minutes
      policies:
      - type: Percent
        value: 5  # Scale down max 5% of replicas at once
        periodSeconds: 60
      - type: Pods
        value: 1  # Scale down max 1 pod at once
        periodSeconds: 60
      selectPolicy: Min  # Use the most conservative policy

    scaleUp:
      stabilizationWindowSeconds: 30  # 30 seconds for faster response
      policies:
      - type: Percent
        value: 100  # Can double replicas quickly
        periodSeconds: 60
      - type: Pods
        value: 10  # Can add up to 10 pods at once for burst traffic
        periodSeconds: 30
      selectPolicy: Max  # Use the most aggressive policy

---
# HPA for Database Auto-scaling (PostgreSQL read replicas)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: postgresql-read-replica-hpa
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: autoscaling
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: postgresql-read-replica  # Assumes read replica deployment exists
  minReplicas: 0  # Can scale to zero when no read load
  maxReplicas: 5
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

  - type: Pods
    pods:
      metric:
        name: postgresql_active_connections
      target:
        type: AverageValue
        averageValue: "50"

  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300  # 5 minutes
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60

---
# Custom Metrics Adapter Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: custom-metrics-config
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: custom-metrics-adapter
data:
  config.yaml: |
    rules:
    - seriesQuery: 'schlep_api_requests_total{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "^schlep_api_requests_total"
        as: "schlep_api_requests_per_second"
      metricsQuery: 'rate(<<.Series>>{<<.LabelMatchers>>}[2m])'

    - seriesQuery: 'schlep_csv_processing_queue_length{namespace!="",pod!=""}'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "^schlep_csv_processing_queue_length"
        as: "schlep_csv_processing_queue_length"
      metricsQuery: '<<.Series>>{<<.LabelMatchers>>}'

    - seriesQuery: 'histogram_quantile(0.95, schlep_api_request_duration_seconds_bucket{namespace!="",pod!=""})'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          pod: {resource: "pod"}
      name:
        matches: "^histogram_quantile"
        as: "schlep_api_response_time_p95"
      metricsQuery: 'histogram_quantile(0.95, rate(schlep_api_request_duration_seconds_bucket{<<.LabelMatchers>>}[5m])) * 1000'

    - seriesQuery: 'schlep_api_active_requests{namespace!=""}'
      resources:
        overrides:
          namespace: {resource: "namespace"}
          service: {resource: "service"}
      name:
        matches: "^schlep_api_active_requests"
        as: "schlep_active_connections"
      metricsQuery: 'sum(<<.Series>>{<<.LabelMatchers>>})'