apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: schlep-engine-data
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: storage
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
  # Uncomment and modify based on your storage class
  # storageClassName: fast-ssd

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: schlep-engine-logs
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: logging
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
# PostgreSQL Data PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgresql-data
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi

---
# Redis Data PVC (optional for persistence)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-data
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi