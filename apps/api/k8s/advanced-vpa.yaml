# Advanced VPA Configurations for Different Workload Types
# Fine-tuned vertical scaling for various components

# Main API VPA with aggressive resource optimization
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: schlep-engine-api-vpa
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: autoscaling-vertical
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: schlep-engine-api
  updatePolicy:
    updateMode: "Auto"  # Automatically update resources
    minReplicas: 3  # Ensure minimum availability during updates
  resourcePolicy:
    containerPolicies:
    - containerName: api
      minAllowed:
        cpu: "100m"
        memory: "512Mi"
      maxAllowed:
        cpu: "8000m"  # 8 cores max
        memory: "16Gi"  # 16GB max
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits
      mode: Auto

---
# PostgreSQL VPA - Conservative scaling for database stability
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: postgresql-vpa
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: autoscaling-vertical
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: postgresql
  updatePolicy:
    updateMode: "Off"  # Only provide recommendations, don't auto-update
  resourcePolicy:
    containerPolicies:
    - containerName: postgresql
      minAllowed:
        cpu: "250m"
        memory: "1Gi"
      maxAllowed:
        cpu: "4000m"
        memory: "8Gi"
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits

---
# Redis VPA - Fast scaling for cache layer
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: redis-vpa
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: autoscaling-vertical
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: redis
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: redis
      minAllowed:
        cpu: "50m"
        memory: "128Mi"
      maxAllowed:
        cpu: "1000m"
        memory: "4Gi"
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits
      mode: Auto

---
# Prometheus VPA - Monitoring resource optimization
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: prometheus-vpa
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/component: autoscaling-vertical
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: prometheus
  updatePolicy:
    updateMode: "Initial"  # Only set initial values, don't update running pods
  resourcePolicy:
    containerPolicies:
    - containerName: prometheus
      minAllowed:
        cpu: "100m"
        memory: "512Mi"
      maxAllowed:
        cpu: "2000m"
        memory: "4Gi"
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits

---
# Grafana VPA - UI component resource optimization
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: grafana-vpa
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: autoscaling-vertical
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: grafana
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: grafana
      minAllowed:
        cpu: "50m"
        memory: "128Mi"
      maxAllowed:
        cpu: "1000m"
        memory: "2Gi"
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits
      mode: Auto

---
# ML Workload VPA - High-resource scaling for ML operations
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: schlep-engine-ml-vpa
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: schlep-engine-ml
    app.kubernetes.io/component: autoscaling-vertical
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: schlep-engine-api  # Same deployment, but when ML enabled
  updatePolicy:
    updateMode: "Recreation"  # Recreate pods for ML resource changes
  resourcePolicy:
    containerPolicies:
    - containerName: api
      minAllowed:
        cpu: "1000m"    # 1 core minimum for ML workloads
        memory: "4Gi"   # 4GB minimum for ML models
      maxAllowed:
        cpu: "16000m"   # 16 cores max for heavy ML processing
        memory: "64Gi"  # 64GB max for large models
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits
      # GPU resource handling (if available)
      # Note: GPU resources require special handling and custom metrics

---
# Custom Resource Scaler for CSV Processing
# Scales resources based on file processing workload
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: csv-processor-vpa
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: csv-processor
    app.kubernetes.io/component: autoscaling-vertical
  annotations:
    vpa.autoscaling.k8s.io/cpu-histogram-decay-half-life: "24h"
    vpa.autoscaling.k8s.io/memory-histogram-decay-half-life: "24h"
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: schlep-engine-api
  updatePolicy:
    updateMode: "Auto"
    evictionRequirements:
    - resources: ["cpu"]
      changeRequirement: 0.2  # Only update if CPU change > 20%
    - resources: ["memory"]
      changeRequirement: 0.3  # Only update if memory change > 30%
  resourcePolicy:
    containerPolicies:
    - containerName: api
      minAllowed:
        cpu: "500m"   # Higher baseline for CSV processing
        memory: "2Gi" # More memory for large CSV files
      maxAllowed:
        cpu: "12000m"  # 12 cores for parallel processing
        memory: "32Gi" # 32GB for very large datasets
      controlledResources: ["cpu", "memory"]
      controlledValues: RequestsAndLimits
      mode: Auto

---
# VPA Monitoring and Alerting Configuration
apiVersion: v1
kind: ServiceMonitor
metadata:
  name: vpa-recommender-monitor
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: vpa-recommender
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vpa-recommender
  endpoints:
  - port: prometheus
    interval: 30s
    path: /metrics

---
# VPA Quality of Service Classes
apiVersion: v1
kind: ConfigMap
metadata:
  name: vpa-qos-config
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: vpa-config
data:
  qos-policy.yaml: |
    # QoS policies for different workload types
    policies:
      - name: "high-performance"
        description: "For latency-sensitive API workloads"
        cpu:
          percentile: 95
          margin: 0.1
        memory:
          percentile: 90
          margin: 0.15
        targets:
          - "schlep-engine-api"

      - name: "batch-processing"
        description: "For CSV processing workloads"
        cpu:
          percentile: 80
          margin: 0.2
        memory:
          percentile: 85
          margin: 0.25
        targets:
          - "csv-processor"

      - name: "infrastructure"
        description: "For monitoring and support services"
        cpu:
          percentile: 70
          margin: 0.3
        memory:
          percentile: 75
          margin: 0.2
        targets:
          - "prometheus"
          - "grafana"
          - "redis"