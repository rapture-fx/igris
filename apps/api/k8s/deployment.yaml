apiVersion: apps/v1
kind: Deployment
metadata:
  name: schlep-engine-api
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "2.0.0"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: schlep-engine
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: schlep-engine
        app.kubernetes.io/component: api
        app.kubernetes.io/version: "2.0.0"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: api
        image: schlep-engine:2.0.0-minimal  # Change to :2.0.0-ml for ML version
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        # Load configuration from ConfigMap
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: APP_NAME
        - name: APP_VERSION
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: APP_VERSION
        - name: APP_ENV
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: APP_ENV
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: DEBUG
        - name: HOST
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: HOST
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: PORT

        # Database Configuration
        - name: DATABASE_HOST
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: DATABASE_HOST
        - name: DATABASE_PORT
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: DATABASE_PORT
        - name: DATABASE_NAME
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: DATABASE_NAME
        - name: DATABASE_USER
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: DATABASE_USER
        - name: DATABASE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: DATABASE_PASSWORD

        # Redis Configuration
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: REDIS_PASSWORD

        # Storage Configuration
        - name: STORAGE_BACKEND
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: STORAGE_BACKEND
        - name: STORAGE_PATH
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: STORAGE_PATH

        # S3-Compatible Storage
        - name: S3_ENDPOINT_URL
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: S3_ENDPOINT_URL
        - name: S3_BUCKET
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: S3_BUCKET
        - name: S3_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: S3_ACCESS_KEY_ID
        - name: S3_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: S3_SECRET_ACCESS_KEY

        # Processing Configuration
        - name: CSV_MAX_SIZE_MB
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: CSV_MAX_SIZE_MB
        - name: CSV_PROCESSING_ENGINE
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: CSV_PROCESSING_ENGINE

        # Security
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: JWT_SECRET
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: SECRET_KEY

        # ML Configuration
        - name: ENABLE_TORCH
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: ENABLE_TORCH
        - name: ENABLE_TF
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: ENABLE_TF
        - name: ENABLE_GPU
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: ENABLE_GPU

        volumeMounts:
        - name: data-storage
          mountPath: /data
        - name: log-storage
          mountPath: /app/logs

        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "4Gi"
            cpu: "2000m"

        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30

      volumes:
      - name: data-storage
        persistentVolumeClaim:
          claimName: schlep-engine-data
      - name: log-storage
        persistentVolumeClaim:
          claimName: schlep-engine-logs

      # Pod Disruption Budget for High Availability
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

      # Security Context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000

      # Node Selection (optional)
      # nodeSelector:
      #   kubernetes.io/arch: amd64

      # Tolerations (optional)
      # tolerations:
      # - key: "dedicated"
      #   operator: "Equal"
      #   value: "schlep-engine"
      #   effect: "NoSchedule"