apiVersion: v1
kind: ConfigMap
metadata:
  name: schlep-engine-config
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: config
data:
  # Application Configuration
  APP_NAME: "Schlep Engine"
  APP_VERSION: "2.0.0"
  APP_ENV: "production"
  DEBUG: "false"

  # Server Configuration
  HOST: "0.0.0.0"
  PORT: "8000"
  WORKERS: "4"

  # Database Configuration (PostgreSQL)
  DATABASE_HOST: "postgresql-service"
  DATABASE_PORT: "5432"
  DATABASE_NAME: "schlepengine"
  DATABASE_MAX_CONNECTIONS: "20"
  DATABASE_POOL_SIZE: "10"

  # Redis Configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_MAX_CONNECTIONS: "10"

  # Storage Configuration
  STORAGE_BACKEND: "filesystem"  # Options: filesystem, nfs, s3-compatible
  STORAGE_PATH: "/data"

  # S3-Compatible Storage (MinIO/Ceph) - Optional
  S3_ENDPOINT_URL: "http://minio-service:9000"
  S3_BUCKET: "schlep-data"
  S3_REGION: "us-east-1"

  # NFS Storage - Optional
  NFS_SERVER: "nfs-server"
  NFS_PATH: "/exports/schlep"

  # Monitoring Configuration
  PROMETHEUS_ENABLED: "true"
  PROMETHEUS_PORT: "9090"
  GRAFANA_ENABLED: "true"
  ALERTMANAGER_ENABLED: "true"

  # Processing Configuration
  CSV_MAX_SIZE_MB: "1000"
  CSV_PROCESSING_ENGINE: "polars"  # polars or pandas
  POLARS_THREADS: "0"  # 0 = auto-detect

  # ML Framework Configuration
  ENABLE_TORCH: "false"
  ENABLE_TF: "false"
  ENABLE_GPU: "false"
  ML_BACKEND: "auto"

  # Logging Configuration
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"
  LOG_FILE: "/app/logs/application.log"

  # Health Check Configuration
  HEALTH_CHECK_INTERVAL: "30"
  HEALTH_CHECK_TIMEOUT: "10"

  # Security Configuration
  CORS_ORIGINS: "*"
  ALLOWED_HOSTS: "*"

  # Performance Tuning
  MAX_UPLOAD_SIZE: "1073741824"  # 1GB in bytes
  REQUEST_TIMEOUT: "300"
  KEEPALIVE_TIMEOUT: "65"