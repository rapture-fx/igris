apiVersion: v1
kind: Service
metadata:
  name: schlep-engine-service
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: api
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  type: ClusterIP

---
# LoadBalancer Service (alternative to Ingress for direct access)
apiVersion: v1
kind: Service
metadata:
  name: schlep-engine-loadbalancer
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: api
  annotations:
    # Cloud-agnostic annotations
    service.beta.kubernetes.io/load-balancer-source-ranges: "0.0.0.0/0"
spec:
  selector:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: api
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  - name: https
    port: 443
    targetPort: 8000
    protocol: TCP
  type: LoadBalancer
  # Uncomment for session affinity if needed
  # sessionAffinity: ClientIP