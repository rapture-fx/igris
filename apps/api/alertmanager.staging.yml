global:
  resolve_timeout: 5m
  slack_api_url: 'https://hooks.slack.com/services/YOUR_SLACK_WEBHOOK_URL'
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: 'alerts@schlep-engine.com'
  smtp_auth_username: 'alerts@schlep-engine.com'
  smtp_auth_password: 'your-smtp-password'

route:
  group_by: ['alertname', 'environment', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'staging-team'
  routes:
    - match:
        severity: critical
      receiver: 'staging-critical'
      repeat_interval: 30m
    - match:
        severity: warning
      receiver: 'staging-warning'
      repeat_interval: 1h
    - match:
        severity: info
      receiver: 'staging-info'
      repeat_interval: 2h

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'environment', 'service']
  - source_match:
      severity: 'warning'
    target_match:
      severity: 'info'
    equal: ['alertname', 'environment', 'service']

receivers:
  - name: 'staging-team'
    slack_configs:
      - channel: '#staging-alerts'
        title: '{{ template "slack.staging.title" . }}'
        text: '{{ template "slack.staging.text" . }}'
        send_resolved: true
        icon_url: 'https://avatars3.githubusercontent.com/u/3380462'
        icon_emoji: ':warning:'
    email_configs:
      - to: 'staging-team@schlep-engine.com'
        send_resolved: true
        headers:
          subject: '{{ template "email.staging.subject" . }}'
        html: '{{ template "email.staging.html" . }}'

  - name: 'staging-critical'
    slack_configs:
      - channel: '#staging-critical'
        title: '{{ template "slack.staging.critical.title" . }}'
        text: '{{ template "slack.staging.critical.text" . }}'
        send_resolved: true
        icon_emoji: ':rotating_light:'
    email_configs:
      - to: 'oncall@schlep-engine.com'
        send_resolved: true
        headers:
          subject: '{{ template "email.staging.critical.subject" . }}'
        html: '{{ template "email.staging.critical.html" . }}'
    pagerduty_configs:
      - routing_key: 'your-pagerduty-routing-key'
        description: '{{ template "pagerduty.staging.description" . }}'
        severity: '{{ if eq .CommonLabels.severity "critical" }}critical{{ else }}warning{{ end }}'
        client: 'AlertManager'
        client_url: '{{ template "pagerduty.staging.clientURL" . }}'

  - name: 'staging-warning'
    slack_configs:
      - channel: '#staging-warnings'
        title: '{{ template "slack.staging.warning.title" . }}'
        text: '{{ template "slack.staging.warning.text" . }}'
        send_resolved: true
        icon_emoji: ':warning:'
    email_configs:
      - to: 'staging-team@schlep-engine.com'
        send_resolved: true
        headers:
          subject: '{{ template "email.staging.warning.subject" . }}'
        html: '{{ template "email.staging.warning.html" . }}'

  - name: 'staging-info'
    slack_configs:
      - channel: '#staging-info'
        title: '{{ template "slack.staging.info.title" . }}'
        text: '{{ template "slack.staging.info.text" . }}'
        send_resolved: true
        icon_emoji: ':information_source:'
    email_configs:
      - to: 'staging-team@schlep-engine.com'
        send_resolved: true
        headers:
          subject: '{{ template "email.staging.info.subject" . }}'
        html: '{{ template "email.staging.info.html" . }}'

templates:
  - '/etc/alertmanager/template/*.tmpl' 