# Prometheus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-prometheus
  namespace: schlep-staging
  labels:
    app: prometheus
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
      environment: staging
  template:
    metadata:
      labels:
        app: prometheus
        environment: staging
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        args:
        - '--config.file=/etc/prometheus/prometheus.yml'
        - '--storage.tsdb.path=/prometheus'
        - '--web.console.libraries=/etc/prometheus/console_libraries'
        - '--web.console.templates=/etc/prometheus/consoles'
        - '--storage.tsdb.retention.time=200h'
        - '--web.enable-lifecycle'
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-data
          mountPath: /prometheus
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: prometheus-config
        configMap:
          name: staging-prometheus-config
      - name: prometheus-data
        persistentVolumeClaim:
          claimName: staging-prometheus-pvc
---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: staging-prometheus
  namespace: schlep-staging
  labels:
    app: prometheus
    environment: staging
spec:
  type: ClusterIP
  ports:
  - port: 9090
    targetPort: 9090
    protocol: TCP
  selector:
    app: prometheus
    environment: staging
---
# Prometheus ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: staging-prometheus-config
  namespace: schlep-staging
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      external_labels:
        environment: staging
        service: schlep-engine

    scrape_configs:
      - job_name: 'schlep-engine-staging'
        static_configs:
          - targets: ['staging-backend:8000']
        metrics_path: '/api/v1/metrics'
        scrape_interval: 15s
        scrape_timeout: 10s
        honor_labels: true
        scheme: http
        tls_config:
          insecure_skip_verify: true

      - job_name: 'staging-health'
        static_configs:
          - targets: ['staging-backend:8000']
        metrics_path: '/api/v1/health'
        scrape_interval: 30s
        scrape_timeout: 10s
        honor_labels: true
        scheme: http
        tls_config:
          insecure_skip_verify: true

      - job_name: 'staging-postgresql'
        static_configs:
          - targets: ['staging-postgresql:5432']
        scrape_interval: 30s
        scrape_timeout: 10s
        metrics_path: /metrics
        scheme: http
        tls_config:
          insecure_skip_verify: true

      - job_name: 'staging-redis'
        static_configs:
          - targets: ['staging-redis:6379']
        scrape_interval: 30s
        scrape_timeout: 10s
        metrics_path: /metrics
        scheme: http
        tls_config:
          insecure_skip_verify: true

      - job_name: 'prometheus'
        static_configs:
          - targets: ['localhost:9090']
        scrape_interval: 30s
        scrape_timeout: 10s
        metrics_path: /metrics
        scheme: http
        tls_config:
          insecure_skip_verify: true
---
# Prometheus PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: staging-prometheus-pvc
  namespace: schlep-staging
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
# Grafana Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-grafana
  namespace: schlep-staging
  labels:
    app: grafana
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
      environment: staging
  template:
    metadata:
      labels:
        app: grafana
        environment: staging
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: "admin"
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_INSTALL_PLUGINS
          value: "grafana-piechart-panel,grafana-worldmap-panel"
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
        - name: grafana-provisioning
          mountPath: /etc/grafana/provisioning
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
      volumes:
      - name: grafana-data
        persistentVolumeClaim:
          claimName: staging-grafana-pvc
      - name: grafana-provisioning
        configMap:
          name: staging-grafana-provisioning
---
# Grafana Service
apiVersion: v1
kind: Service
metadata:
  name: staging-grafana
  namespace: schlep-staging
  labels:
    app: grafana
    environment: staging
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
  selector:
    app: grafana
    environment: staging
---
# Grafana ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: staging-grafana-provisioning
  namespace: schlep-staging
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://staging-prometheus:9090
        isDefault: true
        editable: true
---
# Grafana PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: staging-grafana-pvc
  namespace: schlep-staging
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
# AlertManager Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: staging-alertmanager
  namespace: schlep-staging
  labels:
    app: alertmanager
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alertmanager
      environment: staging
  template:
    metadata:
      labels:
        app: alertmanager
        environment: staging
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:latest
        args:
        - '--config.file=/etc/alertmanager/alertmanager.yml'
        - '--storage.path=/alertmanager'
        ports:
        - containerPort: 9093
        volumeMounts:
        - name: alertmanager-config
          mountPath: /etc/alertmanager
        - name: alertmanager-data
          mountPath: /alertmanager
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9093
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9093
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: alertmanager-config
        configMap:
          name: staging-alertmanager-config
      - name: alertmanager-data
        persistentVolumeClaim:
          claimName: staging-alertmanager-pvc
---
# AlertManager Service
apiVersion: v1
kind: Service
metadata:
  name: staging-alertmanager
  namespace: schlep-staging
  labels:
    app: alertmanager
    environment: staging
spec:
  type: ClusterIP
  ports:
  - port: 9093
    targetPort: 9093
    protocol: TCP
  selector:
    app: alertmanager
    environment: staging
---
# AlertManager ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: staging-alertmanager-config
  namespace: schlep-staging
data:
  alertmanager.yml: |
    global:
      resolve_timeout: 5m
      slack_api_url: 'https://hooks.slack.com/services/YOUR_SLACK_WEBHOOK_URL'

    route:
      group_by: ['alertname', 'environment']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 1h
      receiver: 'staging-team'
      routes:
        - match:
            severity: critical
          receiver: 'staging-critical'
          repeat_interval: 30m

    receivers:
      - name: 'staging-team'
        slack_configs:
          - channel: '#staging-alerts'
            title: 'Staging Alert: {{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
            send_resolved: true

      - name: 'staging-critical'
        slack_configs:
          - channel: '#staging-critical'
            title: 'CRITICAL: {{ .GroupLabels.alertname }}'
            text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'
            send_resolved: true
---
# AlertManager PVC
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: staging-alertmanager-pvc
  namespace: schlep-staging
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi 