# OpenAPI Generator Configuration for Go Client
generator-name: go
input-spec: "../../apps/api/openapi.json"
output-dir: "./generated/go"
package-name: "schlepengine"
package-version: "v2.0.0"

# Go-specific configuration
additional-properties:
  packageName: schlepengine
  packageVersion: v2.0.0
  packageUrl: https://github.com/schlep-engine/go-client
  packageCompany: Schlep-engine
  packageDescription: "Go client library for Schlep-engine API - comprehensive data processing and ML pipeline platform"
  
  # Go module configuration
  moduleName: github.com/schlep-engine/go-client
  goModuleName: github.com/schlep-engine/go-client
  
  # API Configuration
  withGoCodegenComment: true
  generateInterfaces: true
  structPrefix: true
  enumClassPrefix: true
  
  # HTTP Client
  clientPackage: client
  httpLibrary: native
  
  # Code generation
  hideGenerationTimestamp: true
  generateAliasAsModel: false
  
  # Documentation
  withGoMod: true
  withAWSV4Signature: false
  
  # Quality settings
  ensureUniqueParams: true
  allowUnicodeIdentifiers: false
  prependFormOrBodyParameters: false

# Type mappings for Go
type-mappings:
  DateTime: time.Time
  Date: time.Time
  UUID: string
  Binary: []byte
  File: *os.File

# Import mappings
import-mappings:
  DateTime: time
  Date: time
  File: os

# Template files (custom templates)
template-dir: "./templates/go"

# Files to generate
supporting-files:
  - go.mod
  - go.sum
  - README.md
  - .gitignore
  - Makefile
  - client.go
  - configuration.go
  - response.go
  - utils.go

# Global properties
global-properties:
  models: true
  apis: true
  supportingFiles: true
  modelTests: true
  apiTests: true
  modelDocs: true
  apiDocs: true

# Remove unused files
files-to-remove:
  - git_push.sh
  - .travis.yml

# Quality settings
validation:
  - lint: true
  - vet: true
  - test: true
  - security-scan: true
  - mod-tidy: true

# Build configuration
build:
  scripts:
    - "go mod tidy"
    - "go build ./..."
    - "go test ./..."
    - "go vet ./..."
  
  # Testing
  test-coverage: true
  benchmark: true

# Version management
versioning:
  strategy: "semantic"
  auto-increment: true
  tag-format: "go-v{version}"
  
# Go-specific settings
go-settings:
  min-go-version: "1.19"
  modules: true
  
  # Dependencies
  dependencies:
    - "github.com/golang/protobuf"
    
  # Development dependencies  
  dev-dependencies:
    - "github.com/golangci/golangci-lint"
    - "github.com/securecodewarrior/github-action-add-sarif"

# Documentation
documentation:
  generate-readme: true
  generate-examples: true
  godoc: true
  
# Publishing configuration
publishing:
  enabled: true
  registry: "github"
  module-proxy: "proxy.golang.org"