# OpenAPI Generator Configuration for Java Client
generator-name: java
input-spec: "../../apps/api/openapi.json"
output-dir: "./generated/java"
package-name: "com.schlepengine.client"
package-version: "2.0.0"

# Java-specific configuration
additional-properties:
  groupId: com.schlepengine
  artifactId: schlep-engine-client
  artifactVersion: 2.0.0
  artifactUrl: https://github.com/schlep-engine/java-client
  artifactDescription: "Java client library for Schlep-engine API - comprehensive data processing and ML pipeline platform"
  
  # Java configuration
  dateLibrary: java8
  java8: true
  hideGenerationTimestamp: true
  
  # HTTP Client
  library: okhttp-gson
  serializationLibrary: gson
  
  # API Configuration
  modelPackage: com.schlepengine.client.model
  apiPackage: com.schlepengine.client.api
  invokerPackage: com.schlepengine.client
  
  # Code generation
  supportJava11: true
  supportJava17: true
  generateAliasAsModel: false
  
  # Documentation
  generateApiDocumentation: true
  generateModelDocumentation: true
  
  # Quality settings
  ensureUniqueParams: true
  allowUnicodeIdentifiers: false
  sortParamsByRequiredFlag: true
  sortModelPropertiesByRequiredFlag: true
  
  # Developer info
  developerName: "Schlep-engine Team"
  developerEmail: "support@schlep-engine.com"
  developerOrganization: "Schlep-engine"
  developerOrganizationUrl: "https://schlep-engine.com"
  
  # License
  licenseName: "MIT"
  licenseUrl: "https://opensource.org/licenses/MIT"

# Type mappings for Java
type-mappings:
  DateTime: OffsetDateTime
  Date: LocalDate
  UUID: UUID
  Binary: byte[]
  File: File

# Import mappings
import-mappings:
  OffsetDateTime: java.time.OffsetDateTime
  LocalDate: java.time.LocalDate
  UUID: java.util.UUID
  File: java.io.File

# Template files (custom templates)
template-dir: "./templates/java"

# Files to generate
supporting-files:
  - pom.xml
  - README.md
  - .gitignore
  - build.gradle
  - gradle.properties
  - settings.gradle
  - gradlew
  - gradlew.bat

# Global properties
global-properties:
  models: true
  apis: true
  supportingFiles: true
  modelTests: true
  apiTests: true
  modelDocs: true
  apiDocs: true

# Remove unused files
files-to-remove:
  - git_push.sh
  - .travis.yml

# Quality settings
validation:
  - compile: true
  - test: true
  - checkstyle: true
  - spotbugs: true
  - pmd: true

# Build configuration
build:
  build-tool: "gradle"
  java-version: "11"
  
  scripts:
    - "./gradlew build"
    - "./gradlew test"
    - "./gradlew check"
  
  # Testing
  test-framework: "junit5"
  test-coverage: true
  
  # Quality tools
  checkstyle: true
  spotbugs: true
  pmd: true

# Maven/Gradle dependencies
dependencies:
  - "com.squareup.okhttp3:okhttp:4.11.0"
  - "com.google.code.gson:gson:2.10.1"
  - "io.gsonfire:gson-fire:1.8.5"
  - "javax.annotation:javax.annotation-api:1.3.2"
  
test-dependencies:
  - "org.junit.jupiter:junit-jupiter:5.9.2"
  - "org.mockito:mockito-core:5.1.1"

# Version management
versioning:
  strategy: "semantic"
  auto-increment: true
  tag-format: "java-v{version}"

# Publishing configuration
publishing:
  enabled: true
  registry: "maven-central"
  repository-url: "https://oss.sonatype.org/service/local/staging/deploy/maven2/"
  snapshot-repository-url: "https://oss.sonatype.org/content/repositories/snapshots/"