# Prometheus alerting rules for Hybrid ML Pipeline

groups:
  - name: hybrid_ml_pipeline_alerts
    interval: 30s
    rules:
      # High memory usage alert
      - alert: HighMemoryUsage
        expr: |
          (rust_kernel_memory_usage_bytes / 1024 / 1024 / 1024) > 10
        for: 5m
        labels:
          severity: warning
          component: rust-kernels
        annotations:
          summary: "High memory usage in Rust kernels"
          description: "Rust kernel memory usage is {{ $value }}GB (threshold: 10GB)"

      # Batch ingestion failures
      - alert: BatchIngestionFailures
        expr: |
          rate(batch_ingestion_failed_total[5m]) > 0.1
        for: 2m
        labels:
          severity: critical
          component: batch-api
        annotations:
          summary: "High batch ingestion failure rate"
          description: "Batch ingestion failure rate is {{ $value }} per second"

      # Streaming latency too high
      - alert: StreamingHighLatency
        expr: |
          histogram_quantile(0.95, rate(stream_processing_duration_seconds_bucket[5m])) > 0.5
        for: 3m
        labels:
          severity: warning
          component: streaming
        annotations:
          summary: "High streaming processing latency"
          description: "P95 streaming latency is {{ $value }}s (threshold: 0.5s)"

      # NATS message queue backup
      - alert: NATSQueueBackup
        expr: |
          nats_jetstream_stream_messages > 10000
        for: 5m
        labels:
          severity: warning
          component: nats
        annotations:
          summary: "NATS message queue backup"
          description: "NATS queue has {{ $value }} pending messages"

      # Rust kernel processing too slow
      - alert: SlowRustKernelProcessing
        expr: |
          histogram_quantile(0.95, rate(rust_kernel_processing_duration_seconds_bucket[5m])) > 1.0
        for: 5m
        labels:
          severity: warning
          component: rust-kernels
        annotations:
          summary: "Slow Rust kernel processing"
          description: "P95 Rust kernel processing time is {{ $value }}s (threshold: 1s)"

      # ML framework conversion errors
      - alert: MLFrameworkConversionErrors
        expr: |
          rate(ml_framework_conversion_errors_total[5m]) > 0
        for: 2m
        labels:
          severity: critical
          component: ml-adapters
        annotations:
          summary: "ML framework conversion errors detected"
          description: "ML framework conversion error rate: {{ $value }} per second"

      # Data quality issues
      - alert: DataQualityIssues
        expr: |
          rate(data_quality_validation_failed_total[5m]) > 0.05
        for: 3m
        labels:
          severity: warning
          component: data-quality
        annotations:
          summary: "High data quality validation failure rate"
          description: "Data quality failure rate: {{ $value }} per second"

      # Arrow IPC conversion failures
      - alert: ArrowIPCConversionFailures
        expr: |
          rate(arrow_ipc_conversion_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          component: rust-python-bridge
        annotations:
          summary: "Arrow IPC conversion failures"
          description: "Arrow IPC conversion error rate: {{ $value }} per second"
