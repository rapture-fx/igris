apiVersion: v1
kind: ServiceAccount
metadata:
  name: schlep-engine-api
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: v1.0.0
        deployment: blue  # For blue-green deployment
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: schlep-engine-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: api
        image: ghcr.io/schlep-engine/api:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        # Database configuration
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: POSTGRES_PASSWORD

        # Redis configuration
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/$(REDIS_DB)"
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: REDIS_DB
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: REDIS_PASSWORD

        # Application secrets
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: SECRET_KEY
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: JWT_SECRET_KEY
        - name: API_KEY_SECRET
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: API_KEY_SECRET

        # OAuth configuration
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: GOOGLE_CLIENT_ID
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: GOOGLE_CLIENT_SECRET
        - name: GITHUB_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: GITHUB_CLIENT_ID
        - name: GITHUB_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: GITHUB_CLIENT_SECRET

        # SMTP configuration
        - name: SMTP_SERVER
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: SMTP_SERVER
        - name: SMTP_PORT
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: SMTP_PORT
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: SMTP_USERNAME
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: SMTP_PASSWORD
        - name: FROM_EMAIL
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: FROM_EMAIL

        # Cloud storage configuration
        - name: GCS_CREDENTIALS
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: GCS_CREDENTIALS
        - name: GCS_PROJECT_ID
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: GCS_PROJECT_ID
        - name: GCS_BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: GCS_BUCKET_NAME
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: AWS_SECRET_ACCESS_KEY

        # Application configuration from ConfigMap
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: ENVIRONMENT
        - name: DEBUG
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: DEBUG
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: LOG_LEVEL
        - name: WORKERS
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: WORKERS
        - name: MAX_WORKERS
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: MAX_WORKERS

        # Real-time streaming configuration
        - name: ENABLE_STREAM_PRODUCERS
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: ENABLE_STREAM_PRODUCERS
        - name: ENABLE_STREAM_CONSUMERS
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: ENABLE_STREAM_CONSUMERS
        - name: ENABLE_NOTIFICATIONS
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: ENABLE_NOTIFICATIONS
        - name: STREAM_PRODUCER_RATE_LIMIT
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: STREAM_PRODUCER_RATE_LIMIT
        - name: IOT_PRODUCER_RATE
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: IOT_PRODUCER_RATE
        - name: FINANCIAL_PRODUCER_RATE
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: FINANCIAL_PRODUCER_RATE
        - name: ECOMMERCE_PRODUCER_RATE
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: ECOMMERCE_PRODUCER_RATE

        # Security and CORS configuration
        - name: ALLOWED_ORIGINS
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: ALLOWED_ORIGINS
        - name: ALLOWED_HOSTS
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: ALLOWED_HOSTS

        # Rate limiting configuration
        - name: RATE_LIMIT_REQUESTS
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: RATE_LIMIT_REQUESTS
        - name: RATE_LIMIT_WINDOW
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: RATE_LIMIT_WINDOW
        - name: RATE_LIMIT_BURST
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: RATE_LIMIT_BURST

        # Monitoring configuration
        - name: PROMETHEUS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: PROMETHEUS_ENABLED
        - name: METRICS_PORT
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: METRICS_PORT

        # Circuit breaker configuration
        - name: CIRCUIT_BREAKER_FAILURE_THRESHOLD
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: CIRCUIT_BREAKER_FAILURE_THRESHOLD
        - name: CIRCUIT_BREAKER_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: CIRCUIT_BREAKER_TIMEOUT
        - name: CIRCUIT_BREAKER_RECOVERY_TIMEOUT
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: CIRCUIT_BREAKER_RECOVERY_TIMEOUT

        # JWT configuration
        - name: ACCESS_TOKEN_EXPIRE_MINUTES
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: ACCESS_TOKEN_EXPIRE_MINUTES
        - name: REFRESH_TOKEN_EXPIRE_DAYS
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: REFRESH_TOKEN_EXPIRE_DAYS
        - name: ALGORITHM
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: ALGORITHM

        # Storage configuration
        - name: STORAGE_PROVIDER
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: STORAGE_PROVIDER
        - name: UPLOAD_MAX_SIZE
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: UPLOAD_MAX_SIZE

        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1500m"

        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 45
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 3
          successThreshold: 1

        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1

        startupProbe:
          httpGet:
            path: /health/startup
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 15
          successThreshold: 1

        volumeMounts:
        - name: api-logs
          mountPath: /app/logs
        - name: temp-storage
          mountPath: /tmp
        - name: gcs-credentials
          mountPath: /app/credentials
          readOnly: true

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

      volumes:
      - name: api-logs
        emptyDir:
          sizeLimit: 1Gi
      - name: temp-storage
        emptyDir:
          sizeLimit: 2Gi
      - name: gcs-credentials
        secret:
          secretName: schlep-engine-secrets
          items:
          - key: GCS_CREDENTIALS
            path: gcs-credentials.json

      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - api
              topologyKey: kubernetes.io/hostname
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: node-type
                operator: In
                values:
                - compute-optimized

      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: api
            app.kubernetes.io/component: backend

      tolerations:
      - key: node.kubernetes.io/not-ready
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 60
      - key: node.kubernetes.io/unreachable
        operator: Exists
        effect: NoExecute
        tolerationSeconds: 60
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8000
  - name: metrics
    protocol: TCP
    port: 9090
    targetPort: 9090
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
---
# Stream Producer Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-producer
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: stream-producer
    app.kubernetes.io/component: streaming
    app.kubernetes.io/version: v1.0.0
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stream-producer
      app.kubernetes.io/component: streaming
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stream-producer
        app.kubernetes.io/component: streaming
        app.kubernetes.io/version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: stream-producer
        image: ghcr.io/schlep-engine/api:latest
        imagePullPolicy: Always
        command: ["python", "-m", "app.services.stream_producer"]
        ports:
        - containerPort: 9091
          name: metrics
        env:
        - name: STREAM_SERVICE_MODE
          value: "producer"
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/$(REDIS_DB)"
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: REDIS_DB
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: REDIS_PASSWORD
        - name: IOT_PRODUCER_RATE
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: IOT_PRODUCER_RATE
        - name: FINANCIAL_PRODUCER_RATE
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: FINANCIAL_PRODUCER_RATE
        - name: ECOMMERCE_PRODUCER_RATE
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: ECOMMERCE_PRODUCER_RATE
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "750m"
        livenessProbe:
          httpGet:
            path: /health
            port: metrics
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: producer-logs
          mountPath: /app/logs
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: producer-logs
        emptyDir:
          sizeLimit: 500Mi
---
# Stream Consumer Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-consumer
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: stream-consumer
    app.kubernetes.io/component: streaming
    app.kubernetes.io/version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: stream-consumer
      app.kubernetes.io/component: streaming
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stream-consumer
        app.kubernetes.io/component: streaming
        app.kubernetes.io/version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9092"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
      - name: stream-consumer
        image: ghcr.io/schlep-engine/api:latest
        imagePullPolicy: Always
        command: ["python", "-m", "app.services.stream_consumer"]
        ports:
        - containerPort: 9092
          name: metrics
        env:
        - name: STREAM_SERVICE_MODE
          value: "consumer"
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/$(REDIS_DB)"
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: REDIS_DB
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: REDIS_PASSWORD
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: LOG_LEVEL
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1.5Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: metrics
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: metrics
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: consumer-logs
          mountPath: /app/logs
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: consumer-logs
        emptyDir:
          sizeLimit: 1Gi