apiVersion: v1
kind: ConfigMap
metadata:
  name: schlep-engine-config
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: config
    app.kubernetes.io/version: v1.0.0
data:
  # Database configuration
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "schlep_engine"
  POSTGRES_USER: "schlep_user"
  POSTGRES_MAX_CONNECTIONS: "100"
  POSTGRES_CONNECTION_TIMEOUT: "30"

  # Redis configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_MAX_CONNECTIONS: "50"
  REDIS_CONNECTION_TIMEOUT: "10"

  # Application configuration
  ENVIRONMENT: "production"
  DEBUG: "false"
  LOG_LEVEL: "INFO"
  WORKERS: "4"
  MAX_WORKERS: "8"

  # Real-time streaming configuration
  ENABLE_STREAM_PRODUCERS: "true"
  ENABLE_STREAM_CONSUMERS: "true"
  ENABLE_NOTIFICATIONS: "true"
  STREAM_PRODUCER_RATE_LIMIT: "100"
  IOT_PRODUCER_RATE: "5"
  FINANCIAL_PRODUCER_RATE: "20"
  ECOMMERCE_PRODUCER_RATE: "50"

  # Security configuration
  ALLOWED_ORIGINS: "https://schlep-engine.com,https://admin.schlep-engine.com,https://docs.schlep-engine.com"
  ALLOWED_HOSTS: "api.schlep-engine.com"
  CORS_ALLOW_CREDENTIALS: "true"
  CORS_MAX_AGE: "86400"

  # Rate limiting
  RATE_LIMIT_REQUESTS: "1000"
  RATE_LIMIT_WINDOW: "60"
  RATE_LIMIT_BURST: "100"

  # Monitoring configuration
  PROMETHEUS_ENABLED: "true"
  METRICS_PORT: "9090"
  HEALTH_CHECK_INTERVAL: "30"

  # Frontend URLs
  NEXT_PUBLIC_API_URL: "https://api.schlep-engine.com"
  NEXT_PUBLIC_DOCS_URL: "https://docs.schlep-engine.com"
  NEXT_PUBLIC_ADMIN_URL: "https://admin.schlep-engine.com"
  NEXT_PUBLIC_APP_ENV: "production"

  # SMTP configuration (non-sensitive)
  SMTP_SERVER: "smtp.gmail.com"
  SMTP_PORT: "587"
  FROM_EMAIL: "notifications@schlep-engine.com"

  # Storage configuration
  STORAGE_PROVIDER: "multi-cloud"
  GCS_BUCKET_NAME: "schlep-engine-storage"
  S3_BUCKET_NAME: "schlep-engine-backup"
  UPLOAD_MAX_SIZE: "100MB"

  # Circuit breaker configuration
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: "5"
  CIRCUIT_BREAKER_TIMEOUT: "60"
  CIRCUIT_BREAKER_RECOVERY_TIMEOUT: "30"

  # JWT configuration (non-sensitive)
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  ALGORITHM: "HS256"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: schlep-engine-config-staging
  namespace: schlep-engine-staging
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: config
    app.kubernetes.io/version: v1.0.0
    env: staging
data:
  # Database configuration
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "schlep_engine_staging"
  POSTGRES_USER: "schlep_user"
  POSTGRES_MAX_CONNECTIONS: "20"
  POSTGRES_CONNECTION_TIMEOUT: "30"

  # Redis configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  REDIS_DB: "1"
  REDIS_MAX_CONNECTIONS: "10"
  REDIS_CONNECTION_TIMEOUT: "10"

  # Application configuration
  ENVIRONMENT: "staging"
  DEBUG: "true"
  LOG_LEVEL: "DEBUG"
  WORKERS: "2"
  MAX_WORKERS: "4"

  # Real-time streaming configuration
  ENABLE_STREAM_PRODUCERS: "true"
  ENABLE_STREAM_CONSUMERS: "true"
  ENABLE_NOTIFICATIONS: "false"
  STREAM_PRODUCER_RATE_LIMIT: "50"
  IOT_PRODUCER_RATE: "2"
  FINANCIAL_PRODUCER_RATE: "10"
  ECOMMERCE_PRODUCER_RATE: "20"

  # Security configuration
  ALLOWED_ORIGINS: "https://staging.schlep-engine.com,http://localhost:3000"
  ALLOWED_HOSTS: "api-staging.schlep-engine.com,localhost"
  CORS_ALLOW_CREDENTIALS: "true"
  CORS_MAX_AGE: "3600"

  # Rate limiting
  RATE_LIMIT_REQUESTS: "500"
  RATE_LIMIT_WINDOW: "60"
  RATE_LIMIT_BURST: "50"

  # Monitoring configuration
  PROMETHEUS_ENABLED: "true"
  METRICS_PORT: "9090"
  HEALTH_CHECK_INTERVAL: "15"

  # Frontend URLs
  NEXT_PUBLIC_API_URL: "https://api-staging.schlep-engine.com"
  NEXT_PUBLIC_DOCS_URL: "https://docs-staging.schlep-engine.com"
  NEXT_PUBLIC_ADMIN_URL: "https://admin-staging.schlep-engine.com"
  NEXT_PUBLIC_APP_ENV: "staging"

  # SMTP configuration (non-sensitive)
  SMTP_SERVER: "smtp.gmail.com"
  SMTP_PORT: "587"
  FROM_EMAIL: "staging-notifications@schlep-engine.com"

  # Storage configuration
  STORAGE_PROVIDER: "gcs"
  GCS_BUCKET_NAME: "schlep-engine-staging-storage"
  UPLOAD_MAX_SIZE: "50MB"

  # Circuit breaker configuration
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: "3"
  CIRCUIT_BREAKER_TIMEOUT: "30"
  CIRCUIT_BREAKER_RECOVERY_TIMEOUT: "15"

  # JWT configuration (non-sensitive)
  ACCESS_TOKEN_EXPIRE_MINUTES: "60"
  REFRESH_TOKEN_EXPIRE_DAYS: "30"
  ALGORITHM: "HS256"