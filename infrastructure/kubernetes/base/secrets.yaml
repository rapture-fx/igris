# Secrets template - values should be base64 encoded and managed through external secret management
apiVersion: v1
kind: Secret
metadata:
  name: schlep-engine-secrets
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: secrets
    app.kubernetes.io/version: v1.0.0
type: Opaque
data:
  # Database secrets (base64 encoded)
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD_B64}"
  POSTGRES_ROOT_PASSWORD: "${POSTGRES_ROOT_PASSWORD_B64}"

  # Redis secrets
  REDIS_PASSWORD: "${REDIS_PASSWORD_B64}"

  # Application secrets
  SECRET_KEY: "${SECRET_KEY_B64}"
  JWT_SECRET_KEY: "${JWT_SECRET_KEY_B64}"
  API_KEY_SECRET: "${API_KEY_SECRET_B64}"

  # OAuth secrets
  GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID_B64}"
  GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET_B64}"
  GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID_B64}"
  GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET_B64}"

  # SMTP secrets
  SMTP_USERNAME: "${SMTP_USERNAME_B64}"
  SMTP_PASSWORD: "${SMTP_PASSWORD_B64}"

  # Cloud storage secrets
  GCS_CREDENTIALS: "${GCS_CREDENTIALS_B64}"
  GCS_PROJECT_ID: "${GCS_PROJECT_ID_B64}"
  AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID_B64}"
  AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY_B64}"

  # Monitoring secrets
  PROMETHEUS_TOKEN: "${PROMETHEUS_TOKEN_B64}"
  GRAFANA_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD_B64}"
---
apiVersion: v1
kind: Secret
metadata:
  name: schlep-engine-secrets-staging
  namespace: schlep-engine-staging
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: secrets
    app.kubernetes.io/version: v1.0.0
    env: staging
type: Opaque
data:
  # Database secrets (base64 encoded)
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD_STAGING_B64}"
  POSTGRES_ROOT_PASSWORD: "${POSTGRES_ROOT_PASSWORD_STAGING_B64}"

  # Redis secrets
  REDIS_PASSWORD: "${REDIS_PASSWORD_STAGING_B64}"

  # Application secrets
  SECRET_KEY: "${SECRET_KEY_STAGING_B64}"
  JWT_SECRET_KEY: "${JWT_SECRET_KEY_STAGING_B64}"
  API_KEY_SECRET: "${API_KEY_SECRET_STAGING_B64}"

  # OAuth secrets (staging)
  GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID_STAGING_B64}"
  GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET_STAGING_B64}"
  GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID_STAGING_B64}"
  GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET_STAGING_B64}"

  # SMTP secrets
  SMTP_USERNAME: "${SMTP_USERNAME_STAGING_B64}"
  SMTP_PASSWORD: "${SMTP_PASSWORD_STAGING_B64}"

  # Cloud storage secrets
  GCS_CREDENTIALS: "${GCS_CREDENTIALS_STAGING_B64}"
  GCS_PROJECT_ID: "${GCS_PROJECT_ID_STAGING_B64}"

  # Monitoring secrets
  PROMETHEUS_TOKEN: "${PROMETHEUS_TOKEN_STAGING_B64}"
  GRAFANA_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD_STAGING_B64}"
---
# Vault Service Account for Kubernetes Authentication
apiVersion: v1
kind: ServiceAccount
metadata:
  name: schlep-engine-vault-auth
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: vault-auth
---
# External Secrets Operator configuration for production secret management
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: schlep-engine-secret-store
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: secret-store
spec:
  provider:
    vault:
      server: "https://vault.vault-system.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      caBundle: "" # Will be populated by cert-manager
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "schlep-engine"
          serviceAccountRef:
            name: "schlep-engine-vault-auth"
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: schlep-engine-external-secrets
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: external-secrets
spec:
  refreshInterval: 30s  # More frequent refresh for better security
  secretStoreRef:
    name: schlep-engine-secret-store
    kind: SecretStore
  target:
    name: schlep-engine-secrets
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Database secrets
        POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD }}"
        POSTGRES_ROOT_PASSWORD: "{{ .POSTGRES_ROOT_PASSWORD }}"

        # Redis secrets
        REDIS_PASSWORD: "{{ .REDIS_PASSWORD }}"

        # Application secrets
        SECRET_KEY: "{{ .SECRET_KEY }}"
        JWT_SECRET_KEY: "{{ .JWT_SECRET_KEY }}"
        API_KEY_SECRET: "{{ .API_KEY_SECRET }}"

        # OAuth secrets
        GOOGLE_CLIENT_ID: "{{ .GOOGLE_CLIENT_ID }}"
        GOOGLE_CLIENT_SECRET: "{{ .GOOGLE_CLIENT_SECRET }}"
        GITHUB_CLIENT_ID: "{{ .GITHUB_CLIENT_ID }}"
        GITHUB_CLIENT_SECRET: "{{ .GITHUB_CLIENT_SECRET }}"

        # SMTP secrets
        SMTP_USERNAME: "{{ .SMTP_USERNAME }}"
        SMTP_PASSWORD: "{{ .SMTP_PASSWORD }}"

        # Cloud storage secrets
        GCS_CREDENTIALS: "{{ .GCS_CREDENTIALS }}"
        GCS_PROJECT_ID: "{{ .GCS_PROJECT_ID }}"
        AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY }}"

        # Monitoring secrets
        PROMETHEUS_TOKEN: "{{ .PROMETHEUS_TOKEN }}"
        GRAFANA_ADMIN_PASSWORD: "{{ .GRAFANA_ADMIN_PASSWORD }}"
  data:
  # Database secrets
  - secretKey: POSTGRES_PASSWORD
    remoteRef:
      key: database/postgres
      property: password
  - secretKey: POSTGRES_ROOT_PASSWORD
    remoteRef:
      key: database/postgres
      property: root_password

  # Redis secrets
  - secretKey: REDIS_PASSWORD
    remoteRef:
      key: database/redis
      property: password

  # Application secrets
  - secretKey: SECRET_KEY
    remoteRef:
      key: application/core
      property: secret_key
  - secretKey: JWT_SECRET_KEY
    remoteRef:
      key: application/jwt
      property: secret_key
  - secretKey: API_KEY_SECRET
    remoteRef:
      key: application/api
      property: key_secret

  # OAuth secrets
  - secretKey: GOOGLE_CLIENT_ID
    remoteRef:
      key: oauth/google
      property: client_id
  - secretKey: GOOGLE_CLIENT_SECRET
    remoteRef:
      key: oauth/google
      property: client_secret
  - secretKey: GITHUB_CLIENT_ID
    remoteRef:
      key: oauth/github
      property: client_id
  - secretKey: GITHUB_CLIENT_SECRET
    remoteRef:
      key: oauth/github
      property: client_secret

  # SMTP secrets
  - secretKey: SMTP_USERNAME
    remoteRef:
      key: smtp/config
      property: username
  - secretKey: SMTP_PASSWORD
    remoteRef:
      key: smtp/config
      property: password

  # Cloud storage secrets
  - secretKey: GCS_CREDENTIALS
    remoteRef:
      key: storage/gcs
      property: credentials_json
  - secretKey: GCS_PROJECT_ID
    remoteRef:
      key: storage/gcs
      property: project_id
  - secretKey: AWS_ACCESS_KEY_ID
    remoteRef:
      key: storage/aws
      property: access_key_id
  - secretKey: AWS_SECRET_ACCESS_KEY
    remoteRef:
      key: storage/aws
      property: secret_access_key

  # Monitoring secrets
  - secretKey: PROMETHEUS_TOKEN
    remoteRef:
      key: monitoring/prometheus
      property: token
  - secretKey: GRAFANA_ADMIN_PASSWORD
    remoteRef:
      key: monitoring/grafana
      property: admin_password