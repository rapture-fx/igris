apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-config
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
data:
  redis.conf: |
    # Redis configuration optimized for real-time streaming

    # Network
    bind 0.0.0.0
    protected-mode yes
    port 6379
    tcp-backlog 511
    timeout 0
    tcp-keepalive 300

    # General
    daemonize no
    supervised no
    pidfile /var/run/redis.pid
    loglevel notice
    logfile ""
    databases 16

    # Snapshotting - optimized for real-time workloads
    save 900 1
    save 300 10
    save 60 10000
    stop-writes-on-bgsave-error yes
    rdbcompression yes
    rdbchecksum yes
    dbfilename dump.rdb
    dir /data

    # Replication
    replica-serve-stale-data yes
    replica-read-only yes
    repl-diskless-sync no
    repl-diskless-sync-delay 5
    repl-ping-replica-period 10
    repl-timeout 60
    repl-disable-tcp-nodelay no
    repl-backlog-size 1mb
    repl-backlog-ttl 3600
    replica-priority 100

    # Security
    requirepass ${REDIS_PASSWORD}
    rename-command FLUSHDB ""
    rename-command FLUSHALL ""
    rename-command DEBUG ""

    # Memory management - optimized for ML/RL workloads
    maxmemory 1gb
    maxmemory-policy allkeys-lru
    maxmemory-samples 5

    # Lazy freeing
    lazyfree-lazy-eviction no
    lazyfree-lazy-expire no
    lazyfree-lazy-server-del no
    replica-lazy-flush no

    # Append only file
    appendonly yes
    appendfilename "appendonly.aof"
    appendfsync everysec
    no-appendfsync-on-rewrite no
    auto-aof-rewrite-percentage 100
    auto-aof-rewrite-min-size 64mb
    aof-load-truncated yes
    aof-use-rdb-preamble yes

    # Lua scripting
    lua-time-limit 5000

    # Redis Streams configuration
    stream-node-max-bytes 4096
    stream-node-max-entries 100

    # Slow log
    slowlog-log-slower-than 10000
    slowlog-max-len 128

    # Client output buffer limits
    client-output-buffer-limit normal 0 0 0
    client-output-buffer-limit replica 256mb 64mb 60
    client-output-buffer-limit pubsub 32mb 8mb 60

    # Client query buffer limit
    client-query-buffer-limit 1gb

    # Protocol buffer limit
    proto-max-bulk-len 512mb

    # Performance
    hz 10
    dynamic-hz yes
    aof-rewrite-incremental-fsync yes
    rdb-save-incremental-fsync yes

  redis-sentinel.conf: |
    # Sentinel configuration for Redis high availability
    port 26379
    sentinel monitor redis-master redis-master-service 6379 2
    sentinel auth-pass redis-master ${REDIS_PASSWORD}
    sentinel down-after-milliseconds redis-master 5000
    sentinel parallel-syncs redis-master 1
    sentinel failover-timeout redis-master 10000
    sentinel deny-scripts-reconfig yes

  init-streams.sh: |
    #!/bin/bash
    set -e

    # Wait for Redis to be ready
    until redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" ping; do
      echo "Waiting for Redis to be ready..."
      sleep 2
    done

    echo "Initializing Redis Streams..."

    # Create consumer groups for real-time data streams
    redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" XGROUP CREATE iot_sensors iot_processing 0 MKSTREAM || true
    redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" XGROUP CREATE financial_transactions financial_processing 0 MKSTREAM || true
    redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" XGROUP CREATE ecommerce_events ecommerce_processing 0 MKSTREAM || true
    redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" XGROUP CREATE domain_events event_processing 0 MKSTREAM || true
    redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" XGROUP CREATE ml_training_events ml_processing 0 MKSTREAM || true
    redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" XGROUP CREATE rl_agent_events rl_processing 0 MKSTREAM || true

    # Create additional streams for monitoring and metrics
    redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" XGROUP CREATE metrics_stream metrics_processing 0 MKSTREAM || true
    redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" XGROUP CREATE alerts_stream alerts_processing 0 MKSTREAM || true

    echo "Redis Streams initialized successfully"
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    redis-role: master
  ports:
  - name: redis
    protocol: TCP
    port: 6379
    targetPort: 6379
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: redis-master-service
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    redis-role: master
  ports:
  - name: redis
    protocol: TCP
    port: 6379
    targetPort: 6379
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: redis-replica-service
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    redis-role: replica
  ports:
  - name: redis
    protocol: TCP
    port: 6379
    targetPort: 6379
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
spec:
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
  ports:
  - name: redis
    protocol: TCP
    port: 6379
    targetPort: 6379
  - name: sentinel
    protocol: TCP
    port: 26379
    targetPort: 26379
  clusterIP: None
---
# Redis Master StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-master
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    redis-role: master
spec:
  serviceName: redis-headless
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: cache
      redis-role: master
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
        redis-role: master
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
          name: redis
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: REDIS_PASSWORD
        command:
        - /bin/sh
        - -c
        - |
          # Replace password placeholder in config
          sed "s/\${REDIS_PASSWORD}/$REDIS_PASSWORD/g" /etc/redis/redis.conf > /tmp/redis.conf
          redis-server /tmp/redis.conf
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: redis-config
          mountPath: /etc/redis/redis.conf
          subPath: redis.conf
        - name: redis-data
          mountPath: /data
        - name: redis-config
          mountPath: /usr/local/bin/init-streams.sh
          subPath: init-streams.sh
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" ping
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" ping
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 10
      # Redis Exporter for Prometheus monitoring
      - name: redis-exporter
        image: oliver006/redis_exporter:v1.55.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9121
          name: metrics
        env:
        - name: REDIS_ADDR
          value: "redis://localhost:6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: REDIS_PASSWORD
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /metrics
            port: 9121
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /metrics
            port: 9121
          initialDelaySeconds: 10
          periodSeconds: 5
      # Stream initializer init container
      initContainers:
      - name: stream-initializer
        image: redis:7-alpine
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: REDIS_PASSWORD
        command:
        - /bin/sh
        - -c
        - |
          # Wait for Redis master to be ready
          until redis-cli -h redis-master-service -p 6379 -a "${REDIS_PASSWORD}" ping; do
            echo "Waiting for Redis master to be ready..."
            sleep 2
          done

          # Run stream initialization
          chmod +x /usr/local/bin/init-streams.sh
          /usr/local/bin/init-streams.sh
        volumeMounts:
        - name: redis-config
          mountPath: /usr/local/bin/init-streams.sh
          subPath: init-streams.sh
      volumes:
      - name: redis-config
        configMap:
          name: redis-config
          defaultMode: 0755
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - redis
              topologyKey: kubernetes.io/hostname
  volumeClaimTemplates:
  - metadata:
      name: redis-data
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 20Gi
---
# Redis Replica StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-replica
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: cache
    redis-role: replica
spec:
  serviceName: redis-headless
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/component: cache
      redis-role: replica
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/component: cache
        redis-role: replica
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9121"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        runAsNonRoot: true
      containers:
      - name: redis
        image: redis:7-alpine
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 6379
          name: redis
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: REDIS_PASSWORD
        command:
        - /bin/sh
        - -c
        - |
          # Replace password placeholder in config and add replication settings
          sed "s/\${REDIS_PASSWORD}/$REDIS_PASSWORD/g" /etc/redis/redis.conf > /tmp/redis.conf
          echo "replicaof redis-master-service.schlep-engine.svc.cluster.local 6379" >> /tmp/redis.conf
          echo "masterauth $REDIS_PASSWORD" >> /tmp/redis.conf
          redis-server /tmp/redis.conf
        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        volumeMounts:
        - name: redis-config
          mountPath: /etc/redis/redis.conf
          subPath: redis.conf
        - name: redis-replica-data
          mountPath: /data
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" ping
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -c
            - redis-cli -h localhost -p 6379 -a "${REDIS_PASSWORD}" ping
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      # Redis Exporter for Prometheus monitoring
      - name: redis-exporter
        image: oliver006/redis_exporter:v1.55.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9121
          name: metrics
        env:
        - name: REDIS_ADDR
          value: "redis://localhost:6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: REDIS_PASSWORD
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: redis-config
        configMap:
          name: redis-config
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - redis
              topologyKey: kubernetes.io/hostname
  volumeClaimTemplates:
  - metadata:
      name: redis-replica-data
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 20Gi