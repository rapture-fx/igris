apiVersion: v1
kind: Namespace
metadata:
  name: argocd
  labels:
    name: argocd
    app.kubernetes.io/name: argocd
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  # Enable server-side diff to improve performance
  server.enable.diff.jq: "true"
  # Enable concurrent processing
  controller.operation.processors: "20"
  controller.status.processors: "20"
  controller.repo.server.timeout.seconds: "300"
  # Application sync timeout
  controller.app.resync: "300"
  # Enable gRPC-Web for better browser support
  server.grpc.web: "true"
  # Increase resource tracking parallelism
  controller.resource.tracking.parallelism: "10"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-server-config
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server-config
    app.kubernetes.io/part-of: argocd
data:
  url: "https://argocd.schlep-engine.com"
  dex.config: |
    connectors:
    - type: github
      id: github
      name: GitHub
      config:
        clientID: $github-oauth:clientId
        clientSecret: $github-oauth:clientSecret
        orgs:
        - name: schlep-engine
  oidc.config: |
    name: GitHub
    issuer: https://github.com
    clientId: $github-oauth:clientId
    clientSecret: $github-oauth:clientSecret
    requestedScopes: ["openid", "profile", "email", "groups"]
    requestedIDTokenClaims: {"groups": {"essential": true}}
  policy.default: role:readonly
  policy.csv: |
    p, role:admin, applications, *, */*, allow
    p, role:admin, clusters, *, *, allow
    p, role:admin, repositories, *, *, allow
    p, role:readonly, applications, get, */*, allow
    p, role:readonly, applications, sync, */*, allow
    p, role:ci-cd, applications, get, */*, allow
    p, role:ci-cd, applications, sync, */*, allow
    p, role:ci-cd, applications, update, */*, allow
    g, schlep-engine:admins, role:admin
    g, schlep-engine:developers, role:ci-cd
    g, schlep-engine:viewers, role:readonly
  scopes: '[groups]'
  resource.exclusions: |
    - apiGroups:
      - tekton.dev
      clusters:
      - "*"
      kinds:
      - TaskRun
      - PipelineRun
  resource.inclusions: |
    - apiGroups:
      - argoproj.io
      kinds:
      - Application
      - ApplicationSet
      - AppProject
  # Blue-Green deployment specific configuration
  application.instanceLabelKey: argocd.argoproj.io/instance
  application.resourceTrackingMethod: annotation
  resource.customizations.health.argoproj.io_Application: |
    hs = {}
    hs.status = "Progressing"
    hs.message = ""
    if obj.status ~= nil then
      if obj.status.health ~= nil then
        hs.status = obj.status.health.status
        if obj.status.health.message ~= nil then
          hs.message = obj.status.health.message
        end
      end
    end
    return hs
---
apiVersion: v1
kind: Secret
metadata:
  name: github-oauth
  namespace: argocd
  labels:
    app.kubernetes.io/name: github-oauth
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  clientId: "your-github-oauth-client-id"
  clientSecret: "your-github-oauth-client-secret"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-application-controller
  namespace: argocd
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: argocd-server
  namespace: argocd
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: argocd-application-controller
  labels:
    app.kubernetes.io/component: application-controller
    app.kubernetes.io/name: argocd-application-controller
    app.kubernetes.io/part-of: argocd
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  - configmaps
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - argoproj.io
  resources:
  - applications
  - applicationsets
  - appprojects
  verbs:
  - create
  - get
  - list
  - watch
  - update
  - patch
  - delete
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - create
  - list
- apiGroups:
  - '*'
  resources:
  - '*'
  verbs:
  - '*'
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: argocd-application-controller
  labels:
    app.kubernetes.io/component: application-controller
    app.kubernetes.io/name: argocd-application-controller
    app.kubernetes.io/part-of: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: argocd-application-controller
subjects:
- kind: ServiceAccount
  name: argocd-application-controller
  namespace: argocd
---
# Blue-Green Deployment Webhook Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: blue-green-webhook-config
  namespace: argocd
  labels:
    app.kubernetes.io/name: blue-green-webhook
    app.kubernetes.io/component: webhook
data:
  webhook.yaml: |
    triggers:
      - type: github
        name: schlep-engine-deployment
        github:
          secret:
            name: github-webhook-secret
            key: secret
        bindings:
          - ref: deployment-environment
            kind: TriggerBinding
        template:
          ref: blue-green-deployment
          kind: TriggerTemplate
    bindings:
      - name: deployment-environment
        spec:
          params:
            - name: gitrevision
              value: $(body.head_commit.id)
            - name: gitrepositoryurl
              value: $(body.repository.clone_url)
            - name: component
              value: $(extensions.component)
            - name: environment
              value: $(extensions.environment)
    templates:
      - name: blue-green-deployment
        spec:
          params:
            - name: gitrevision
            - name: gitrepositoryurl
            - name: component
            - name: environment
          resourcetemplates:
            - apiVersion: batch/v1
              kind: Job
              metadata:
                generateName: blue-green-deploy-
                namespace: argocd
              spec:
                template:
                  spec:
                    serviceAccountName: blue-green-deployer
                    containers:
                    - name: deployer
                      image: argoproj/argocd:v2.8.4
                      command:
                      - /bin/sh
                      - -c
                      - |
                        argocd app sync schlep-engine-$(params.environment) --revision $(params.gitrevision)
                        argocd app wait schlep-engine-$(params.environment) --health
                    restartPolicy: Never
                backoffLimit: 3
---
apiVersion: v1
kind: Secret
metadata:
  name: github-webhook-secret
  namespace: argocd
  labels:
    app.kubernetes.io/name: github-webhook-secret
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  secret: "your-github-webhook-secret"
---
# Blue-Green Deployment Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blue-green-deployer
  namespace: argocd
  labels:
    app.kubernetes.io/name: blue-green-deployer
    app.kubernetes.io/component: deployment
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: blue-green-deployer
  labels:
    app.kubernetes.io/name: blue-green-deployer
    app.kubernetes.io/component: deployment
rules:
- apiGroups:
  - argoproj.io
  resources:
  - applications
  verbs:
  - get
  - list
  - patch
  - update
- apiGroups:
  - ''
  resources:
  - events
  verbs:
  - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: blue-green-deployer
  labels:
    app.kubernetes.io/name: blue-green-deployer
    app.kubernetes.io/component: deployment
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: blue-green-deployer
subjects:
- kind: ServiceAccount
  name: blue-green-deployer
  namespace: argocd
---
# ArgoCD CLI Configuration for Blue-Green Operations
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cli-config
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cli-config
    app.kubernetes.io/component: cli
data:
  config: |
    contexts:
      argocd-blue-green:
        server: argocd.schlep-engine.com
        user: admin
    current-context: argocd-blue-green
    servers:
      argocd.schlep-engine.com:
        server: argocd.schlep-engine.com
        insecure: false
        grpc-web: true
    users:
      admin:
        auth-token: # Will be populated by CI/CD
  blue-green-commands.sh: |
    #!/bin/bash
    # Blue-Green Deployment Helper Commands

    # Deploy to green environment
    deploy_green() {
        local image_tag=$1
        argocd app set schlep-engine-green -p image.tag=$image_tag
        argocd app set schlep-engine-green -p deployment.replicas=3
        argocd app sync schlep-engine-green
        argocd app wait schlep-engine-green --health
    }

    # Switch traffic to green
    promote_green() {
        local traffic_percentage=${1:-100}
        argocd app set schlep-engine-green -p service.traffic.percentage=$traffic_percentage
        argocd app set schlep-engine-blue -p service.traffic.percentage=$((100 - traffic_percentage))
        argocd app sync schlep-engine-green
        argocd app sync schlep-engine-blue
    }

    # Rollback to blue
    rollback_to_blue() {
        argocd app set schlep-engine-blue -p service.traffic.percentage=100
        argocd app set schlep-engine-green -p service.traffic.percentage=0
        argocd app sync schlep-engine-blue
        argocd app sync schlep-engine-green
    }

    # Cleanup green environment
    cleanup_green() {
        argocd app set schlep-engine-green -p deployment.replicas=0
        argocd app sync schlep-engine-green
    }