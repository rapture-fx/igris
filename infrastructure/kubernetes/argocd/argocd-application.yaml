apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: schlep-engine-blue-green
  namespace: argocd
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: argocd-application
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/schlep-engine/schlep-engine
    targetRevision: HEAD
    path: infrastructure/kubernetes
    directory:
      recurse: true
      exclude: |
        argocd/**
        monitoring/**
        staging/**
  destination:
    server: https://kubernetes.default.svc
    namespace: schlep-engine
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
  ignoreDifferences:
  - group: apps
    kind: Deployment
    name: api-deployment-*
    jsonPointers:
    - /spec/replicas
  - group: apps
    kind: Deployment
    name: landing-deployment-*
    jsonPointers:
    - /spec/replicas
  - group: networking.istio.io
    kind: VirtualService
    jsonPointers:
    - /spec/http/0/route
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: schlep-engine-blue
  namespace: argocd
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: blue-deployment
    deployment.schlep-engine.com/color: blue
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    deployment.schlep-engine.com/active: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/schlep-engine/schlep-engine
    targetRevision: HEAD
    path: infrastructure/kubernetes/blue-green/environments/blue
    helm:
      parameters:
      - name: image.tag
        value: "stable"
      - name: deployment.color
        value: "blue"
      - name: deployment.replicas
        value: "3"
      - name: service.traffic.percentage
        value: "100"
  destination:
    server: https://kubernetes.default.svc
    namespace: schlep-engine
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
  revisionHistoryLimit: 5
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: schlep-engine-green
  namespace: argocd
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: green-deployment
    deployment.schlep-engine.com/color: green
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    deployment.schlep-engine.com/active: "false"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/schlep-engine/schlep-engine
    targetRevision: HEAD
    path: infrastructure/kubernetes/blue-green/environments/green
    helm:
      parameters:
      - name: image.tag
        value: "latest"
      - name: deployment.color
        value: "green"
      - name: deployment.replicas
        value: "0"
      - name: service.traffic.percentage
        value: "0"
  destination:
    server: https://kubernetes.default.svc
    namespace: schlep-engine
  syncPolicy:
    automated:
      prune: false
      selfHeal: false  # Manual control for green deployment
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m
  revisionHistoryLimit: 5
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: schlep-engine
  namespace: argocd
  labels:
    app.kubernetes.io/name: schlep-engine
    app.kubernetes.io/component: argocd-project
spec:
  description: Schlep Engine Blue-Green Deployment Project
  sourceRepos:
  - 'https://github.com/schlep-engine/schlep-engine'
  - 'https://charts.bitnami.com/bitnami'
  - 'https://prometheus-community.github.io/helm-charts'
  - 'https://istio-release.storage.googleapis.com/charts'
  destinations:
  - namespace: schlep-engine
    server: https://kubernetes.default.svc
  - namespace: schlep-engine-*
    server: https://kubernetes.default.svc
  - namespace: istio-system
    server: https://kubernetes.default.svc
  - namespace: monitoring
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: 'rbac.authorization.k8s.io'
    kind: ClusterRole
  - group: 'rbac.authorization.k8s.io'
    kind: ClusterRoleBinding
  - group: 'apiextensions.k8s.io'
    kind: CustomResourceDefinition
  - group: 'networking.istio.io'
    kind: Gateway
  namespaceResourceWhitelist:
  - group: ''
    kind: Service
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: ConfigMap
  - group: ''
    kind: Secret
  - group: ''
    kind: PersistentVolumeClaim
  - group: 'apps'
    kind: Deployment
  - group: 'apps'
    kind: StatefulSet
  - group: 'apps'
    kind: DaemonSet
  - group: 'apps'
    kind: ReplicaSet
  - group: 'batch'
    kind: Job
  - group: 'batch'
    kind: CronJob
  - group: 'networking.k8s.io'
    kind: Ingress
  - group: 'networking.k8s.io'
    kind: NetworkPolicy
  - group: 'networking.istio.io'
    kind: VirtualService
  - group: 'networking.istio.io'
    kind: DestinationRule
  - group: 'networking.istio.io'
    kind: ServiceEntry
  - group: 'security.istio.io'
    kind: PeerAuthentication
  - group: 'security.istio.io'
    kind: AuthorizationPolicy
  - group: 'autoscaling'
    kind: HorizontalPodAutoscaler
  - group: 'policy'
    kind: PodDisruptionBudget
  - group: 'monitoring.coreos.com'
    kind: ServiceMonitor
  - group: 'monitoring.coreos.com'
    kind: PodMonitor
  roles:
  - name: read-only
    description: Read-only privileges to schlep-engine project
    policies:
    - p, proj:schlep-engine:read-only, applications, get, schlep-engine/*, allow
    - p, proj:schlep-engine:read-only, logs, get, schlep-engine/*, allow
    - p, proj:schlep-engine:read-only, exec, create, schlep-engine/*, deny
    groups:
    - schlep-engine:viewers
  - name: ci-cd
    description: CI/CD privileges for automated deployments
    policies:
    - p, proj:schlep-engine:ci-cd, applications, get, schlep-engine/*, allow
    - p, proj:schlep-engine:ci-cd, applications, sync, schlep-engine/*, allow
    - p, proj:schlep-engine:ci-cd, applications, update, schlep-engine/*, allow
    - p, proj:schlep-engine:ci-cd, applications, delete, schlep-engine/*, deny
    groups:
    - schlep-engine:ci-cd
  - name: admin
    description: Administrative privileges for schlep-engine project
    policies:
    - p, proj:schlep-engine:admin, applications, *, schlep-engine/*, allow
    - p, proj:schlep-engine:admin, logs, get, schlep-engine/*, allow
    - p, proj:schlep-engine:admin, exec, create, schlep-engine/*, allow
    groups:
    - schlep-engine:admins
  syncWindows:
  - kind: allow
    schedule: '0 6 * * *'
    duration: 4h
    applications:
    - schlep-engine-*
    timeZone: UTC
    manualSync: true
  - kind: deny
    schedule: '0 22 * * 5'
    duration: 8h
    applications:
    - schlep-engine-*
    timeZone: UTC
    manualSync: false