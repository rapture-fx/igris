---
# Real-Time Performance Monitoring Stack for Schlep-engine
# Comprehensive monitoring setup for <100ms response time SLA

apiVersion: v1
kind: ConfigMap
metadata:
  name: realtime-monitoring-config
  namespace: schlep-engine
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s  # High frequency for real-time monitoring
      evaluation_interval: 5s

    rule_files:
      - "/etc/prometheus/rules/*.yml"

    scrape_configs:
      # Application Performance Metrics
      - job_name: 'app-performance'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - schlep-engine
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
        scrape_interval: 2s  # Very high frequency for app metrics

      # Load Balancer Metrics
      - job_name: 'nginx-ingress'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - ingress-nginx
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
            action: keep
            regex: ingress-nginx
        scrape_interval: 5s

      # Cache Performance Metrics
      - job_name: 'redis-l1-cache'
        static_configs:
          - targets: ['redis-l1-exporter:9121']
        scrape_interval: 2s

      - job_name: 'redis-l2-cache'
        static_configs:
          - targets: ['redis-l2-exporter:9121']
        scrape_interval: 5s

      # Database Performance
      - job_name: 'postgresql-realtime'
        static_configs:
          - targets: ['postgres-exporter:9187']
        scrape_interval: 10s

      # Kafka/MSK Performance
      - job_name: 'kafka-metrics'
        static_configs:
          - targets: ['kafka-exporter:9308']
        scrape_interval: 10s

      # Node Performance
      - job_name: 'node-exporter'
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
        scrape_interval: 10s

  realtime_rules.yml: |
    groups:
      - name: realtime_performance_sla
        rules:
          # Response Time SLA Monitoring
          - alert: ResponseTimeBreachCritical
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[1m])) > 0.1
            for: 30s
            labels:
              severity: critical
              sla: response_time
            annotations:
              summary: "Response time SLA breach - 95th percentile > 100ms"
              description: "95th percentile response time is {{ $value | humanizeDuration }}"

          - alert: ResponseTimeBreachWarning
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[1m])) > 0.08
            for: 1m
            labels:
              severity: warning
              sla: response_time
            annotations:
              summary: "Response time approaching SLA breach - 95th percentile > 80ms"
              description: "95th percentile response time is {{ $value | humanizeDuration }}"

          - alert: ResponseTimeBreachP99
            expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[1m])) > 0.2
            for: 1m
            labels:
              severity: warning
              sla: response_time
            annotations:
              summary: "99th percentile response time high"
              description: "99th percentile response time is {{ $value | humanizeDuration }}"

      - name: cache_performance
        rules:
          # L1 Cache Performance
          - alert: L1CacheHitRateLow
            expr: redis_keyspace_hits_total / (redis_keyspace_hits_total + redis_keyspace_misses_total) < 0.95
            for: 2m
            labels:
              severity: warning
              cache_layer: L1
            annotations:
              summary: "L1 Cache hit rate low"
              description: "L1 Cache hit rate is {{ $value | humanizePercentage }}"

          - alert: L1CacheLatencyHigh
            expr: redis_latency_percentiles_usec{quantile="0.99"} > 1000
            for: 1m
            labels:
              severity: critical
              cache_layer: L1
            annotations:
              summary: "L1 Cache latency high"
              description: "L1 Cache 99th percentile latency is {{ $value }}μs"

          # L2 Cache Performance
          - alert: L2CacheHitRateLow
            expr: redis_keyspace_hits_total{instance=~".*l2.*"} / (redis_keyspace_hits_total{instance=~".*l2.*"} + redis_keyspace_misses_total{instance=~".*l2.*"}) < 0.85
            for: 5m
            labels:
              severity: warning
              cache_layer: L2
            annotations:
              summary: "L2 Cache hit rate low"
              description: "L2 Cache hit rate is {{ $value | humanizePercentage }}"

          # Cache Memory Usage
          - alert: CacheMemoryHighUsage
            expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Cache memory usage high"
              description: "Cache memory usage is {{ $value | humanizePercentage }}"

      - name: database_realtime_performance
        rules:
          # Database Query Performance
          - alert: DatabaseSlowQueries
            expr: rate(pg_stat_statements_total_exec_time[1m]) / rate(pg_stat_statements_calls[1m]) > 50
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Database queries running slow"
              description: "Average query execution time is {{ $value }}ms"

          # Database Connection Pool
          - alert: DatabaseConnectionPoolHigh
            expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Database connection pool usage high"
              description: "Connection pool usage is {{ $value | humanizePercentage }}"

          # Lock Contention
          - alert: DatabaseLockContention
            expr: pg_locks_count{mode="AccessExclusiveLock"} > 5
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Database lock contention detected"
              description: "{{ $value }} exclusive locks detected"

      - name: infrastructure_performance
        rules:
          # Auto-scaling triggers
          - alert: HighCPURequiresScaling
            expr: rate(container_cpu_usage_seconds_total[1m]) > 0.7
            for: 30s
            labels:
              severity: warning
              action: scale_out
            annotations:
              summary: "High CPU usage - scaling recommended"
              description: "CPU usage is {{ $value | humanizePercentage }}"

          - alert: HighMemoryRequiresScaling
            expr: container_memory_working_set_bytes / container_spec_memory_limit_bytes > 0.8
            for: 1m
            labels:
              severity: warning
              action: scale_out
            annotations:
              summary: "High memory usage - scaling recommended"
              description: "Memory usage is {{ $value | humanizePercentage }}"

          # Network Performance
          - alert: NetworkLatencyHigh
            expr: histogram_quantile(0.95, rate(nginx_ingress_controller_request_duration_seconds_bucket[1m])) > 0.05
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Network latency high at ingress"
              description: "Ingress 95th percentile latency is {{ $value | humanizeDuration }}"

      - name: event_streaming_performance
        rules:
          # Kafka/MSK Performance
          - alert: KafkaConsumerLag
            expr: kafka_consumer_lag_sum > 1000
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Kafka consumer lag high"
              description: "Consumer lag is {{ $value }} messages"

          - alert: KafkaProducerLatency
            expr: kafka_producer_request_latency_avg > 100
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Kafka producer latency high"
              description: "Producer latency is {{ $value }}ms"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-prometheus
  namespace: schlep-engine
spec:
  replicas: 2  # HA setup
  selector:
    matchLabels:
      app: realtime-prometheus
  template:
    metadata:
      labels:
        app: realtime-prometheus
    spec:
      serviceAccountName: prometheus
      containers:
      - name: prometheus
        image: prom/prometheus:v2.45.0
        args:
          - '--config.file=/etc/prometheus/prometheus.yml'
          - '--storage.tsdb.path=/prometheus/'
          - '--web.console.libraries=/etc/prometheus/console_libraries'
          - '--web.console.templates=/etc/prometheus/consoles'
          - '--storage.tsdb.retention.time=15d'
          - '--web.enable-lifecycle'
          - '--storage.tsdb.min-block-duration=2h'
          - '--storage.tsdb.max-block-duration=2h'
          - '--query.max-concurrency=50'  # High concurrency for real-time queries
        ports:
        - containerPort: 9090
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus/
        - name: prometheus-rules
          mountPath: /etc/prometheus/rules/
        - name: prometheus-storage
          mountPath: /prometheus/
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 5
          timeoutSeconds: 10
      volumes:
      - name: prometheus-config
        configMap:
          name: realtime-monitoring-config
      - name: prometheus-rules
        configMap:
          name: realtime-monitoring-config
          items:
          - key: realtime_rules.yml
            path: realtime_rules.yml
      - name: prometheus-storage
        persistentVolumeClaim:
          claimName: prometheus-storage

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-storage
  namespace: schlep-engine
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-fast  # High IOPS storage class
  resources:
    requests:
      storage: 50Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: realtime-alertmanager
  namespace: schlep-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: realtime-alertmanager
  template:
    metadata:
      labels:
        app: realtime-alertmanager
    spec:
      containers:
      - name: alertmanager
        image: prom/alertmanager:v0.25.0
        args:
          - '--config.file=/etc/alertmanager/config.yml'
          - '--storage.path=/alertmanager'
          - '--web.external-url=http://alertmanager:9093'
          - '--cluster.listen-address=0.0.0.0:9094'
          - '--cluster.peer=realtime-alertmanager:9094'
        ports:
        - containerPort: 9093
        - containerPort: 9094
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        volumeMounts:
        - name: alertmanager-config
          mountPath: /etc/alertmanager/
        - name: alertmanager-storage
          mountPath: /alertmanager/
      volumes:
      - name: alertmanager-config
        configMap:
          name: alertmanager-config
      - name: alertmanager-storage
        emptyDir: {}

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
  namespace: schlep-engine
data:
  config.yml: |
    global:
      smtp_smarthost: 'localhost:587'
      smtp_from: 'alerts@schlep-engine.com'

    route:
      group_by: ['alertname']
      group_wait: 5s      # Fast grouping for real-time alerts
      group_interval: 10s
      repeat_interval: 5m
      receiver: 'realtime-alerts'
      routes:
      - match:
          severity: critical
        receiver: 'critical-alerts'
        group_wait: 1s
        group_interval: 5s
        repeat_interval: 1m

    receivers:
    - name: 'realtime-alerts'
      webhook_configs:
      - url: 'http://alert-webhook:9093/webhook'
        send_resolved: true

    - name: 'critical-alerts'
      webhook_configs:
      - url: 'http://alert-webhook:9093/webhook/critical'
        send_resolved: true
      pagerduty_configs:
      - service_key: 'YOUR_PAGERDUTY_KEY'
        description: 'Critical performance alert: {{ .GroupLabels.alertname }}'

    inhibit_rules:
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'dev', 'instance']

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-realtime
  namespace: schlep-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-realtime
  template:
    metadata:
      labels:
        app: grafana-realtime
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:10.0.0
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-credentials
              key: password
        - name: GF_USERS_ALLOW_SIGN_UP
          value: "false"
        - name: GF_SERVER_ROOT_URL
          value: "https://monitoring.schlep-engine.com"
        - name: GF_INSTALL_PLUGINS
          value: "grafana-clock-panel,grafana-simple-json-datasource"
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "400m"
        volumeMounts:
        - name: grafana-storage
          mountPath: /var/lib/grafana
        - name: grafana-config
          mountPath: /etc/grafana/provisioning/
      volumes:
      - name: grafana-storage
        persistentVolumeClaim:
          claimName: grafana-storage
      - name: grafana-config
        configMap:
          name: grafana-config

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-storage
  namespace: schlep-engine
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3-fast
  resources:
    requests:
      storage: 10Gi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: schlep-engine
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
    - name: Prometheus-Realtime
      type: prometheus
      access: proxy
      url: http://realtime-prometheus:9090
      isDefault: true
      editable: true
      jsonData:
        timeInterval: "2s"  # High resolution for real-time data
        
  dashboard.yml: |
    apiVersion: 1
    providers:
    - name: 'realtime-dashboards'
      orgId: 1
      folder: 'Real-Time Performance'
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards

---
# Real-time performance dashboard
apiVersion: v1
kind: ConfigMap
metadata:
  name: realtime-dashboard
  namespace: schlep-engine
data:
  realtime-performance.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Real-Time Performance SLA Dashboard",
        "tags": ["realtime", "performance", "sla"],
        "timezone": "browser",
        "refresh": "2s",
        "time": {"from": "now-15m", "to": "now"},
        "panels": [
          {
            "id": 1,
            "title": "Response Time SLA Status",
            "type": "stat",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[1m]))",
                "legendFormat": "95th Percentile"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "thresholds"},
                "thresholds": {
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "yellow", "value": 0.08},
                    {"color": "red", "value": 0.1}
                  ]
                },
                "unit": "s",
                "max": 0.15,
                "min": 0
              }
            },
            "gridPos": {"h": 8, "w": 6, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Real-Time Response Times",
            "type": "timeseries",
            "targets": [
              {
                "expr": "histogram_quantile(0.50, rate(http_request_duration_seconds_bucket[30s]))",
                "legendFormat": "50th Percentile"
              },
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[30s]))",
                "legendFormat": "95th Percentile"
              },
              {
                "expr": "histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[30s]))",
                "legendFormat": "99th Percentile"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "unit": "s"
              }
            },
            "gridPos": {"h": 8, "w": 18, "x": 6, "y": 0}
          },
          {
            "id": 3,
            "title": "Cache Performance",
            "type": "timeseries",
            "targets": [
              {
                "expr": "redis_keyspace_hits_total / (redis_keyspace_hits_total + redis_keyspace_misses_total) * 100",
                "legendFormat": "L1 Cache Hit Rate %"
              },
              {
                "expr": "redis_latency_percentiles_usec{quantile=\"0.99\"}",
                "legendFormat": "L1 Cache Latency (μs)"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "Auto-scaling Status",
            "type": "timeseries",
            "targets": [
              {
                "expr": "kube_deployment_status_replicas",
                "legendFormat": "Current Replicas"
              },
              {
                "expr": "rate(container_cpu_usage_seconds_total[1m]) * 100",
                "legendFormat": "CPU Usage %"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          },
          {
            "id": 5,
            "title": "SLA Compliance (Last 24h)",
            "type": "stat",
            "targets": [
              {
                "expr": "100 * (1 - (increase(ALERTS{alertname=\"ResponseTimeBreachCritical\",alertstate=\"firing\"}[24h]) / (24 * 60 * 60 / 5)))",
                "legendFormat": "SLA Compliance %"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "thresholds"},
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": null},
                    {"color": "yellow", "value": 99.5},
                    {"color": "green", "value": 99.9}
                  ]
                },
                "unit": "percent",
                "max": 100,
                "min": 95
              }
            },
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 16}
          }
        ]
      }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: realtime-prometheus
  namespace: schlep-engine
spec:
  ports:
  - port: 9090
    targetPort: 9090
    name: prometheus
  selector:
    app: realtime-prometheus

---
apiVersion: v1
kind: Service
metadata:
  name: realtime-alertmanager
  namespace: schlep-engine
spec:
  ports:
  - port: 9093
    targetPort: 9093
    name: alertmanager
  - port: 9094
    targetPort: 9094
    name: cluster
  selector:
    app: realtime-alertmanager

---
apiVersion: v1
kind: Service
metadata:
  name: grafana-realtime
  namespace: schlep-engine
spec:
  ports:
  - port: 3000
    targetPort: 3000
    name: grafana
  selector:
    app: grafana-realtime