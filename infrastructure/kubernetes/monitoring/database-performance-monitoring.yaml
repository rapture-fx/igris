---
# Database Performance Monitoring Stack for Schlep-engine
# Comprehensive monitoring setup for PostgreSQL and Redis performance

apiVersion: v1
kind: ConfigMap
metadata:
  name: database-monitoring-config
  namespace: schlep-engine
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - "/etc/prometheus/rules/*.yml"

    scrape_configs:
      # PostgreSQL Metrics
      - job_name: 'postgresql'
        static_configs:
          - targets: ['postgres-exporter:9187']
        scrape_interval: 30s
        metrics_path: /metrics

      # Redis Metrics  
      - job_name: 'redis'
        static_configs:
          - targets: ['redis-exporter:9121']
        scrape_interval: 30s
        metrics_path: /metrics

      # Application Database Metrics
      - job_name: 'app-db-metrics'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - schlep-engine
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)

  database_rules.yml: |
    groups:
      - name: postgresql_performance
        rules:
          # Query Performance Rules
          - alert: PostgreSQLSlowQueries
            expr: rate(pg_stat_activity_max_tx_duration[5m]) > 30
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "PostgreSQL slow queries detected"
              description: "Slow queries detected with duration > 30s"

          - alert: PostgreSQLHighConnections
            expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "PostgreSQL connection usage high"
              description: "Connection usage is {{ $value | humanizePercentage }}"

          - alert: PostgreSQLDeadlocks
            expr: increase(pg_stat_database_deadlocks[1h]) > 5
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "PostgreSQL deadlocks detected"
              description: "{{ $value }} deadlocks detected in the last hour"

          # Index Performance Rules
          - alert: PostgreSQLUnusedIndexes
            expr: pg_stat_user_indexes_idx_scan < 10
            for: 24h
            labels:
              severity: info
            annotations:
              summary: "PostgreSQL unused indexes detected"
              description: "Index {{ $labels.indexname }} on table {{ $labels.relname }} has low usage"

          - alert: PostgreSQLMissingIndexes
            expr: pg_stat_user_tables_seq_scan / (pg_stat_user_tables_seq_scan + pg_stat_user_tables_idx_scan) > 0.1
            for: 1h
            labels:
              severity: warning
            annotations:
              summary: "PostgreSQL high sequential scan ratio"
              description: "Table {{ $labels.relname }} has high sequential scan ratio: {{ $value | humanizePercentage }}"

      - name: redis_performance
        rules:
          # Redis Performance Rules
          - alert: RedisHighMemoryUsage
            expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Redis memory usage high"
              description: "Redis memory usage is {{ $value | humanizePercentage }}"

          - alert: RedisSlowQueries
            expr: increase(redis_slowlog_length[10m]) > 0
            for: 0m
            labels:
              severity: warning
            annotations:
              summary: "Redis slow queries detected"
              description: "{{ $value }} slow queries detected in Redis"

          - alert: RedisHighLatency
            expr: redis_latency_percentiles_usec{quantile="0.99"} > 10000
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: "Redis high latency detected"
              description: "Redis 99th percentile latency is {{ $value }}μs"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: schlep-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
      - name: postgres-exporter
        image: prometheuscommunity/postgres-exporter:v0.12.1
        ports:
        - containerPort: 9187
        env:
        - name: DATA_SOURCE_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-credentials
              key: connection-string
        - name: PG_EXPORTER_EXTEND_QUERY_PATH
          value: "/etc/postgres_exporter/queries.yaml"
        - name: PG_EXPORTER_CONSTANT_LABELS
          value: "environment=production,service=schlep-engine"
        volumeMounts:
        - name: queries-config
          mountPath: /etc/postgres_exporter
          readOnly: true
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "100m"
      volumes:
      - name: queries-config
        configMap:
          name: postgres-exporter-queries

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-queries
  namespace: schlep-engine
data:
  queries.yaml: |
    # Custom PostgreSQL metrics for Schlep-engine performance monitoring
    
    # Query performance metrics
    pg_stat_statements_top_queries:
      query: |
        SELECT 
          query,
          calls,
          total_exec_time,
          mean_exec_time,
          max_exec_time,
          stddev_exec_time,
          rows,
          100.0 * shared_blks_hit / nullif(shared_blks_hit + shared_blks_read, 0) AS hit_percent
        FROM pg_stat_statements 
        WHERE query NOT LIKE '%pg_stat_statements%'
        ORDER BY total_exec_time DESC 
        LIMIT 20
      master: true
      metrics:
        - query: {usage: "LABEL", description: "SQL Query"}
        - calls: {usage: "COUNTER", description: "Number of times executed"}
        - total_exec_time: {usage: "COUNTER", description: "Total execution time in milliseconds"}
        - mean_exec_time: {usage: "GAUGE", description: "Mean execution time in milliseconds"}
        - max_exec_time: {usage: "GAUGE", description: "Maximum execution time in milliseconds"}
        - hit_percent: {usage: "GAUGE", description: "Cache hit percentage"}

    # Index usage statistics
    pg_stat_user_indexes_usage:
      query: |
        SELECT 
          schemaname,
          tablename,
          indexname,
          idx_tup_read,
          idx_tup_fetch,
          idx_scan,
          CASE WHEN idx_scan = 0 THEN 0
               WHEN idx_scan < 10 THEN 1
               ELSE 2
          END as usage_level
        FROM pg_stat_user_indexes
      master: true
      metrics:
        - schemaname: {usage: "LABEL", description: "Schema name"}
        - tablename: {usage: "LABEL", description: "Table name"}
        - indexname: {usage: "LABEL", description: "Index name"}
        - idx_tup_read: {usage: "COUNTER", description: "Number of index entries read"}
        - idx_tup_fetch: {usage: "COUNTER", description: "Number of table rows fetched"}
        - idx_scan: {usage: "COUNTER", description: "Number of index scans"}
        - usage_level: {usage: "GAUGE", description: "Index usage level (0=unused, 1=low, 2=active)"}

    # Table statistics
    pg_stat_user_tables_detailed:
      query: |
        SELECT 
          schemaname,
          relname,
          seq_scan,
          seq_tup_read,
          idx_scan,
          idx_tup_fetch,
          n_tup_ins,
          n_tup_upd,
          n_tup_del,
          n_tup_hot_upd,
          n_live_tup,
          n_dead_tup,
          vacuum_count,
          autovacuum_count,
          analyze_count,
          autoanalyze_count
        FROM pg_stat_user_tables
      master: true
      metrics:
        - schemaname: {usage: "LABEL", description: "Schema name"}
        - relname: {usage: "LABEL", description: "Table name"}
        - seq_scan: {usage: "COUNTER", description: "Sequential scans"}
        - seq_tup_read: {usage: "COUNTER", description: "Tuples read by sequential scans"}
        - idx_scan: {usage: "COUNTER", description: "Index scans"}
        - idx_tup_fetch: {usage: "COUNTER", description: "Tuples fetched by index scans"}
        - n_tup_ins: {usage: "COUNTER", description: "Tuples inserted"}
        - n_tup_upd: {usage: "COUNTER", description: "Tuples updated"}
        - n_tup_del: {usage: "COUNTER", description: "Tuples deleted"}
        - n_live_tup: {usage: "GAUGE", description: "Live tuples"}
        - n_dead_tup: {usage: "GAUGE", description: "Dead tuples"}
        - vacuum_count: {usage: "COUNTER", description: "Manual vacuum count"}
        - autovacuum_count: {usage: "COUNTER", description: "Auto vacuum count"}

    # Connection and activity metrics
    pg_stat_activity_detailed:
      query: |
        SELECT 
          state,
          COUNT(*) as connections,
          AVG(EXTRACT(EPOCH FROM (now() - query_start))) as avg_query_duration_seconds,
          MAX(EXTRACT(EPOCH FROM (now() - query_start))) as max_query_duration_seconds
        FROM pg_stat_activity 
        WHERE state IS NOT NULL
        GROUP BY state
      master: true
      metrics:
        - state: {usage: "LABEL", description: "Connection state"}
        - connections: {usage: "GAUGE", description: "Number of connections in this state"}
        - avg_query_duration_seconds: {usage: "GAUGE", description: "Average query duration"}
        - max_query_duration_seconds: {usage: "GAUGE", description: "Maximum query duration"}

    # Lock statistics
    pg_locks_summary:
      query: |
        SELECT 
          mode,
          granted,
          COUNT(*) as lock_count
        FROM pg_locks 
        GROUP BY mode, granted
      master: true
      metrics:
        - mode: {usage: "LABEL", description: "Lock mode"}
        - granted: {usage: "LABEL", description: "Lock granted status"}
        - lock_count: {usage: "GAUGE", description: "Number of locks"}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-exporter
  namespace: schlep-engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-exporter
  template:
    metadata:
      labels:
        app: redis-exporter
    spec:
      containers:
      - name: redis-exporter
        image: oliver006/redis_exporter:v1.50.0
        ports:
        - containerPort: 9121
        env:
        - name: REDIS_ADDR
          value: "redis://redis-service:6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: redis-credentials
              key: password
        - name: REDIS_EXPORTER_INCL_SYSTEM_METRICS
          value: "true"
        - name: REDIS_EXPORTER_CHECK_KEYS
          value: "cache:*,session:*,rate_limit:*"
        resources:
          requests:
            memory: "32Mi"
            cpu: "25m"
          limits:
            memory: "64Mi"
            cpu: "50m"

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: schlep-engine
  labels:
    app: postgres-exporter
spec:
  ports:
  - port: 9187
    targetPort: 9187
    name: metrics
  selector:
    app: postgres-exporter

---
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter
  namespace: schlep-engine
  labels:
    app: redis-exporter
spec:
  ports:
  - port: 9121
    targetPort: 9121
    name: metrics
  selector:
    app: redis-exporter

---
# Grafana Dashboard ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: database-performance-dashboard
  namespace: schlep-engine
data:
  dashboard.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Schlep-engine Database Performance",
        "tags": ["database", "postgresql", "redis", "performance"],
        "timezone": "browser",
        "panels": [
          {
            "id": 1,
            "title": "Database Connections",
            "type": "stat",
            "targets": [
              {
                "expr": "pg_stat_database_numbackends",
                "legendFormat": "Active Connections"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "thresholds"},
                "thresholds": {
                  "steps": [
                    {"color": "green", "value": null},
                    {"color": "yellow", "value": 50},
                    {"color": "red", "value": 80}
                  ]
                }
              }
            },
            "gridPos": {"h": 8, "w": 6, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Query Performance (Top 10)",
            "type": "table",
            "targets": [
              {
                "expr": "topk(10, pg_stat_statements_total_exec_time)",
                "legendFormat": "{{query}}"
              }
            ],
            "gridPos": {"h": 8, "w": 18, "x": 6, "y": 0}
          },
          {
            "id": 3,
            "title": "Index Usage Efficiency",
            "type": "bargauge",
            "targets": [
              {
                "expr": "pg_stat_user_indexes_idx_scan / (pg_stat_user_indexes_idx_scan + pg_stat_user_tables_seq_scan) * 100",
                "legendFormat": "{{tablename}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "Redis Memory Usage",
            "type": "timeseries",
            "targets": [
              {
                "expr": "redis_memory_used_bytes",
                "legendFormat": "Used Memory"
              },
              {
                "expr": "redis_memory_max_bytes",
                "legendFormat": "Max Memory"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}
          },
          {
            "id": 5,
            "title": "Database Response Time (95th percentile)",
            "type": "timeseries",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(pg_stat_statements_total_exec_time_bucket[5m]))",
                "legendFormat": "95th percentile"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 16}
          },
          {
            "id": 6,
            "title": "Cache Hit Ratio",
            "type": "stat",
            "targets": [
              {
                "expr": "pg_stat_database_blks_hit / (pg_stat_database_blks_hit + pg_stat_database_blks_read) * 100",
                "legendFormat": "Cache Hit %"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "thresholds"},
                "thresholds": {
                  "steps": [
                    {"color": "red", "value": null},
                    {"color": "yellow", "value": 90},
                    {"color": "green", "value": 95}
                  ]
                },
                "unit": "percent"
              }
            },
            "gridPos": {"h": 4, "w": 6, "x": 0, "y": 24}
          },
          {
            "id": 7,
            "title": "Lock Contention",
            "type": "timeseries",
            "targets": [
              {
                "expr": "pg_locks_count",
                "legendFormat": "{{mode}} - {{granted}}"
              }
            ],
            "gridPos": {"h": 8, "w": 18, "x": 6, "y": 24}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "30s"
      }
    }