# Grafana Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: schlep-engine-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
data:
  grafana.ini: |
    [analytics]
    check_for_updates = false
    reporting_enabled = false

    [grafana_net]
    url = https://grafana.net

    [log]
    mode = console
    level = info

    [paths]
    data = /var/lib/grafana/data
    logs = /var/log/grafana
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning

    [server]
    protocol = http
    http_addr = 0.0.0.0
    http_port = 3000
    domain = grafana.schlep-engine.com
    root_url = https://%(domain)s/
    serve_from_sub_path = false

    [security]
    admin_user = admin
    admin_password = $__file{/etc/grafana/secrets/admin_password}
    secret_key = $__file{/etc/grafana/secrets/secret_key}
    cookie_secure = true
    cookie_samesite = lax
    allow_embedding = false
    x_content_type_options = true
    x_xss_protection = true

    [users]
    allow_sign_up = false
    allow_org_create = false
    auto_assign_org = true
    auto_assign_org_role = Viewer
    default_theme = dark

    [auth]
    disable_login_form = false
    oauth_auto_login = false

    [auth.anonymous]
    enabled = false

    [auth.github]
    enabled = true
    allow_sign_up = true
    client_id = $__file{/etc/grafana/secrets/github_client_id}
    client_secret = $__file{/etc/grafana/secrets/github_client_secret}
    scopes = user:email,read:org
    auth_url = https://github.com/login/oauth/authorize
    token_url = https://github.com/login/oauth/access_token
    api_url = https://api.github.com/user
    allowed_organizations = schlep-engine
    role_attribute_path = contains(groups[*], '@schlep-engine/admin') && 'Admin' || contains(groups[*], '@schlep-engine/editors') && 'Editor' || 'Viewer'

    [database]
    type = postgres
    host = postgres-service.schlep-engine.svc.cluster.local:5432
    name = grafana
    user = grafana
    password = $__file{/etc/grafana/secrets/db_password}
    ssl_mode = require
    max_idle_conn = 2
    max_open_conn = 10
    conn_max_lifetime = 14400

    [session]
    provider = postgres
    provider_config = user=grafana password=$__file{/etc/grafana/secrets/db_password} host=postgres-service.schlep-engine.svc.cluster.local port=5432 dbname=grafana sslmode=require
    cookie_name = grafana_sess
    cookie_secure = true
    session_life_time = 86400

    [dataproxy]
    timeout = 30
    keep_alive_seconds = 30

    [alerting]
    enabled = true
    execute_alerts = true

    [metrics]
    enabled = true
    basic_auth_username = metrics
    basic_auth_password = $__file{/etc/grafana/secrets/metrics_password}

    [feature_toggles]
    enable = ngalert

    [unified_alerting]
    enabled = true
    ha_peers = grafana-0.grafana-headless.schlep-engine-monitoring.svc.cluster.local:9094,grafana-1.grafana-headless.schlep-engine-monitoring.svc.cluster.local:9094
    ha_listen_address = 0.0.0.0:9094
    ha_advertise_address = ${POD_NAME}.grafana-headless.schlep-engine-monitoring.svc.cluster.local:9094

  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus-service.schlep-engine-monitoring.svc.cluster.local:9090
      isDefault: true
      editable: true
      jsonData:
        httpMethod: POST
        manageAlerts: true
        prometheusType: Prometheus
        prometheusVersion: 2.45.0
        cacheLevel: 'High'
        disableRecordingRules: false
        incrementalQueryOverlapWindow: 10m

    - name: Loki
      type: loki
      access: proxy
      url: http://loki-service.schlep-engine-monitoring.svc.cluster.local:3100
      editable: true
      jsonData:
        maxLines: 1000
        derivedFields:
        - datasourceUid: Prometheus
          matcherRegex: "traceID=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"

    - name: Tempo
      type: tempo
      access: proxy
      url: http://tempo-service.schlep-engine-monitoring.svc.cluster.local:3200
      editable: true
      jsonData:
        httpMethod: GET
        tracesToLogs:
          datasourceUid: Loki
          tags: ['job', 'instance', 'pod', 'namespace']
          mappedTags: [{ key: 'service.name', value: 'service' }]
          mapTagNamesEnabled: false
          spanStartTimeShift: '1h'
          spanEndTimeShift: '1h'
          filterByTraceID: false
          filterBySpanID: false

  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: ''
      type: file
      disableDeletion: false
      updateIntervalSeconds: 10
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards

    - name: 'schlep-engine'
      orgId: 1
      folder: 'Schlep Engine'
      type: file
      disableDeletion: false
      updateIntervalSeconds: 30
      allowUiUpdates: true
      options:
        path: /var/lib/grafana/dashboards/schlep-engine

  notifiers.yaml: |
    notifiers:
    - name: slack-alerts
      type: slack
      uid: slack-alerts
      org_id: 1
      settings:
        url: "${SLACK_WEBHOOK_URL}"
        channel: "#alerts"
        username: "Grafana"
        title: "Schlep Engine Alert"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ .Annotations.description }}{{ end }}"
---
# Grafana Dashboard ConfigMaps
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-overview
  namespace: schlep-engine-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: dashboard
data:
  schlep-engine-overview.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Schlep Engine - System Overview",
        "tags": ["schlep-engine", "overview"],
        "style": "dark",
        "timezone": "UTC",
        "panels": [
          {
            "id": 1,
            "title": "API Request Rate",
            "type": "stat",
            "targets": [
              {
                "expr": "rate(http_requests_total{service=\"schlep-engine-api\"}[5m])",
                "legendFormat": "Requests/sec"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"},
                "unit": "reqps"
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "API Response Time",
            "type": "stat",
            "targets": [
              {
                "expr": "histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{service=\"schlep-engine-api\"}[5m]))",
                "legendFormat": "95th percentile"
              }
            ],
            "fieldConfig": {
              "defaults": {
                "color": {"mode": "palette-classic"},
                "unit": "s"
              }
            },
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Database Connections",
            "type": "graph",
            "targets": [
              {
                "expr": "postgres_stat_database_numbackends{service=\"postgres\"}",
                "legendFormat": "Active connections"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8}
          },
          {
            "id": 4,
            "title": "Redis Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "redis_memory_used_bytes{service=\"redis\"}",
                "legendFormat": "Memory used"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 16}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "30s"
      }
    }

  kubernetes-overview.json: |
    {
      "dashboard": {
        "id": null,
        "title": "Kubernetes - Cluster Overview",
        "tags": ["kubernetes", "infrastructure"],
        "style": "dark",
        "timezone": "UTC",
        "panels": [
          {
            "id": 1,
            "title": "Node CPU Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "100 - (avg by(instance) (irate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
                "legendFormat": "{{instance}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
          },
          {
            "id": 2,
            "title": "Node Memory Usage",
            "type": "graph",
            "targets": [
              {
                "expr": "(node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100",
                "legendFormat": "{{instance}}"
              }
            ],
            "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
          },
          {
            "id": 3,
            "title": "Pod Status",
            "type": "stat",
            "targets": [
              {
                "expr": "kube_pod_status_phase{namespace=\"schlep-engine\"}",
                "legendFormat": "{{phase}}"
              }
            ],
            "gridPos": {"h": 8, "w": 24, "x": 0, "y": 8}
          }
        ],
        "time": {"from": "now-1h", "to": "now"},
        "refresh": "30s"
      }
    }
---
# Grafana StatefulSet
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: grafana
  namespace: schlep-engine-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
spec:
  serviceName: grafana-headless
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/component: monitoring
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: monitoring
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: grafana
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
      - name: grafana
        image: grafana/grafana:10.1.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        - containerPort: 9094
          name: cluster
          protocol: TCP
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: GF_SECURITY_ADMIN_PASSWORD__FILE
          value: /etc/grafana/secrets/admin_password
        - name: GF_DATABASE_PASSWORD__FILE
          value: /etc/grafana/secrets/db_password
        - name: GF_AUTH_GITHUB_CLIENT_ID__FILE
          value: /etc/grafana/secrets/github_client_id
        - name: GF_AUTH_GITHUB_CLIENT_SECRET__FILE
          value: /etc/grafana/secrets/github_client_secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        volumeMounts:
        - name: config
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
        - name: config
          mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          subPath: datasources.yaml
        - name: config
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
          subPath: dashboards.yaml
        - name: config
          mountPath: /etc/grafana/provisioning/notifiers/notifiers.yaml
          subPath: notifiers.yaml
        - name: dashboards
          mountPath: /var/lib/grafana/dashboards
        - name: grafana-secrets
          mountPath: /etc/grafana/secrets
          readOnly: true
        - name: grafana-storage
          mountPath: /var/lib/grafana
        livenessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/health
            port: http
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 10
          failureThreshold: 15
      volumes:
      - name: config
        configMap:
          name: grafana-config
      - name: dashboards
        configMap:
          name: grafana-dashboard-overview
      - name: grafana-secrets
        secret:
          secretName: grafana-secrets
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - grafana
              topologyKey: kubernetes.io/hostname
  volumeClaimTemplates:
  - metadata:
      name: grafana-storage
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: monitoring
    spec:
      accessModes:
      - ReadWriteOnce
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 10Gi
---
# Grafana Service
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
  namespace: schlep-engine-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3000"
    prometheus.io/path: "/metrics"
spec:
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
  ports:
  - name: http
    protocol: TCP
    port: 3000
    targetPort: http
  type: ClusterIP
---
# Grafana Headless Service
apiVersion: v1
kind: Service
metadata:
  name: grafana-headless
  namespace: schlep-engine-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
spec:
  selector:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
  ports:
  - name: http
    protocol: TCP
    port: 3000
    targetPort: http
  - name: cluster
    protocol: TCP
    port: 9094
    targetPort: cluster
  clusterIP: None
---
# Grafana ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: schlep-engine-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
---
# Grafana Secrets
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: schlep-engine-monitoring
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: monitoring
type: Opaque
data:
  admin_password: "${GRAFANA_ADMIN_PASSWORD_B64}"
  secret_key: "${GRAFANA_SECRET_KEY_B64}"
  db_password: "${GRAFANA_DB_PASSWORD_B64}"
  github_client_id: "${GITHUB_CLIENT_ID_B64}"
  github_client_secret: "${GITHUB_CLIENT_SECRET_B64}"
  metrics_password: "${GRAFANA_METRICS_PASSWORD_B64}"