apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: pollarbase-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: pollarbase-secrets
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: prod/pollarbase/database-url
    - secretKey: REDIS_URL
      remoteRef:
        key: prod/pollarbase/redis-url 