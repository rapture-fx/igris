# Blue-Green Deployment Service for API
apiVersion: v1
kind: Service
metadata:
  name: api-service-blue
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
    deployment: blue
spec:
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
    deployment: blue
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8000
  - name: metrics
    protocol: TCP
    port: 9090
    targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: api-service-green
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
    deployment: green
spec:
  selector:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
    deployment: green
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8000
  - name: metrics
    protocol: TCP
    port: 9090
    targetPort: 9090
  type: ClusterIP
---
# Green Deployment for API (template)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment-green
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: v1.0.0
    deployment: green
spec:
  replicas: 0  # Initially zero, scaled up during deployment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/component: backend
      deployment: green
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: backend
        app.kubernetes.io/version: v1.0.0
        deployment: green
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: schlep-engine-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: api
        image: ghcr.io/schlep-engine/api:latest  # Updated during deployment
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        # Same environment configuration as blue deployment
        # Database configuration
        - name: DATABASE_URL
          value: "postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)"
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: POSTGRES_PASSWORD
        # Redis configuration
        - name: REDIS_URL
          value: "redis://:$(REDIS_PASSWORD)@$(REDIS_HOST):$(REDIS_PORT)/$(REDIS_DB)"
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: REDIS_PORT
        - name: REDIS_DB
          valueFrom:
            configMapKeyRef:
              name: schlep-engine-config
              key: REDIS_DB
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: REDIS_PASSWORD
        # Application secrets
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: SECRET_KEY
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: schlep-engine-secrets
              key: JWT_SECRET_KEY
        - name: DEPLOYMENT_COLOR
          value: "green"
        - name: DEPLOYMENT_VERSION
          value: "${NEW_VERSION}"
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1500m"
        livenessProbe:
          httpGet:
            path: /health
            port: http
          initialDelaySeconds: 45
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/ready
            port: http
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health/startup
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 15
        volumeMounts:
        - name: api-logs
          mountPath: /app/logs
        - name: temp-storage
          mountPath: /tmp
        - name: gcs-credentials
          mountPath: /app/credentials
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      volumes:
      - name: api-logs
        emptyDir:
          sizeLimit: 1Gi
      - name: temp-storage
        emptyDir:
          sizeLimit: 2Gi
      - name: gcs-credentials
        secret:
          secretName: schlep-engine-secrets
          items:
          - key: GCS_CREDENTIALS
            path: gcs-credentials.json
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                  - api
              topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: api
            app.kubernetes.io/component: backend
            deployment: green
---
# Frontend Blue-Green Services
apiVersion: v1
kind: Service
metadata:
  name: landing-service-blue
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: landing
    app.kubernetes.io/component: frontend
    deployment: blue
spec:
  selector:
    app.kubernetes.io/name: landing
    app.kubernetes.io/component: frontend
    deployment: blue
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: landing-service-green
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: landing
    app.kubernetes.io/component: frontend
    deployment: green
spec:
  selector:
    app.kubernetes.io/name: landing
    app.kubernetes.io/component: frontend
    deployment: green
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 3000
  type: ClusterIP
---
# Canary Deployment Configuration
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: api-canary-vs
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: canary
spec:
  hosts:
  - api.schlep-engine.com
  gateways:
  - schlep-engine-gateway
  http:
  - match:
    - headers:
        canary:
          exact: "true"
    route:
    - destination:
        host: api-service-green
        port:
          number: 80
  - match:
    - uri:
        prefix: "/api/v1/health"
    route:
    - destination:
        host: api-service-blue
        port:
          number: 80
      weight: 90
    - destination:
        host: api-service-green
        port:
          number: 80
      weight: 10
  - route:
    - destination:
        host: api-service-blue
        port:
          number: 80
      weight: 100
---
# Istio Gateway for advanced traffic management
apiVersion: networking.istio.io/v1beta1
kind: Gateway
metadata:
  name: schlep-engine-gateway
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/component: istio
spec:
  selector:
    istio: ingressgateway
  servers:
  - port:
      number: 80
      name: http
      protocol: HTTP
    hosts:
    - api.schlep-engine.com
    - schlep-engine.com
    - admin.schlep-engine.com
    - docs.schlep-engine.com
    - console.schlep-engine.com
    tls:
      httpsRedirect: true
  - port:
      number: 443
      name: https
      protocol: HTTPS
    tls:
      mode: SIMPLE
      credentialName: schlep-engine-tls
    hosts:
    - api.schlep-engine.com
    - schlep-engine.com
    - admin.schlep-engine.com
    - docs.schlep-engine.com
    - console.schlep-engine.com
---
# Deployment Validation Job
apiVersion: batch/v1
kind: Job
metadata:
  name: green-deployment-validator
  namespace: schlep-engine
  labels:
    app.kubernetes.io/name: deployment-validator
    app.kubernetes.io/component: validation
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: deployment-validator
        app.kubernetes.io/component: validation
    spec:
      restartPolicy: OnFailure
      containers:
      - name: validator
        image: curlimages/curl:latest
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Starting green deployment validation..."

          # Wait for green deployment to be ready
          echo "Waiting for green deployment to be ready..."
          for i in $(seq 1 60); do
            if curl -f -s http://api-service-green.schlep-engine.svc.cluster.local/health; then
              echo "Green deployment health check passed"
              break
            fi
            echo "Waiting for green deployment... attempt $i/60"
            sleep 10
          done

          # Run comprehensive validation tests
          echo "Running validation tests..."

          # Test basic API endpoints
          curl -f -s http://api-service-green.schlep-engine.svc.cluster.local/api/v1/health || exit 1
          echo "✓ Health endpoint test passed"

          # Test database connectivity
          curl -f -s http://api-service-green.schlep-engine.svc.cluster.local/api/v1/db/health || exit 1
          echo "✓ Database connectivity test passed"

          # Test Redis connectivity
          curl -f -s http://api-service-green.schlep-engine.svc.cluster.local/api/v1/cache/health || exit 1
          echo "✓ Redis connectivity test passed"

          # Test authentication endpoints
          curl -f -s http://api-service-green.schlep-engine.svc.cluster.local/api/v1/auth/health || exit 1
          echo "✓ Authentication service test passed"

          # Test streaming endpoints
          curl -f -s http://api-service-green.schlep-engine.svc.cluster.local/api/v1/stream/health || exit 1
          echo "✓ Streaming service test passed"

          echo "All validation tests passed! Green deployment is ready for traffic."
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      activeDeadlineSeconds: 600  # 10 minutes timeout
      backoffLimit: 2