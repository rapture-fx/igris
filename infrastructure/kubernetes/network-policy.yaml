apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: schlep-engine-network-policy
  namespace: schlep-staging
  labels:
    app: schlep-engine
    environment: staging
spec:
  podSelector:
    matchLabels:
      app: schlep-engine
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from nginx ingress controller
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector:
        matchLabels:
          app.kubernetes.io/name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8000
  # Allow ingress from monitoring (Prometheus)
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - podSelector:
        matchLabels:
          app: prometheus
    ports:
    - protocol: TCP
      port: 8000  # Metrics endpoint
  # Allow ingress within the same namespace (inter-service communication)
  - from:
    - podSelector:
        matchLabels:
          app: schlep-engine
    ports:
    - protocol: TCP
      port: 8000
  egress:
  # Allow egress to PostgreSQL
  - to:
    - podSelector:
        matchLabels:
          app: postgresql
    ports:
    - protocol: TCP
      port: 5432
  # Allow egress to Redis
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  # Allow egress to external services (HTTPS only)
  - to: []  # Any destination
    ports:
    - protocol: TCP
      port: 443
  # Allow egress for DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow egress to NTP servers
  - to: []
    ports:
    - protocol: UDP
      port: 123

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgresql-network-policy
  namespace: schlep-staging
  labels:
    app: postgresql
    environment: staging
spec:
  podSelector:
    matchLabels:
      app: postgresql
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Only allow ingress from schlep-engine backend
  - from:
    - podSelector:
        matchLabels:
          app: schlep-engine
    ports:
    - protocol: TCP
      port: 5432
  # Allow ingress from backup/maintenance pods
  - from:
    - podSelector:
        matchLabels:
          app: db-backup
    ports:
    - protocol: TCP
      port: 5432
  egress:
  # Allow egress for DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow egress to NTP servers
  - to: []
    ports:
    - protocol: UDP
      port: 123
  # Allow egress for PostgreSQL replication (if configured)
  - to:
    - podSelector:
        matchLabels:
          app: postgresql
          role: replica
    ports:
    - protocol: TCP
      port: 5432

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis-network-policy
  namespace: schlep-staging
  labels:
    app: redis
    environment: staging
spec:
  podSelector:
    matchLabels:
      app: redis
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Only allow ingress from schlep-engine backend
  - from:
    - podSelector:
        matchLabels:
          app: schlep-engine
    ports:
    - protocol: TCP
      port: 6379
  # Allow ingress from Celery workers
  - from:
    - podSelector:
        matchLabels:
          app: celery-worker
    ports:
    - protocol: TCP
      port: 6379
  egress:
  # Allow egress for DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53
  # Allow egress to NTP servers
  - to: []
    ports:
    - protocol: UDP
      port: 123

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-default
  namespace: schlep-staging
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
  # This policy denies all ingress and egress traffic by default
  # Other policies will explicitly allow required traffic

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: schlep-staging
spec:
  podSelector: {}
  policyTypes:
  - Egress
  egress:
  # Allow DNS queries to kube-dns/CoreDNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    - podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53