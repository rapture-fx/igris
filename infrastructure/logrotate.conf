# Logrotate configuration for Igris Inertial
# Place in /etc/logrotate.d/igris-inertial on production servers
#
# Purpose: Prevent log files from consuming all disk space
# Retention: 7 days of logs, compressed after rotation
# Frequency: Daily rotation at midnight

# Igris Inertial API logs
/var/log/igris-inertial/api/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 igris-inertial igris-inertial
    dateext
    dateformat -%Y-%m-%d

    postrotate
        # Signal application to reopen log file if needed
        # Or use copytruncate instead (see below)
    endscript
}

# Python ML Service logs
/var/log/igris-inertial/python-ml/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 igris-inertial igris-inertial
    dateext
    dateformat -%Y-%m-%d
}

# Nginx/Reverse Proxy logs (if used)
/var/log/igris-inertial/nginx/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        # Reload nginx to reopen log files
        [ -f /var/run/nginx.pid ] && kill -USR1 `cat /var/run/nginx.pid`
    endscript
}

# High-volume access logs (separate retention)
/var/log/igris-inertial/api/access.log {
    daily
    rotate 3
    compress
    missingok
    notifempty
    size 100M
    # Rotate if file exceeds 100MB OR daily
}

# Error logs (longer retention)
/var/log/igris-inertial/*/error.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0644 igris-inertial igris-inertial
}

# Docker container logs (alternative to Docker logging driver)
/var/lib/docker/containers/*/*-json.log {
    daily
    rotate 7
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
}
