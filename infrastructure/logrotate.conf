# Logrotate configuration for Schlep-Engine
# Place in /etc/logrotate.d/schlep-engine on production servers
#
# Purpose: Prevent log files from consuming all disk space
# Retention: 7 days of logs, compressed after rotation
# Frequency: Daily rotation at midnight

# Schlep-Engine API logs
/var/log/schlep-engine/api/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 schlep-engine schlep-engine
    dateext
    dateformat -%Y-%m-%d

    postrotate
        # Signal application to reopen log file if needed
        # Or use copytruncate instead (see below)
    endscript
}

# Python ML Service logs
/var/log/schlep-engine/python-ml/*.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    create 0644 schlep-engine schlep-engine
    dateext
    dateformat -%Y-%m-%d
}

# Nginx/Reverse Proxy logs (if used)
/var/log/schlep-engine/nginx/*.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    sharedscripts
    postrotate
        # Reload nginx to reopen log files
        [ -f /var/run/nginx.pid ] && kill -USR1 `cat /var/run/nginx.pid`
    endscript
}

# High-volume access logs (separate retention)
/var/log/schlep-engine/api/access.log {
    daily
    rotate 3
    compress
    missingok
    notifempty
    size 100M
    # Rotate if file exceeds 100MB OR daily
}

# Error logs (longer retention)
/var/log/schlep-engine/*/error.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0644 schlep-engine schlep-engine
}

# Docker container logs (alternative to Docker logging driver)
/var/lib/docker/containers/*/*-json.log {
    daily
    rotate 7
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
}
