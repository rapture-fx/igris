# ======================================================================================
# Grafana Configuration for Schlep Engine Monitoring
# Includes datasources, dashboards, and notification channels
# ======================================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: monitoring
data:
  grafana.ini: |
    [analytics]
    check_for_updates = false
    reporting_enabled = false
    
    [security]
    admin_user = admin
    cookie_secure = true
    cookie_samesite = strict
    
    [server]
    domain = grafana.schlep-engine.com
    root_url = https://grafana.schlep-engine.com
    enable_gzip = true
    
    [database]
    type = postgres
    ssl_mode = require
    
    [session]
    provider = postgres
    provider_config = user=grafana password=grafana123 host=schlep-engine-postgres.schlep-engine:5432 dbname=grafana sslmode=require
    
    [log]
    mode = console
    level = info
    
    [paths]
    data = /var/lib/grafana
    logs = /var/lib/grafana/logs
    plugins = /var/lib/grafana/plugins
    provisioning = /etc/grafana/provisioning
    
    [alerting]
    enabled = true
    execute_alerts = true
    
    [unified_alerting]
    enabled = true
    
    [feature_toggles]
    enable = ngalert prometheusAzureOverrideAudience
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      orgId: 1
      url: http://prometheus-operated:9090
      basicAuth: false
      isDefault: true
      version: 1
      editable: true
      jsonData:
        httpMethod: POST
        exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: jaeger
    
    - name: Jaeger
      type: jaeger
      access: proxy
      orgId: 1
      uid: jaeger
      url: http://jaeger-query:16686
      basicAuth: false
      isDefault: false
      version: 1
      editable: true
      jsonData:
        tracesToLogs:
          datasourceUid: loki
          tags: ['job', 'instance', 'pod', 'namespace']
          mappedTags: [{ key: 'service.name', value: 'job' }]
          mapTagNamesEnabled: false
          spanStartTimeShift: '-1h'
          spanEndTimeShift: '1h'
    
    - name: Loki
      type: loki
      access: proxy
      orgId: 1
      uid: loki
      url: http://loki:3100
      basicAuth: false
      isDefault: false
      version: 1
      editable: true
      jsonData:
        derivedFields:
        - datasourceUid: jaeger
          matcherRegex: "trace_id=(\\w+)"
          name: TraceID
          url: "$${__value.raw}"
    
    - name: Redis
      type: redis-datasource
      access: proxy
      orgId: 1
      url: redis://schlep-engine-redis.schlep-engine:6379
      basicAuth: false
      isDefault: false
      version: 1
      editable: true
      secureJsonData:
        password: ""
      jsonData:
        client: "standalone"
        poolSize: 5
        timeout: 10
        pingInterval: 0
        pipelineWindow: 0
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'default'
      orgId: 1
      folder: 'Schlep Engine'
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards
