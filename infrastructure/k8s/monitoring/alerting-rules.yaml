# ======================================================================================
# Prometheus Alerting Rules for Schlep Engine
# Comprehensive alerting for reliability patterns, circuit breakers, and system health
# ======================================================================================
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: schlep-engine-reliability-alerts
  namespace: monitoring
  labels:
    prometheus: schlep-engine
    role: alert-rules
spec:
  groups:
  # Circuit Breaker and Reliability Alerts
  - name: circuit_breaker
    interval: 30s
    rules:
    - alert: CircuitBreakerOpen
      expr: circuit_breaker_state{service=~".*"} == 2
      for: 1m
      labels:
        severity: critical
        component: circuit-breaker
      annotations:
        summary: "Circuit breaker is OPEN for {{ $labels.service }}"
        description: "Circuit breaker for service {{ $labels.service }} has been open for more than 1 minute. This indicates repeated failures and the service is degraded."
        runbook_url: "https://docs.schlep-engine.com/runbooks/circuit-breaker-open"
    
    - alert: HighFailureRate
      expr: rate(circuit_breaker_failures_total[5m]) > 0.1
      for: 2m
      labels:
        severity: warning
        component: circuit-breaker
      annotations:
        summary: "High failure rate detected for {{ $labels.circuit_name }}"
        description: "Circuit breaker {{ $labels.circuit_name }} is experiencing failure rate of {{ $value | humanizePercentage }} over the last 5 minutes."
        runbook_url: "https://docs.schlep-engine.com/runbooks/high-failure-rate"
    
    - alert: RetryAttemptsExhausted
      expr: increase(retry_attempts_total{status="failure"}[10m]) > 50
      for: 5m
      labels:
        severity: warning
        component: reliability
      annotations:
        summary: "High number of retry attempts exhausted for {{ $labels.operation }}"
        description: "Operation {{ $labels.operation }} has exhausted {{ $value }} retry attempts in the last 10 minutes."
        runbook_url: "https://docs.schlep-engine.com/runbooks/retry-exhausted"
    
    - alert: DeadLetterQueueGrowth
      expr: increase(dead_letter_queue_items_total[15m]) > 10
      for: 5m
      labels:
        severity: warning
        component: dead-letter-queue
      annotations:
        summary: "Dead letter queue growing rapidly"
        description: "{{ $value }} items have been added to the dead letter queue for {{ $labels.service }} in the last 15 minutes."
        runbook_url: "https://docs.schlep-engine.com/runbooks/dead-letter-queue"

  # Application Health Alerts
  - name: application_health
    interval: 30s
    rules:
    - alert: ServiceDown
      expr: up{job=~"schlep-engine-.*"} == 0
      for: 1m
      labels:
        severity: critical
        component: application
      annotations:
        summary: "Service {{ $labels.job }} is down"
        description: "Service {{ $labels.job }} has been down for more than 1 minute."
        runbook_url: "https://docs.schlep-engine.com/runbooks/service-down"
    
    - alert: HighErrorRate
      expr: rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
      for: 2m
      labels:
        severity: critical
        component: application
      annotations:
        summary: "High HTTP error rate on {{ $labels.instance }}"
        description: "HTTP error rate is {{ $value | humanizePercentage }} on {{ $labels.instance }} for the last 5 minutes."
        runbook_url: "https://docs.schlep-engine.com/runbooks/high-error-rate"
    
    - alert: HighResponseTime
      expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
      for: 3m
      labels:
        severity: warning
        component: performance
      annotations:
        summary: "High response time on {{ $labels.instance }}"
        description: "95th percentile response time is {{ $value }}s on {{ $labels.instance }}."
        runbook_url: "https://docs.schlep-engine.com/runbooks/high-response-time"
    
    - alert: HealthCheckFailing
      expr: service_status{service=~"database|redis"} == 0
      for: 30s
      labels:
        severity: critical
        component: health-check
      annotations:
        summary: "Health check failing for {{ $labels.service }}"
        description: "Health check for {{ $labels.service }} has been failing for more than 30 seconds."
        runbook_url: "https://docs.schlep-engine.com/runbooks/health-check-failing"
    
    - alert: DependencyHealthDegraded
      expr: dependency_health_score < 80
      for: 2m
      labels:
        severity: warning
        component: dependency
      annotations:
        summary: "Dependency health degraded for {{ $labels.service }}"
        description: "Dependency health score is {{ $value }}% for {{ $labels.service }}."
        runbook_url: "https://docs.schlep-engine.com/runbooks/dependency-degraded"

  # Database Alerts
  - name: database
    interval: 30s
    rules:
    - alert: DatabaseConnectionsHigh
      expr: pg_stat_activity_count{state="active"} > 40
      for: 5m
      labels:
        severity: warning
        component: database
      annotations:
        summary: "High number of active database connections"
        description: "{{ $value }} active connections to PostgreSQL database."
        runbook_url: "https://docs.schlep-engine.com/runbooks/db-connections-high"
    
    - alert: DatabaseSlowQueries
      expr: rate(pg_stat_statements_mean_time_seconds[5m]) > 1
      for: 3m
      labels:
        severity: warning
        component: database
      annotations:
        summary: "Database slow queries detected"
        description: "Average query time is {{ $value }}s over the last 5 minutes."
        runbook_url: "https://docs.schlep-engine.com/runbooks/db-slow-queries"
    
    - alert: DatabaseDiskSpaceHigh
      expr: pg_database_size_bytes / 1024 / 1024 / 1024 > 8
      for: 5m
      labels:
        severity: warning
        component: database
      annotations:
        summary: "Database disk space usage is high"
        description: "Database size is {{ $value | humanize }}GB."
        runbook_url: "https://docs.schlep-engine.com/runbooks/db-disk-space"

  # Redis Alerts
  - name: redis
    interval: 30s
    rules:
    - alert: RedisMemoryHigh
      expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.8
      for: 5m
      labels:
        severity: warning
        component: redis
      annotations:
        summary: "Redis memory usage is high"
        description: "Redis memory usage is {{ $value | humanizePercentage }} of maximum."
        runbook_url: "https://docs.schlep-engine.com/runbooks/redis-memory-high"
    
    - alert: RedisConnectionsHigh
      expr: redis_connected_clients > 100
      for: 5m
      labels:
        severity: warning
        component: redis
      annotations:
        summary: "High number of Redis connections"
        description: "{{ $value }} clients connected to Redis."
        runbook_url: "https://docs.schlep-engine.com/runbooks/redis-connections-high"
    
    - alert: RedisCacheHitRateLow
      expr: rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) < 0.8
      for: 5m
      labels:
        severity: warning
        component: redis
      annotations:
        summary: "Redis cache hit rate is low"
        description: "Cache hit rate is {{ $value | humanizePercentage }}."
        runbook_url: "https://docs.schlep-engine.com/runbooks/redis-cache-hit-low"

  # Infrastructure Alerts
  - name: infrastructure
    interval: 30s
    rules:
    - alert: NodeCPUHigh
      expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
      for: 5m
      labels:
        severity: warning
        component: infrastructure
      annotations:
        summary: "High CPU usage on {{ $labels.instance }}"
        description: "CPU usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}."
        runbook_url: "https://docs.schlep-engine.com/runbooks/node-cpu-high"
    
    - alert: NodeMemoryHigh
      expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes > 0.9
      for: 5m
      labels:
        severity: critical
        component: infrastructure
      annotations:
        summary: "High memory usage on {{ $labels.instance }}"
        description: "Memory usage is {{ $value | humanizePercentage }} on {{ $labels.instance }}."
        runbook_url: "https://docs.schlep-engine.com/runbooks/node-memory-high"
    
    - alert: NodeDiskSpaceHigh
      expr: (node_filesystem_size_bytes - node_filesystem_avail_bytes) / node_filesystem_size_bytes > 0.85
      for: 5m
      labels:
        severity: warning
        component: infrastructure
      annotations:
        summary: "High disk usage on {{ $labels.instance }}"
        description: "Disk usage is {{ $value | humanizePercentage }} on {{ $labels.instance }} for mount {{ $labels.mountpoint }}."
        runbook_url: "https://docs.schlep-engine.com/runbooks/node-disk-high"
    
    - alert: PodCrashLooping
      expr: rate(kube_pod_container_status_restarts_total[15m]) > 0
      for: 5m
      labels:
        severity: critical
        component: kubernetes
      annotations:
        summary: "Pod {{ $labels.pod }} is crash looping"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has restarted {{ $value }} times in the last 15 minutes."
        runbook_url: "https://docs.schlep-engine.com/runbooks/pod-crash-looping"
    
    - alert: PodNotReady
      expr: kube_pod_status_ready{condition="false"} == 1
      for: 5m
      labels:
        severity: warning
        component: kubernetes
      annotations:
        summary: "Pod {{ $labels.pod }} is not ready"
        description: "Pod {{ $labels.pod }} in namespace {{ $labels.namespace }} has been in not ready state for more than 5 minutes."
        runbook_url: "https://docs.schlep-engine.com/runbooks/pod-not-ready"

  # Streaming and Real-time Alerts
  - name: streaming
    interval: 30s
    rules:
    - alert: StreamConsumerLag
      expr: stream_consumer_lag_seconds > 60
      for: 2m
      labels:
        severity: warning
        component: streaming
      annotations:
        summary: "Stream consumer {{ $labels.consumer_name }} is lagging"
        description: "Consumer {{ $labels.consumer_name }} has {{ $value }}s lag on stream {{ $labels.stream_name }}."
        runbook_url: "https://docs.schlep-engine.com/runbooks/stream-consumer-lag"
    
    - alert: StreamErrorRateHigh
      expr: rate(stream_processing_errors_total[5m]) > 0.1
      for: 2m
      labels:
        severity: warning
        component: streaming
      annotations:
        summary: "High error rate in stream processing"
        description: "Stream {{ $labels.stream_name }} has error rate of {{ $value | humanizePercentage }}."
        runbook_url: "https://docs.schlep-engine.com/runbooks/stream-error-rate-high"
    
    - alert: BackpressureEventsHigh
      expr: increase(backpressure_events_total[10m]) > 50
      for: 5m
      labels:
        severity: warning
        component: streaming
      annotations:
        summary: "High number of backpressure events"
        description: "{{ $value }} backpressure events occurred in the last 10 minutes for consumer {{ $labels.consumer_name }}."
        runbook_url: "https://docs.schlep-engine.com/runbooks/backpressure-events-high"
    
    - alert: DuplicateMessagesHigh
      expr: increase(duplicate_messages_total[15m]) > 20
      for: 5m
      labels:
        severity: warning
        component: streaming
      annotations:
        summary: "High number of duplicate messages detected"
        description: "{{ $value }} duplicate messages detected in the last 15 minutes for stream {{ $labels.stream_name }}."
        runbook_url: "https://docs.schlep-engine.com/runbooks/duplicate-messages-high"

  # Business Logic Alerts
  - name: business_metrics
    interval: 60s
    rules:
    - alert: DataQualityScoreLow
      expr: data_quality_score < 80
      for: 10m
      labels:
        severity: warning
        component: data-quality
      annotations:
        summary: "Data quality score is low"
        description: "Data quality score is {{ $value }}% for dataset {{ $labels.dataset_id }}."
        runbook_url: "https://docs.schlep-engine.com/runbooks/data-quality-low"
    
    - alert: JobSuccessRateLow
      expr: job_success_rate_percent < 95
      for: 15m
      labels:
        severity: warning
        component: job-processing
      annotations:
        summary: "Job success rate is low"
        description: "Job success rate is {{ $value }}% for job type {{ $labels.job_type }}."
        runbook_url: "https://docs.schlep-engine.com/runbooks/job-success-rate-low"
    
    - alert: MLModelAccuracyDegraded
      expr: ml_model_accuracy_percent < 85
      for: 30m
      labels:
        severity: warning
        component: ml-model
      annotations:
        summary: "ML model accuracy has degraded"
        description: "Model {{ $labels.model_name }} accuracy is {{ $value }}%."
        runbook_url: "https://docs.schlep-engine.com/runbooks/ml-accuracy-degraded"
    
    - alert: UserEngagementDrop
      expr: rate(user_active_sessions_total[1h]) < 100
      for: 1h
      labels:
        severity: info
        component: user-engagement
      annotations:
        summary: "User engagement has dropped"
        description: "Active user sessions per hour: {{ $value }}."
        runbook_url: "https://docs.schlep-engine.com/runbooks/user-engagement-drop"

  # Security Alerts
  - name: security
    interval: 30s
    rules:
    - alert: HighAuthFailureRate
      expr: rate(auth_failures_total[5m]) > 10
      for: 2m
      labels:
        severity: warning
        component: security
      annotations:
        summary: "High authentication failure rate"
        description: "{{ $value }} authentication failures per second."
        runbook_url: "https://docs.schlep-engine.com/runbooks/auth-failure-rate-high"
    
    - alert: RateLimitHitsHigh
      expr: rate(rate_limit_hits_total[5m]) > 50
      for: 5m
      labels:
        severity: info
        component: security
      annotations:
        summary: "High rate limit hits"
        description: "{{ $value }} rate limit hits per second from {{ $labels.source_ip }}."
        runbook_url: "https://docs.schlep-engine.com/runbooks/rate-limit-hits-high"
    
    - alert: SuspiciousActivity
      expr: increase(security_events_total[1h]) > 20
      for: 5m
      labels:
        severity: critical
        component: security
      annotations:
        summary: "Suspicious security activity detected"
        description: "{{ $value }} security events in the last hour."
        runbook_url: "https://docs.schlep-engine.com/runbooks/suspicious-activity"

  # SLA and Performance Alerts  
  - name: sla_performance
    interval: 30s
    rules:
    - alert: SLABreach
      expr: |
        (
          (
            sum(rate(http_requests_total{status=~"2.."}[5m])) 
            / 
            sum(rate(http_requests_total[5m]))
          ) < 0.995
        ) or (
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.5
        )
      for: 2m
      labels:
        severity: critical
        component: sla
      annotations:
        summary: "SLA breach detected"
        description: "Service is not meeting SLA requirements. Availability: {{ $value | humanizePercentage }} or P99 latency > 500ms."
        runbook_url: "https://docs.schlep-engine.com/runbooks/sla-breach"
    
    - alert: ThroughputDrop
      expr: rate(http_requests_total[5m]) < 10
      for: 5m
      labels:
        severity: warning
        component: performance
      annotations:
        summary: "Request throughput has dropped significantly"
        description: "Request rate is {{ $value }} req/s, which is below normal levels."
        runbook_url: "https://docs.schlep-engine.com/runbooks/throughput-drop"