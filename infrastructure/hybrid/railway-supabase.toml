# Railway Configuration for Hybrid Architecture
# Schlep Engine - Railway + Supabase Setup

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[build]
builder = "NIXPACKS"

# Hybrid Environment Configuration
[env]
# Core Application
PORT = "8000"
ENVIRONMENT = "production"
LOG_LEVEL = "INFO"
APP_VERSION = "1.0.0"
HOST = "0.0.0.0"

# Domain Configuration
CORS_ORIGINS = "https://schlep-engine.com,https://admin.schlep-engine.com,https://docs.schlep-engine.com,https://api.schlep-engine.com"
ALLOWED_HOSTS = "api.schlep-engine.com,*.railway.app"

# Supabase Database Configuration
DATABASE_URL = "${{SUPABASE_DATABASE_URL}}"
SUPABASE_URL = "${{SUPABASE_PROJECT_URL}}"
SUPABASE_SERVICE_KEY = "${{SUPABASE_SERVICE_ROLE_KEY}}"
SUPABASE_ANON_KEY = "${{SUPABASE_ANON_KEY}}"
SUPABASE_JWT_SECRET = "${{SUPABASE_JWT_SECRET}}"

# Database Connection Pooling
DB_POOL_SIZE = "20"
DB_MAX_OVERFLOW = "30"
DB_POOL_TIMEOUT = "30"
DB_POOL_RECYCLE = "3600"

# Railway Redis Configuration
REDIS_URL = "${{Redis.REDIS_URL}}"
REDIS_MAX_CONNECTIONS = "30"
REDIS_RETRY_ON_TIMEOUT = "true"
REDIS_SOCKET_KEEPALIVE = "true"

# Celery Configuration (Redis-based)
CELERY_BROKER_URL = "${{Redis.REDIS_URL}}/0"
CELERY_RESULT_BACKEND = "${{Redis.REDIS_URL}}/1"
CELERY_WORKER_CONCURRENCY = "4"
CELERY_TASK_TIME_LIMIT = "600"
CELERY_TASK_SOFT_TIME_LIMIT = "540"

# ML Model Configuration
ML_MODEL_CACHE_SIZE = "2000"
ML_BATCH_SIZE = "32"
ML_MAX_PARALLEL_JOBS = "4"
ML_MEMORY_LIMIT = "6144"
ML_TIMEOUT = "300"

# TensorFlow Optimization
TENSORFLOW_INTER_OP_PARALLELISM_THREADS = "4"
TENSORFLOW_INTRA_OP_PARALLELISM_THREADS = "4"
TF_CPP_MIN_LOG_LEVEL = "2"
CUDA_VISIBLE_DEVICES = "-1"

# PyTorch Optimization
TORCH_NUM_THREADS = "4"
OMP_NUM_THREADS = "4"
MKL_NUM_THREADS = "4"

# Security Configuration
SECRET_KEY = "${{SECRET_KEY}}"
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = "30"
SESSION_COOKIE_SECURE = "true"
SESSION_COOKIE_HTTPONLY = "true"
ENABLE_SECURITY_HEADERS = "true"
FORCE_HTTPS = "true"

# File Processing
MAX_UPLOAD_SIZE = "104857600"  # 100MB
ALLOWED_FILE_TYPES = "csv,xlsx,xls,json,parquet,pdf,txt,png,jpg,jpeg"
UPLOAD_TIMEOUT = "120"

# Supabase Storage Configuration
SUPABASE_STORAGE_BUCKET = "schlep-engine-documents"
ENABLE_LOCAL_STORAGE = "false"  # Use Supabase storage instead

# Performance Optimization
WORKERS = "4"
MAX_WORKER_CONNECTIONS = "1000"
WORKER_CLASS = "uvicorn.workers.UvicornWorker"
KEEP_ALIVE = "30"
TIMEOUT = "300"
GRACEFUL_TIMEOUT = "30"

# Rate Limiting
RATE_LIMIT_ENABLED = "true"
RATE_LIMIT_REQUESTS = "1000"
RATE_LIMIT_PERIOD = "60"
RATE_LIMIT_STORAGE_URL = "${{Redis.REDIS_URL}}/2"

# Monitoring and Observability
PROMETHEUS_METRICS_ENABLED = "true"
METRICS_PORT = "9090"
SENTRY_DSN = "${{SENTRY_DSN}}"
SENTRY_ENVIRONMENT = "production"
SENTRY_TRACES_SAMPLE_RATE = "0.1"

# Feature Flags
ENABLE_ML_PROCESSING = "true"
ENABLE_DOCUMENT_EXTRACTION = "true"
ENABLE_REAL_TIME_PROCESSING = "true"
ENABLE_SUPABASE_REALTIME = "true"
ENABLE_VECTOR_SEARCH = "true"

# Memory Management
MALLOC_TRIM_THRESHOLD = "131072"
MALLOC_MMAP_THRESHOLD = "131072"
PYTHONMALLOC = "malloc"

[healthcheck]
path = "/api/v1/health/comprehensive"
timeout = "30s"
interval = "60s"
retries = 3

[resources]
# Production tier - optimized for ML workloads
cpu = "4"        # 4 vCPU for ML processing
memory = "8192"  # 8GB RAM for ML models and caching