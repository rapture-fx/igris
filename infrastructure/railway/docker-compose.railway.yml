# Railway deployment configuration for Schlep-engine
# Optimized for ML workloads with validated performance requirements

version: '3.8'

services:
  # Main API service (deployed to Railway)
  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.api
      args:
        - ENVIRONMENT=production
        - PYTHON_VERSION=3.11
    ports:
      - "${PORT:-8000}:8000"
    environment:
      # Core application
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - PORT=${PORT:-8000}
      
      # Database (Supabase)
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      
      # Redis (Railway Redis)
      - REDIS_URL=${REDIS_URL}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      
      # ML Configuration
      - ML_MODEL_CACHE_SIZE=1000
      - ML_BATCH_SIZE=32
      - TENSORFLOW_INTER_OP_PARALLELISM_THREADS=4
      - TENSORFLOW_INTRA_OP_PARALLELISM_THREADS=4
      - TF_CPP_MIN_LOG_LEVEL=2
      - TF_ENABLE_ONEDNN_OPTS=1
      
      # Performance
      - WORKERS=4
      - MAX_WORKER_CONNECTIONS=1000
      - KEEP_ALIVE=2
      - TIMEOUT=300
      - GRACEFUL_TIMEOUT=30
      
      # Security
      - SECRET_KEY=${SECRET_KEY}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      
      # File processing (from validation results)
      - MAX_UPLOAD_SIZE=104857600  # 100MB
      - ALLOWED_FILE_TYPES=csv,xlsx,xls,json,parquet
      - PROCESSING_TIMEOUT=1800    # 30 minutes
      
      # Cloud storage
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT}
      - GCS_BUCKET_NAME=${GCS_BUCKET_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_DEFAULT_REGION=${AWS_DEFAULT_REGION}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME}
      
      # Monitoring
      - SENTRY_DSN=${SENTRY_DSN}
      - PROMETHEUS_ENABLED=true
      - METRICS_ENABLED=true
      
      # Memory management for ML workloads
      - MALLOC_TRIM_THRESHOLD=131072
      - MALLOC_MMAP_THRESHOLD=131072
      - OMP_NUM_THREADS=4
      - MKL_NUM_THREADS=4
      - NUMEXPR_NUM_THREADS=4
      - VECLIB_MAXIMUM_THREADS=4
      
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/simple"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    
    deploy:
      resources:
        limits:
          memory: 8G      # Growth tier: 8GB RAM for ML processing
          cpus: '4.0'     # Growth tier: 4 vCPUs
        reservations:
          memory: 4G
          cpus: '2.0'
    
    volumes:
      - uploads:/app/uploads
      - logs:/var/log/schlep-engine
    
    restart: unless-stopped
    
    depends_on:
      - redis
      - postgres

  # Background worker for ML processing (deployed to Railway)
  worker:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile.api
    command: celery -A app.core.celery_app worker --loglevel=info --concurrency=2
    environment:
      # Inherit from api service
      - ENVIRONMENT=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - CELERY_BROKER_URL=${REDIS_URL}
      - CELERY_RESULT_BACKEND=${REDIS_URL}
      
      # Worker-specific ML configuration
      - ML_WORKER_BATCH_SIZE=16
      - ML_WORKER_TIMEOUT=3600     # 1 hour for large jobs
      - CELERY_TASK_SOFT_TIME_LIMIT=3000
      - CELERY_TASK_TIME_LIMIT=3600
      
    deploy:
      resources:
        limits:
          memory: 4G      # Dedicated worker resources
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    
    volumes:
      - uploads:/app/uploads
      - logs:/var/log/schlep-engine
    
    restart: unless-stopped
    
    depends_on:
      - redis
      - postgres

  # Redis for local development (Railway provides managed Redis)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-development}
    command: redis-server --requirepass ${REDIS_PASSWORD:-development} --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    profiles:
      - local

  # PostgreSQL for local development (Supabase used in production)
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=schlep_engine
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${DB_PASSWORD:-development}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../apps/api/sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    profiles:
      - local

  # Monitoring stack (for Railway deployment)
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-dashboard.json:/etc/grafana/provisioning/dashboards/dashboard.json
    profiles:
      - monitoring

volumes:
  uploads:
    driver: local
  logs:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  default:
    name: schlep-engine-network