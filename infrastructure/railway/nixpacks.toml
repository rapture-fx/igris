# Nixpacks configuration for Railway ML deployment
[phases.setup]
nixPkgs = ["python311", "gcc", "gfortran", "lapack", "blas", "libffi", "openssl", "pkg-config", "cairo", "pango", "gdk-pixbuf", "librsvg"]

[phases.install]
cmds = [
    "pip install --upgrade pip setuptools wheel",
    "pip install --no-cache-dir -r infrastructure/railway/requirements-railway.txt"
]

[phases.build]
cmds = [
    "python -m compileall .",
    "python -c 'import tensorflow as tf; print(tf.__version__)'",
    "python -c 'import torch; print(torch.__version__)'",
    "python -c 'import sklearn; print(sklearn.__version__)'"
]

[start]
cmd = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4 --worker-class uvicorn.workers.UvicornWorker --access-log --timeout-keep-alive 300"

[variables]
PYTHON_VERSION = "3.11"
PIP_NO_CACHE_DIR = "1"
PYTHONUNBUFFERED = "1"
PYTHONPATH = "/app"

# ML-specific optimizations
OMP_NUM_THREADS = "4"
MKL_NUM_THREADS = "4"
NUMEXPR_NUM_THREADS = "4"
VECLIB_MAXIMUM_THREADS = "4"

# TensorFlow optimizations for Railway
TF_CPP_MIN_LOG_LEVEL = "2"
TF_ENABLE_ONEDNN_OPTS = "1"