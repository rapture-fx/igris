[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 4"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[build]
builder = "NIXPACKS"

# ML-optimized environment variables for Railway
[env]
# Core Application
PORT = "8000"
ENVIRONMENT = "production"
LOG_LEVEL = "INFO"

# Database Configuration (Supabase)
# Note: Set these in Railway dashboard as secrets
# DATABASE_URL = "${{Postgres.DATABASE_URL}}"
# SUPABASE_URL = "your-supabase-project-url"
# SUPABASE_SERVICE_KEY = "your-supabase-service-key"

# Redis Configuration (Railway Redis)  
# REDIS_URL = "${{Redis.REDIS_URL}}"
# REDIS_PASSWORD = "${{Redis.REDIS_PASSWORD}}"

# ML Model Configuration
ML_MODEL_CACHE_SIZE = "1000"
ML_BATCH_SIZE = "32"
TENSORFLOW_INTER_OP_PARALLELISM_THREADS = "4"
TENSORFLOW_INTRA_OP_PARALLELISM_THREADS = "4"

# Performance Optimization
WORKERS = "4"
MAX_WORKER_CONNECTIONS = "1000"
KEEP_ALIVE = "2"
TIMEOUT = "300"  # 5 minutes for ML processing

# Security
SECRET_KEY = "change-this-in-production"
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = "30"

# File Processing
MAX_UPLOAD_SIZE = "104857600"  # 100MB
ALLOWED_FILE_TYPES = "csv,xlsx,xls,json,parquet"

# Memory Management
MALLOC_TRIM_THRESHOLD = "131072"
MALLOC_MMAP_THRESHOLD = "131072"

[healthcheck]
path = "/api/v1/health/simple"
timeout = "30s"
interval = "60s"
retries = 3

[resources]
# Starter tier - cost optimized for initial deployment
cpu = "1"        # 1 vCPU - sufficient for initial workload
memory = "2048"  # 2GB RAM - adequate for basic ML processing
# Upgrade to Growth tier (4 vCPUs, 8GB RAM) when traffic increases