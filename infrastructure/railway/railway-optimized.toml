# Railway Optimized Configuration for Schlep-engine FastAPI Backend
# Optimized for ML workloads with efficient resource allocation

[deploy]
# Optimized startup command for ML workloads
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2 --worker-class uvicorn.workers.UvicornWorker --timeout-keep-alive 30 --access-log --log-level info"

# Enhanced restart policy for ML workloads
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
restartPolicyInitialDelaySeconds = 10
restartPolicyMaxDelaySeconds = 300

# Build optimization
builder = "DOCKERFILE"
dockerfilePath = "./infrastructure/railway/Dockerfile.railway"

# Railway build configuration
[build]
builder = "DOCKERFILE"
buildCommand = "docker build -f infrastructure/railway/Dockerfile.railway -t schlep-engine-railway ."

# ML-optimized environment variables
[env]
# Core Application Configuration
PORT = "8000"
ENVIRONMENT = "production"
LOG_LEVEL = "INFO"
APP_VERSION = "1.0.0"
HOST = "0.0.0.0"

# ML Performance Optimization
WORKERS = "2"  # Optimized for 2 vCPU
MAX_WORKER_CONNECTIONS = "1000"
WORKER_CLASS = "uvicorn.workers.UvicornWorker"
KEEP_ALIVE = "30"
TIMEOUT = "300"  # 5 minutes for ML processing
GRACEFUL_TIMEOUT = "30"
MAX_REQUESTS = "1000"
MAX_REQUESTS_JITTER = "100"

# ML Model Configuration
ML_MODEL_CACHE_SIZE = "2000"
ML_BATCH_SIZE = "16"  # Optimized for 4GB RAM
ML_MAX_PARALLEL_JOBS = "2"
ML_MEMORY_LIMIT = "3072"  # 3GB out of 4GB for ML processing

# TensorFlow Optimization
TENSORFLOW_INTER_OP_PARALLELISM_THREADS = "2"
TENSORFLOW_INTRA_OP_PARALLELISM_THREADS = "2"
TF_CPP_MIN_LOG_LEVEL = "2"
CUDA_VISIBLE_DEVICES = "-1"  # Force CPU usage on Railway

# PyTorch Optimization
TORCH_NUM_THREADS = "2"
OMP_NUM_THREADS = "2"
MKL_NUM_THREADS = "2"

# Memory Management for ML workloads
MALLOC_TRIM_THRESHOLD = "131072"
MALLOC_MMAP_THRESHOLD = "131072"
PYTHONMALLOC = "malloc"
PYTHONHASHSEED = "random"

# Database Configuration
# Note: Configure these in Railway dashboard as environment variables
# DATABASE_URL = "${{Postgres.DATABASE_URL}}"
# SUPABASE_URL = "your-supabase-project-url"
# SUPABASE_SERVICE_KEY = "your-supabase-service-key"

# Redis Configuration
# REDIS_URL = "${{Redis.REDIS_URL}}"
# REDIS_PASSWORD = "${{Redis.REDIS_PASSWORD}}"

# Security Configuration
SECRET_KEY = "railway-production-secret-key-change-this"
ALGORITHM = "HS256"
ACCESS_TOKEN_EXPIRE_MINUTES = "30"
CORS_ORIGINS = "https://*.railway.app,https://yourdomain.com"
ALLOWED_HOSTS = "*.railway.app,yourdomain.com"

# File Processing Configuration
MAX_UPLOAD_SIZE = "52428800"  # 50MB - reduced for memory efficiency
ALLOWED_FILE_TYPES = "csv,xlsx,xls,json,parquet,pdf,txt"
UPLOAD_TIMEOUT = "120"  # 2 minutes

# Celery Configuration for Background Processing
CELERY_BROKER_URL = "${{Redis.REDIS_URL}}"
CELERY_RESULT_BACKEND = "${{Redis.REDIS_URL}}"
CELERY_WORKER_CONCURRENCY = "2"
CELERY_TASK_TIME_LIMIT = "600"  # 10 minutes
CELERY_TASK_SOFT_TIME_LIMIT = "540"  # 9 minutes

# Monitoring and Observability
PROMETHEUS_METRICS_ENABLED = "true"
SENTRY_DSN = ""  # Configure in Railway dashboard
SENTRY_ENVIRONMENT = "production"
SENTRY_TRACES_SAMPLE_RATE = "0.1"

# Cloud Storage Configuration
GCS_BUCKET_NAME = ""  # Configure in Railway dashboard
AWS_S3_BUCKET = ""   # Configure in Railway dashboard

# API Rate Limiting
RATE_LIMIT_REQUESTS = "100"
RATE_LIMIT_PERIOD = "60"
RATE_LIMIT_BURST = "20"

# Health Check Configuration
[healthcheck]
path = "/api/v1/health/simple"
timeout = "30s"
interval = "60s"
retries = 5
startPeriod = "60s"

# Advanced health check for ML services
[healthcheck.ml]
path = "/api/v1/health/ml"
timeout = "45s"
interval = "120s"
retries = 3

# Resource Configuration - Optimized for ML Workloads
[resources]
# Production tier optimized for ML workloads
cpu = "2"        # 2 vCPU for parallel ML processing
memory = "4096"  # 4GB RAM for ML model loading and processing

# Auto-scaling configuration
[scaling]
minReplicas = 1
maxReplicas = 3
targetCPUUtilization = 70
targetMemoryUtilization = 80

# Deployment Strategy
[deployment]
strategy = "rolling"
maxUnavailable = 0
maxSurge = 1

# Networking Configuration
[networking]
# Enable internal networking for service communication
internal = true
# Custom domains (configure in Railway dashboard)
# customDomains = ["api.yourdomain.com"]

# Monitoring Configuration
[monitoring]
# Enable detailed monitoring
enabled = true
# Custom metrics endpoints
metricsPath = "/metrics"
healthPath = "/health"

# Logging Configuration
[logging]
level = "INFO"
format = "json"
# Log retention (Railway manages this)
retentionDays = 30

# Backup Configuration
[backup]
# Database backup schedule (if using Railway Postgres)
enabled = true
schedule = "0 2 * * *"  # Daily at 2 AM UTC
retentionDays = 7

# Security Configuration
[security]
# Enable security headers
enableSecurityHeaders = true
# Force HTTPS
forceHTTPS = true
# Enable HSTS
enableHSTS = true

# Performance Optimization
[performance]
# Enable gzip compression
enableGzip = true
# Enable static file caching
enableStaticCaching = true
# Connection timeout
connectionTimeout = "30s"
# Request timeout
requestTimeout = "300s"

# Development Configuration (for staging deployments)
[dev]
# Development-specific overrides
LOG_LEVEL = "DEBUG"
WORKERS = "1"
ML_BATCH_SIZE = "8"