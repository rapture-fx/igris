version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: schlep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schlep_engine}
      POSTGRES_USER: ${POSTGRES_USER:-schlep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      - ./backups:/backups
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schlep_user} -d ${POSTGRES_DB:-schlep_engine}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - schlep-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: schlep-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - schlep-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # API Backend
  api:
    build:
      context: ../../
      dockerfile: infrastructure/hetzner/Dockerfile.api
    container_name: schlep-api
    restart: unless-stopped
    environment:
      # Core Configuration
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DEBUG: ${DEBUG:-false}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      
      # Database
      DATABASE_URL: ${DATABASE_URL}
      
      # Redis
      REDIS_URL: redis://redis:6379
      
      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      
      # Application URLs
      API_URL: ${API_URL:-https://api.schlep-engine.com}
      FRONTEND_URL: ${FRONTEND_URL:-https://schlep-engine.com}
      
      # Storage
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-100MB}
      STORAGE_PATH: /app/storage
      
      # ML Configuration
      ML_WORKERS: ${ML_WORKERS:-2}
      ENABLE_ML_PROCESSING: ${ENABLE_ML_PROCESSING:-true}
      
      # Features
      ENABLE_DOCUMENT_EXTRACTION: ${ENABLE_DOCUMENT_EXTRACTION:-true}
      ENABLE_VECTOR_SEARCH: ${ENABLE_VECTOR_SEARCH:-true}
      
      # Monitoring
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SENTRY_DSN: ${SENTRY_DSN:-}
      
      # Rate Limiting
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-1000}
      RATE_LIMIT_PERIOD: ${RATE_LIMIT_PERIOD:-60}
    
    volumes:
      - api_storage:/app/storage
      - api_logs:/app/logs
      - ./uploads:/app/uploads
    
    ports:
      - "127.0.0.1:8000:8000"
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    
    networks:
      - schlep-network
    
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Web Admin Dashboard
  web-admin:
    build:
      context: ../../
      dockerfile: infrastructure/hetzner/Dockerfile.web-admin
    container_name: schlep-web-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL:-https://api.schlep-engine.com}
      NEXT_PUBLIC_ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "127.0.0.1:3002:3000"
    networks:
      - schlep-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Web Landing Page
  web-landing:
    build:
      context: ../../
      dockerfile: infrastructure/hetzner/Dockerfile.web-landing
    container_name: schlep-web-landing
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL:-https://api.schlep-engine.com}
      NEXT_PUBLIC_ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - schlep-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Web Docs
  web-docs:
    build:
      context: ../../
      dockerfile: infrastructure/hetzner/Dockerfile.web-docs
    container_name: schlep-web-docs
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL:-https://api.schlep-engine.com}
    ports:
      - "127.0.0.1:3001:3000"
    networks:
      - schlep-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: schlep-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sites-enabled:/etc/nginx/sites-enabled:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
      - ./nginx/cache:/var/cache/nginx
    depends_on:
      - api
      - web-admin
      - web-landing
      - web-docs
    networks:
      - schlep-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Log Aggregator (Optional)
  logrotate:
    image: alpine:latest
    container_name: schlep-logrotate
    restart: unless-stopped
    volumes:
      - api_logs:/logs/api
      - nginx_logs:/logs/nginx
      - ./scripts:/scripts:ro
    command: crond -f
    networks:
      - schlep-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  api_storage:
    driver: local
  api_logs:
    driver: local
  nginx_logs:
    driver: local

networks:
  schlep-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16