# Cloudflare Pages Configuration for Igris Inertial Console
# https://developers.cloudflare.com/pages/

name = "igris-console"
compatibility_date = "2024-01-10"

# Build output directory for Cloudflare Pages
# Using @cloudflare/next-on-pages adapter
pages_build_output_dir = ".vercel/output/static"

# Production environment configuration
[env.production]
vars = { ENVIRONMENT = "production" }

# Preview/staging environment configuration
[env.preview]
vars = { ENVIRONMENT = "preview" }

# Optional: KV namespace bindings (if needed in future)
# Uncomment and configure if you need KV storage
# [[env.production.kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"

# Optional: Durable Objects bindings (if needed in future)
# [[env.production.durable_objects.bindings]]
# name = "SESSION_STORE"
# class_name = "SessionDurableObject"

# Optional: R2 bucket bindings (if needed in future)
# [[env.production.r2_buckets]]
# binding = "ASSETS"
# bucket_name = "igris-assets"
