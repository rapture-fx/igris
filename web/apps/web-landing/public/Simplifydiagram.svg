<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 320 520" role="img" aria-label="Igris Request Execute Verify diagram">
  <style>
    .box { fill: #f7f7f3; stroke: #757575; stroke-width: 1.2; rx: 18; ry: 18; }
    .text { font-family: Arial, sans-serif; font-size: 14px; fill: #111111; text-anchor: middle; dominant-baseline: middle; }
    .small { font-size: 12px; fill: #555555; }
    .arrow { stroke: #757575; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#757575" />
    </marker>
  </defs>

  <rect class="box" x="90" y="24" width="140" height="48" />
  <text class="text" x="160" y="48">Your Application</text>

  <path class="arrow" d="M160 72 L160 110" />

  <rect class="box" x="70" y="110" width="180" height="56" />
  <text class="text" x="160" y="136">Request</text>
  <text class="text small" x="160" y="154">Send one task through Igris</text>

  <path class="arrow" d="M160 166 L160 206" />

  <rect class="box" x="50" y="206" width="220" height="72" />
  <text class="text" x="160" y="230">Execute</text>
  <text class="text small" x="160" y="248">Apply boundaries and choose a path</text>
  <text class="text small" x="160" y="266">Run in hosted or local environments</text>

  <path class="arrow" d="M160 278 L160 318" />

  <rect class="box" x="56" y="318" width="208" height="72" />
  <text class="text" x="160" y="342">Record</text>
  <text class="text small" x="160" y="360">Capture execution events</text>
  <text class="text small" x="160" y="378">Return signed records and receipts</text>

  <path class="arrow" d="M160 390 L160 430" />

  <rect class="box" x="70" y="430" width="180" height="56" />
  <text class="text" x="160" y="456">Verify</text>
  <text class="text small" x="160" y="474">Inspect metadata and receipt hashes</text>
</svg>
