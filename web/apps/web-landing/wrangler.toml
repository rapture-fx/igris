name = "schlep-engine-landing"
compatibility_date = "2024-09-01"
# Enable Node.js compatibility for Next.js
compatibility_flags = ["nodejs_compat"]

# Output directory for @cloudflare/next-on-pages
# Build with: pnpm pages:build
# Deploy with: wrangler pages deploy .vercel/output/static
pages_build_output_dir = ".vercel/output/static"

# D1 Database binding for early access signups
# Create database with: wrangler d1 create schlep-signups
# Run migrations with: wrangler d1 migrations apply schlep-signups
[[d1_databases]]
binding = "DB"
database_name = "schlep-signups"
database_id = "preview_id" # Replace with actual database ID after creation

# Production environment configuration
[env.production]
# Production D1 database - Update with your actual D1 database ID
# Create with: wrangler d1 create schlep-signups
# [[env.production.d1_databases]]
# binding = "DB"
# database_name = "schlep-signups"
# database_id = "your-production-database-id"