syntax = "proto3";

package ml;

option go_package = "github.com/schlep-engine/schlep-engine/proto/ml";

// Core ML prediction service
service MLService {
    // Single prediction request
    rpc Predict(PredictRequest) returns (PredictResponse);

    // Batch prediction for multiple inputs
    rpc BatchPredict(BatchPredictRequest) returns (BatchPredictResponse);

    // Health check for the ML service
    rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

    // Get model metadata and capabilities
    rpc GetModelInfo(ModelInfoRequest) returns (ModelInfoResponse);

    // Model management operations
    rpc LoadModel(LoadModelRequest) returns (LoadModelResponse);
    rpc UnloadModel(UnloadModelRequest) returns (UnloadModelResponse);
}

// Request messages
message PredictRequest {
    string model_id = 1;
    repeated double features = 2;
    map<string, string> metadata = 3;
    int32 timeout_ms = 4;
}

message BatchPredictRequest {
    string model_id = 1;
    repeated FeatureSet feature_sets = 2;
    map<string, string> metadata = 3;
    int32 timeout_ms = 4;
}

message FeatureSet {
    repeated double features = 1;
    string identifier = 2;
}

message HealthCheckRequest {
    bool detailed = 1;
}

message ModelInfoRequest {
    string model_id = 1;
}

message LoadModelRequest {
    string model_id = 1;
    string model_path = 2;
    map<string, string> config = 3;
}

message UnloadModelRequest {
    string model_id = 1;
}

// Response messages
message PredictResponse {
    double prediction = 1;
    double confidence = 2;
    string model_id = 3;
    int64 latency_ms = 4;
    map<string, double> probabilities = 5;
    string error = 6;
}

message BatchPredictResponse {
    repeated PredictResponse predictions = 1;
    int64 total_latency_ms = 2;
    int32 success_count = 3;
    int32 error_count = 4;
}

message HealthCheckResponse {
    string status = 1;
    int64 uptime_seconds = 2;
    int32 loaded_models_count = 3;
    repeated string loaded_models = 4;
    map<string, string> system_metrics = 5;
}

message ModelInfoResponse {
    string model_id = 1;
    string model_type = 2;
    string version = 3;
    repeated string input_features = 4;
    repeated string output_classes = 5;
    map<string, string> metadata = 6;
    bool loaded = 7;
}

message LoadModelResponse {
    bool success = 1;
    string message = 2;
    int64 load_time_ms = 3;
}

message UnloadModelResponse {
    bool success = 1;
    string message = 2;
}
