# Schlep Engine Monorepo Configuration
[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schlep-engine"
version = "0.1.0"
description = "AI-powered data processing and optimization platform"
authors = [
    {name = "Schlep Engine Team", email = "dev@schlepengine.com"},
]
license = {text = "MIT"}
requires-python = ">=3.9"

# Monorepo workspace configuration
[tool.setuptools.packages.find]
where = ["apps", "packages"]

# Testing configuration for monorepo
[tool.pytest.ini_options]
testpaths = [
    "apps/api/tests",
    "packages/cli/tests", 
    "packages/python-sdk/tests",
    "tests"
]
python_paths = [
    "apps/api",
    "packages/cli/src",
    "packages/python-sdk/src"
]
addopts = [
    "-v",
    "--tb=short",
    "--strict-config",
    "--strict-markers",
    "--disable-warnings",
    "--cov=app",
    "--cov=packages",
    "--cov-report=html:coverage_html",
    "--cov-report=term-missing"
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow running tests"
]
env_files = [
    ".env.test"
]
# Async test configuration
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"

# Coverage configuration
[tool.coverage.run]
source = ["apps/api/app", "packages"]
omit = [
    "*/tests/*",
    "*/venv/*",
    "*/__pycache__/*",
    "*/migrations/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError"
]

# Black code formatting
[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort import sorting
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# MyPy type checking
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true