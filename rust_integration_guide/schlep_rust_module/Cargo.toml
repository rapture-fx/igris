[package]
name = "schlep-rust-module"
version = "0.1.0"
edition = "2021"

[lib]
name = "schlep_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
numpy = "0.20"
rayon = "1.8"  # For parallel processing
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.polars]
version = "0.35"
features = ["lazy", "json", "csv-file", "temporal"]

[build-dependencies]
pyo3-build-config = "0.20"
csv = "1.3"