# Redis Configuration for Real-Time Streaming
# Optimized for Redis Streams workloads

# Basic configuration
port 6379
bind 0.0.0.0
protected-mode no
daemonize no
requirepass ${REDIS_PASSWORD}

# Memory management - optimized for streaming
maxmemory 1gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence - balanced for streams
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF for data durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# Network and connection settings
tcp-keepalive 300
tcp-backlog 511
timeout 300
tcp-keepalive 300

# Client connection limits
maxclients 10000

# Performance optimizations for streams
# Increase the number of databases for stream isolation
databases 16

# Stream-specific optimizations
stream-node-max-bytes 4096
stream-node-max-entries 100

# Slow log for performance monitoring
slowlog-log-slower-than 10000
slowlog-max-len 128

# Latency monitoring
latency-monitor-threshold 100

# Client output buffer limits - increased for stream consumers
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Hash and List optimizations that may affect streams
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog sparse representation
hll-sparse-max-bytes 3000

# Streams configuration
# Maximum length for streams before trimming (0 = unlimited)
stream-max-length 0

# Replica configuration (if using replication)
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-ping-replica-period 10
repl-timeout 60
repl-disable-tcp-nodelay no
replica-priority 100

# Security
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command KEYS ""
rename-command CONFIG "CONFIG_9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d"
rename-command SHUTDOWN "SHUTDOWN_1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d"
rename-command DEBUG ""
rename-command EVAL ""
rename-command SCRIPT ""

# Logging
loglevel notice
logfile ""
syslog-enabled no

# Disable potentially dangerous commands
rename-command DEL "DEL_DISABLED"

# Stream processing optimizations
# Enable keyspace notifications for stream events (optional)
notify-keyspace-events "Ex"

# Memory allocation
jemalloc-bg-thread yes

# TLS Configuration (uncomment and configure if using TLS)
# tls-port 6380
# port 0
# tls-cert-file /path/to/redis.crt
# tls-key-file /path/to/redis.key
# tls-ca-cert-file /path/to/ca.crt
# tls-protocols "TLSv1.2 TLSv1.3"