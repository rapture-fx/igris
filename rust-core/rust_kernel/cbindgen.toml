# cbindgen configuration for optimizer FFI exports
# Generates C header file for Go cgo integration

language = "C"
style = "both"

# Header
header = """/* Auto-generated FFI bindings for Rust Optimizer */
/* Generated by cbindgen - DO NOT EDIT */

#ifndef IGRIS_OPTIMIZER_H
#define IGRIS_OPTIMIZER_H

#include <stdint.h>
#include <stdbool.h>

#ifdef __cplusplus
extern "C" {
#endif
"""

# Trailer
trailer = """
#ifdef __cplusplus
}
#endif

#endif /* IGRIS_OPTIMIZER_H */
"""

# Include only optimizer FFI exports
include_guard = "IGRIS_OPTIMIZER_H"
autogen_warning = "/* Warning, this file is autogenerated by cbindgen. Don't modify this manually. */"
include_version = true
namespace = "optimizer"
sys_includes = ["stdint.h", "stdbool.h"]

# Structure configuration
[struct]
rename_fields = "ScreamingSnakeCase"

# Enum configuration
[enum]
rename_variants = "ScreamingSnakeCase"

# Export configuration
[export]
include = ["OptimizerHandle"]
exclude = []
prefix = "Optimizer"

# Parse configuration
[parse]
parse_deps = false
include = ["igris_kernel"]
extra_bindings = []

[parse.expand]
crates = ["igris_kernel"]
all_features = false
default_features = true
