[package]
name = "schlep-kernel"
version = "0.1.0"
edition = "2021"
authors = ["Schlep-Engine Team"]
description = "Minimal Rust kernel for Go FFI prototype"

[lib]
name = "schlep_kernel"
crate-type = ["cdylib", "staticlib"]  # Both for compatibility

[dependencies]
# Core inference dependencies (Phase 10 cleanup)
chrono = { version = "0.4.42", features = ["serde"] }
libc = "0.2"
serde_json = "1.0.145"
serde = { version = "1.0", features = ["derive"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
hashbrown = "0.16"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

# Phase 6: Memory pooling and caching
bytes = "1.5"
crossbeam = "0.8"
dashmap = "5.5"
lru = "0.12"

# Phase 7: Parallel processing
rayon = "1.8"
num_cpus = "1.16"

# FFI Safety and Runtime dependencies
lazy_static = "1.4"
parking_lot = "0.12"
log = "0.4"
tokio = { version = "1.0", features = ["rt", "sync", "time", "macros", "rt-multi-thread"] }
once_cell = "1.18"
thiserror = "1.0"
async-trait = "0.1"
tonic = "0.9"

# Phase 4: OpenTelemetry distributed tracing
opentelemetry = { version = "0.21", features = ["trace"] }
opentelemetry_sdk = { version = "0.21", features = ["trace", "rt-tokio"] }
opentelemetry-jaeger = { version = "0.20", features = ["rt-tokio", "collector_client", "reqwest_collector_client"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.22"

# REMOVED deprecated data processing deps:
# csv = "1.3" - not used in inference pipeline
# polars = "0.51.0" - removed with data_normalizer
# arrow = "56.2.0" - removed with data_normalizer
# parquet = "56.2.0" - removed with data_normalizer
# avro-rs = "0.13.0" - removed with data_normalizer
# tokio = "1.47" - reserved for future async FFI (Phase 11)

[dev-dependencies]
tokio-test = "0.4"  # Testing utilities for async code

[profile.release]
lto = true              # Link-time optimization
codegen-units = 1       # Single codegen unit for better optimization
panic = "abort"         # Smaller binaries
opt-level = 3           # Maximum optimization
strip = true            # Strip symbols for smaller binary
