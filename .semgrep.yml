# Semgrep Configuration for Schlep-engine Security Scanning
# Custom security rules for Python/FastAPI and TypeScript/React applications

rules:
  - id: hardcoded-secret
    pattern-either:
      - pattern: $X = "sk-..."
      - pattern: $X = "AKIA..."
      - pattern: $X = "-----BEGIN PRIVATE KEY-----"
      - pattern: password = "..."
      - pattern: secret = "..."
      - pattern: token = "..."
    message: Potential hardcoded secret detected
    languages: [python, javascript, typescript]
    severity: ERROR

  - id: sql-injection-risk
    pattern-either:
      - pattern: execute($X + $Y)
      - pattern: execute(f"... {$VAR} ...")
      - pattern: execute("... " + $VAR + " ...")
    message: Potential SQL injection vulnerability
    languages: [python]
    severity: ERROR

  - id: unsafe-eval
    pattern-either:
      - pattern: eval(...)
      - pattern: exec(...)
      - pattern: __import__(...)
    message: Unsafe code execution detected
    languages: [python]
    severity: ERROR

  - id: debug-mode-enabled
    pattern-either:
      - pattern: DEBUG = True
      - pattern: debug=True
    message: Debug mode should not be enabled in production
    languages: [python]
    severity: WARNING

  - id: insecure-random
    pattern-either:
      - pattern: random.random()
      - pattern: random.randint(...)
      - pattern: Math.random()
    message: Use cryptographically secure random number generator
    languages: [python, javascript, typescript]
    severity: WARNING

  - id: missing-csrf-protection
    pattern: @app.route(...)
    pattern-not-inside: |
      @csrf.exempt
      @require_csrf_token
    message: Missing CSRF protection on route
    languages: [python]
    severity: WARNING

  - id: unsafe-yaml-load
    pattern: yaml.load(...)
    message: Use yaml.safe_load() to prevent code execution
    languages: [python]
    severity: ERROR

  - id: pickle-deserialization
    pattern-either:
      - pattern: pickle.load(...)
      - pattern: pickle.loads(...)
      - pattern: cPickle.load(...)
    message: Pickle deserialization can lead to code execution
    languages: [python]
    severity: ERROR

  - id: weak-hash-algorithm
    pattern-either:
      - pattern: hashlib.md5(...)
      - pattern: hashlib.sha1(...)
    message: Use stronger hash algorithms like SHA-256 or bcrypt
    languages: [python]
    severity: WARNING

  - id: insecure-request
    pattern-either:
      - pattern: requests.get(..., verify=False)
      - pattern: requests.post(..., verify=False)
      - pattern: urllib.request.urlopen("http://...")
    message: Insecure HTTP request or disabled SSL verification
    languages: [python]
    severity: ERROR

  - id: dangerous-shell-command
    pattern-either:
      - pattern: subprocess.call(..., shell=True)
      - pattern: os.system(...)
      - pattern: subprocess.run(..., shell=True)
    message: Dangerous shell command execution
    languages: [python]
    severity: ERROR

  - id: reflected-xss-risk
    pattern-either:
      - pattern: innerHTML = $USER_INPUT
      - pattern: document.write($USER_INPUT)
      - pattern: eval($USER_INPUT)
    message: Potential XSS vulnerability from user input
    languages: [javascript, typescript]
    severity: ERROR

  - id: unsafe-regex
    pattern: re.compile(r".*\*.*\*.*")
    message: Potentially unsafe regex that could cause ReDoS
    languages: [python]
    severity: WARNING

  - id: missing-content-type-validation
    pattern: |
      @app.route(...)
      def $FUNC(...):
        ...
    pattern-not-inside: |
      content_type = request.headers.get('content-type')
    message: Missing content-type validation in API endpoint
    languages: [python]
    severity: INFO

  - id: jwt-none-algorithm
    pattern-either:
      - pattern: jwt.decode(..., algorithms=["none"])
      - pattern: jwt.decode(..., verify=False)
    message: JWT verification disabled or using 'none' algorithm
    languages: [python]
    severity: ERROR

  - id: cors-wildcard
    pattern-either:
      - pattern: Access-Control-Allow-Origin = "*"
      - pattern: cors(origin="*")
    message: CORS wildcard origin allows any domain
    languages: [python, javascript, typescript]
    severity: WARNING