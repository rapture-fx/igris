[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name is igris-sdk (not the unrelated public PyPI package named
# "igris"). The import package remains `igris`. Do not `pip install igris`
# from the public index for this SDK until publication is explicitly authorized.
name = "igris-sdk"
version = "0.1.0a2"
description = "Igris is a drop-in action layer for consequential AI-agent actions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "cryptography>=42.0",
]
keywords = ["ai-agents", "approval", "audit", "evidence", "guardrails", "durable-actions"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.scripts]
igris = "igris.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "tomli>=2.0; python_version < '3.11'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/igris"]

[tool.hatch.build.targets.sdist]
include = [
    "src/igris",
    "docs/evidence-privacy.md",
    "docs/wrapping-existing-tools.md",
    "docs/durable-action-quickstart.md",
    "README.md",
    "LICENSE",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "S", "RUF"]
ignore = [
    "S101", # assert use is fine in this codebase's tests and invariants
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B011"]
"examples/*" = ["S"]
