---
# Litmus Chaos Engineering Operator Installation
apiVersion: v1
kind: Namespace
metadata:
  name: litmus
  labels:
    app.kubernetes.io/name: litmus
    name: litmus
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litmus
  namespace: litmus
  labels:
    app.kubernetes.io/name: litmus
    app.kubernetes.io/instance: litmus
    app.kubernetes.io/version: "3.9.0"
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: litmus
    name: litmus
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: litmus
  labels:
    app.kubernetes.io/name: litmus
    app.kubernetes.io/instance: litmus
    app.kubernetes.io/version: "3.9.0"
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: litmus
    name: litmus
rules:
  # Chaos operator rules
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "persistentvolumeclaims", "events", "configmaps", "secrets", "nodes", "namespaces"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec", "pods/log", "pods/eviction"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "daemonsets", "replicasets", "statefulsets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["litmuschaos.io"]
    resources: ["*"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: litmus
  labels:
    app.kubernetes.io/name: litmus
    app.kubernetes.io/instance: litmus
    app.kubernetes.io/version: "3.9.0"
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: litmus
    name: litmus
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: litmus
subjects:
- kind: ServiceAccount
  name: litmus
  namespace: litmus
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chaos-operator
  namespace: litmus
  labels:
    app.kubernetes.io/name: litmus
    app.kubernetes.io/instance: litmus
    app.kubernetes.io/version: "3.9.0"
    app.kubernetes.io/component: operator
    app.kubernetes.io/part-of: litmus
spec:
  replicas: 1
  selector:
    matchLabels:
      name: chaos-operator
  template:
    metadata:
      labels:
        name: chaos-operator
        app.kubernetes.io/name: litmus
        app.kubernetes.io/instance: litmus
        app.kubernetes.io/version: "3.9.0"
        app.kubernetes.io/component: operator
        app.kubernetes.io/part-of: litmus
    spec:
      serviceAccountName: litmus
      containers:
        - name: chaos-operator
          image: litmuschaos/chaos-operator:3.9.0
          command:
          - chaos-operator
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            runAsUser: 2000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: CHAOS_RUNNER_IMAGE
              value: "litmuschaos/chaos-runner:3.9.0"
            - name: WATCH_NAMESPACE
              value: ""
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: OPERATOR_NAME
              value: "chaos-operator"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            limits:
              cpu: 125m
              memory: 300Mi
            requests:
              cpu: 125m
              memory: 300Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: chaos-experiments
  namespace: litmus
  labels:
    app.kubernetes.io/name: litmus
    app.kubernetes.io/instance: litmus
data:
  experiments.yaml: |
    - name: pod-delete
      description: "Deletes a pod belonging to a deployment/statefulset/daemonset"
      spec:
        image: litmuschaos/go-runner:3.9.0
        args:
          - -c
          - ./experiments -name pod-delete
    - name: container-kill
      description: "Kill one container in the application pod"
      spec:
        image: litmuschaos/go-runner:3.9.0
        args:
          - -c
          - ./experiments -name container-kill
    - name: pod-network-latency
      description: "Inject network latency into application pod"
      spec:
        image: litmuschaos/go-runner:3.9.0
        args:
          - -c
          - ./experiments -name pod-network-latency
    - name: pod-network-loss
      description: "Inject network loss into application pod"
      spec:
        image: litmuschaos/go-runner:3.9.0
        args:
          - -c
          - ./experiments -name pod-network-loss
    - name: pod-cpu-hog
      description: "Consume CPU resources on the application container"
      spec:
        image: litmuschaos/go-runner:3.9.0
        args:
          - -c
          - ./experiments -name pod-cpu-hog
    - name: pod-memory-hog
      description: "Consume memory resources on the application container"
      spec:
        image: litmuschaos/go-runner:3.9.0
        args:
          - -c
          - ./experiments -name pod-memory-hog