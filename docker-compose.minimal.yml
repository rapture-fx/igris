version: '3.8'

# MINIMAL CONFIGURATION FOR 1GB VPS
# WARNING: For testing/development ONLY - NOT for production
# Monitoring stack disabled, memory limits enforced

services:
  # PostgreSQL with strict memory limits
  postgres:
    image: postgres:15-alpine
    container_name: schlep-postgres-minimal
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-igris_overture}
      POSTGRES_USER: ${POSTGRES_USER:-schlep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      # Limit PostgreSQL memory
      POSTGRES_INITDB_ARGS: "-c shared_buffers=128MB -c effective_cache_size=256MB"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c max_connections=20
      -c work_mem=4MB
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schlep_user}"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - schlep-network

  # Redis (standard) instead of Dragonfly - much lower memory
  cache:
    image: redis:7-alpine
    container_name: schlep-redis-minimal
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - schlep-network

  # Schlep-Engine API with strict limits
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: igris-overture-minimal
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      # Server Configuration
      PORT: 8080
      HOST: 0.0.0.0
      ENV: development

      # Database Configuration (minimal connections)
      DATABASE_URL: postgres://${POSTGRES_USER:-schlep_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-igris_overture}?sslmode=disable
      ENABLE_PERSISTENCE: "true"
      DB_MAX_OPEN_CONNS: 10
      DB_MAX_IDLE_CONNS: 2

      # Redis Cache Configuration
      USE_REDIS: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@cache:6379/0

      # Multi-Tenancy (simplified)
      ENABLE_MULTI_TENANCY: "false"
      REQUIRE_AUTH_FOR_INFERENCE: "false"
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret}

      # Provider Configuration
      PROVIDER_MODE: ${PROVIDER_MODE:-benchmark}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Safety Configuration (strict limits)
      MAX_MONTHLY_COST_USD: "10.00"
      MAX_TOKENS_PER_REQUEST: "1024"
      ENABLE_BUDGET_LIMIT: "true"
      ENABLE_TOKEN_LIMIT: "true"

      # State Persistence (disabled for memory)
      USE_PG_OPTIMIZER_STATE: "false"
      USE_DISTRIBUTED_LOCK: "false"

      # Observability (minimal)
      METRICS_ENABLED: "false"
      TRACING_ENABLED: "false"
      LOG_LEVEL: "warn"
      LOG_FORMAT: "json"

    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 384M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 60s
      timeout: 10s
      retries: 2
      start_period: 40s
    networks:
      - schlep-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  schlep-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
