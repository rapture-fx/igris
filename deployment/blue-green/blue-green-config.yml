# Schlep-engine Blue-Green Deployment Configuration
# Zero-downtime deployment pipeline with automated rollback

# =====================================
# GLOBAL CONFIGURATION
# =====================================

global:
  deployment_strategy: "blue_green"
  health_check_timeout: 300  # 5 minutes
  traffic_switch_delay: 60   # 1 minute verification period
  rollback_timeout: 180      # 3 minutes
  monitoring_window: 900     # 15 minutes post-deployment monitoring
  environments: ["staging", "production"]
  notification_channels: ["slack-deployments", "email-devops"]

# =====================================
# ENVIRONMENT CONFIGURATIONS
# =====================================

environments:
  staging:
    cluster: "schlep-engine-staging-cluster"
    namespace: "schlep-engine-staging"
    ingress_class: "nginx"
    domain: "staging.schlep-engine.com"
    load_balancer_timeout: 60
    health_check_path: "/health"
    health_check_interval: 10
    replica_count: 2
    resource_limits:
      cpu: "500m"
      memory: "1Gi"
    auto_rollback: true
    approval_required: false

  production:
    cluster: "schlep-engine-prod-cluster"
    namespace: "schlep-engine"
    ingress_class: "nginx"
    domain: "api.schlep-engine.com"
    load_balancer_timeout: 120
    health_check_path: "/health"
    health_check_interval: 5
    replica_count: 3
    resource_limits:
      cpu: "1000m"
      memory: "2Gi"
    auto_rollback: true
    approval_required: true
    approvers: ["devops-lead", "engineering-manager"]

# =====================================
# APPLICATION CONFIGURATIONS
# =====================================

applications:
  api:
    name: "schlep-engine-api"
    port: 8000
    health_check_path: "/health"
    readiness_check_path: "/health/ready"
    startup_check_path: "/health/startup"
    graceful_shutdown_timeout: 30
    environment_variables:
      - name: "DATABASE_URL"
        secret: "database-credentials"
        key: "url"
      - name: "REDIS_URL"
        secret: "redis-credentials"
        key: "url"
      - name: "JWT_SECRET_KEY"
        secret: "jwt-keys"
        key: "secret"
    volumes:
      - name: "config"
        configMap: "api-config"
        mountPath: "/app/config"
    dependencies:
      - "database"
      - "redis"
    smoke_tests:
      - endpoint: "/health"
        expected_status: 200
      - endpoint: "/api/v1/health"
        expected_status: 200
      - endpoint: "/api/v1/auth/providers"
        expected_status: 200

  web-admin:
    name: "schlep-engine-web-admin"
    port: 3000
    health_check_path: "/api/health"
    readiness_check_path: "/api/health"
    startup_check_path: "/api/health"
    graceful_shutdown_timeout: 15
    environment_variables:
      - name: "NEXT_PUBLIC_API_URL"
        value: "https://api.schlep-engine.com"
      - name: "NEXTAUTH_SECRET"
        secret: "nextauth-secret"
        key: "secret"
    dependencies:
      - "api"
    smoke_tests:
      - endpoint: "/api/health"
        expected_status: 200
      - endpoint: "/"
        expected_status: 200

  web-landing:
    name: "schlep-engine-web-landing"
    port: 3001
    health_check_path: "/api/health"
    readiness_check_path: "/api/health"
    startup_check_path: "/api/health"
    graceful_shutdown_timeout: 15
    environment_variables:
      - name: "NEXT_PUBLIC_API_URL"
        value: "https://api.schlep-engine.com"
    dependencies: []
    smoke_tests:
      - endpoint: "/api/health"
        expected_status: 200
      - endpoint: "/"
        expected_status: 200

# =====================================
# DEPLOYMENT PHASES
# =====================================

deployment_phases:
  pre_deployment:
    name: "Pre-deployment Validation"
    timeout: 300
    steps:
      - name: "validate_configuration"
        type: "validation"
        action: "validate_k8s_manifests"
      - name: "check_dependencies"
        type: "validation"
        action: "verify_dependencies"
      - name: "backup_current_state"
        type: "backup"
        action: "create_deployment_snapshot"
      - name: "notify_start"
        type: "notification"
        action: "send_deployment_start_notification"

  green_deployment:
    name: "Green Environment Deployment"
    timeout: 600
    steps:
      - name: "deploy_green_infrastructure"
        type: "deployment"
        action: "create_green_environment"
      - name: "deploy_applications"
        type: "deployment"
        action: "deploy_to_green"
      - name: "wait_for_readiness"
        type: "health_check"
        action: "wait_for_green_ready"
        timeout: 300
      - name: "run_smoke_tests"
        type: "testing"
        action: "execute_smoke_tests"
      - name: "run_integration_tests"
        type: "testing"
        action: "execute_integration_tests"

  traffic_switching:
    name: "Traffic Switching"
    timeout: 300
    steps:
      - name: "canary_traffic"
        type: "traffic_management"
        action: "route_canary_traffic"
        percentage: 10
        duration: 60
      - name: "validate_canary"
        type: "validation"
        action: "monitor_canary_metrics"
      - name: "gradual_switch"
        type: "traffic_management"
        action: "gradual_traffic_switch"
        percentages: [25, 50, 75, 100]
        interval: 30
      - name: "validate_full_switch"
        type: "validation"
        action: "validate_production_traffic"

  post_deployment:
    name: "Post-deployment Validation"
    timeout: 900
    steps:
      - name: "monitor_metrics"
        type: "monitoring"
        action: "monitor_application_metrics"
        duration: 300
      - name: "validate_business_metrics"
        type: "validation"
        action: "check_business_kpis"
      - name: "cleanup_blue"
        type: "cleanup"
        action: "cleanup_blue_environment"
        delay: 600  # Wait 10 minutes before cleanup
      - name: "notify_success"
        type: "notification"
        action: "send_deployment_success_notification"

# =====================================
# ROLLBACK CONFIGURATION
# =====================================

rollback:
  triggers:
    - name: "health_check_failure"
      condition: "health_check_success_rate < 0.95"
      check_interval: 30
      failure_threshold: 3
    - name: "error_rate_spike"
      condition: "error_rate > 0.05"
      check_interval: 30
      failure_threshold: 2
    - name: "response_time_degradation"
      condition: "response_time_p95 > baseline_p95 * 1.5"
      check_interval: 60
      failure_threshold: 3
    - name: "business_metric_drop"
      condition: "conversion_rate < baseline_conversion * 0.8"
      check_interval: 120
      failure_threshold: 2

  strategy:
    type: "immediate"
    steps:
      - name: "stop_traffic_switch"
        action: "halt_traffic_migration"
      - name: "revert_traffic"
        action: "route_traffic_to_blue"
        timeout: 60
      - name: "validate_rollback"
        action: "verify_blue_health"
        timeout: 120
      - name: "cleanup_failed_green"
        action: "remove_green_environment"
        delay: 300
      - name: "notify_rollback"
        action: "send_rollback_notification"

# =====================================
# MONITORING AND METRICS
# =====================================

monitoring:
  metrics:
    deployment_metrics:
      - name: "deployment_duration"
        type: "histogram"
        labels: ["environment", "application", "phase"]
      - name: "deployment_success_rate"
        type: "gauge"
        labels: ["environment", "application"]
      - name: "rollback_count"
        type: "counter"
        labels: ["environment", "application", "trigger"]

    application_metrics:
      - name: "health_check_success_rate"
        type: "gauge"
        labels: ["environment", "application", "endpoint"]
      - name: "response_time_p95"
        type: "gauge"
        labels: ["environment", "application", "endpoint"]
      - name: "error_rate"
        type: "gauge"
        labels: ["environment", "application"]

    business_metrics:
      - name: "conversion_rate"
        type: "gauge"
        labels: ["environment"]
      - name: "user_session_count"
        type: "gauge"
        labels: ["environment"]
      - name: "api_requests_per_minute"
        type: "gauge"
        labels: ["environment"]

  alerts:
    - name: "DeploymentFailed"
      condition: "deployment_success_rate < 1"
      for: "1m"
      severity: "critical"
    - name: "RollbackTriggered"
      condition: "increase(rollback_count[5m]) > 0"
      for: "0m"
      severity: "high"
    - name: "HealthCheckFailing"
      condition: "health_check_success_rate < 0.95"
      for: "2m"
      severity: "high"

# =====================================
# TRAFFIC MANAGEMENT
# =====================================

traffic_management:
  load_balancer:
    type: "nginx_ingress"
    annotations:
      nginx.ingress.kubernetes.io/canary: "true"
      nginx.ingress.kubernetes.io/canary-weight: "0"
      nginx.ingress.kubernetes.io/canary-by-header: "X-Canary"
      nginx.ingress.kubernetes.io/canary-by-header-value: "true"

  routing_rules:
    canary:
      header_based:
        header: "X-Canary"
        value: "true"
      weight_based:
        initial_weight: 0
        increments: [10, 25, 50, 75, 100]
        increment_interval: 30

    blue_green:
      selector_labels:
        blue: "version=blue"
        green: "version=green"
      service_names:
        blue: "{app-name}-blue"
        green: "{app-name}-green"

# =====================================
# SECURITY AND COMPLIANCE
# =====================================

security:
  image_scanning:
    enabled: true
    severity_threshold: "HIGH"
    policy_bundle: "schlep-engine-security-policy"

  network_policies:
    enabled: true
    ingress_rules:
      - from_namespaces: ["istio-system", "ingress-nginx"]
      - from_pods: ["monitoring"]
    egress_rules:
      - to_namespaces: ["kube-system"]
      - to_external: ["database", "redis", "vault"]

  rbac:
    service_account: "blue-green-deployer"
    permissions:
      - resources: ["deployments", "services", "ingresses"]
        verbs: ["get", "list", "create", "update", "patch", "delete"]
      - resources: ["configmaps", "secrets"]
        verbs: ["get", "list"]

# =====================================
# DISASTER RECOVERY
# =====================================

disaster_recovery:
  backup_strategy:
    pre_deployment:
      - database_snapshot: true
      - configuration_backup: true
      - deployment_state_backup: true
    retention_policy: "7d"

  recovery_procedures:
    database_restore:
      timeout: "30m"
      verification_required: true
    configuration_restore:
      timeout: "5m"
    full_environment_restore:
      timeout: "45m"
      approval_required: true

# =====================================
# NOTIFICATION CONFIGURATION
# =====================================

notifications:
  channels:
    slack-deployments:
      webhook_url: "${SLACK_DEPLOYMENTS_WEBHOOK}"
      channel: "#deployments"
      mention_users: ["@devops-team"]

    email-devops:
      smtp_host: "${SMTP_HOST}"
      recipients: ["devops@schlep-engine.com", "engineering@schlep-engine.com"]

  templates:
    deployment_start:
      title: "🚀 Blue-Green Deployment Started"
      message: |
        Blue-Green deployment initiated for {{ application }} in {{ environment }}

        **Details:**
        - Version: {{ version }}
        - Commit: {{ commit_sha }}
        - Triggered by: {{ triggered_by }}
        - Estimated duration: {{ estimated_duration }}

    deployment_success:
      title: "✅ Blue-Green Deployment Completed"
      message: |
        Blue-Green deployment completed successfully for {{ application }} in {{ environment }}

        **Results:**
        - Duration: {{ duration }}
        - Health checks: {{ health_check_results }}
        - Traffic switched: {{ traffic_percentage }}%

    rollback_triggered:
      title: "⚠️ Deployment Rollback Triggered"
      message: |
        Automatic rollback initiated for {{ application }} in {{ environment }}

        **Trigger:** {{ rollback_trigger }}
        **Reason:** {{ rollback_reason }}
        **Action:** Reverting to previous stable version