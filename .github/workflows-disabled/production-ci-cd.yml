name: Production CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 2 * * *' # Daily security scans

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # =============================================================================
  # SECURITY & QUALITY GATES
  # =============================================================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Semgrep Security Scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: >
          p/security-audit
          p/secrets
          p/owasp-top-ten
          p/python
          p/typescript
        outputFormat: sarif
        outputFile: semgrep-results.sarif
      env:
        SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

    - name: Upload Semgrep results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: semgrep-results.sarif

    - name: Secret Detection with TruffleHog
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified

    - name: Dependency Vulnerability Scan
      uses: ossf/scorecard-action@v2.3.1
      with:
        results_file: results.sarif
        results_format: sarif
        publish_results: true

  code-quality:
    name: Code Quality Analysis
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'pnpm'

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 8

    - name: Install Python dependencies
      run: |
        cd apps/api
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install black isort flake8 mypy bandit safety ruff

    - name: Install Node dependencies
      run: pnpm install --frozen-lockfile

    - name: Python code formatting check
      run: |
        cd apps/api
        black --check --diff .
        isort --check-only --diff .
        ruff check .

    - name: Python linting
      run: |
        cd apps/api
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        mypy app/ --ignore-missing-imports

    - name: Python security scan
      run: |
        cd apps/api
        bandit -r app/ -f json -o bandit-report.json
        safety check --json --output safety-report.json

    - name: TypeScript/JavaScript formatting
      run: |
        pnpm lint
        pnpm type-check

    - name: Upload code quality artifacts
      uses: actions/upload-artifact@v4
      with:
        name: code-quality-reports
        path: |
          apps/api/bandit-report.json
          apps/api/safety-report.json

  # =============================================================================
  # COMPREHENSIVE TESTING SUITE
  # =============================================================================
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
        test-type: [unit, integration, e2e]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: schlep_test
        options: >
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        options: >
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip packages
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('apps/api/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        cd apps/api
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov pytest-mock pytest-xdist pytest-html

    - name: Run ${{ matrix.test-type }} tests
      run: |
        cd apps/api
        if [ "${{ matrix.test-type }}" = "unit" ]; then
          pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=html --junitxml=unit-test-results.xml --html=unit-report.html
        elif [ "${{ matrix.test-type }}" = "integration" ]; then
          pytest tests/integration/ -v --cov=app --cov-report=xml --cov-report=html --junitxml=integration-test-results.xml --html=integration-report.html
        else
          pytest tests/e2e/ -v --cov=app --cov-report=xml --cov-report=html --junitxml=e2e-test-results.xml --html=e2e-report.html
        fi
      env:
        DATABASE_URL: postgresql://postgres:test_password@localhost/schlep_test
        REDIS_URL: redis://localhost:6379
        TESTING: true

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: backend-test-results-${{ matrix.test-type }}-${{ matrix.python-version }}
        path: |
          apps/api/coverage.xml
          apps/api/htmlcov/
          apps/api/*-test-results.xml
          apps/api/*-report.html

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: apps/api/coverage.xml
        flags: backend-${{ matrix.test-type }}
        name: backend-${{ matrix.test-type }}-coverage
        token: ${{ secrets.CODECOV_TOKEN }}

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: ['18', '20']
        app: [admin, landing, docs]
        test-type: [unit, integration, e2e]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup pnpm
      uses: pnpm/action-setup@v3
      with:
        version: 8

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run ${{ matrix.test-type }} tests for ${{ matrix.app }}
      run: |
        cd apps/${{ matrix.app }}
        if [ "${{ matrix.test-type }}" = "unit" ]; then
          pnpm test -- --coverage --watchAll=false --testPathPattern="__tests__/unit"
        elif [ "${{ matrix.test-type }}" = "integration" ]; then
          pnpm test -- --coverage --watchAll=false --testPathPattern="__tests__/integration"
        else
          pnpm run test:e2e || echo "E2E tests not configured for ${{ matrix.app }}"
        fi

    - name: Build check
      run: |
        cd apps/${{ matrix.app }}
        pnpm run build
      env:
        NEXT_PUBLIC_API_URL: https://api.staging.igris-inertial.com
        NEXT_PUBLIC_APP_ENV: test

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: frontend-test-results-${{ matrix.app }}-${{ matrix.test-type }}-${{ matrix.node-version }}
        path: |
          apps/${{ matrix.app }}/coverage/
          apps/${{ matrix.app }}/.next/

  # =============================================================================
  # PERFORMANCE & LOAD TESTING
  # =============================================================================
  performance-tests:
    name: Performance & Load Tests
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: github.event_name == 'push' && contains(fromJson('["main", "develop"]'), github.ref_name)
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: schlep_test
        options: >
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        options: >
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        cd apps/api
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install locust pytest-benchmark

    - name: Start backend server
      run: |
        cd apps/api
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 15
      env:
        DATABASE_URL: postgresql://postgres:test_password@localhost/schlep_test
        REDIS_URL: redis://localhost:6379
        TESTING: true

    - name: Run load tests
      run: |
        cd apps/api
        if [ -f "tests/load_test.py" ]; then
          locust -f tests/load_test.py --headless --users 50 --spawn-rate 5 --run-time 60s --html=load-test-report.html
        else
          echo "Load tests not found, skipping"
        fi

    - name: Run benchmark tests
      run: |
        cd apps/api
        pytest tests/ -k "benchmark" --benchmark-only --benchmark-json=benchmark-results.json || echo "No benchmark tests found"

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: performance-test-results
        path: |
          apps/api/load-test-report.html
          apps/api/benchmark-results.json

  # =============================================================================
  # CONTAINER BUILD & SECURITY
  # =============================================================================
  build-and-scan-images:
    name: Build & Scan Container Images
    runs-on: ubuntu-latest
    needs: [security-scan, code-quality]
    permissions:
      contents: read
      packages: write
      security-events: write
    
    outputs:
      backend-image: ${{ steps.meta-backend.outputs.tags }}
      admin-image: ${{ steps.meta-admin.outputs.tags }}
      landing-image: ${{ steps.meta-landing.outputs.tags }}
      docs-image: ${{ steps.meta-docs.outputs.tags }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Log in to Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Backend Image
    - name: Extract metadata for backend
      id: meta-backend
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Backend image
      uses: docker/build-push-action@v5
      with:
        context: ./apps/api
        file: ./apps/api/Dockerfile.api
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta-backend.outputs.tags }}
        labels: ${{ steps.meta-backend.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
        build-args: |
          BUILD_DATE=${{ github.event.head_commit.timestamp }}
          VCS_REF=${{ github.sha }}
          VERSION=${{ steps.meta-backend.outputs.version }}

    # Admin App Image
    - name: Extract metadata for admin
      id: meta-admin
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/admin
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Admin image
      uses: docker/build-push-action@v5
      with:
        context: ./apps/admin
        file: ./apps/admin/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta-admin.outputs.tags }}
        labels: ${{ steps.meta-admin.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Landing Page Image
    - name: Extract metadata for landing
      id: meta-landing
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/landing
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Landing image
      uses: docker/build-push-action@v5
      with:
        context: ./apps/landing
        file: ./apps/landing/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta-landing.outputs.tags }}
        labels: ${{ steps.meta-landing.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Docs Image
    - name: Extract metadata for docs
      id: meta-docs
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/docs
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=sha,prefix={{branch}}-
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push Docs image
      uses: docker/build-push-action@v5
      with:
        context: ./apps/docs
        file: ./apps/docs/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta-docs.outputs.tags }}
        labels: ${{ steps.meta-docs.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    # Container Security Scanning
    - name: Scan Backend image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.meta-backend.outputs.tags }}
        format: 'sarif'
        output: 'trivy-backend-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Scan Admin image with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ steps.meta-admin.outputs.tags }}
        format: 'sarif'
        output: 'trivy-admin-results.sarif'
        severity: 'CRITICAL,HIGH'

    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-backend-results.sarif'

    - name: Generate SBOM for Backend
      uses: anchore/sbom-action@v0
      with:
        image: ${{ steps.meta-backend.outputs.tags }}
        format: spdx-json
        output-file: sbom-backend.spdx.json

    - name: Generate SBOM for Admin
      uses: anchore/sbom-action@v0
      with:
        image: ${{ steps.meta-admin.outputs.tags }}
        format: spdx-json
        output-file: sbom-admin.spdx.json

    - name: Install Cosign
      uses: sigstore/cosign-installer@v3.4.0

    - name: Sign container images
      env:
        COSIGN_EXPERIMENTAL: "1"
      run: |
        cosign sign --yes ${{ steps.meta-backend.outputs.tags }}
        cosign sign --yes ${{ steps.meta-admin.outputs.tags }}
        cosign sign --yes ${{ steps.meta-landing.outputs.tags }}
        cosign sign --yes ${{ steps.meta-docs.outputs.tags }}

    - name: Upload SBOM artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sbom-reports
        path: |
          sbom-*.spdx.json

  # =============================================================================
  # DEPLOYMENT AUTOMATION
  # =============================================================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-scan-images, test-backend, test-frontend]
    if: github.ref == 'refs/heads/develop'
    environment: 
      name: staging
      url: https://staging.igris-inertial.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Configure kubectl
      run: |
        aws eks update-kubeconfig --name schlep-staging-cluster --region ${{ secrets.AWS_REGION }}

    - name: Deploy to Kubernetes
      run: |
        cd apps/api/kubernetes/staging
        kubectl apply -f namespace.yaml
        kubectl apply -f configmap.yaml
        kubectl apply -f secret.yaml
        kubectl set image deployment/backend backend=${{ needs.build-and-scan-images.outputs.backend-image }}
        kubectl set image deployment/admin admin=${{ needs.build-and-scan-images.outputs.admin-image }}
        kubectl rollout status deployment/backend -n schlep-staging --timeout=300s
        kubectl rollout status deployment/admin -n schlep-staging --timeout=300s

    - name: Health check
      run: |
        sleep 30
        curl -f https://staging.igris-inertial.com/api/v1/health || exit 1
        curl -f https://staging.igris-inertial.com || exit 1

    - name: Run smoke tests
      run: |
        cd apps/api
        python -m pytest tests/smoke/ -v || echo "Smoke tests failed but deployment continues"
      env:
        API_BASE_URL: https://staging.igris-inertial.com/api/v1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-scan-images, performance-tests]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: 
      name: production
      url: https://igris-inertial.com
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Configure kubectl
      run: |
        aws eks update-kubeconfig --name schlep-production-cluster --region ${{ secrets.AWS_REGION }}

    - name: Create database backup
      run: |
        kubectl exec -n schlep-production $(kubectl get pods -n schlep-production -l app=postgres -o jsonpath='{.items[0].metadata.name}') -- pg_dump -U postgres igris_overture > backup-$(date +%Y%m%d_%H%M%S).sql
        aws s3 cp backup-$(date +%Y%m%d_%H%M%S).sql s3://schlep-backups/pre-deployment/

    - name: Blue-Green Deployment
      run: |
        cd infrastructure/k8s
        # Deploy to green environment
        kubectl apply -f namespace.yaml
        kubectl apply -f configmap.yaml
        kubectl apply -f secret.yaml
        
        # Update image tags
        kubectl set image deployment/backend-green backend=${{ needs.build-and-scan-images.outputs.backend-image }} -n schlep-production
        kubectl set image deployment/admin-green admin=${{ needs.build-and-scan-images.outputs.admin-image }} -n schlep-production
        
        # Wait for rollout
        kubectl rollout status deployment/backend-green -n schlep-production --timeout=600s
        kubectl rollout status deployment/admin-green -n schlep-production --timeout=600s
        
        # Switch traffic
        kubectl patch service backend-service -n schlep-production -p '{"spec":{"selector":{"version":"green"}}}'
        kubectl patch service admin-service -n schlep-production -p '{"spec":{"selector":{"version":"green"}}}'

    - name: Production health check
      run: |
        sleep 60
        for i in {1..5}; do
          if curl -f https://igris-inertial.com/api/v1/health && curl -f https://igris-inertial.com; then
            echo "Health check passed"
            break
          fi
          if [ $i -eq 5 ]; then
            echo "Health check failed, rolling back..."
            kubectl patch service backend-service -n schlep-production -p '{"spec":{"selector":{"version":"blue"}}}'
            kubectl patch service admin-service -n schlep-production -p '{"spec":{"selector":{"version":"blue"}}}'
            exit 1
          fi
          sleep 30
        done

    - name: Run production smoke tests
      run: |
        cd apps/api
        python -m pytest tests/smoke/ -v
      env:
        API_BASE_URL: https://igris-inertial.com/api/v1

    - name: Cleanup old blue deployment
      run: |
        kubectl delete deployment backend-blue admin-blue -n schlep-production || echo "Blue deployments already cleaned up"
        kubectl delete deployment backend admin -n schlep-production || echo "Old deployments already cleaned up"
        # Rename green to blue for next deployment
        kubectl patch deployment backend-green -n schlep-production -p '{"metadata":{"name":"backend-blue"}}'
        kubectl patch deployment admin-green -n schlep-production -p '{"metadata":{"name":"admin-blue"}}'

  # =============================================================================
  # RELEASE MANAGEMENT
  # =============================================================================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Generate changelog
      id: changelog
      run: |
        echo "## What's New" >> RELEASE_NOTES.md
        git log --oneline --pretty=format:"- %s" $(git describe --tags --abbrev=0 HEAD^)..HEAD >> RELEASE_NOTES.md
        echo "" >> RELEASE_NOTES.md
        echo "## Security" >> RELEASE_NOTES.md
        echo "- All container images scanned and signed" >> RELEASE_NOTES.md
        echo "- Dependencies updated and vulnerability-free" >> RELEASE_NOTES.md
        echo "" >> RELEASE_NOTES.md
        echo "## Testing" >> RELEASE_NOTES.md
        echo "- All unit tests passed" >> RELEASE_NOTES.md
        echo "- All integration tests passed" >> RELEASE_NOTES.md
        echo "- All E2E tests passed" >> RELEASE_NOTES.md
        echo "- Performance benchmarks met" >> RELEASE_NOTES.md
        echo "- Security scans passed" >> RELEASE_NOTES.md

    - name: Create Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body_path: RELEASE_NOTES.md
        draft: false
        prerelease: false

  # =============================================================================
  # MONITORING & ALERTING
  # =============================================================================
  setup-monitoring:
    name: Setup Production Monitoring
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Configure kubectl
      run: |
        aws eks update-kubeconfig --name schlep-production-cluster --region ${{ secrets.AWS_REGION }}

    - name: Deploy monitoring stack
      run: |
        # Deploy Prometheus, Grafana, AlertManager
        kubectl apply -f infrastructure/k8s/prometheus-deployment.yaml
        kubectl apply -f apps/api/kubernetes/staging/monitoring.yaml
        
        # Wait for monitoring stack to be ready
        kubectl rollout status deployment/prometheus -n monitoring --timeout=300s
        kubectl rollout status deployment/grafana -n monitoring --timeout=300s

    - name: Configure alerts
      run: |
        # Apply alert rules
        kubectl apply -f infrastructure/monitoring/alerts/ || echo "Alert rules applied"

  # =============================================================================
  # NOTIFICATIONS
  # =============================================================================
  notify-deployment:
    name: Deployment Notifications
    runs-on: ubuntu-latest
    needs: [deploy-production, setup-monitoring]
    if: always()
    
    steps:
    - name: Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ needs.deploy-production.result }}
        channel: '#deployments'
        text: |
          **Igris Overture Deployment ${{ needs.deploy-production.result }}**
          
          **Environment:** Production
          **Version:** ${{ github.ref }}
          **Commit:** ${{ github.sha }}
          **Triggered by:** ${{ github.actor }}
          
          **Services Deployed:**
          - Backend API: ${{ needs.build-and-scan-images.outputs.backend-image }}
          - Admin Dashboard: ${{ needs.build-and-scan-images.outputs.admin-image }}
          - Landing Page: ${{ needs.build-and-scan-images.outputs.landing-image }}
          - Documentation: ${{ needs.build-and-scan-images.outputs.docs-image }}
          
          **Security:** All images scanned and signed
          **Testing:** All tests passed
          **Monitoring:** Active
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: Teams notification
      if: failure()
      uses: skitionek/notify-microsoft-teams@master
      with:
        webhook_url: ${{ secrets.TEAMS_WEBHOOK_URL }}
        needs: ${{ toJson(needs) }}
        job: ${{ toJson(job) }}
        steps: ${{ toJson(steps) }}

  # =============================================================================
  # ROLLBACK CAPABILITY
  # =============================================================================
  setup-rollback:
    name: Setup Automated Rollback
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: failure()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: Configure kubectl
      run: |
        aws eks update-kubeconfig --name schlep-production-cluster --region ${{ secrets.AWS_REGION }}

    - name: Automatic rollback
      run: |
        echo "Deployment failed, initiating automatic rollback..."
        
        # Rollback to previous version
        kubectl rollout undo deployment/backend -n schlep-production
        kubectl rollout undo deployment/admin -n schlep-production
        
        # Wait for rollback to complete
        kubectl rollout status deployment/backend -n schlep-production --timeout=300s
        kubectl rollout status deployment/admin -n schlep-production --timeout=300s
        
        # Verify health after rollback
        sleep 30
        curl -f https://igris-inertial.com/api/v1/health || exit 1
        
        echo "Rollback completed successfully"

    - name: Rollback notification
      uses: 8398a7/action-slack@v3
      with:
        status: 'warning'
        channel: '#alerts'
        text: |
          **AUTOMATED ROLLBACK EXECUTED**
          
          **Environment:** Production
          **Reason:** Deployment failure detected
          **Action:** Rolled back to previous stable version
          **Status:** System restored and healthy
          
          **Next Steps:**
          - Review deployment logs
          - Fix issues in develop branch
          - Re-deploy when ready
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
