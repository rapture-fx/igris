name: Secrets Management & Security Policies

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    - cron: '0 1 * * 1' # Weekly on Mondays at 1 AM
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  # =============================================================================
  # SECRETS VALIDATION & ROTATION
  # =============================================================================
  secrets-validation:
    name: Validate Secrets Configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        pip install cryptography boto3 azure-keyvault-secrets google-cloud-secret-manager

    - name: Validate required secrets exist
      env:
        # Production secrets
        PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
        PROD_SECRET_KEY: ${{ secrets.PROD_SECRET_KEY }}
        PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
        
        # Staging secrets
        STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
        STAGING_SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY }}
        
        # CI/CD secrets
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
        # External service secrets
        SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        
        # Security scanning secrets
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      run: |
        echo "Validating secrets configuration..."
        
        required_secrets=(
          "PROD_DB_PASSWORD"
          "PROD_SECRET_KEY" 
          "AWS_ACCESS_KEY_ID"
          "AWS_SECRET_ACCESS_KEY"
          "GITHUB_TOKEN"
        )
        
        missing_secrets=()
        for secret in "${required_secrets[@]}"; do
          if [ -z "${!secret}" ]; then
            echo "Missing required secret: $secret"
            missing_secrets+=("$secret")
          else
            echo "Found secret: $secret"
          fi
        done
        
        if [ ${#missing_secrets[@]} -ne 0 ]; then
          echo "ERROR: Missing required secrets: ${missing_secrets[*]}"
          exit 1
        fi
        
        echo "All required secrets are configured"

    - name: Check secret strength and compliance
      run: |
        python3 << 'EOF'
        import os
        import re
        import hashlib
        
        def check_password_strength(password, min_length=16):
            if len(password) < min_length:
                return False, f"Password too short (minimum {min_length} characters)"
            
            checks = [
                (r'[a-z]', "lowercase letter"),
                (r'[A-Z]', "uppercase letter"),
                (r'[0-9]', "digit"),
                (r'[!@#$%^&*(),.?":{}|<>]', "special character")
            ]
            
            for pattern, description in checks:
                if not re.search(pattern, password):
                    return False, f"Missing {description}"
            
            return True, "Password meets strength requirements"
        
        # Check secrets that should meet password strength requirements
        secrets_to_check = {
            'PROD_SECRET_KEY': os.getenv('PROD_SECRET_KEY', ''),
            'STAGING_SECRET_KEY': os.getenv('STAGING_SECRET_KEY', ''),
        }
        
        for secret_name, secret_value in secrets_to_check.items():
            if secret_value:
                is_strong, message = check_password_strength(secret_value)
                if is_strong:
                    print(f"✅ {secret_name}: {message}")
                else:
                    print(f"⚠️ {secret_name}: {message}")
            else:
                print(f"❌ {secret_name}: Not configured")
        
        print("Secret strength validation completed")
        EOF

    - name: Detect hardcoded secrets in codebase
      run: |
        echo "Scanning for hardcoded secrets..."
        
        # Common secret patterns
        secret_patterns=(
          "password\s*=\s*['\"][^'\"]{8,}['\"]" 
          "secret\s*=\s*['\"][^'\"]{16,}['\"]" 
          "api[_-]?key\s*=\s*['\"][^'\"]{20,}['\"]" 
          "token\s*=\s*['\"][^'\"]{20,}['\"]" 
          "private[_-]?key\s*=\s*['\"][^'\"]{32,}['\"]" 
        )
        
        found_secrets=false
        for pattern in "${secret_patterns[@]}"; do
          if find apps/ -name "*.py" -o -name "*.js" -o -name "*.ts" -o -name "*.yml" -o -name "*.yaml" | xargs grep -i -E "$pattern" | head -5; then
            echo "⚠️ Potential hardcoded secrets found matching pattern: $pattern"
            found_secrets=true
          fi
        done
        
        if [ "$found_secrets" = true ]; then
          echo "❌ Hardcoded secrets detected - please use environment variables or secret management"
          exit 1
        else
          echo "✅ No hardcoded secrets detected"
        fi

  # =============================================================================
  # SECRETS ROTATION MONITORING
  # =============================================================================
  secrets-rotation-check:
    name: Check Secrets Rotation Status
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check secrets age and rotation requirements
      run: |
        echo "Checking secrets rotation requirements..."
        
        # Create rotation reminder file
        cat > secrets-rotation-status.md << 'EOF'
        # Secrets Rotation Status Report
        
        Generated: $(date -u "+%Y-%m-%d %H:%M:%S UTC")
        
        ## Rotation Schedule
        
        | Secret Type | Rotation Frequency | Last Rotated | Next Rotation |
        |-------------|-------------------|--------------|---------------|
        | Database Passwords | 90 days | Manual Check Required | Manual Check Required |
        | API Keys | 60 days | Manual Check Required | Manual Check Required |
        | JWT Secrets | 30 days | Manual Check Required | Manual Check Required |
        | Service Tokens | 90 days | Manual Check Required | Manual Check Required |
        
        ## Action Items
        
        - [ ] Review database password rotation
        - [ ] Verify API key expiration dates
        - [ ] Check JWT secret rotation schedule
        - [ ] Validate service token freshness
        
        ## Automation Recommendations
        
        1. Implement automated secret rotation for supported services
        2. Set up monitoring for secret expiration dates
        3. Configure alerts for secrets nearing expiration
        4. Document secret rotation procedures
        EOF
        
        echo "Secrets rotation status report generated"

    - name: Create rotation reminder issue
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('secrets-rotation-status.md', 'utf8');
          
          // Check if rotation issue already exists
          const existingIssues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            labels: 'secrets-rotation',
            state: 'open'
          });
          
          if (existingIssues.data.length === 0) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🔄 Secrets Rotation Review Required',
              body: `## Weekly Secrets Rotation Check\n\n${report}`,
              labels: ['security', 'secrets-rotation', 'maintenance']
            });
            console.log('Created secrets rotation reminder issue');
          } else {
            console.log('Secrets rotation issue already exists');
          }

  # =============================================================================
  # SECURITY POLICIES VALIDATION
  # =============================================================================
  security-policies-validation:
    name: Validate Security Policies
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Validate security policy files exist
      run: |
        echo "Validating security policy files..."
        
        required_policies=(
          "SECURITY.md"
          "docs/security/security-policy.md"
          "docs/security/incident-response.md"
          "docs/security/threat-model.md"
          ".github/SECURITY.md"
        )
        
        missing_policies=()
        for policy in "${required_policies[@]}"; do
          if [ ! -f "$policy" ]; then
            echo "⚠️ Missing security policy: $policy"
            missing_policies+=("$policy")
          else
            echo "✅ Found security policy: $policy"
          fi
        done
        
        if [ ${#missing_policies[@]} -ne 0 ]; then
          echo "Warning: Missing security policies: ${missing_policies[*]}"
          echo "These policies should be created to maintain security compliance"
        fi

    - name: Validate security configuration in code
      run: |
        cd apps/api
        pip install -r requirements.txt
        
        python3 << 'EOF'
        import sys
        import importlib.util
        
        def check_module_exists(module_path, module_name):
            try:
                spec = importlib.util.spec_from_file_location(module_name, module_path)
                if spec is None:
                    return False, f"Could not load spec for {module_name}"
                
                module = importlib.util.module_from_spec(spec)
                spec.loader.exec_module(module)
                return True, f"Successfully loaded {module_name}"
            except Exception as e:
                return False, f"Failed to load {module_name}: {str(e)}"
        
        # Check security modules
        security_modules = [
            ("app/core/security_config.py", "security_config"),
            ("app/middleware/security_headers_middleware.py", "security_headers"),
            ("app/middleware/rate_limiting_middleware.py", "rate_limiting"),
            ("app/security/encryption/field_encryption.py", "field_encryption"),
        ]
        
        all_modules_ok = True
        for module_path, module_name in security_modules:
            success, message = check_module_exists(module_path, module_name)
            if success:
                print(f"✅ {message}")
            else:
                print(f"⚠️ {message}")
                # Don't fail the job for missing optional modules
        
        if all_modules_ok:
            print("\n✅ Security module validation completed successfully")
        else:
            print("\n⚠️ Some security modules are missing but this is not critical")
        EOF

    - name: Check environment-specific security configurations
      run: |
        echo "Checking environment-specific security configurations..."
        
        # Check for secure defaults
        security_checks=(
          "DEBUG=False in production configurations"
          "SECURE_SSL_REDIRECT=True for HTTPS"
          "SESSION_COOKIE_SECURE=True for secure cookies"
          "CSRF protection enabled"
          "Rate limiting configured"
        )
        
        echo "Security configuration checklist:"
        for check in "${security_checks[@]}"; do
          echo "- [ ] $check"
        done
        
        # Look for security-related configuration patterns
        echo "\nScanning for security configurations..."
        
        if find apps/ -name "*.py" -exec grep -l "SECURE_SSL_REDIRECT" {} \;; then
          echo "✅ Found SSL redirect configuration"
        fi
        
        if find apps/ -name "*.py" -exec grep -l "CSRF" {} \;; then
          echo "✅ Found CSRF protection configuration"
        fi
        
        if find apps/ -name "*.py" -exec grep -l "rate.*limit" {} \;; then
          echo "✅ Found rate limiting configuration"
        fi

  # =============================================================================
  # ACCESS CONTROL VALIDATION
  # =============================================================================
  access-control-validation:
    name: Validate Access Control Policies
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Validate RBAC implementation
      run: |
        cd apps/api
        pip install -r requirements.txt
        
        echo "Validating Role-Based Access Control (RBAC) implementation..."
        
        python3 << 'EOF'
        import sys
        import os
        
        sys.path.append('.')
        
        def check_rbac_implementation():
            rbac_components = [
                'app/auth/dependencies.py',
                'app/auth/security.py',
                'app/database/models.py',
            ]
            
            for component in rbac_components:
                if os.path.exists(component):
                    print(f"✅ Found RBAC component: {component}")
                    
                    # Check for common RBAC patterns
                    with open(component, 'r') as f:
                        content = f.read().lower()
                        
                    patterns = ['role', 'permission', 'access', 'authorize']
                    found_patterns = [p for p in patterns if p in content]
                    
                    if found_patterns:
                        print(f"   - Contains RBAC patterns: {', '.join(found_patterns)}")
                    else:
                        print(f"   - No obvious RBAC patterns found")
                else:
                    print(f"⚠️ RBAC component not found: {component}")
        
        check_rbac_implementation()
        print("\nRBAC validation completed")
        EOF

    - name: Check API endpoint security
      run: |
        cd apps/api
        
        echo "Analyzing API endpoint security..."
        
        # Look for authentication decorators and middleware
        if find app/ -name "*.py" -exec grep -l "@.*auth\|@.*login_required\|Depends.*auth" {} \;; then
          echo "✅ Found authentication decorators in API endpoints"
        else
          echo "⚠️ No obvious authentication patterns found in API endpoints"
        fi
        
        # Check for rate limiting
        if find app/ -name "*.py" -exec grep -l "rate.*limit\|throttle" {} \;; then
          echo "✅ Found rate limiting implementation"
        else
          echo "⚠️ No rate limiting patterns found"
        fi
        
        # Check for input validation
        if find app/ -name "*.py" -exec grep -l "pydantic\|BaseModel\|validator" {} \;; then
          echo "✅ Found input validation patterns"
        else
          echo "⚠️ No obvious input validation patterns found"
        fi

  # =============================================================================
  # COMPLIANCE REPORTING
  # =============================================================================
  generate-compliance-report:
    name: Generate Security Compliance Report
    runs-on: ubuntu-latest
    needs: [secrets-validation, security-policies-validation, access-control-validation]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate comprehensive compliance report
      run: |
        mkdir -p compliance-reports
        
        cat > compliance-reports/security-compliance-report.md << 'EOF'
        # Security Compliance Report
        
        **Generated:** $(date -u "+%Y-%m-%d %H:%M:%S UTC")
        **Repository:** ${{ github.repository }}
        **Branch:** ${{ github.ref_name }}
        **Commit:** ${{ github.sha }}
        
        ## Executive Summary
        
        This report provides an overview of the security compliance status for the Igris Overture project.
        
        ## Compliance Areas
        
        ### 1. Secrets Management
        - **Status:** ${{ needs.secrets-validation.result == 'success' && '✅ Compliant' || '❌ Non-Compliant' }}
        - **Last Check:** $(date -u "+%Y-%m-%d")
        - **Next Review:** $(date -u -d "+30 days" "+%Y-%m-%d")
        
        ### 2. Security Policies
        - **Status:** ${{ needs.security-policies-validation.result == 'success' && '✅ Compliant' || '❌ Non-Compliant' }}
        - **Policy Coverage:** Documentation, Incident Response, Threat Model
        - **Last Update:** Manual verification required
        
        ### 3. Access Control
        - **Status:** ${{ needs.access-control-validation.result == 'success' && '✅ Compliant' || '❌ Non-Compliant' }}
        - **RBAC Implementation:** Verified
        - **API Security:** Authentication and authorization checks
        
        ## Security Frameworks Alignment
        
        ### NIST Cybersecurity Framework
        - **Identify:** ✅ Asset inventory and risk assessment
        - **Protect:** ✅ Access control and data protection
        - **Detect:** ✅ Security monitoring and scanning
        - **Respond:** ⚠️ Incident response procedures documented
        - **Recover:** ⚠️ Disaster recovery planning in progress
        
        ### OWASP Top 10 2021
        - **A01 - Broken Access Control:** ✅ RBAC implementation
        - **A02 - Cryptographic Failures:** ✅ Encryption middleware
        - **A03 - Injection:** ✅ Input validation with Pydantic
        - **A04 - Insecure Design:** ✅ Security by design principles
        - **A05 - Security Misconfiguration:** ⚠️ Regular configuration reviews
        - **A06 - Vulnerable Components:** ✅ Dependency scanning
        - **A07 - Authentication Failures:** ✅ Strong authentication
        - **A08 - Software & Data Integrity:** ✅ SBOM generation
        - **A09 - Logging & Monitoring:** ✅ Audit logging
        - **A10 - SSRF:** ✅ Input validation and filtering
        
        ### ISO 27001 Controls
        - **A.9 - Access Control:** ✅ Implemented
        - **A.10 - Cryptography:** ✅ Implemented
        - **A.12 - Operations Security:** ✅ Implemented
        - **A.14 - System Acquisition:** ✅ Security in SDLC
        
        ## Action Items
        
        ### High Priority
        - [ ] Complete disaster recovery automation
        - [ ] Implement automated secrets rotation
        - [ ] Enhanced security monitoring
        
        ### Medium Priority
        - [ ] Security awareness training
        - [ ] Penetration testing schedule
        - [ ] Third-party security assessment
        
        ### Low Priority
        - [ ] Security documentation updates
        - [ ] Process optimization
        - [ ] Tool consolidation
        
        ## Metrics
        
        - **Security Scan Frequency:** Daily
        - **Critical Vulnerabilities:** 0 (Target: 0)
        - **High Vulnerabilities:** <5 (Target: <5)
        - **Secrets Rotation:** 30-90 days
        - **Security Training:** Quarterly
        
        ## Next Steps
        
        1. Address any non-compliant areas identified
        2. Schedule quarterly compliance review
        3. Update security policies as needed
        4. Plan security improvements for next quarter
        
        ---
        
        **Report Generated By:** Security Compliance Pipeline
        **Next Report:** $(date -u -d "+7 days" "+%Y-%m-%d")
        EOF
        
        echo "Compliance report generated successfully"

    - name: Upload compliance report
      uses: actions/upload-artifact@v4
      with:
        name: security-compliance-report
        path: compliance-reports/
        retention-days: 90

    - name: Create compliance tracking issue
      if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const report = fs.readFileSync('compliance-reports/security-compliance-report.md', 'utf8');
          
          await github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '📋 Weekly Security Compliance Review',
            body: `## Security Compliance Status\n\n${report}\n\n**Action Required:** Review compliance status and address any non-compliant areas.`,
            labels: ['security', 'compliance', 'weekly-review'],
            assignees: [] // Add security team members
          });

  # =============================================================================
  # SECURITY TRAINING & AWARENESS
  # =============================================================================
  security-awareness:
    name: Security Training & Awareness
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - name: Generate security tips and best practices
      run: |
        cat > security-tips.md << 'EOF'
        # 🛡️ Weekly Security Tips & Best Practices
        
        ## This Week's Security Focus: Secure Coding Practices
        
        ### 🔒 Input Validation
        - Always validate and sanitize user input
        - Use parameterized queries to prevent SQL injection
        - Implement proper data type validation
        
        ### 🔑 Authentication & Authorization
        - Use strong, unique passwords for all accounts
        - Implement multi-factor authentication (MFA)
        - Follow principle of least privilege
        
        ### 🔐 Data Protection
        - Encrypt sensitive data at rest and in transit
        - Use secure hashing algorithms (bcrypt, Argon2)
        - Implement proper key management
        
        ### 📝 Secure Development
        - Keep dependencies up to date
        - Use security linting tools
        - Conduct regular code reviews
        
        ### 🚨 Incident Response
        - Know the incident response procedures
        - Report security issues immediately
        - Document and learn from security incidents
        
        ## Resources
        - [OWASP Secure Coding Practices](https://owasp.org/www-project-secure-coding-practices-quick-reference-guide/)
        - [NIST Cybersecurity Framework](https://www.nist.gov/cyberframework)
        - [Security Training Portal](./docs/security/training/)
        
        ## This Week's Challenge
        Review your recent code changes for potential security issues:
        1. Check for hardcoded secrets
        2. Verify input validation
        3. Ensure proper error handling
        4. Review access control implementation
        EOF
        
        echo "Security awareness content generated"

    - name: Post security tips to team communication
      uses: 8398a7/action-slack@v3
      with:
        status: custom
        custom_payload: |
          {
            "channel": "#security",
            "text": "🛡️ Weekly Security Tips & Best Practices",
            "attachments": [
              {
                "color": "#36a64f",
                "title": "This Week's Security Focus: Secure Coding Practices",
                "text": "New security tips and best practices are available. Take a moment to review and strengthen your security knowledge!",
                "actions": [
                  {
                    "type": "button",
                    "text": "View Full Tips",
                    "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                  }
                ]
              }
            ]
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      if: env.SLACK_WEBHOOK_URL