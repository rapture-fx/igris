name: Deploy Schlep-engine to Cloud

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # =============================================================================
  # SECURITY SCAN
  # =============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Check for exposed secrets
        run: |
          echo "🔒 Running security scan..."
          
          # Check for hardcoded secrets (but allow environment.env with ${} variables)
          if grep -r "eyJ0eXAiOiJKV1QiLCJhbGciOiJSUzI1NiJ9" . --exclude-dir=.git --exclude-dir=node_modules; then
            echo "❌ Exposed JWT tokens found!"
            exit 1
          fi
          
          if grep -r "hTx2o@A6&11Bw5cC" . --exclude-dir=.git --exclude-dir=node_modules; then
            echo "❌ Exposed webhook secrets found!"
            exit 1
          fi
          
          # Check for placeholder secrets that should be replaced
          if grep -r "__CHANGE_ME_GENERATE_SECURE_SECRET_KEY__" . --exclude-dir=.git --exclude-dir=node_modules; then
            echo "❌ Placeholder secrets found - replace with actual secrets!"
            exit 1
          fi
          
          echo "✅ Security scan passed - no exposed secrets found"

  # =============================================================================
  # FRONTEND QUALITY CHECKS
  # =============================================================================
  frontend-checks:
    name: Frontend Quality Checks
    runs-on: ubuntu-latest
    needs: security-scan
    strategy:
      matrix:
        app: [web-landing, web-admin, web-docs]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'apps/${{ matrix.app }}/package-lock.json'

      - name: Install dependencies
        run: |
          cd apps/${{ matrix.app }}
          npm ci

      - name: Type check
        run: |
          cd apps/${{ matrix.app }}
          npm run type-check || echo "⚠️ Type check not available for ${{ matrix.app }}"

      - name: Lint check
        run: |
          cd apps/${{ matrix.app }}
          npm run lint || echo "⚠️ Lint check not available for ${{ matrix.app }}"

      - name: Build check
        run: |
          cd apps/${{ matrix.app }}
          npm run build

  # =============================================================================
  # BACKEND TESTS
  # =============================================================================
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: security-scan
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Set up test environment
        run: |
          cd apps/api
          echo "DATABASE_URL=postgresql+asyncpg://test_user:test_password@localhost:5432/test_db" > .env.test
          echo "REDIS_URL=redis://localhost:6379/0" >> .env.test
          echo "SECRET_KEY=test_secret_key_for_ci_only_not_production" >> .env.test
          echo "ENVIRONMENT=testing" >> .env.test
          echo "DEBUG=false" >> .env.test

      - name: Run backend health check
        run: |
          cd apps/api
          python -c "
          import sys
          import os
          os.environ['ENVIRONMENT'] = 'testing'
          sys.path.append('.')
          try:
              from app.main import app
              print('✅ Backend server imports successfully')
          except Exception as e:
              print(f'❌ Backend import failed: {e}')
              sys.exit(1)
          "

      - name: Run backend tests
        run: |
          cd apps/api
          if [ -d "tests/" ]; then
            python -m pytest tests/ -v --cov=app --cov-report=term-missing || echo "⚠️ Some tests failed but continuing"
          else
            echo "⚠️ No test directory found - skipping tests"
          fi

  # =============================================================================
  # DEPLOY TO VERCEL
  # =============================================================================
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [quality-checks, backend-tests]
    defaults:
      run:
        working-directory: ./packages/frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: './packages/frontend/pnpm-lock.yaml'

      - name: Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build Project Artifacts
        run: vercel build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$url" >> $GITHUB_OUTPUT
          echo "Deployed to: $url"

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentUrl = '${{ steps.deploy.outputs.deployment_url }}';
            const comment = `
            ## Deployment Preview Ready!
            
            **Preview URL:** ${deploymentUrl}
            
            ### Deployment Details
            - **Environment:** Preview
            - **Branch:** \`${{ github.head_ref }}\`
            - **Commit:** \`${{ github.sha }}\`
            - **Workflow:** [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ### Testing Checklist
            - [ ] Authentication (Sign in/Sign up)
            - [ ] UI/UX components render correctly
            - [ ] API connections work
            - [ ] Mobile responsiveness
            - [ ] Performance is acceptable
            
            ---
            *This preview will be automatically updated with new commits to this PR.*
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # =============================================================================
  # HEALTH CHECK
  # =============================================================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Check deployment health
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 30
          
          # Add your production URL here
          PROD_URL="https://igris-inertial.vercel.app"
          
          # Basic health check
          if curl -f -s "$PROD_URL" > /dev/null; then
            echo "Production deployment is healthy"
          else
            echo "Production deployment health check failed"
            exit 1
          fi

      - name: Performance audit (optional)
        run: |
          echo "Performance audit would go here"
          # You can add lighthouse CI or other performance tools here

  # =============================================================================
  # NOTIFICATIONS
  # =============================================================================
  notify:
    name:  Notify Team
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    
    steps:
      - name: Deployment notification
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "Schlep-engine deployment successful!"
            # Add Slack/Discord/Email notification here if needed
          else
            echo "Schlep-engine deployment failed!"
            # Add failure notification here if needed
          fi 