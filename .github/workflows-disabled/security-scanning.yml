name: Enhanced Security Scanning & DevSecOps

on:
  push:
    branches: [ main, develop, staging ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of security scan to run'
        required: true
        default: 'full'
        type: choice
        options:
        - full
        - dependencies
        - secrets
        - containers
        - infrastructure

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  SECURITY_SCAN_TIMEOUT: '300'

jobs:
  dependency-vulnerability-scan:
    name: Dependency Vulnerability Scanning
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        component: [api, admin, docs, landing]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js (for frontend components)
      if: matrix.component != 'api'
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: apps/${{ matrix.component }}/package-lock.json
        
    - name: Setup Python (for API)
      if: matrix.component == 'api'
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install Python dependencies
      if: matrix.component == 'api'
      working-directory: apps/${{ matrix.component }}
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install Node dependencies
      if: matrix.component != 'api'
      working-directory: apps/${{ matrix.component }}
      run: npm ci
      
    - name: Run Safety scan (Python)
      if: matrix.component == 'api'
      working-directory: apps/${{ matrix.component }}
      run: |
        pip install safety
        safety check --json --output safety-report.json || true
        safety check
        
    - name: Run Bandit security scan (Python)
      if: matrix.component == 'api'
      working-directory: apps/${{ matrix.component }}
      run: |
        pip install bandit
        bandit -r . -f json -o bandit-report.json || true
        bandit -r . -ll -i
        
    - name: Run npm audit (Node.js)
      if: matrix.component != 'api'
      working-directory: apps/${{ matrix.component }}
      run: |
        npm audit --audit-level=moderate --json > npm-audit-report.json || true
        npm audit --audit-level=moderate
        
    - name: Run Snyk vulnerability scan
      uses: snyk/actions/node@master
      if: matrix.component != 'api'
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=medium --json > snyk-report.json
        command: test
        
    - name: Run Snyk Python scan
      uses: snyk/actions/python@master
      if: matrix.component == 'api'
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=medium --json > snyk-python-report.json
        command: test
        
    - name: Upload vulnerability reports
      uses: actions/upload-artifact@v4
      with:
        name: vulnerability-reports-${{ matrix.component }}
        path: |
          apps/${{ matrix.component }}/*-report.json
        retention-days: 30

  static-application-security-testing:
    name: Static Application Security Testing (SAST)
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # Fetch full history for better analysis
        fetch-depth: 0
        
    - name: Run Semgrep SAST scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/owasp-top-ten
          p/python
          p/javascript
          p/typescript
        generateSarif: "1"
        
    - name: Upload SARIF file to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: semgrep.sarif
        
    - name: Run CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        languages: python, javascript
        queries: security-and-quality
        
    - name: Setup SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectKey=igris-inertial
          -Dsonar.organization=your-org
          -Dsonar.sources=apps/
          -Dsonar.exclusions=**/node_modules/**,**/venv/**
          -Dsonar.security.hotspots.ignored=false

  secret-scanning:
    name: Secret Detection Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: Run TruffleHog secret scan
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD
        extra_args: --debug --only-verified
        
    - name: Run GitLeaks secret scan
      uses: gitleaks/gitleaks-action@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        
    - name: Upload secret scan results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: secret-scan-results
        path: |
          gitleaks-report.json
          trufflehog-results.json

  infrastructure-security-scan:
    name: Infrastructure Security Scanning
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Checkov IaC security scan
      uses: bridgecrewio/checkov-action@master
      with:
        directory: .
        framework: dockerfile,kubernetes,terraform
        output_format: sarif
        output_file_path: checkov-report.sarif
        
    - name: Upload Checkov SARIF
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: checkov-report.sarif
        
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  container-security-scan:
    name: Container Security Scanning
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        component: [api, admin, docs, landing]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Build Docker image
      working-directory: apps/${{ matrix.component }}
      run: |
        if [ -f Dockerfile ]; then
          docker build -t schlep-${{ matrix.component }}:latest .
        fi
        
    - name: Run Trivy container scan
      if: hashFiles(format('apps/{0}/Dockerfile', matrix.component)) != ''
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'schlep-${{ matrix.component }}:latest'
        format: 'sarif'
        output: 'trivy-container-${{ matrix.component }}.sarif'
        
    - name: Upload Trivy container results
      if: hashFiles(format('apps/{0}/Dockerfile', matrix.component)) != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: 'trivy-container-${{ matrix.component }}.sarif'
        
    - name: Run Snyk container scan
      if: hashFiles(format('apps/{0}/Dockerfile', matrix.component)) != ''
      uses: snyk/actions/docker@master
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        image: 'schlep-${{ matrix.component }}:latest'
        args: --severity-threshold=medium

  dynamic-application-security-testing:
    name: Dynamic Application Security Testing (DAST)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Start application stack
      run: |
        docker-compose -f docker-compose.yml up -d
        sleep 30  # Wait for services to start
        
    - name: Wait for application to be ready
      run: |
        timeout 300 bash -c 'until curl -f http://localhost:8000/health; do sleep 5; done'
        
    - name: Run OWASP ZAP baseline scan
      uses: zaproxy/action-baseline@v0.10.0
      with:
        target: 'http://localhost:8000'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        
    - name: Run OWASP ZAP full scan
      uses: zaproxy/action-full-scan@v0.8.0
      with:
        target: 'http://localhost:8000'
        rules_file_name: '.zap/rules.tsv'
        cmd_options: '-a'
        
    - name: Upload ZAP scan results
      uses: actions/upload-artifact@v4
      with:
        name: zap-scan-results
        path: |
          report_html.html
          report_json.json

  security-policy-compliance:
    name: Security Policy Compliance Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Check for security policy files
      run: |
        # Check for required security files
        files=(
          "SECURITY.md"
          ".github/SECURITY.md" 
          "apps/api/app/security/"
          "apps/api/app/middleware/security_headers_middleware.py"
          "apps/api/app/middleware/audit_middleware.py"
        )
        
        for file in "${files[@]}"; do
          if [ ! -e "$file" ]; then
            echo "❌ Missing required security file: $file"
            exit 1
          else
            echo "✅ Found security file: $file"
          fi
        done
        
    - name: Validate security configuration
      working-directory: apps/api
      run: |
        python3 -c "
        import sys
        import os
        sys.path.append('.')
        
        try:
            from app.core.security_config import security_manager
            from app.security.waf_config import WAFMiddleware
            from app.security.secrets_management import secrets_manager
            print('✅ Security modules loaded successfully')
        except ImportError as e:
            print(f'❌ Security module import failed: {e}')
            sys.exit(1)
        "
        
    - name: Check environment security
      run: |
        # Check for insecure configurations
        if grep -r "DEBUG.*=.*True" apps/; then
          echo "❌ Debug mode enabled in production code"
          exit 1
        fi
        
        if grep -r "ALLOWED_HOSTS.*=.*\[\]" apps/; then
          echo "❌ Insecure ALLOWED_HOSTS configuration"
          exit 1
        fi
        
        echo "✅ Basic security configuration checks passed"

  vulnerability-report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: 
      - dependency-vulnerability-scan
      - static-application-security-testing
      - secret-scanning
      - infrastructure-security-scan
      - container-security-scan
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      
    - name: Generate security report
      run: |
        mkdir -p security-reports
        
        cat > security-reports/security-summary.md << 'EOF'
        # Security Scan Summary Report
        
        **Scan Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
        **Repository:** ${{ github.repository }}
        **Branch:** ${{ github.ref_name }}
        **Commit:** ${{ github.sha }}
        
        ## Scan Results Overview
        
        | Scan Type | Status | Report |
        |-----------|--------|---------|
        | Dependency Vulnerabilities | ✅ | [View Report](./dependency-scan/) |
        | Static Analysis (SAST) | ✅ | [View Report](./sast-scan/) |
        | Secret Detection | ✅ | [View Report](./secret-scan/) |
        | Infrastructure Security | ✅ | [View Report](./infrastructure-scan/) |
        | Container Security | ✅ | [View Report](./container-scan/) |
        
        ## Critical Findings
        
        EOF
        
        # Process scan results and generate summary
        find . -name "*-report.json" -exec echo "Processing: {}" \;
        
        echo "## Next Steps" >> security-reports/security-summary.md
        echo "1. Review all high and critical severity findings" >> security-reports/security-summary.md
        echo "2. Create issues for vulnerabilities that need remediation" >> security-reports/security-summary.md
        echo "3. Update security policies if needed" >> security-reports/security-summary.md
        
    - name: Upload security report
      uses: actions/upload-artifact@v4
      with:
        name: complete-security-report
        path: security-reports/
        retention-days: 90
        
    - name: Comment PR with security summary
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          if (fs.existsSync('security-reports/security-summary.md')) {
            const report = fs.readFileSync('security-reports/security-summary.md', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔒 Security Scan Results\n\n${report}`
            });
          }

  security-notification:
    name: Security Notification
    runs-on: ubuntu-latest
    needs: vulnerability-report
    if: failure() && github.ref == 'refs/heads/main'
    
    steps:
    - name: Send security alert
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: '🚨 Security Scan Failures Detected',
            body: `
            Security scans have detected issues that require immediate attention.
            
            **Branch:** ${context.ref}
            **Commit:** ${context.sha}
            **Run:** ${context.runId}
            
            Please review the security scan results and address any critical or high severity findings.
            
            [View Workflow Run](${context.payload.repository.html_url}/actions/runs/${context.runId})
            `,
            labels: ['security', 'urgent', 'needs-review']
          });