name: 🚀 Enhanced CI/CD Pipeline

on:
  push:
    branches: [main, develop, staging]
  pull_request:
    branches: [main, develop]
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # =============================================================================
  # QUALITY GATES
  # =============================================================================
  code-quality:
    name: 🔍 Code Quality & Security
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🔍 Run SonarQube Analysis
      uses: sonarqube-quality-gate-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        scannerHomebrew: SonarScanner

    - name: 🔒 Run Semgrep Security Scan
      uses: returntocorp/semgrep-action@v1
      with:
        config: >-
          p/security-audit
          p/secrets
          p/owasp-top-ten
        outputFormat: sarif
        outputFile: semgrep-results.sarif

    - name: 📊 Upload Semgrep results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: semgrep-results.sarif

  # =============================================================================
  # BACKEND TESTING SUITE
  # =============================================================================
  backend-tests:
    name: 🐍 Backend Test Suite
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.11, 3.12]
        test-type: [unit, integration, e2e]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: schlep_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: 📦 Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('packages/backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: 📦 Install dependencies
      run: |
        cd packages/backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov pytest-mock pytest-xdist
        pip install black isort flake8 mypy bandit safety

    - name: 🎨 Code formatting check
      run: |
        cd packages/backend
        black --check --diff .
        isort --check-only --diff .

    - name: 🧹 Lint with flake8
      run: |
        cd packages/backend
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: 🔍 Type check with mypy
      run: |
        cd packages/backend
        mypy app/ --ignore-missing-imports --strict

    - name: 🔒 Security scan with bandit
      run: |
        cd packages/backend
        bandit -r app/ -f json -o bandit-report.json || true

    - name: 🔒 Dependency vulnerability scan
      run: |
        cd packages/backend
        safety check --json --output safety-report.json || true

    - name: 🧪 Run ${{ matrix.test-type }} tests
      run: |
        cd packages/backend
        if [ "${{ matrix.test-type }}" = "unit" ]; then
          pytest tests/unit/ -v --cov=app --cov-report=xml --cov-report=html --junitxml=unit-test-results.xml
        elif [ "${{ matrix.test-type }}" = "integration" ]; then
          pytest tests/integration/ -v --cov=app --cov-report=xml --cov-report=html --junitxml=integration-test-results.xml
        else
          pytest tests/e2e/ -v --cov=app --cov-report=xml --cov-report=html --junitxml=e2e-test-results.xml
        fi
      env:
        DATABASE_URL: postgresql://postgres:test_password@localhost/schlep_test
        REDIS_URL: redis://localhost:6379
        TESTING: true

    - name: 📊 Upload test results
      uses: actions/upload-artifact@v3
      with:
        name: test-results-${{ matrix.test-type }}-${{ matrix.python-version }}
        path: |
          packages/backend/coverage.xml
          packages/backend/htmlcov/
          packages/backend/*-test-results.xml
          packages/backend/bandit-report.json
          packages/backend/safety-report.json

    - name: 📈 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: packages/backend/coverage.xml
        flags: backend-${{ matrix.test-type }}
        name: backend-${{ matrix.test-type }}-coverage

  # =============================================================================
  # FRONTEND TESTING SUITE
  # =============================================================================
  frontend-tests:
    name: ⚛️ Frontend Test Suite
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
        test-type: [unit, integration, e2e]

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔧 Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    - name: 🔧 Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        cache-dependency-path: packages/frontend/pnpm-lock.yaml

    - name: 📦 Install dependencies
      run: |
        cd packages/frontend
        pnpm install --frozen-lockfile

    - name: 🎨 Code formatting check
      run: |
        cd packages/frontend
        pnpm run format:check

    - name: 🧹 Lint check
      run: |
        cd packages/frontend
        pnpm run lint

    - name: 🔍 Type check
      run: |
        cd packages/frontend
        pnpm run type-check

    - name: 🧪 Run ${{ matrix.test-type }} tests
      run: |
        cd packages/frontend
        if [ "${{ matrix.test-type }}" = "unit" ]; then
          pnpm test -- --coverage --watchAll=false --testPathPattern="__tests__/unit"
        elif [ "${{ matrix.test-type }}" = "integration" ]; then
          pnpm test -- --coverage --watchAll=false --testPathPattern="__tests__/integration"
        else
          pnpm run test:e2e
        fi

    - name: 🏗️ Build check
      run: |
        cd packages/frontend
        pnpm run build
      env:
        NEXT_PUBLIC_API_URL: https://api.staging.igris-inertial.com
        NEXT_PUBLIC_APP_ENV: test

    - name: 📊 Upload test results
      uses: actions/upload-artifact@v3
      with:
        name: frontend-test-results-${{ matrix.test-type }}-${{ matrix.node-version }}
        path: |
          packages/frontend/coverage/
          packages/frontend/.next/

    - name: 📈 Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: packages/frontend/coverage/lcov.info
        flags: frontend-${{ matrix.test-type }}
        name: frontend-${{ matrix.test-type }}-coverage

  # =============================================================================
  # PERFORMANCE & LOAD TESTING
  # =============================================================================
  performance-tests:
    name: ⚡ Performance & Load Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: schlep_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11

    - name: 📦 Install dependencies
      run: |
        cd packages/backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install locust k6-python

    - name: 🚀 Start backend server
      run: |
        cd packages/backend
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 15
      env:
        DATABASE_URL: postgresql://postgres:test_password@localhost/schlep_test
        TESTING: true

    - name: 🧪 Run load tests with Locust
      run: |
        cd packages/backend
        locust -f tests/load_test.py --headless --users 10 --spawn-rate 2 --run-time 60s --html=load-test-report.html

    - name: 📊 Upload performance results
      uses: actions/upload-artifact@v3
      with:
        name: performance-test-results
        path: |
          packages/backend/load-test-report.html
          packages/backend/locust-report.csv

  # =============================================================================
  # CONTAINER SECURITY & BUILD
  # =============================================================================
  container-security:
    name: 🐳 Container Security & Build
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Log in to Container Registry
      uses: docker/login-action@v2
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: 🔧 Set up QEMU
      uses: docker/setup-qemu-action@v2

    - name: 🔧 Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: 🏗️ Build and push Backend image
      uses: docker/build-push-action@v4
      with:
        context: ./packages/backend
        file: ./packages/backend/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: 🏗️ Build and push Frontend image
      uses: docker/build-push-action@v4
      with:
        context: ./packages/frontend
        file: ./packages/frontend/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: 🔒 Scan images with Trivy
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}'
        format: 'sarif'
        output: 'trivy-backend-results.sarif'

    - name: 📊 Upload Trivy results
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: trivy-backend-results.sarif

    - name: 📋 Generate SBOM
      uses: anchore/sbom-action@v0
      with:
        image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
        format: spdx-json
        output-file: sbom-backend.spdx.json

    - name: 🔐 Sign images with Cosign
      uses: sigstore/cosign-installer@v3.4.0

    - name: ✍️ Sign images
      env:
        COSIGN_EXPERIMENTAL: "1"
      run: |
        cosign sign --keyless ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
        cosign sign --keyless ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}

  # =============================================================================
  # DEPLOYMENT STAGES
  # =============================================================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [container-security, performance-tests]
    if: github.ref == 'refs/heads/develop'
    environment: staging
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: 🔐 Configure kubectl
      run: |
        aws eks update-kubeconfig --name schlep-staging-cluster --region ${{ secrets.AWS_REGION }}

    - name: 🚀 Deploy to Kubernetes
      run: |
        cd infrastructure/kubernetes
        kubectl apply -f namespace.yaml
        kubectl apply -f configmap.yaml
        kubectl apply -f secret.yaml
        kubectl set image deployment/backend backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
        kubectl set image deployment/frontend frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
        kubectl rollout status deployment/backend -n schlep-staging
        kubectl rollout status deployment/frontend -n schlep-staging

    - name: 🏥 Health check
      run: |
        sleep 30
        curl -f https://staging.igris-inertial.com/health || exit 1

  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [container-security, performance-tests]
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: 🔐 Configure kubectl
      run: |
        aws eks update-kubeconfig --name schlep-production-cluster --region ${{ secrets.AWS_REGION }}

    - name: 🚀 Deploy to Kubernetes
      run: |
        cd infrastructure/kubernetes
        kubectl apply -f namespace.yaml
        kubectl apply -f configmap.yaml
        kubectl apply -f secret.yaml
        kubectl set image deployment/backend backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
        kubectl set image deployment/frontend frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
        kubectl rollout status deployment/backend -n schlep-production
        kubectl rollout status deployment/frontend -n schlep-production

    - name: 🏥 Health check
      run: |
        sleep 30
        curl -f https://igris-inertial.com/health || exit 1

    - name: 📊 Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## 🚀 Production Deployment Complete
          
          **Version:** ${{ github.ref }}
          **Commit:** ${{ github.sha }}
          **Environment:** Production
          
          ### 📋 Deployment Details
          - Backend: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/backend:${{ github.sha }}
          - Frontend: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/frontend:${{ github.sha }}
          
          ### 🧪 Test Results
          - All tests passed ✅
          - Security scans clean ✅
          - Performance benchmarks met ✅
          
          See [CHANGELOG.md](./CHANGELOG.md) for detailed changes.
        draft: false
        prerelease: false

  # =============================================================================
  # MONITORING & ALERTS
  # =============================================================================
  monitoring-setup:
    name: 📊 Monitoring Setup
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    - name: 🔐 Configure kubectl
      run: |
        aws eks update-kubeconfig --name schlep-production-cluster --region ${{ secrets.AWS_REGION }}

    - name: 📊 Deploy monitoring stack
      run: |
        cd infrastructure/monitoring
        kubectl apply -f prometheus/
        kubectl apply -f grafana/
        kubectl apply -f alertmanager/

    - name: 🔔 Setup alerts
      run: |
        cd infrastructure/monitoring
        kubectl apply -f alerts/

  # =============================================================================
  # NOTIFICATIONS
  # =============================================================================
  notify:
    name: 📢 Notifications
    runs-on: ubuntu-latest
    needs: [deploy-production, monitoring-setup]
    if: always()
    
    steps:
    - name: 📢 Slack notification
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        channel: '#deployments'
        text: |
          🚀 Schlep-engine deployment ${{ job.status }}
          **Environment:** Production
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref }}
        webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}

    - name: 📧 Email notification
      run: |
        if [ "${{ needs.deploy-production.result }}" == "success" ]; then
          echo "✅ Production deployment successful!"
          # Add email notification logic here
        else
          echo "❌ Production deployment failed!"
          # Add failure notification logic here
        fi 