name: Security Testing & Fuzzing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run nightly fuzzing at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      fuzz_duration:
        description: 'Fuzzing duration in seconds'
        required: false
        default: '300'
        type: string
      run_regression_only:
        description: 'Run only regression tests (skip fuzzing)'
        required: false
        default: false
        type: boolean

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  security_regression:
    name: Security Regression Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: rustfmt, clippy

    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          ~/.cache/pip
          apps/api/rust_compute_kernels/target
        key: security-${{ runner.os }}-${{ hashFiles('apps/api/rust_compute_kernels/Cargo.toml', '**/requirements*.txt') }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin pandas polars psutil pytest
        cd apps/api && pip install -e .

    - name: Build Rust kernels
      run: |
        cd apps/api/rust_compute_kernels
        maturin develop --release

    - name: Run security regression tests
      id: regression_tests
      run: |
        cd apps/api/rust_compute_kernels
        python tests/test_security_regression.py

    - name: Performance impact check
      id: perf_check
      run: |
        cd apps/api/rust_compute_kernels
        python -c "
        import time
        import json
        import schlep_compute_kernels

        # Quick performance check to ensure security fixes don't regress performance
        print('🔍 Checking performance impact of security fixes...')

        test_data = ['test string'] * 1000
        iterations = 100

        # Test string operations performance
        start_time = time.time()
        for i in range(iterations):
            result = schlep_compute_kernels.fast_string_ops(test_data, 'length', None)
        string_ops_time = (time.time() - start_time) / iterations

        # Test regex operations performance
        start_time = time.time()
        for i in range(iterations // 10):  # Fewer iterations for regex
            try:
                result = schlep_compute_kernels.fast_string_ops(test_data[:100], 'regex', 'test')
            except:
                pass  # May reject unsafe patterns
        regex_ops_time = (time.time() - start_time) / (iterations // 10)

        results = {
            'string_ops_avg_ms': string_ops_time * 1000,
            'regex_ops_avg_ms': regex_ops_time * 1000,
            'performance_regression': False
        }

        # Basic performance thresholds
        if string_ops_time > 0.01:  # Should complete in <10ms
            results['performance_regression'] = True
            print(f'⚠️ String operations too slow: {string_ops_time*1000:.2f}ms')

        if regex_ops_time > 0.05:  # Should complete in <50ms
            results['performance_regression'] = True
            print(f'⚠️ Regex operations too slow: {regex_ops_time*1000:.2f}ms')

        with open('security_performance_check.json', 'w') as f:
            json.dump(results, f, indent=2)

        if results['performance_regression']:
            print('❌ Performance regression detected in security fixes')
            exit(1)
        else:
            print('✅ Security fixes have minimal performance impact')
            print(f'   String ops: {results[\"string_ops_avg_ms\"]:.2f}ms avg')
            print(f'   Regex ops: {results[\"regex_ops_avg_ms\"]:.2f}ms avg')
        "

    - name: Upload regression test results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-regression-results
        path: |
          apps/api/rust_compute_kernels/security_regression_report_*.json
          apps/api/rust_compute_kernels/security_performance_check.json

  rust_fuzzing:
    name: Rust Fuzzing
    runs-on: ubuntu-latest
    if: github.event.inputs.run_regression_only != 'true'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: nightly  # Required for fuzzing
        override: true
        components: rustfmt, clippy

    - name: Install cargo-fuzz
      run: cargo install cargo-fuzz

    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          apps/api/rust_compute_kernels/target
          apps/api/rust_compute_kernels/fuzz/target
        key: fuzz-${{ runner.os }}-${{ hashFiles('apps/api/rust_compute_kernels/fuzz/Cargo.toml') }}

    - name: Initialize fuzzing corpus
      run: |
        cd apps/api/rust_compute_kernels

        # Create initial corpus files for each fuzzer
        mkdir -p fuzz/corpus/string_ops
        mkdir -p fuzz/corpus/regex_validation
        mkdir -p fuzz/corpus/path_validation
        mkdir -p fuzz/corpus/arithmetic_ops
        mkdir -p fuzz/corpus/unicode_validation

        # String operations corpus
        echo '{"strings":["hello","world"],"operation":"length","pattern":null}' > fuzz/corpus/string_ops/basic
        echo '{"strings":["test"],"operation":"regex","pattern":"^test$"}' > fuzz/corpus/string_ops/regex

        # Regex validation corpus
        echo '{"pattern":"hello.*world"}' > fuzz/corpus/regex_validation/basic
        echo '{"pattern":"(a+)+"}' > fuzz/corpus/regex_validation/dangerous

        # Path validation corpus
        echo '{"path":"data/test.csv"}' > fuzz/corpus/path_validation/safe
        echo '{"path":"../etc/passwd"}' > fuzz/corpus/path_validation/traversal

        # Arithmetic operations corpus
        echo '{"a":100,"b":200,"operation":"Multiply"}' > fuzz/corpus/arithmetic_ops/basic
        echo '{"a":1000000000,"b":1000000000,"operation":"Multiply"}' > fuzz/corpus/arithmetic_ops/overflow

        # Unicode validation corpus
        echo '{"data":[72,101,108,108,111]}' > fuzz/corpus/unicode_validation/ascii
        echo '{"data":[240,159,152,128]}' > fuzz/corpus/unicode_validation/emoji

    - name: Run fuzzing - String Operations
      run: |
        cd apps/api/rust_compute_kernels
        timeout ${{ github.event.inputs.fuzz_duration || '300' }}s cargo fuzz run string_ops -- -max_total_time=${{ github.event.inputs.fuzz_duration || '300' }} || true

    - name: Run fuzzing - Regex Validation
      run: |
        cd apps/api/rust_compute_kernels
        timeout ${{ github.event.inputs.fuzz_duration || '300' }}s cargo fuzz run regex_validation -- -max_total_time=${{ github.event.inputs.fuzz_duration || '300' }} || true

    - name: Run fuzzing - Path Validation
      run: |
        cd apps/api/rust_compute_kernels
        timeout ${{ github.event.inputs.fuzz_duration || '300' }}s cargo fuzz run path_validation -- -max_total_time=${{ github.event.inputs.fuzz_duration || '300' }} || true

    - name: Run fuzzing - Arithmetic Operations
      run: |
        cd apps/api/rust_compute_kernels
        timeout ${{ github.event.inputs.fuzz_duration || '300' }}s cargo fuzz run arithmetic_ops -- -max_total_time=${{ github.event.inputs.fuzz_duration || '300' }} || true

    - name: Run fuzzing - Unicode Validation
      run: |
        cd apps/api/rust_compute_kernels
        timeout ${{ github.event.inputs.fuzz_duration || '300' }}s cargo fuzz run unicode_validation -- -max_total_time=${{ github.event.inputs.fuzz_duration || '300' }} || true

    - name: Collect fuzzing results
      if: always()
      run: |
        cd apps/api/rust_compute_kernels

        echo "🔍 FUZZING RESULTS SUMMARY" > fuzzing_summary.txt
        echo "=========================" >> fuzzing_summary.txt
        echo "Duration: ${{ github.event.inputs.fuzz_duration || '300' }} seconds" >> fuzzing_summary.txt
        echo "Date: $(date)" >> fuzzing_summary.txt
        echo "" >> fuzzing_summary.txt

        # Check for crashes in each fuzzer
        for fuzzer in string_ops regex_validation path_validation arithmetic_ops unicode_validation; do
          echo "Fuzzer: $fuzzer" >> fuzzing_summary.txt

          crash_dir="fuzz/artifacts/$fuzzer"
          if [ -d "$crash_dir" ] && [ "$(ls -A $crash_dir 2>/dev/null)" ]; then
            echo "❌ CRASHES FOUND:" >> fuzzing_summary.txt
            ls -la "$crash_dir" >> fuzzing_summary.txt
            echo "" >> fuzzing_summary.txt
          else
            echo "✅ No crashes detected" >> fuzzing_summary.txt
            echo "" >> fuzzing_summary.txt
          fi
        done

        # Create JSON summary
        python3 -c "
        import json
        import os
        from datetime import datetime

        summary = {
            'timestamp': datetime.now().isoformat(),
            'duration_seconds': int('${{ github.event.inputs.fuzz_duration || \"300\" }}'),
            'fuzzers': {},
            'total_crashes': 0
        }

        fuzzers = ['string_ops', 'regex_validation', 'path_validation', 'arithmetic_ops', 'unicode_validation']

        for fuzzer in fuzzers:
            crash_dir = f'fuzz/artifacts/{fuzzer}'
            crashes = []

            if os.path.exists(crash_dir):
                crashes = [f for f in os.listdir(crash_dir) if f.startswith('crash-') or f.startswith('timeout-')]

            summary['fuzzers'][fuzzer] = {
                'crashes_found': len(crashes),
                'crash_files': crashes
            }
            summary['total_crashes'] += len(crashes)

        with open('fuzzing_results.json', 'w') as f:
            json.dump(summary, f, indent=2)

        print(f'Total crashes found: {summary[\"total_crashes\"]}')
        if summary['total_crashes'] > 0:
            print('❌ Fuzzing found security issues!')
            exit(1)
        else:
            print('✅ No security issues found in fuzzing')
        "

    - name: Upload fuzzing artifacts
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: fuzzing-results
        path: |
          apps/api/rust_compute_kernels/fuzzing_summary.txt
          apps/api/rust_compute_kernels/fuzzing_results.json
          apps/api/rust_compute_kernels/fuzz/artifacts/

  security_report:
    name: Generate Security Report
    runs-on: ubuntu-latest
    needs: [security_regression, rust_fuzzing]
    if: always()

    steps:
    - uses: actions/checkout@v4

    - name: Download all security test results
      uses: actions/download-artifact@v3

    - name: Generate comprehensive security report
      run: |
        python3 -c "
        import json
        import os
        from datetime import datetime

        print('🛡️ COMPREHENSIVE SECURITY REPORT')
        print('================================')

        report = {
            'timestamp': datetime.now().isoformat(),
            'commit_sha': '${{ github.sha }}',
            'branch': '${{ github.ref_name }}',
            'regression_tests': {
                'status': 'unknown',
                'vulnerabilities_tested': 9,
                'tests_passed': 0,
                'tests_failed': 0
            },
            'fuzzing': {
                'status': 'unknown',
                'duration_seconds': 0,
                'total_crashes': 0,
                'fuzzers_run': 0
            },
            'performance_impact': {
                'regression_detected': False,
                'string_ops_ms': 0,
                'regex_ops_ms': 0
            },
            'overall_security_score': 0,
            'recommendation': 'unknown'
        }

        # Process regression test results
        regression_files = []
        if os.path.exists('security-regression-results'):
            for f in os.listdir('security-regression-results'):
                if f.startswith('security_regression_report_') and f.endswith('.json'):
                    regression_files.append(os.path.join('security-regression-results', f))

        if regression_files:
            with open(regression_files[-1]) as f:  # Latest report
                regression_data = json.load(f)

            report['regression_tests']['status'] = 'passed' if not regression_data.get('regression_detected', True) else 'failed'
            report['regression_tests']['tests_passed'] = regression_data.get('tests_passed', 0)
            report['regression_tests']['tests_failed'] = regression_data.get('tests_failed', 0)

            print(f'✅ Regression Tests: {regression_data.get(\"tests_passed\", 0)}/{regression_data.get(\"tests_passed\", 0) + regression_data.get(\"tests_failed\", 0)} passed')

        # Process performance check
        perf_file = 'security-regression-results/security_performance_check.json'
        if os.path.exists(perf_file):
            with open(perf_file) as f:
                perf_data = json.load(f)

            report['performance_impact'] = perf_data
            print(f'✅ Performance Impact: String ops {perf_data.get(\"string_ops_avg_ms\", 0):.1f}ms, Regex ops {perf_data.get(\"regex_ops_avg_ms\", 0):.1f}ms')

        # Process fuzzing results
        fuzz_file = 'fuzzing-results/fuzzing_results.json'
        if os.path.exists(fuzz_file):
            with open(fuzz_file) as f:
                fuzz_data = json.load(f)

            report['fuzzing']['status'] = 'passed' if fuzz_data.get('total_crashes', 0) == 0 else 'failed'
            report['fuzzing']['duration_seconds'] = fuzz_data.get('duration_seconds', 0)
            report['fuzzing']['total_crashes'] = fuzz_data.get('total_crashes', 0)
            report['fuzzing']['fuzzers_run'] = len(fuzz_data.get('fuzzers', {}))

            print(f'✅ Fuzzing: {report[\"fuzzing\"][\"fuzzers_run\"]} fuzzers, {report[\"fuzzing\"][\"total_crashes\"]} crashes found')

        # Calculate overall security score
        score = 100  # Start with perfect score

        # Deduct for regression test failures
        if report['regression_tests']['tests_failed'] > 0:
            score -= report['regression_tests']['tests_failed'] * 10

        # Deduct for fuzzing crashes
        score -= report['fuzzing']['total_crashes'] * 20

        # Deduct for performance regressions
        if report['performance_impact']['regression_detected']:
            score -= 15

        report['overall_security_score'] = max(0, score)

        # Determine recommendation
        if score >= 90:
            report['recommendation'] = 'production_ready'
            status_emoji = '✅'
            status_text = 'PRODUCTION READY'
        elif score >= 70:
            report['recommendation'] = 'needs_fixes'
            status_emoji = '⚠️'
            status_text = 'NEEDS SECURITY FIXES'
        else:
            report['recommendation'] = 'not_ready'
            status_emoji = '❌'
            status_text = 'NOT PRODUCTION READY'

        print(f'')
        print(f'{status_emoji} OVERALL SECURITY STATUS: {status_text}')
        print(f'🔒 Security Score: {score}/100')
        print(f'📊 Recommendation: {report[\"recommendation\"].replace(\"_\", \" \").title()}')

        # Save comprehensive report
        with open('comprehensive_security_report.json', 'w') as f:
            json.dump(report, f, indent=2)

        # Exit with error if security issues found
        if score < 90:
            print('❌ Security issues detected - build should be rejected')
            exit(1)
        else:
            print('✅ All security tests passed')
        "

    - name: Upload comprehensive security report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: comprehensive-security-report
        path: comprehensive_security_report.json

    - name: Comment PR with security results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');

          try {
            if (fs.existsSync('comprehensive_security_report.json')) {
              const report = JSON.parse(fs.readFileSync('comprehensive_security_report.json', 'utf8'));

              const score = report.overall_security_score;
              const emoji = score >= 90 ? '✅' : score >= 70 ? '⚠️' : '❌';
              const status = score >= 90 ? 'All Security Tests Passed' :
                           score >= 70 ? 'Security Issues Detected' : 'Critical Security Issues';

              const comment = `## ${emoji} ${status}

          **Security Test Results:**

          - **Overall Security Score:** ${score}/100
          - **Regression Tests:** ${report.regression_tests.tests_passed}/${report.regression_tests.tests_passed + report.regression_tests.tests_failed} passed
          - **Fuzzing Results:** ${report.fuzzing.total_crashes} crashes found (${report.fuzzing.fuzzers_run} fuzzers, ${report.fuzzing.duration_seconds}s)
          - **Performance Impact:** ${report.performance_impact.regression_detected ? 'Regression detected' : 'Minimal impact'}

          **Vulnerability Coverage:**
          - VUL-001: Unicode surrogate validation ✅
          - VUL-002: Regex ReDoS protection ✅
          - VUL-003: Memory exhaustion prevention ✅
          - VUL-004: Mutex poisoning recovery ✅
          - VUL-005: String overflow protection ✅
          - VUL-006: Path traversal validation ✅
          - VUL-007: Invalid UTF-8 sanitization ✅
          - VUL-008: Operation timeouts ✅
          - VUL-009: Integer overflow protection ✅

          ${score >= 90 ? '🎉 **All security tests passed!** Ready for production.' :
            score >= 70 ? '⚠️ **Security fixes needed** before production deployment.' :
                         '❌ **Critical security issues** must be resolved immediately.'}
          `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
          } catch (error) {
            console.log('Could not post security results:', error);
          }