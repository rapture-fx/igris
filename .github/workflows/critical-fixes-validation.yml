name: Critical P0 Fixes Validation

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/api/**'
      - 'packages/backend/**'
      - '.github/workflows/critical-fixes-validation.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/api/**'
      - 'packages/backend/**'
      - '.github/workflows/critical-fixes-validation.yml'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of tests to run'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - smoke
          - security
          - performance
          - integration

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '18'
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: test_critical_fixes
  ENVIRONMENT: testing
  CSRF_PROTECTION_ENABLED: true
  RATE_LIMITING_ENABLED: true

jobs:
  setup:
    name: Setup Test Environment
    runs-on: ubuntu-latest
    outputs:
      test-type: ${{ steps.determine-tests.outputs.test-type }}
      cache-key: ${{ steps.cache-key.outputs.key }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine test type
        id: determine-tests
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "test-type=${{ github.event.inputs.test_type }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "test-type=smoke" >> $GITHUB_OUTPUT
          else
            echo "test-type=all" >> $GITHUB_OUTPUT
          fi

      - name: Generate cache key
        id: cache-key
        run: |
          echo "key=deps-${{ runner.os }}-python${{ env.PYTHON_VERSION }}-${{ hashFiles('**/requirements*.txt', '**/pyproject.toml', '**/package*.json') }}" >> $GITHUB_OUTPUT

  database-tests:
    name: Database Persistence Tests
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.test-type == 'all' || needs.setup.outputs.test-type == 'smoke'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            deps-${{ runner.os }}-python${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-timeout

      - name: Run database persistence tests
        env:
          DATABASE_URL: postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          TEST_DATABASE_URL: postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd apps/api
          python -m pytest tests/critical_fixes/test_rl_optimization_database_persistence.py \
            -v --tb=short --cov=app --cov-report=xml:coverage-db.xml \
            --junitxml=test-results-db.xml

      - name: Upload database test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: database-test-results
          path: |
            apps/api/coverage-db.xml
            apps/api/test-results-db.xml

  data-quality-tests:
    name: Data Quality API Tests
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.test-type == 'all' || needs.setup.outputs.test-type == 'smoke'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            deps-${{ runner.os }}-python${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-timeout
          pip install pandas openpyxl fastparquet

      - name: Run data quality API tests
        env:
          DATABASE_URL: sqlite:///test_data_quality.db
          TEST_DATABASE_URL: sqlite:///test_data_quality.db
        run: |
          cd apps/api
          python -m pytest tests/critical_fixes/test_data_quality_api_runtime_errors.py \
            -v --tb=short --cov=app --cov-report=xml:coverage-dq.xml \
            --junitxml=test-results-dq.xml

      - name: Upload data quality test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: data-quality-test-results
          path: |
            apps/api/coverage-dq.xml
            apps/api/test-results-dq.xml

  security-tests:
    name: Security Configuration Tests
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.test-type == 'all' || needs.setup.outputs.test-type == 'security' || needs.setup.outputs.test-type == 'smoke'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            deps-${{ runner.os }}-python${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-timeout

      - name: Run security configuration tests
        env:
          DATABASE_URL: sqlite:///test_security.db
          TEST_DATABASE_URL: sqlite:///test_security.db
          ENVIRONMENT: production  # Test production security settings
        run: |
          cd apps/api
          python -m pytest tests/critical_fixes/test_security_configuration_validation.py \
            -v --tb=short --cov=app --cov-report=xml:coverage-security.xml \
            --junitxml=test-results-security.xml

      - name: Upload security test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-test-results
          path: |
            apps/api/coverage-security.xml
            apps/api/test-results-security.xml

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.test-type == 'all' || needs.setup.outputs.test-type == 'integration'

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            deps-${{ runner.os }}-python${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-timeout
          pip install pandas openpyxl fastparquet

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          TEST_DATABASE_URL: postgresql://postgres:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          REDIS_URL: redis://localhost:6379/0
        run: |
          cd apps/api
          python -m pytest tests/critical_fixes/test_integration_end_to_end_workflows.py \
            -v --tb=short --cov=app --cov-report=xml:coverage-integration.xml \
            --junitxml=test-results-integration.xml \
            --timeout=300

      - name: Upload integration test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: integration-test-results
          path: |
            apps/api/coverage-integration.xml
            apps/api/test-results-integration.xml

  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    needs: setup
    if: needs.setup.outputs.test-type == 'all' || needs.setup.outputs.test-type == 'performance'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ needs.setup.outputs.cache-key }}
          restore-keys: |
            deps-${{ runner.os }}-python${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-timeout
          pip install psutil pandas openpyxl fastparquet

      - name: Run performance tests
        env:
          DATABASE_URL: sqlite:///test_performance.db
          TEST_DATABASE_URL: sqlite:///test_performance.db
        run: |
          cd apps/api
          python -m pytest tests/critical_fixes/test_performance_load_testing.py \
            -v --tb=short --cov=app --cov-report=xml:coverage-performance.xml \
            --junitxml=test-results-performance.xml \
            --timeout=600

      - name: Upload performance test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-test-results
          path: |
            apps/api/coverage-performance.xml
            apps/api/test-results-performance.xml

  comprehensive-report:
    name: Generate Comprehensive Report
    runs-on: ubuntu-latest
    needs: [setup, database-tests, data-quality-tests, security-tests, integration-tests, performance-tests]
    if: always() && (needs.setup.outputs.test-type == 'all' || github.event_name == 'push')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download all test results
        uses: actions/download-artifact@v3
        with:
          path: test-artifacts

      - name: Install report dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest coverage[toml] junitparser

      - name: Merge coverage reports
        run: |
          cd apps/api
          coverage combine test-artifacts/*/coverage*.xml || true
          coverage report --format=markdown > coverage-summary.md || true
          coverage html -d htmlcov || true

      - name: Generate comprehensive report
        run: |
          cd apps/api
          python tests/critical_fixes/run_critical_fixes_tests.py --generate-report --ci-mode || true

      - name: Upload comprehensive report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: comprehensive-report
          path: |
            apps/api/tests/critical_fixes/reports/
            apps/api/htmlcov/
            apps/api/coverage-summary.md

      - name: Comment PR with test results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Try to read coverage summary
            let coverageSummary = 'Coverage report not available';
            try {
              coverageSummary = fs.readFileSync('apps/api/coverage-summary.md', 'utf8');
            } catch (e) {
              console.log('Could not read coverage summary:', e.message);
            }

            // Determine overall status
            const testJobs = ['database-tests', 'data-quality-tests', 'security-tests'];
            const jobResults = testJobs.map(job => {
              const result = context.payload.check_suite?.conclusion || 'unknown';
              return { job, result };
            });

            const overallStatus = jobResults.every(r => r.result === 'success') ? '✅ PASSED' : '❌ FAILED';

            const comment = `
            ## Critical P0 Fixes Validation Results

            **Overall Status: ${overallStatus}**

            ### Test Results
            ${jobResults.map(r => `- ${r.job}: ${r.result === 'success' ? '✅' : '❌'} ${r.result}`).join('\n')}

            ### Coverage Summary
            \`\`\`
            ${coverageSummary}
            \`\`\`

            ### Production Readiness
            ${overallStatus.includes('PASSED') ?
              '🚀 **PRODUCTION READY**: All critical fixes validated successfully!' :
              '⚠️ **NOT PRODUCTION READY**: Critical issues found that must be resolved before deployment.'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  deployment-readiness:
    name: Deployment Readiness Check
    runs-on: ubuntu-latest
    needs: [database-tests, data-quality-tests, security-tests, integration-tests]
    if: always() && github.ref == 'refs/heads/main'

    steps:
      - name: Check deployment readiness
        run: |
          echo "Checking deployment readiness..."

          # Check if all critical tests passed
          if [[ "${{ needs.database-tests.result }}" == "success" && \
                "${{ needs.data-quality-tests.result }}" == "success" && \
                "${{ needs.security-tests.result }}" == "success" ]]; then
            echo "✅ ALL CRITICAL TESTS PASSED"
            echo "🚀 SYSTEM IS READY FOR PRODUCTION DEPLOYMENT"
            echo "deployment-ready=true" >> $GITHUB_ENV
          else
            echo "❌ CRITICAL TESTS FAILED"
            echo "⚠️ SYSTEM IS NOT READY FOR PRODUCTION DEPLOYMENT"
            echo "deployment-ready=false" >> $GITHUB_ENV
            exit 1
          fi

      - name: Create deployment readiness badge
        if: success()
        run: |
          echo "Creating deployment readiness badge..."
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{
              "state": "success",
              "description": "Critical P0 fixes validated - Ready for production",
              "context": "critical-fixes/deployment-readiness"
            }'

      - name: Mark deployment as not ready
        if: failure()
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{
              "state": "failure",
              "description": "Critical P0 fixes validation failed - Not ready for production",
              "context": "critical-fixes/deployment-readiness"
            }'