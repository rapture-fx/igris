name: Performance Benchmarks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      benchmark_size:
        description: 'Benchmark data size'
        required: false
        default: 'medium'
        type: choice
        options:
        - small
        - medium
        - large

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  benchmark:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          apps/api/rust_compute_kernels/target
        key: ${{ runner.os }}-rust-${{ hashFiles('apps/api/rust_compute_kernels/Cargo.toml') }}

    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin pandas polars psutil pytest
        cd apps/api && pip install -e .

    - name: Build Rust kernels
      run: |
        cd apps/api/rust_compute_kernels
        maturin develop --release

    - name: Run benchmark suite
      id: benchmark
      run: |
        cd apps/api
        python -c "
        import json
        import sys
        from schlep_engine.benchmarks import run_comprehensive_benchmark, generate_benchmark_report

        # Determine benchmark size
        size_input = '${{ github.event.inputs.benchmark_size || 'medium' }}'
        if size_input == 'small':
            sizes = [1_000, 5_000, 10_000]
        elif size_input == 'large':
            sizes = [50_000, 100_000, 500_000, 1_000_000]
        else:  # medium
            sizes = [10_000, 50_000, 100_000]

        print(f'Running benchmarks with sizes: {sizes}')

        try:
            results = run_comprehensive_benchmark(sizes)
            report = generate_benchmark_report(results)

            # Save results
            with open('benchmark_results.json', 'w') as f:
                json.dump(results, f, indent=2)

            with open('benchmark_report.txt', 'w') as f:
                f.write(report)

            print('Benchmark completed successfully')
            print(report)

        except Exception as e:
            print(f'Benchmark failed: {e}')
            sys.exit(1)
        "

    - name: Check performance regressions
      id: regression_check
      run: |
        cd apps/api
        python -c "
        import json
        import os
        import sys

        # Load current results
        with open('benchmark_results.json') as f:
            current = json.load(f)

        # Performance thresholds (minimum expected speedups)
        thresholds = {
            'csv_reading': 2.0,      # Must be 2x faster than pandas
            'aggregations': 3.0,     # Must be 3x faster than pandas
            'string_processing': 5.0 # Must be 5x faster than pandas
        }

        # Check if we meet performance requirements
        summary = current.get('summary', {})
        avg_speedups = summary.get('average_speedups', {})

        regression_detected = False
        issues = []

        for operation, threshold in thresholds.items():
            speedup = avg_speedups.get(operation, 0)
            if speedup < threshold:
                regression_detected = True
                issues.append(f'{operation}: {speedup:.2f}x < {threshold}x (FAILED)')
            else:
                issues.append(f'{operation}: {speedup:.2f}x >= {threshold}x (PASSED)')

        print('Performance Check Results:')
        for issue in issues:
            print(f'  {issue}')

        if regression_detected:
            print('❌ Performance regression detected!')
            # Save regression info for PR comment
            with open('regression_detected.txt', 'w') as f:
                f.write('true')
            sys.exit(1)
        else:
            print('✅ All performance thresholds met!')
            with open('regression_detected.txt', 'w') as f:
                f.write('false')
        "

    - name: Upload benchmark results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: benchmark-results-py${{ matrix.python-version }}
        path: |
          apps/api/benchmark_results.json
          apps/api/benchmark_report.txt
          apps/api/regression_detected.txt

    - name: Comment PR with performance results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          const path = require('path');

          try {
            const reportPath = 'apps/api/benchmark_report.txt';
            const regressionPath = 'apps/api/regression_detected.txt';

            if (fs.existsSync(reportPath)) {
              const report = fs.readFileSync(reportPath, 'utf8');
              const hasRegression = fs.readFileSync(regressionPath, 'utf8').trim() === 'true';

              const emoji = hasRegression ? '❌' : '✅';
              const status = hasRegression ? 'Performance Regression Detected' : 'Performance Check Passed';

              const comment = `## ${emoji} ${status}

          **Python ${{ matrix.python-version }} Benchmark Results:**

          \`\`\`
          ${report}
          \`\`\`

          ${hasRegression ? '⚠️ **Action Required:** Performance has degraded below acceptable thresholds.' : '🎉 All performance benchmarks are within acceptable ranges.'}
          `;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }
          } catch (error) {
            console.log('Could not post benchmark results:', error);
          }

  security_tests:
    runs-on: ubuntu-latest
    needs: benchmark

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin pandas polars psutil pytest
        cd apps/api && pip install -e .

    - name: Build Rust kernels
      run: |
        cd apps/api/rust_compute_kernels
        maturin develop --release

    - name: Run security regression tests
      run: |
        cd apps/api/rust_compute_kernels
        python tests/test_security_regression.py

    - name: Run legacy security fuzz tests
      run: |
        cd apps/api/rust_compute_kernels
        python tests/test_security_fuzz.py

    - name: Upload security results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: security-test-results
        path: |
          apps/api/rust_compute_kernels/security_fuzz_results.json

  memory_safety:
    runs-on: ubuntu-latest
    needs: benchmark

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: stable
        override: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install maturin pandas polars psutil pytest
        cd apps/api && pip install -e .

    - name: Build Rust kernels
      run: |
        cd apps/api/rust_compute_kernels
        maturin develop --release

    - name: Run memory safety tests
      run: |
        cd apps/api/rust_compute_kernels
        python tests/test_memory_quick.py

  publish_results:
    runs-on: ubuntu-latest
    needs: [benchmark, security_tests, memory_safety]
    if: always()

    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v3

    - name: Create performance dashboard data
      run: |
        python -c "
        import json
        import os
        from datetime import datetime

        # Collect all benchmark results
        dashboard_data = {
            'timestamp': datetime.now().isoformat(),
            'commit_sha': '${{ github.sha }}',
            'branch': '${{ github.ref_name }}',
            'python_versions': {},
            'security_score': None,
            'memory_safety': 'unknown'
        }

        # Process benchmark results for each Python version
        for item in os.listdir('.'):
            if item.startswith('benchmark-results-py'):
                py_version = item.replace('benchmark-results-py', '')
                results_file = os.path.join(item, 'benchmark_results.json')

                if os.path.exists(results_file):
                    with open(results_file) as f:
                        results = json.load(f)

                    dashboard_data['python_versions'][py_version] = {
                        'speedups': results.get('summary', {}).get('average_speedups', {}),
                        'max_speedups': results.get('summary', {}).get('max_speedups', {})
                    }

        # Process security results
        security_file = 'security-test-results/security_fuzz_results.json'
        if os.path.exists(security_file):
            with open(security_file) as f:
                security_results = json.load(f)
            dashboard_data['security_score'] = security_results.get('security_score', 0)

        # Save dashboard data
        with open('performance_dashboard.json', 'w') as f:
            json.dump(dashboard_data, f, indent=2)

        print('Performance dashboard data created')
        "

    - name: Upload dashboard data
      uses: actions/upload-artifact@v4
      with:
        name: performance-dashboard
        path: performance_dashboard.json

    - name: Update performance tracking (if main branch)
      if: github.ref == 'refs/heads/main'
      run: |
        # This could push to a separate repo or database for tracking
        # performance over time
        echo "Would update performance tracking database"