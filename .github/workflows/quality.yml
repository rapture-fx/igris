name: 🔍 Code Quality

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip install -r apps/api/requirements.txt

      - name: 🐍 Scan Python dependencies
        run: pip-audit

      - name: Build Docker image
        run: docker build . -f apps/api/Dockerfile -t schlep-api-image

      - name: 🐳 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "schlep-api-image"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"
  code-quality:
    name: 🔍 Code Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: 📦 Install Python quality tools
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8 mypy bandit safety

      - name: 🎨 Check Python formatting
        run: |
          cd apps/api
          black --check --diff . || echo "❌ Python formatting issues found"
          isort --check-only --diff . || echo "❌ Import sorting issues found"

      - name: 🧹 Python linting
        run: |
          cd apps/api
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: 🔍 Type checking
        run: |
          cd apps/api
          mypy app/ --ignore-missing-imports || echo "❌ Type checking issues found"

      - name: 🔒 Security scanning
        run: |
          cd apps/api
          bandit -r app/ -f json -o bandit-report.json || true
          safety check --json --output safety-report.json || true

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: 🔧 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 📦 Install frontend dependencies
        run: pnpm install

      - name: 🧹 Frontend linting
        run: pnpm run lint || echo "❌ Frontend linting issues found"

      - name: 📊 Upload quality reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quality-reports
          path: |
            apps/api/bandit-report.json
            apps/api/safety-report.json

  dependency-check:
    name: 📦 Dependency Security
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔒 Run dependency audit
        uses: ossf/scorecard-action@v2.3.1
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          repo_token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Upload SARIF results
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: scorecard-results.sarif
