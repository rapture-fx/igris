name: Deploy to Hetzner VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect what changed
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "$CHANGED"

          # Console: web/** or labs/packages/**
          if echo "$CHANGED" | grep -qE '^(web/|labs/packages/)'; then
            echo "console=true" >> $GITHUB_OUTPUT
          else
            echo "console=false" >> $GITHUB_OUTPUT
          fi

          # API: Go source files
          if echo "$CHANGED" | grep -qE '^(igris-overture/|cmd/|Dockerfile$)'; then
            echo "api=true" >> $GITHUB_OUTPUT
          else
            echo "api=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy console
        if: steps.changes.outputs.console == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /home/wira/igris
            git pull origin main
            docker compose -f docker-compose.production.yml build console
            docker compose -f docker-compose.production.yml up -d console
            docker image prune -f

      - name: Deploy API
        if: steps.changes.outputs.api == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /home/wira/igris
            git pull origin main
            docker compose -f docker-compose.production.yml build api
            docker compose -f docker-compose.production.yml up -d api
            docker image prune -f
