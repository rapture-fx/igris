name: Deploy to Hetzner VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Detect what changed
        id: changes
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD)
          echo "$CHANGED"

          # Console: web/** or labs/packages/**
          if echo "$CHANGED" | grep -qE '^(web/|labs/packages/)'; then
            echo "console=true" >> $GITHUB_OUTPUT
          else
            echo "console=false" >> $GITHUB_OUTPUT
          fi

          # API: Go source files
          if echo "$CHANGED" | grep -qE '^(igris-overture/|cmd/|Dockerfile$)'; then
            echo "api=true" >> $GITHUB_OUTPUT
          else
            echo "api=false" >> $GITHUB_OUTPUT
          fi

      - name: Deploy console
        if: steps.changes.outputs.console == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/wira/igris
            git pull origin main
            docker compose -f docker-compose.production.yml build console
            docker compose -f docker-compose.production.yml up -d --force-recreate console
            docker image prune -f

      - name: Deploy API
        if: steps.changes.outputs.api == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/wira/igris
            git pull origin main
            docker compose -f docker-compose.production.yml build api
            docker compose -f docker-compose.production.yml up -d --force-recreate api
            docker image prune -f

      - name: Notify Telegram
        if: always()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS="${{ job.status }}"
          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)
          COMMIT_SHA="${{ github.sha }}"
          SHORT_SHA="${COMMIT_SHA:0:7}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          CONSOLE_CHANGED="${{ steps.changes.outputs.console }}"
          API_CHANGED="${{ steps.changes.outputs.api }}"
          CHANGED_LABEL=""
          [ "$CONSOLE_CHANGED" = "true" ] && CHANGED_LABEL="${CHANGED_LABEL}console "
          [ "$API_CHANGED" = "true" ] && CHANGED_LABEL="${CHANGED_LABEL}api"

          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
            LABEL="Deploy successful"
          else
            EMOJI="❌"
            LABEL="Deploy FAILED"
          fi

          MSG="${EMOJI} <b>Igris Inertial — ${LABEL}</b>
<b>Changed:</b> ${CHANGED_LABEL:-none}
<b>Commit:</b> <code>${SHORT_SHA}</code> ${COMMIT_MSG}
<a href=\"${RUN_URL}\">View run →</a>"

          curl -s -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -d chat_id="${CHAT_ID}" \
            -d text="${MSG}" \
            -d parse_mode="HTML" \
            -o /dev/null
