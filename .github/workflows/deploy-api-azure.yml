name: Deploy API to Azure

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: "GitHub environment to deploy to"
        required: true
        type: choice
        options:
          - staging
          - production
      api_image_digest:
        description: "Pinned API image digest, for example ghcr.io/igris-inertial/system/igris-api@sha256:<64 hex chars>"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-azure-${{ inputs.target_environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy igris-api to ${{ inputs.target_environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    env:
      TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
      API_IMAGE_DIGEST: ${{ inputs.api_image_digest }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINERAPPS_ENV: ${{ vars.AZURE_CONTAINERAPPS_ENV }}
      AZURE_API_APP: ${{ vars.AZURE_API_APP }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      IGRIS_AGENT_API_KEY: ${{ secrets.IGRIS_AGENT_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment input
        shell: bash
        run: |
          set -euo pipefail

          case "${TARGET_ENVIRONMENT}" in
            staging|production) ;;
            *)
              echo "target_environment must be staging or production." >&2
              exit 1
              ;;
          esac

          case "${API_IMAGE_DIGEST}" in
            ghcr.io/*@sha256:*) ;;
            *)
              echo "api_image_digest must be a pinned GHCR digest like ghcr.io/...@sha256:<digest>." >&2
              exit 1
              ;;
          esac

          digest="${API_IMAGE_DIGEST##*@sha256:}"
          if [[ ! "${digest}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "api_image_digest digest must be exactly 64 hexadecimal characters." >&2
            exit 1
          fi

          : "${AZURE_CLIENT_ID:?AZURE_CLIENT_ID environment variable is required}"
          : "${AZURE_TENANT_ID:?AZURE_TENANT_ID environment variable is required}"
          : "${AZURE_SUBSCRIPTION_ID:?AZURE_SUBSCRIPTION_ID environment variable is required}"
          : "${AZURE_RESOURCE_GROUP:?AZURE_RESOURCE_GROUP environment variable is required}"
          : "${AZURE_CONTAINERAPPS_ENV:?AZURE_CONTAINERAPPS_ENV environment variable is required}"
          : "${AZURE_API_APP:?AZURE_API_APP environment variable is required}"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        shell: bash
        run: |
          set -euo pipefail

          az extension add --name containerapp --upgrade --only-show-errors 1>/dev/null

          if [ -n "${GHCR_USERNAME}" ] && [ -n "${GHCR_TOKEN}" ]; then
            az containerapp registry set \
              --name "${AZURE_API_APP}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --server ghcr.io \
              --username "${GHCR_USERNAME}" \
              --password "${GHCR_TOKEN}" \
              --only-show-errors 1>/dev/null
          fi

          az containerapp update \
            --name "${AZURE_API_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --image "${API_IMAGE_DIGEST}" \
            --only-show-errors 1>/dev/null

      - name: Resolve API FQDN
        id: endpoint
        shell: bash
        run: |
          set -euo pipefail

          fqdn="$(
            az containerapp show \
              --name "${AZURE_API_APP}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query properties.configuration.ingress.fqdn \
              -o tsv
          )"

          if [ -z "${fqdn}" ]; then
            echo "Azure Container App ingress FQDN was empty." >&2
            exit 1
          fi

          echo "api_base=https://${fqdn}" >> "${GITHUB_OUTPUT}"

      - name: Smoke API
        shell: bash
        env:
          API_BASE: ${{ steps.endpoint.outputs.api_base }}
        run: |
          set -euo pipefail

          curl_retry() {
            curl --fail --silent --show-error --retry 18 --retry-all-errors --retry-delay 10 "$@"
          }

          curl_retry "${API_BASE}/healthz" >/dev/null
          curl_retry "${API_BASE}/readyz" >/dev/null

          if [ -n "${IGRIS_AGENT_API_KEY}" ]; then
            body='{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}'
            response="$(
              curl_retry \
                -X POST \
                -H "Authorization: Bearer ${IGRIS_AGENT_API_KEY}" \
                -H "Content-Type: application/json" \
                -d "${body}" \
                "${API_BASE}/v1/mcp"
            )"

            if ! printf '%s' "${response}" | jq -e '.result.tools | length > 0' >/dev/null; then
              echo "MCP tools/list smoke did not return tools." >&2
              exit 1
            fi
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo "### API deployment"
            echo "Environment: \`${TARGET_ENVIRONMENT}\`"
            echo "Container App: \`${AZURE_API_APP}\`"
            echo "Image: \`${API_IMAGE_DIGEST}\`"
            echo "Smoke: \`/healthz\`, \`/readyz\`"
          } >> "${GITHUB_STEP_SUMMARY}"
