name: Pollarbase CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: [3.11, 3.12]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('packages/backend/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        cd packages/backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov
    
    - name: Lint with flake8
      run: |
        cd packages/backend
        pip install flake8
        # Stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Type check with mypy
      run: |
        cd packages/backend
        pip install mypy
        mypy app/ --ignore-missing-imports
    
    - name: Test with pytest
      run: |
        cd packages/backend
        pytest tests/ -v --cov=app --cov-report=xml
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: packages/backend/coverage.xml
        flags: backend
        name: backend-coverage

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'pnpm'
        cache-dependency-path: packages/frontend/pnpm-lock.yaml
    
    - name: Install dependencies
      run: |
        cd packages/frontend
        pnpm install --frozen-lockfile
    
    - name: Lint TypeScript
      run: |
        cd packages/frontend
        pnpm run lint
    
    - name: Type check
      run: |
        cd packages/frontend
        pnpm run type-check
    
    - name: Run tests
      run: |
        cd packages/frontend
        pnpm test -- --coverage --watchAll=false
    
    - name: Build production
      run: |
        cd packages/frontend
        pnpm run build
    
    - name: Upload frontend coverage
      uses: codecov/codecov-action@v3
      with:
        file: packages/frontend/coverage/clover.xml
        flags: frontend
        name: frontend-coverage

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pollarbase_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 18.x
        cache: 'pnpm'
        cache-dependency-path: packages/frontend/pnpm-lock.yaml
    
    - name: Install backend dependencies
      run: |
        cd packages/backend
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Install frontend dependencies
      run: |
        cd packages/frontend
        pnpm install --frozen-lockfile
    
    - name: Start backend server
      run: |
        cd packages/backend
        python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 &
        sleep 10
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost/pollarbase_test
    
    - name: Build frontend
      run: |
        cd packages/frontend
        pnpm run build
    
    - name: Run integration tests
      run: |
        cd packages/backend
        python test_ai_framework_integration.py
    
    - name: Health check
      run: |
        curl -f http://localhost:8000/health || exit 1

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
    
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, integration-tests, security-scan]
    if: github.ref == 'refs/heads/develop'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to staging environment
      run: |
        echo "Deploying to staging environment..."
        # Add your staging deployment commands here
    
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, integration-tests, security-scan]
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to production environment
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
    
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        body: |
          ## Changes in this release
          
          See [CHANGELOG.md](./CHANGELOG.md) for details.
        draft: false
        prerelease: false

  docker-build:
    name: Build & Scan Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build API image
        id: build_api
        uses: docker/build-push-action@v4
        with:
          context: .
          file: packages/backend/Dockerfile.api
          platforms: linux/amd64
          push: false
          tags: pollarbase/backend:ci-${{ github.sha }}

      - name: Build Frontend image
        id: build_frontend
        uses: docker/build-push-action@v4
        with:
          context: packages/frontend
          file: packages/frontend/Dockerfile
          platforms: linux/amd64
          push: false
          tags: pollarbase/frontend:ci-${{ github.sha }}

      - name: Scan API image with Trivy
        uses: aquasecurity/trivy-action@0.12.0
        with:
          scan-type: image
          image-ref: pollarbase/backend:ci-${{ github.sha }}
          format: table
          exit-code: 0

      - name: Scan Frontend image with Trivy
        uses: aquasecurity/trivy-action@0.12.0
        with:
          scan-type: image
          image-ref: pollarbase/frontend:ci-${{ github.sha }}
          format: table
          exit-code: 0