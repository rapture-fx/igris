name: Proof Gate

on:
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/proof-gate.yml"
      - "cmd/igris-overture/**"
      - "igris-overture/**"
      - "igris-runtime/**"
      - "scripts/**proof*.sh"
      - "scripts/ci_proof_gate.sh"
      - "go.mod"
      - "go.sum"
  merge_group:
  workflow_dispatch:
    inputs:
      proof_tier:
        description: "Proof tier to run"
        required: true
        default: "heavy"
        type: choice
        options:
          - fast
          - heavy
      run_tier_b:
        description: "Also run Tier B containment proofs (requires a self-hosted, cgroup-capable runner labelled 'containment-capable')"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 9 * * *"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/proof-gate.yml"
      - "cmd/igris-overture/**"
      - "igris-overture/**"
      - "igris-runtime/**"
      - "scripts/**proof*.sh"
      - "scripts/ci_proof_gate.sh"
      - "go.mod"
      - "go.sum"

jobs:
  fast-proof-gate:
    name: fast deterministic proof gate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: igris_overture_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d igris_overture_proof"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/igris_overture_proof?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run fast proof gate
        run: scripts/ci_proof_gate.sh fast

  # Continuous heavy regression insurance (Clock 3C):
  # run the complete heavy proof gate on PRs and pushes that touch the durable
  # proof surface, plus schedule / mainline / explicit dispatch. Failures are
  # never continue-on-error. GitHub-hosted runners honestly skip containment
  # (Tier B) rather than reporting a false green.
  cumulative-clean-host-proof:
    name: heavy cumulative clean-host proof
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.proof_tier == 'heavy')

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: igris_overture_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d igris_overture_proof"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/igris_overture_proof?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      # The proof scripts build Overture OFFLINE (GOPROXY=off GOSUMDB=off
      # GOFLAGS=-mod=readonly) to keep the proof hermetic. That only works if
      # the module cache is already complete — the restored actions cache is
      # not guaranteed to be. Prime it here, while network is still allowed;
      # `go mod download` verifies against the committed go.sum and can never
      # modify go.mod/go.sum, so dependency drift still fails the gate.
      - name: Prime Go module cache for offline proof builds
        run: go mod download

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install proof dependencies
        run: sudo apt-get update && sudo apt-get install -y postgresql-client lsof

      - name: Run heavy cumulative proof gate
        run: scripts/ci_proof_gate.sh heavy

  # Tier B — containment-capable runner.
  #
  # GitHub-hosted runners (Tier A above) cannot create cgroups, so the gate
  # honestly SKIPS the agent-inference containment proofs there (see
  # ci_proof_gate.sh: run_core_proof_suite_containment_aware). Tier B runs the
  # SAME gate on a runner that CAN enforce containment, with
  # IGRIS_REQUIRE_CONTAINMENT=1 so an incapable runner fails red instead of
  # skipping — i.e. the containment guarantee is actually proven here.
  #
  # Dormant until an operator (a) registers a self-hosted Linux runner with
  # cgroup-v2 create permission (root, systemd Delegate=yes, or a privileged
  # container) labelled `containment-capable`, and (b) dispatches with
  # run_tier_b=true. See CONTAINMENT_GATE_DECISION_2026-07-05.md for the runner
  # requirements and security guidance (trusted-branch / ephemeral only).
  containment-tier-b-proof:
    name: heavy containment proof (Tier B, containment-capable runner)
    runs-on: [self-hosted, linux, containment-capable]
    if: github.event_name == 'workflow_dispatch' && inputs.proof_tier == 'heavy' && inputs.run_tier_b == true

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: igris_overture_proof
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d igris_overture_proof"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_URL: postgres://postgres:postgres@localhost:5432/igris_overture_proof?sslmode=disable
      # Fail red if this runner cannot actually enforce containment — a Tier B
      # runner that cannot create a cgroup is a real defect, never a skip.
      IGRIS_REQUIRE_CONTAINMENT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true
      - name: Prime Go module cache for offline proof builds
        run: go mod download
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run heavy proof gate with containment required
        run: scripts/ci_proof_gate.sh heavy

  heavy-proof-gate-status:
    name: heavy proof gate status
    runs-on: ubuntu-latest
    needs:
      - cumulative-clean-host-proof
      - containment-tier-b-proof
    if: always() && (github.event_name == 'workflow_dispatch' && inputs.proof_tier == 'heavy' || github.event_name == 'schedule' || github.event_name == 'push')

    steps:
      - name: Require heavy proof gate success
        env:
          TIER_A: ${{ needs.cumulative-clean-host-proof.result }}
          TIER_B: ${{ needs.containment-tier-b-proof.result }}
        run: |
          # Tier A (GitHub-hosted) must always pass. It runs everything except
          # the agent-inference containment proofs, which it honestly skips as
          # UNSUPPORTED on this runner (never reported as passed).
          if [ "$TIER_A" != "success" ]; then
            echo "Tier A (heavy cumulative clean-host proof) did not pass: $TIER_A"
            exit 1
          fi
          echo "Tier A passed."

          # Tier B result: success (containment proven), skipped (no capable
          # runner / not opted in), or failure/cancelled (must block).
          case "$TIER_B" in
            success)
              echo "Tier B passed — cgroup containment enforcement proven end-to-end." ;;
            skipped)
              echo "::warning title=Containment not proven in CI::Tier B did not run (no containment-capable runner / run_tier_b not set). Core proofs are green, but cgroup containment enforcement is UNPROVEN in this run. Dispatch with run_tier_b=true on a containment-capable runner to prove it. This is NOT a containment pass." ;;
            *)
              echo "Tier B ran on a containment-capable runner and did not pass: $TIER_B"
              exit 1 ;;
          esac
