name: Schlep-Engine CI/CD Pipeline

on:
  push:
    branches:
      - main
      - enhancement/**
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [go-gateway, rust-kernel, ml-service]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and test
        run: echo "Building ${{ matrix.component }}"

  helm-package:
    name: Package Helm Chart
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v3

      - name: Lint and package
        run: |
          helm lint helm/igris-inertial/
          helm package helm/igris-inertial/
