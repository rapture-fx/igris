name: 🚀 Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: 🚀 Deploy to Production VPS
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4

    - name: 🔐 Setup SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

    - name: 📦 Create deployment package
      run: |
        tar -czf deployment.tar.gz \
          --exclude='.git' \
          --exclude='node_modules' \
          --exclude='.next' \
          --exclude='__pycache__' \
          --exclude='*.log' \
          .

    - name: 📤 Upload to VPS
      run: |
        scp -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          deployment.tar.gz root@45.77.44.216:/tmp/

    - name: 🚀 Deploy on VPS
      run: |
        ssh -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          root@45.77.44.216 << 'EOF'
          
          # Navigate to project directory
          cd /root/schlep-engine || { echo "Project directory not found"; exit 1; }
          
          # Backup current deployment
          if [ -d "/root/schlep-engine.backup" ]; then
            rm -rf /root/schlep-engine.backup
          fi
          cp -r /root/schlep-engine /root/schlep-engine.backup || true
          
          # Extract new deployment (overwrite existing)
          cd /root/schlep-engine
          tar -xzf /tmp/deployment.tar.gz --overwrite
          
          # Stop existing containers
          docker-compose -f docker-compose.production.yml down || true
          
          # Run deployment script
          chmod +x deploy.sh
          ./deploy.sh
          
          echo "✅ Deployment completed successfully"
        EOF

    - name: 🏥 Post-deployment health check
      run: |
        sleep 45
        # Check if services are running via Docker
        ssh -o StrictHostKeyChecking=no \
          -o UserKnownHostsFile=/dev/null \
          root@45.77.44.216 \
          'cd /root/schlep-engine && docker-compose -f docker-compose.production.yml ps'
        echo "✅ Production deployment status checked"

    - name: 📢 Notify deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Deployment to VPS successful!"
        else
          echo "❌ Deployment to VPS failed!"
        fi
