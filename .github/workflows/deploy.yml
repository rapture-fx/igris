name: 🚀 Deploy to Vercel

on:
  push:
    branches: [main, staging, develop]
  pull_request:
    branches: [main, staging]

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # =============================================================================
  # QUALITY CHECKS
  # =============================================================================
  quality-checks:
    name: 🔍 Quality Checks  
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/frontend
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: './packages/frontend/pnpm-lock.yaml'

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🔍 Type check
        run: pnpm type-check

      - name: 🧹 Lint check
        run: pnpm lint

      - name: 🏗️ Build check
        run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_APP_ENV: preview

  # =============================================================================
  # BACKEND TESTS
  # =============================================================================
  backend-tests:
    name: 🧪 Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Install backend dependencies
        run: |
          cd packages/backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt || echo "No requirements.txt found"
          pip install fastapi uvicorn pytest httpx

      - name: 🧪 Run backend tests
        run: |
          cd packages/backend
          if [ -f "test_*.py" ] || [ -d "tests/" ]; then
            python -m pytest -v
          else
            echo "No tests found, creating basic health check"
            python -c "
            import sys
            sys.path.append('.')
            try:
                from app.main import app
                print('✅ Backend server imports successfully')
            except Exception as e:
                print(f'❌ Backend import failed: {e}')
                sys.exit(1)
            "
          fi

  # =============================================================================
  # DEPLOY TO VERCEL
  # =============================================================================
  deploy:
    name: 🚀 Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [quality-checks, backend-tests]
    defaults:
      run:
        working-directory: ./packages/frontend
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: './packages/frontend/pnpm-lock.yaml'

      - name: 📦 Install Vercel CLI
        run: pnpm add -g vercel@latest

      - name: 🔗 Pull Vercel Environment Information
        run: vercel pull --yes --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🏗️ Build Project Artifacts
        run: vercel build ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: 🚀 Deploy Project Artifacts to Vercel
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "deployment_url=$url" >> $GITHUB_OUTPUT
          echo "🚀 Deployed to: $url"

      - name: 💬 Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentUrl = '${{ steps.deploy.outputs.deployment_url }}';
            const comment = `
            ## 🚀 Deployment Preview Ready!
            
            **Preview URL:** ${deploymentUrl}
            
            ### 📋 Deployment Details
            - **Environment:** Preview
            - **Branch:** \`${{ github.head_ref }}\`
            - **Commit:** \`${{ github.sha }}\`
            - **Workflow:** [View Details](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
            
            ### 🧪 Testing Checklist
            - [ ] Authentication (Sign in/Sign up)
            - [ ] UI/UX components render correctly
            - [ ] API connections work
            - [ ] Mobile responsiveness
            - [ ] Performance is acceptable
            
            ---
            *This preview will be automatically updated with new commits to this PR.*
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # =============================================================================
  # HEALTH CHECK
  # =============================================================================
  health-check:
    name: 🏥 Health Check
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: 🏥 Check deployment health
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 30
          
          # Add your production URL here
          PROD_URL="https://schlep-engine.vercel.app"
          
          # Basic health check
          if curl -f -s "$PROD_URL" > /dev/null; then
            echo "✅ Production deployment is healthy"
          else
            echo "❌ Production deployment health check failed"
            exit 1
          fi

      - name: 📊 Performance audit (optional)
        run: |
          echo "Performance audit would go here"
          # You can add lighthouse CI or other performance tools here

  # =============================================================================
  # NOTIFICATIONS
  # =============================================================================
  notify:
    name: 📢 Notify Team
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()
    
    steps:
      - name: 📢 Deployment notification
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "✅ Schlep-engine deployment successful!"
            # Add Slack/Discord/Email notification here if needed
          else
            echo "❌ Schlep-engine deployment failed!"
            # Add failure notification here if needed
          fi 