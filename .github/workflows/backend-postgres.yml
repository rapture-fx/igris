name: Backend Postgres

on:
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/backend-postgres.yml"
      - "cmd/igris-overture/**"
      - "cmd/igris-db-bootstrap/**"
      - "cmd/igris-db-roles/**"
      - "cmd/igris-db-staging-preflight/**"
      - "igris-overture/**"
      - "scripts/connected/**"
      - "go.mod"
      - "go.sum"
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/backend-postgres.yml"
      - "cmd/igris-overture/**"
      - "cmd/igris-db-bootstrap/**"
      - "cmd/igris-db-roles/**"
      - "cmd/igris-db-staging-preflight/**"
      - "igris-overture/**"
      - "scripts/connected/**"
      - "go.mod"
      - "go.sum"

jobs:
  governance-postgres:
    name: governance Postgres migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: igris_overture_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d igris_overture_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      IGRIS_OVERTURE_POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/igris_overture_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
          cache: true

      - name: Run mandatory governance API Postgres migration tests
        run: go test ./igris-overture/api -run 'TestRoboticsPolicyActivationWithPostgresMigrations|TestExportRoboticsAuditBundleIncludesKeyLifecycleAndReplay|TestHILRoboticsStopAndCancelEvidenceExportsThroughAuditBundle|TestCleanupExpiredRoboticsPolicyCommandNonces' -count=1 -timeout=120s

      - name: Run deterministic greenfield bootstrap tests
        env:
          IGRIS_BOOTSTRAP_POSTGRES_ADMIN_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test ./igris-overture/database/bootstrap -count=1 -timeout=300s

      - name: Run least-privilege role boundary tests
        env:
          IGRIS_BOOTSTRAP_POSTGRES_ADMIN_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test ./igris-overture/database/roles -count=1 -timeout=300s

      - name: Run Connected runtime-role store paths
        env:
          IGRIS_BOOTSTRAP_POSTGRES_ADMIN_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test ./igris-overture/api -run 'TestConnectedPathsUnderRuntimeRolePostgres' -count=1 -timeout=300s

      - name: Run staging preflight on disposable PostgreSQL 16 database
        env:
          IGRIS_BOOTSTRAP_POSTGRES_ADMIN_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          set -euo pipefail
          DB="igris_backend_preflight_${RANDOM}"
          cleanup() {
            psql "$IGRIS_BOOTSTRAP_POSTGRES_ADMIN_DSN" -c "DROP DATABASE IF EXISTS ${DB};" >/dev/null 2>&1 || true
            for role in igris_app_runtime igris_read_only_operator igris_backup_restore igris_migration_owner; do
              psql "$IGRIS_BOOTSTRAP_POSTGRES_ADMIN_DSN" -c "DROP OWNED BY ${role} CASCADE;" >/dev/null 2>&1 || true
              psql "$IGRIS_BOOTSTRAP_POSTGRES_ADMIN_DSN" -c "DROP ROLE IF EXISTS ${role};" >/dev/null 2>&1 || true
            done
          }
          trap cleanup EXIT
          psql "$IGRIS_BOOTSTRAP_POSTGRES_ADMIN_DSN" -v ON_ERROR_STOP=1 -c "CREATE DATABASE ${DB};"
          TARGET_DSN="postgres://postgres:postgres@localhost:5432/${DB}?sslmode=disable"
          go run ./cmd/igris-db-bootstrap --mode=apply --database-url="$TARGET_DSN"
          go run ./cmd/igris-db-roles --mode=apply --database-url="$TARGET_DSN"
          go run ./cmd/igris-db-staging-preflight --database-url="$TARGET_DSN"

      - name: Run mandatory API-key auth Postgres migration tests
        run: go test ./igris-overture/api -run 'TestTenantEmailAlignmentMigration|TestBetterAuth_RealPostgres' -count=1 -timeout=120s

      - name: Run mandatory governance coordinator Postgres replay tests
        run: go test ./igris-overture/coordinator -run 'TestRoboticsReceiptReplayWithPostgresMigrations|TestRoboticsPolicyAuthorizationWithPostgresMigrations|TestAIToolReplayPostgres043' -count=1 -timeout=120s

      - name: Run tenant isolation Postgres tests
        run: go test ./igris-overture/coordinator -run 'TestTaskRecordsTenantScopedIdempotencyPostgres|TestExecutionLineageTenantIsolationPostgres|TestExecutionContextTenantBoundMigrationPostgres' -count=1 -timeout=120s
