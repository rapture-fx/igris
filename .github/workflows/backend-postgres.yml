name: Backend Postgres

on:
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/backend-postgres.yml"
      - "cmd/igris-overture/**"
      - "cmd/igris-db-bootstrap/**"
      - "cmd/igris-db-roles/**"
      - "cmd/igris-db-staging-preflight/**"
      - "igris-overture/**"
      - "scripts/connected/**"
      - "go.mod"
      - "go.sum"
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/backend-postgres.yml"
      - "cmd/igris-overture/**"
      - "cmd/igris-db-bootstrap/**"
      - "cmd/igris-db-roles/**"
      - "cmd/igris-db-staging-preflight/**"
      - "igris-overture/**"
      - "scripts/connected/**"
      - "go.mod"
      - "go.sum"

permissions:
  contents: read

concurrency:
  group: backend-postgres-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  governance-postgres:
    name: governance Postgres migrations
    runs-on: ubuntu-latest
    timeout-minutes: 35

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: igris_overture_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d igris_overture_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      IGRIS_OVERTURE_POSTGRES_TEST_DSN: postgres://postgres:postgres@localhost:5432/igris_overture_test?sslmode=disable

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.24.x"
          cache: true

      - name: Run mandatory governance API Postgres migration tests
        run: |
          set -euo pipefail
          go test ./igris-overture/api -run 'TestRoboticsPolicyActivationWithPostgresMigrations|TestExportRoboticsAuditBundleIncludesKeyLifecycleAndReplay|TestHILRoboticsStopAndCancelEvidenceExportsThroughAuditBundle|TestCleanupExpiredRoboticsPolicyCommandNonces' -count=1 -timeout=120s -v 2>&1 | tee governance-api.log
          ! grep -q 'no tests to run' governance-api.log

      - name: Run deterministic greenfield bootstrap tests
        env:
          IGRIS_BOOTSTRAP_POSTGRES_ADMIN_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test ./igris-overture/database/bootstrap -count=1 -timeout=300s

      - name: Prove application startup does not migrate
        env:
          IGRIS_BOOTSTRAP_POSTGRES_ADMIN_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          set -euo pipefail
          go test ./igris-overture/database -run 'TestApplicationStartupDoesNotMigrateOutdatedDatabase' -count=1 -timeout=120s -v 2>&1 | tee runtime-startup.log
          ! grep -q 'no tests to run' runtime-startup.log

      - name: Run least-privilege role boundary tests
        env:
          IGRIS_BOOTSTRAP_POSTGRES_ADMIN_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test ./igris-overture/database/roles -count=1 -timeout=300s

      - name: Run Connected runtime-role store paths
        env:
          IGRIS_BOOTSTRAP_POSTGRES_ADMIN_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          set -euo pipefail
          go test ./igris-overture/api -run 'TestConnectedPathsUnderRuntimeRolePostgres' -count=1 -timeout=300s -v 2>&1 | tee runtime-role.log
          ! grep -q 'no tests to run' runtime-role.log

      - name: Run staging preflight on disposable PostgreSQL 16 database
        env:
          IGRIS_BOOTSTRAP_POSTGRES_ADMIN_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: |
          set -euo pipefail
          RUN_SUFFIX="$(openssl rand -hex 6)"
          DB="igris_backend_preflight_${RUN_SUFFIX}"
          export IGRIS_DB_ROLE_MIGRATION_OWNER="igris_mig_${RUN_SUFFIX}"
          export IGRIS_DB_ROLE_APP_RUNTIME="igris_rt_${RUN_SUFFIX}"
          export IGRIS_DB_ROLE_READ_ONLY_OPERATOR="igris_ro_${RUN_SUFFIX}"
          export IGRIS_DB_ROLE_BACKUP_RESTORE="igris_bk_${RUN_SUFFIX}"
          DB_CREATED=0
          ROLES_CREATED=0
          cleanup() {
            primary_status=$?
            trap - EXIT
            set +e
            cleanup_status=0
            if [[ "$DB_CREATED" -eq 1 ]]; then
              psql "$IGRIS_BOOTSTRAP_POSTGRES_ADMIN_DSN" -v ON_ERROR_STOP=1 -v db_name="$DB" <<'SQL' >/dev/null || cleanup_status=70
          SELECT pg_terminate_backend(pid)
          FROM pg_stat_activity
          WHERE datname = :'db_name' AND pid <> pg_backend_pid();
          DROP DATABASE IF EXISTS :"db_name";
          SQL
            fi
            if [[ "$ROLES_CREATED" -eq 1 ]]; then
              for role in "$IGRIS_DB_ROLE_APP_RUNTIME" "$IGRIS_DB_ROLE_READ_ONLY_OPERATOR" "$IGRIS_DB_ROLE_BACKUP_RESTORE" "$IGRIS_DB_ROLE_MIGRATION_OWNER"; do
                psql "$IGRIS_BOOTSTRAP_POSTGRES_ADMIN_DSN" -v ON_ERROR_STOP=1 -v role_name="$role" <<'SQL' >/dev/null || cleanup_status=70
          SELECT format('DROP OWNED BY %I CASCADE', :'role_name')
          WHERE EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role_name')
          \gexec
          SELECT format('DROP ROLE %I', :'role_name')
          WHERE EXISTS (SELECT 1 FROM pg_roles WHERE rolname = :'role_name')
          \gexec
          SQL
              done
            fi
            if [[ "$cleanup_status" -ne 0 ]]; then
              echo "cleanup failed status=${cleanup_status}" >&2
              exit "$cleanup_status"
            fi
            exit "$primary_status"
          }
          trap cleanup EXIT
          MIGRATION_PASSWORD="$(openssl rand -hex 24)"
          psql "$IGRIS_BOOTSTRAP_POSTGRES_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -v migration_owner="$IGRIS_DB_ROLE_MIGRATION_OWNER" -v migration_password="$MIGRATION_PASSWORD" <<'SQL'
          CREATE ROLE :"migration_owner" LOGIN PASSWORD :'migration_password'
            NOSUPERUSER NOCREATEDB NOCREATEROLE INHERIT NOREPLICATION NOBYPASSRLS;
          SQL
          ROLES_CREATED=1
          psql "$IGRIS_BOOTSTRAP_POSTGRES_ADMIN_DSN" -v ON_ERROR_STOP=1 \
            -v db_name="$DB" -v migration_owner="$IGRIS_DB_ROLE_MIGRATION_OWNER" <<'SQL'
          CREATE DATABASE :"db_name" OWNER :"migration_owner";
          SQL
          DB_CREATED=1
          TARGET_DSN="postgres://postgres:postgres@localhost:5432/${DB}?sslmode=disable"
          MIGRATION_DSN="postgres://${IGRIS_DB_ROLE_MIGRATION_OWNER}:${MIGRATION_PASSWORD}@localhost:5432/${DB}?sslmode=disable"
          go run ./cmd/igris-db-bootstrap --mode=apply --database-url="$MIGRATION_DSN" --migration-owner="$IGRIS_DB_ROLE_MIGRATION_OWNER"
          go run ./cmd/igris-db-roles --mode=apply --database-url="$TARGET_DSN"
          go run ./cmd/igris-db-staging-preflight --database-url="$TARGET_DSN"

      - name: Run mandatory API-key auth Postgres migration tests
        run: |
          set -euo pipefail
          go test ./igris-overture/api -run 'TestTenantEmailAlignmentMigration|TestBetterAuth_RealPostgres' -count=1 -timeout=120s -v 2>&1 | tee auth-postgres.log
          ! grep -q 'no tests to run' auth-postgres.log

      - name: Run mandatory governance coordinator Postgres replay tests
        run: |
          set -euo pipefail
          go test ./igris-overture/coordinator -run 'TestRoboticsReceiptReplayWithPostgresMigrations|TestRoboticsPolicyAuthorizationWithPostgresMigrations|TestAIToolReplayPostgres043' -count=1 -timeout=120s -v 2>&1 | tee governance-coordinator.log
          ! grep -q 'no tests to run' governance-coordinator.log

      - name: Run tenant isolation Postgres tests
        run: |
          set -euo pipefail
          go test ./igris-overture/coordinator -run 'TestTaskRecordsTenantScopedIdempotencyPostgres|TestExecutionLineageTenantIsolationPostgres|TestExecutionContextTenantBoundMigrationPostgres' -count=1 -timeout=120s -v 2>&1 | tee tenant-isolation.log
          ! grep -q 'no tests to run' tenant-isolation.log
