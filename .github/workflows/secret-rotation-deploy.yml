name: Deploy Automated Secret Rotation System

on:
  push:
    branches: [main]
    paths:
      - 'security/secret-rotation/**'
      - '.github/workflows/secret-rotation-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'security/secret-rotation/**'
  schedule:
    # Run secret rotation weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to rotate secrets in'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      secret_name:
        description: 'Specific secret to rotate (optional)'
        required: false
        type: string
      dry_run:
        description: 'Run in dry-run mode'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write  # For OIDC authentication to cloud providers
  security-events: write  # For security scanning results

env:
  SECURITY_NAMESPACE: igris-inertial-security
  VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
  PYTHON_VERSION: '3.11'

jobs:
  security-scan:
    name: Security Scan Secret Rotation Code
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install security scanning tools
      run: |
        pip install bandit safety semgrep

    - name: Run Bandit security scan
      run: |
        bandit -r security/secret-rotation/ -f json -o bandit-results.json || true

    - name: Run Safety vulnerability scan
      run: |
        pip install -r security/secret-rotation/requirements.txt
        safety check --json --output safety-results.json || true

    - name: Run Semgrep security scan
      run: |
        semgrep --config=auto security/secret-rotation/ --json --output=semgrep-results.json || true

    - name: Upload security scan results
      uses: actions/upload-artifact@v4
      with:
        name: security-scan-results
        path: |
          bandit-results.json
          safety-results.json
          semgrep-results.json
        retention-days: 30

    - name: Fail on critical security issues
      run: |
        # Check for critical security issues
        python -c "
        import json
        import sys

        # Check Bandit results
        with open('bandit-results.json', 'r') as f:
            bandit = json.load(f)

        high_severity = [r for r in bandit.get('results', [])
                        if r.get('issue_severity') in ['HIGH', 'MEDIUM']]

        if high_severity:
            print(f'Found {len(high_severity)} medium/high severity security issues')
            for issue in high_severity:
                print(f\"- {issue['test_id']}: {issue['issue_text']}\")
            sys.exit(1)

        print('No critical security issues found')
        "

  validate-configuration:
    name: Validate Secret Rotation Configuration
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        cd security/secret-rotation
        pip install pyyaml jsonschema cryptography

    - name: Validate configuration schema
      run: |
        cd security/secret-rotation
        python -c "
        import yaml
        import sys
        from pathlib import Path

        try:
            with open('secret-rotation-config.yml', 'r') as f:
                config = yaml.safe_load(f)

            # Validate required sections
            required_sections = [
                'global', 'secret_categories', 'secrets',
                'rotation_strategies', 'validation_tests',
                'notifications', 'environments'
            ]

            for section in required_sections:
                if section not in config:
                    print(f'Missing required section: {section}')
                    sys.exit(1)

            # Validate secret definitions
            for secret_name, secret_config in config['secrets'].items():
                required_fields = ['category', 'type', 'environments', 'vault_path']
                for field in required_fields:
                    if field not in secret_config:
                        print(f'Secret {secret_name} missing required field: {field}')
                        sys.exit(1)

            # Validate categories exist
            for secret_name, secret_config in config['secrets'].items():
                category = secret_config['category']
                if category not in config['secret_categories']:
                    print(f'Secret {secret_name} references unknown category: {category}')
                    sys.exit(1)

            print('Configuration validation passed')

        except Exception as e:
            print(f'Configuration validation failed: {e}')
            sys.exit(1)
        "

    - name: Test secret generation
      run: |
        cd security/secret-rotation
        python -c "
        import sys
        sys.path.append('.')

        try:
            from secret_rotator import SecretGenerator

            generator = SecretGenerator()

            # Test password generation
            password = generator.generate_password(32, 'high')
            assert len(password) == 32
            print(f'Generated password: {password[:8]}...')

            # Test API key generation
            api_key = generator.generate_api_key(24)
            assert len(api_key) >= 24
            print(f'Generated API key: {api_key[:8]}...')

            # Test RSA key generation
            private_key, public_key = generator.generate_rsa_key(2048)
            assert 'BEGIN PRIVATE KEY' in private_key
            assert 'BEGIN PUBLIC KEY' in public_key
            print('Generated RSA key pair successfully')

            # Test AES key generation
            aes_key = generator.generate_aes_key(32)
            assert len(aes_key) > 32  # Base64 encoded
            print(f'Generated AES key: {aes_key[:8]}...')

            print('Secret generation tests passed')

        except Exception as e:
            print(f'Secret generation test failed: {e}')
            sys.exit(1)
        "

  test-rotation-logic:
    name: Test Secret Rotation Logic
    runs-on: ubuntu-latest
    needs: validate-configuration

    services:
      vault:
        image: vault:1.15
        options: >-
          --cap-add=IPC_LOCK
          --health-cmd="vault status"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
        env:
          VAULT_DEV_ROOT_TOKEN_ID: test-token
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
        ports:
          - 8200:8200

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: |
        cd security/secret-rotation
        pip install -r requirements.txt

    - name: Setup test Vault
      run: |
        export VAULT_ADDR=http://localhost:8200
        export VAULT_TOKEN=test-token

        # Enable KV secrets engine
        vault secrets enable -path=secret kv-v2

        # Create test secret
        vault kv put secret/test/postgres password=old_password

        echo "Vault setup complete"

    - name: Test rotation workflow
      env:
        VAULT_ADDR: http://localhost:8200
        VAULT_TOKEN: test-token
      run: |
        cd security/secret-rotation

        # Create test configuration
        cat > test-config.yml << EOF
        global:
          vault_endpoint: "http://localhost:8200"
          rotation_schedule: "0 2 * * 0"
          dry_run_mode: true

        secret_categories:
          test_credentials:
            rotation_frequency: "weekly"
            validation_required: false
            backup_required: false

        secrets:
          test_postgres_password:
            category: "test_credentials"
            type: "password"
            length: 16
            complexity: "medium"
            environments: ["test"]
            services: ["test-api"]
            vault_path: "test/postgres"
            k8s_secret: "test-postgres"

        validation_tests: {}
        rotation_strategies: {}
        notifications:
          channels: {}
          events: {}
        environments:
          test:
            rotation_approval_required: false
        EOF

        # Test secret rotation
        python -c "
        import asyncio
        import sys
        import os
        sys.path.append('.')

        async def test_rotation():
            try:
                from secret_rotator import SecretRotator

                rotator = SecretRotator('test-config.yml')

                # Test configuration loading
                assert 'test_postgres_password' in rotator.config['secrets']
                print('Configuration loaded successfully')

                # Test secret generation
                generator = rotator.generator
                new_password = generator.generate_password(16, 'medium')
                assert len(new_password) == 16
                print(f'Generated test password: {new_password}')

                print('Rotation logic tests passed')

            except Exception as e:
                print(f'Rotation test failed: {e}')
                sys.exit(1)

        asyncio.run(test_rotation())
        "

  deploy-to-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [security-scan, validate-configuration, test-rotation-logic]
    if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    environment: staging

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN_STAGING }}
        aws-region: us-east-1

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3

    - name: Create secret rotation namespace
      run: |
        kubectl create namespace ${{ env.SECURITY_NAMESPACE }}-staging --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy secret rotation configuration
      run: |
        # Create ConfigMap for rotation configuration
        kubectl create configmap secret-rotation-config \
          --from-file=security/secret-rotation/secret-rotation-config.yml \
          --namespace=${{ env.SECURITY_NAMESPACE }}-staging \
          --dry-run=client -o yaml | kubectl apply -f -

    - name: Deploy secret rotator service
      run: |
        cat <<EOF | kubectl apply -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: secret-rotator
          namespace: ${{ env.SECURITY_NAMESPACE }}-staging
          labels:
            app: secret-rotator
            environment: staging
        spec:
          replicas: 1
          selector:
            matchLabels:
              app: secret-rotator
          template:
            metadata:
              labels:
                app: secret-rotator
            spec:
              serviceAccountName: secret-rotator
              containers:
              - name: secret-rotator
                image: python:${{ env.PYTHON_VERSION }}-slim
                command: ["/bin/bash"]
                args:
                  - -c
                  - |
                    apt-get update && apt-get install -y git
                    pip install aioredis aiohttp pydantic cryptography pyyaml hvac kubernetes asyncpg
                    cd /app
                    python secret-rotator.py
                volumeMounts:
                - name: config
                  mountPath: /app/secret-rotation-config.yml
                  subPath: secret-rotation-config.yml
                - name: app-code
                  mountPath: /app/secret-rotator.py
                  subPath: secret-rotator.py
                env:
                - name: VAULT_ADDR
                  value: "${{ secrets.VAULT_ADDR_STAGING }}"
                - name: VAULT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: vault-credentials
                      key: token
                - name: ENVIRONMENT
                  value: "staging"
                - name: DRY_RUN_MODE
                  value: "true"
                resources:
                  requests:
                    memory: "256Mi"
                    cpu: "250m"
                  limits:
                    memory: "512Mi"
                    cpu: "500m"
              volumes:
              - name: config
                configMap:
                  name: secret-rotation-config
              - name: app-code
                configMap:
                  name: secret-rotator-code
        ---
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: secret-rotator
          namespace: ${{ env.SECURITY_NAMESPACE }}-staging
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: secret-rotator
        rules:
        - apiGroups: [""]
          resources: ["secrets"]
          verbs: ["get", "list", "create", "update", "patch"]
        - apiGroups: ["apps"]
          resources: ["deployments"]
          verbs: ["get", "list", "patch"]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: secret-rotator-staging
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: secret-rotator
        subjects:
        - kind: ServiceAccount
          name: secret-rotator
          namespace: ${{ env.SECURITY_NAMESPACE }}-staging
        EOF

    - name: Setup CronJob for scheduled rotation
      run: |
        cat <<EOF | kubectl apply -f -
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: secret-rotation-scheduled
          namespace: ${{ env.SECURITY_NAMESPACE }}-staging
        spec:
          schedule: "0 2 * * 0"  # Weekly at 2 AM UTC
          jobTemplate:
            spec:
              template:
                spec:
                  serviceAccountName: secret-rotator
                  containers:
                  - name: secret-rotator
                    image: python:${{ env.PYTHON_VERSION }}-slim
                    command: ["/bin/bash"]
                    args:
                      - -c
                      - |
                        pip install aioredis aiohttp pydantic cryptography pyyaml hvac kubernetes asyncpg
                        cd /app
                        python -c "
                        import asyncio
                        from secret_rotator import SecretRotator

                        async def main():
                            rotator = SecretRotator('/app/secret-rotation-config.yml')
                            await rotator.rotate_all_scheduled_secrets('staging')

                        asyncio.run(main())
                        "
                    volumeMounts:
                    - name: config
                      mountPath: /app/secret-rotation-config.yml
                      subPath: secret-rotation-config.yml
                    env:
                    - name: VAULT_ADDR
                      value: "${{ secrets.VAULT_ADDR_STAGING }}"
                    - name: VAULT_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: vault-credentials
                          key: token
                    - name: ENVIRONMENT
                      value: "staging"
                  volumes:
                  - name: config
                    configMap:
                      name: secret-rotation-config
                  restartPolicy: OnFailure
        EOF

    - name: Validate staging deployment
      run: |
        kubectl wait --for=condition=available --timeout=300s deployment/secret-rotator -n ${{ env.SECURITY_NAMESPACE }}-staging
        kubectl get pods -n ${{ env.SECURITY_NAMESPACE }}-staging

  manual-secret-rotation:
    name: Manual Secret Rotation
    runs-on: ubuntu-latest
    needs: [security-scan, validate-configuration]
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.secret_name != ''
    environment: ${{ github.event.inputs.environment }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Configure cloud credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ github.event.inputs.environment == 'production' && secrets.AWS_ROLE_ARN_PROD || secrets.AWS_ROLE_ARN_STAGING }}
        aws-region: us-east-1

    - name: Install dependencies
      run: |
        cd security/secret-rotation
        pip install -r requirements.txt

    - name: Run manual secret rotation
      env:
        VAULT_ADDR: ${{ github.event.inputs.environment == 'production' && secrets.VAULT_ADDR_PROD || secrets.VAULT_ADDR_STAGING }}
        VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
        DRY_RUN_MODE: ${{ github.event.inputs.dry_run }}
      run: |
        cd security/secret-rotation

        python -c "
        import asyncio
        import os
        import sys
        from secret_rotator import SecretRotator

        async def main():
            try:
                rotator = SecretRotator('secret-rotation-config.yml')

                # Override dry run mode if specified
                dry_run = os.getenv('DRY_RUN_MODE', 'true').lower() == 'true'
                if dry_run:
                    print('Running in DRY RUN mode - no actual changes will be made')
                    rotator.config['global']['dry_run_mode'] = True

                secret_name = '${{ github.event.inputs.secret_name }}'
                environment = '${{ github.event.inputs.environment }}'

                print(f'Rotating secret: {secret_name} in environment: {environment}')

                job = await rotator.rotate_secret(secret_name, environment)

                print(f'Rotation job {job.job_id} completed with status: {job.status}')

                if job.status == 'failed':
                    print(f'Error: {job.error_message}')
                    sys.exit(1)

                if job.validation_results:
                    print('Validation results:')
                    for test, result in job.validation_results.items():
                        print(f'  {test}: {result}')

            except Exception as e:
                print(f'Manual rotation failed: {e}')
                sys.exit(1)

        asyncio.run(main())
        "

  deploy-to-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [security-scan, validate-configuration, test-rotation-logic]
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_ARN_PROD }}
        aws-region: us-east-1

    - name: Setup kubectl
      uses: azure/setup-kubectl@v3

    - name: Deploy to production
      run: |
        echo "Deploying secret rotation system to production..."

        # Create production namespace
        kubectl create namespace ${{ env.SECURITY_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

        # Deploy configuration
        kubectl create configmap secret-rotation-config \
          --from-file=security/secret-rotation/secret-rotation-config.yml \
          --namespace=${{ env.SECURITY_NAMESPACE }} \
          --dry-run=client -o yaml | kubectl apply -f -

        # Deploy production secret rotator with high availability
        cat <<EOF | kubectl apply -f -
        apiVersion: apps/v1
        kind: Deployment
        metadata:
          name: secret-rotator
          namespace: ${{ env.SECURITY_NAMESPACE }}
          labels:
            app: secret-rotator
            environment: production
        spec:
          replicas: 2
          strategy:
            type: RollingUpdate
            rollingUpdate:
              maxUnavailable: 1
              maxSurge: 1
          selector:
            matchLabels:
              app: secret-rotator
          template:
            metadata:
              labels:
                app: secret-rotator
            spec:
              serviceAccountName: secret-rotator
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                fsGroup: 2000
              containers:
              - name: secret-rotator
                image: python:${{ env.PYTHON_VERSION }}-slim
                command: ["/bin/bash"]
                args:
                  - -c
                  - |
                    apt-get update && apt-get install -y git
                    pip install aioredis aiohttp pydantic cryptography pyyaml hvac kubernetes asyncpg
                    cd /app
                    python secret-rotator.py
                ports:
                - containerPort: 8080
                  name: http
                volumeMounts:
                - name: config
                  mountPath: /app/secret-rotation-config.yml
                  subPath: secret-rotation-config.yml
                env:
                - name: VAULT_ADDR
                  value: "${{ secrets.VAULT_ADDR_PROD }}"
                - name: VAULT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: vault-credentials
                      key: token
                - name: ENVIRONMENT
                  value: "production"
                - name: DRY_RUN_MODE
                  value: "false"
                resources:
                  requests:
                    memory: "512Mi"
                    cpu: "500m"
                  limits:
                    memory: "1Gi"
                    cpu: "1000m"
                livenessProbe:
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 60
                  periodSeconds: 30
                readinessProbe:
                  httpGet:
                    path: /ready
                    port: 8080
                  initialDelaySeconds: 30
                  periodSeconds: 10
              volumes:
              - name: config
                configMap:
                  name: secret-rotation-config
        EOF

    - name: Setup production CronJob
      run: |
        cat <<EOF | kubectl apply -f -
        apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: secret-rotation-scheduled
          namespace: ${{ env.SECURITY_NAMESPACE }}
        spec:
          schedule: "0 2 * * 0"  # Weekly at 2 AM UTC
          concurrencyPolicy: Forbid
          successfulJobsHistoryLimit: 3
          failedJobsHistoryLimit: 3
          jobTemplate:
            spec:
              backoffLimit: 2
              template:
                spec:
                  serviceAccountName: secret-rotator
                  securityContext:
                    runAsNonRoot: true
                    runAsUser: 1000
                  containers:
                  - name: secret-rotator
                    image: python:${{ env.PYTHON_VERSION }}-slim
                    command: ["/bin/bash"]
                    args:
                      - -c
                      - |
                        pip install aioredis aiohttp pydantic cryptography pyyaml hvac kubernetes asyncpg
                        cd /app
                        python -c "
                        import asyncio
                        from secret_rotator import SecretRotator

                        async def main():
                            rotator = SecretRotator('/app/secret-rotation-config.yml')
                            await rotator.rotate_all_scheduled_secrets('production')

                        asyncio.run(main())
                        "
                    env:
                    - name: VAULT_ADDR
                      value: "${{ secrets.VAULT_ADDR_PROD }}"
                    - name: VAULT_TOKEN
                      valueFrom:
                        secretKeyRef:
                          name: vault-credentials
                          key: token
                    - name: ENVIRONMENT
                      value: "production"
                    resources:
                      requests:
                        memory: "256Mi"
                        cpu: "250m"
                      limits:
                        memory: "512Mi"
                        cpu: "500m"
                  restartPolicy: OnFailure
        EOF

    - name: Validate production deployment
      run: |
        kubectl wait --for=condition=available --timeout=600s deployment/secret-rotator -n ${{ env.SECURITY_NAMESPACE }}
        kubectl get deployment secret-rotator -n ${{ env.SECURITY_NAMESPACE }}
        kubectl get cronjob secret-rotation-scheduled -n ${{ env.SECURITY_NAMESPACE }}

    - name: Run post-deployment verification
      run: |
        # Test secret rotator health
        kubectl run test-pod --rm -i --restart=Never --image=curlimages/curl -- \
          curl -f http://secret-rotator.${{ env.SECURITY_NAMESPACE }}.svc.cluster.local:8080/health

        echo "Production deployment verification completed"

  notify-deployment:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-to-staging, deploy-to-production, manual-secret-rotation]
    if: always()

    steps:
    - name: Notify security team
      run: |
        STATUS="${{ job.status }}"
        COLOR="good"
        if [ "$STATUS" != "success" ]; then
          COLOR="danger"
        fi

        ENVIRONMENT="${{ github.event.inputs.environment || 'production' }}"

        curl -X POST "${{ secrets.SLACK_SECURITY_WEBHOOK }}" \
          -H 'Content-type: application/json' \
          --data "{
            \"attachments\": [{
              \"color\": \"$COLOR\",
              \"title\": \"Secret Rotation System Deployment\",
              \"text\": \"Status: $STATUS\",
              \"fields\": [
                {\"title\": \"Environment\", \"value\": \"$ENVIRONMENT\", \"short\": true},
                {\"title\": \"Workflow\", \"value\": \"${{ github.workflow }}\", \"short\": true},
                {\"title\": \"Commit\", \"value\": \"${{ github.sha }}\", \"short\": true}
              ]
            }]
          }"