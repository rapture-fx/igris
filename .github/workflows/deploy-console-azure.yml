name: Deploy Console to Azure

on:
  workflow_dispatch:
    inputs:
      console_image:
        description: "Pinned console image digest, for example ghcr.io/igris-inertial/system/igris-console@sha256:<64 hex chars>"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-console-azure-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy igris-console
    runs-on: ubuntu-latest
    environment: production
    env:
      CONSOLE_IMAGE: ${{ inputs.console_image }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINERAPPS_ENV: ${{ vars.AZURE_CONTAINERAPPS_ENV }}
      AZURE_CONSOLE_APP: ${{ vars.AZURE_CONSOLE_APP }}
      GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment input
        shell: bash
        run: |
          set -euo pipefail

          case "${CONSOLE_IMAGE}" in
            ghcr.io/*@sha256:*) ;;
            *)
              echo "console_image must be a pinned GHCR digest like ghcr.io/...@sha256:<digest>." >&2
              exit 1
              ;;
          esac

          digest="${CONSOLE_IMAGE##*@sha256:}"
          if [[ ! "${digest}" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "console_image digest must be exactly 64 hexadecimal characters." >&2
            exit 1
          fi

          : "${AZURE_CLIENT_ID:?AZURE_CLIENT_ID production variable is required}"
          : "${AZURE_TENANT_ID:?AZURE_TENANT_ID production variable is required}"
          : "${AZURE_SUBSCRIPTION_ID:?AZURE_SUBSCRIPTION_ID production variable is required}"
          : "${AZURE_RESOURCE_GROUP:?AZURE_RESOURCE_GROUP production variable is required}"
          : "${AZURE_CONTAINERAPPS_ENV:?AZURE_CONTAINERAPPS_ENV production variable is required}"
          : "${AZURE_CONSOLE_APP:?AZURE_CONSOLE_APP production variable is required}"

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Update Container App image
        shell: bash
        run: |
          set -euo pipefail

          az extension add --name containerapp --upgrade --only-show-errors 1>/dev/null

          if [ -n "${GHCR_USERNAME}" ] && [ -n "${GHCR_TOKEN}" ]; then
            az containerapp registry set \
              --name "${AZURE_CONSOLE_APP}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --server ghcr.io \
              --username "${GHCR_USERNAME}" \
              --password "${GHCR_TOKEN}" \
              --only-show-errors 1>/dev/null
          fi

          az containerapp update \
            --name "${AZURE_CONSOLE_APP}" \
            --resource-group "${AZURE_RESOURCE_GROUP}" \
            --image "${CONSOLE_IMAGE}" \
            --only-show-errors 1>/dev/null

      - name: Resolve console FQDN
        id: endpoint
        shell: bash
        run: |
          set -euo pipefail

          fqdn="$(
            az containerapp show \
              --name "${AZURE_CONSOLE_APP}" \
              --resource-group "${AZURE_RESOURCE_GROUP}" \
              --query properties.configuration.ingress.fqdn \
              -o tsv
          )"

          if [ -z "${fqdn}" ]; then
            echo "Azure Container App ingress FQDN was empty." >&2
            exit 1
          fi

          echo "console_base=https://${fqdn}" >> "${GITHUB_OUTPUT}"

      - name: Smoke console
        shell: bash
        env:
          CONSOLE_BASE: ${{ steps.endpoint.outputs.console_base }}
        run: |
          set -euo pipefail

          curl_retry() {
            curl --fail --silent --show-error --retry 18 --retry-all-errors --retry-delay 10 "$@"
          }

          curl_retry "${CONSOLE_BASE}/up" >/dev/null

          if [ -n "${ADMIN_USERNAME}" ] && [ -n "${ADMIN_PASSWORD}" ]; then
            curl_retry -u "${ADMIN_USERNAME}:${ADMIN_PASSWORD}" "${CONSOLE_BASE}/actions" >/dev/null
          fi

      - name: Summary
        shell: bash
        run: |
          {
            echo "### Console deployment"
            echo "Container App: \`${AZURE_CONSOLE_APP}\`"
            echo "Image: \`${CONSOLE_IMAGE}\`"
            echo "Smoke: \`/up\`"
          } >> "${GITHUB_STEP_SUMMARY}"
