name: Prevent Labs Imports in Production

on:
  pull_request:
    paths:
      - 'internal/**'
      - 'cmd/**'
  push:
    branches:
      - main
    paths:
      - 'internal/**'
      - 'cmd/**'

jobs:
  check-no-labs-imports:
    name: Check for /labs imports in production code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check for labs imports in internal/
        run: |
          echo "🔍 Checking internal/ for labs imports..."
          if grep -r "labs/" internal/ --include="*.go" 2>/dev/null; then
            echo "❌ ERROR: Production code in internal/ cannot import from /labs"
            echo ""
            echo "Found labs imports in the following files:"
            grep -r "labs/" internal/ --include="*.go" -l
            echo ""
            echo "📝 Action Required:"
            echo "   Graduate the module from /labs to /rust-core/ or /internal/ first"
            echo "   See rust-core/README.md for graduation policy"
            exit 1
          fi
          echo "✅ No labs imports found in internal/"

      - name: Check for labs imports in cmd/
        run: |
          echo "🔍 Checking cmd/ for labs imports..."
          if grep -r "labs/" cmd/ --include="*.go" 2>/dev/null; then
            echo "❌ ERROR: Production code in cmd/ cannot import from /labs"
            echo ""
            echo "Found labs imports in the following files:"
            grep -r "labs/" cmd/ --include="*.go" -l
            echo ""
            echo "📝 Action Required:"
            echo "   Graduate the module from /labs to /rust-core/ or /internal/ first"
            echo "   See rust-core/README.md for graduation policy"
            exit 1
          fi
          echo "✅ No labs imports found in cmd/"

      - name: Check for labs path references in CGO
        run: |
          echo "🔍 Checking for labs path references in CGO directives..."
          if grep -r "#cgo.*labs/" internal/ cmd/ --include="*.go" 2>/dev/null; then
            echo "❌ ERROR: CGO directives cannot reference /labs paths"
            echo ""
            echo "Found labs paths in CGO directives:"
            grep -r "#cgo.*labs/" internal/ cmd/ --include="*.go" -l
            echo ""
            echo "📝 Action Required:"
            echo "   Update CGO paths to reference /rust-core/ instead"
            exit 1
          fi
          echo "✅ No labs paths found in CGO directives"

      - name: Summary
        if: success()
        run: |
          echo "✅ Production Code Quality Check PASSED"
          echo ""
          echo "All production code properly separated from /labs experiments"
          echo "✅ internal/ - Clean"
          echo "✅ cmd/ - Clean"
          echo "✅ CGO directives - Clean"
