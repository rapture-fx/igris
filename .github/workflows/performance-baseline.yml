name: Performance Baseline Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run performance tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_type:
        description: 'Type of performance test to run'
        required: true
        default: 'comprehensive'
        type: choice
        options:
          - comprehensive
          - api_only
          - frontend_only
          - integration_only
          - backend_only
      performance_budget:
        description: 'Performance budget strictness'
        required: false
        default: 'moderate'
        type: choice
        options:
          - strict
          - moderate
          - relaxed

env:
  NODE_VERSION: '18'
  PYTHON_VERSION: '3.11'
  DATABASE_URL: postgresql://postgres:postgres@localhost/schlep_test
  REDIS_URL: redis://localhost:6379
  API_BASE_URL: http://localhost:8000
  FRONTEND_URL: http://localhost:3000

jobs:
  setup-services:
    name: Setup Test Services
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schlep_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          pnpm install
          cd apps/api && pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx playwright selenium redis asyncpg psutil memory-profiler

      - name: Setup test database
        run: |
          cd apps/api
          python -c "
          import asyncio
          import asyncpg
          
          async def setup_db():
              conn = await asyncpg.connect('${{ env.DATABASE_URL }}')
              await conn.execute('''
                  CREATE TABLE IF NOT EXISTS users (
                      id SERIAL PRIMARY KEY,
                      email VARCHAR(255) UNIQUE NOT NULL,
                      created_at TIMESTAMP DEFAULT NOW()
                  )
              ''')
              await conn.execute('''
                  CREATE TABLE IF NOT EXISTS files (
                      id SERIAL PRIMARY KEY,
                      user_id INTEGER REFERENCES users(id),
                      filename VARCHAR(255) NOT NULL,
                      size INTEGER DEFAULT 0,
                      created_at TIMESTAMP DEFAULT NOW()
                  )
              ''')
              await conn.execute('''
                  CREATE TABLE IF NOT EXISTS profiles (
                      id SERIAL PRIMARY KEY,
                      user_id INTEGER REFERENCES users(id),
                      name VARCHAR(255),
                      created_at TIMESTAMP DEFAULT NOW()
                  )
              ''')
              await conn.execute('''
                  CREATE TABLE IF NOT EXISTS file_uploads (
                      id SERIAL PRIMARY KEY,
                      file_size INTEGER,
                      created_at TIMESTAMP DEFAULT NOW()
                  )
              ''')
              
              # Insert test data
              for i in range(1000):
                  await conn.execute(
                      'INSERT INTO users (email) VALUES ($1) ON CONFLICT (email) DO NOTHING',
                      f'user{i}@test.com'
                  )
              await conn.close()
          
          asyncio.run(setup_db())
          "

      - name: Cache performance baselines
        uses: actions/cache@v3
        with:
          path: |
            performance-reports/
            comprehensive_performance_reports/
            integration_performance_reports/
            backend_performance_reports/
            performance_baselines/
          key: performance-baselines-${{ github.sha }}
          restore-keys: |
            performance-baselines-
            
      - name: Store service readiness
        run: |
          echo "Services are ready" > /tmp/services-ready
          
  api-performance-test:
    name: API Performance Testing
    runs-on: ubuntu-latest
    needs: setup-services
    if: ${{ github.event.inputs.test_type == 'api_only' || github.event.inputs.test_type == 'comprehensive' || github.event.inputs.test_type == '' }}
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schlep_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx redis asyncpg psutil memory-profiler

      - name: Start API server
        run: |
          cd apps/api
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 10  # Wait for server to start

      - name: Run API performance tests
        run: |
          cd apps/api
          pytest tests/comprehensive_performance_baseline.py -v --tb=short
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          API_BASE_URL: ${{ env.API_BASE_URL }}

      - name: Upload API performance results
        uses: actions/upload-artifact@v4
        with:
          name: api-performance-results
          path: |
            apps/api/comprehensive_performance_reports/
            apps/api/performance_reports/
          retention-days: 30

  frontend-performance-test:
    name: Frontend Performance Testing
    runs-on: ubuntu-latest
    needs: setup-services
    if: ${{ github.event.inputs.test_type == 'frontend_only' || github.event.inputs.test_type == 'comprehensive' || github.event.inputs.test_type == '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright
        run: |
          pnpm exec playwright install chromium
          pnpm exec playwright install-deps

      - name: Build frontend applications
        run: |
          pnpm run build

      - name: Start frontend applications
        run: |
          pnpm --filter @igris-inertial/web-landing start &
          pnpm --filter @igris-inertial/web-admin start &
          pnpm --filter @igris-inertial/web-docs start &
          sleep 15  # Wait for applications to start

      - name: Run frontend performance tests
        run: |
          cd packages/frontend
          npm test -- __tests__/performance/frontend-performance.test.ts
        env:
          FRONTEND_URL: ${{ env.FRONTEND_URL }}
          API_URL: ${{ env.API_BASE_URL }}

      - name: Generate bundle analysis
        run: |
          pnpm --filter @igris-inertial/web-landing run build:analyze
          pnpm --filter @igris-inertial/web-admin run build:analyze
          pnpm --filter @igris-inertial/web-docs run build:analyze

      - name: Upload frontend performance results
        uses: actions/upload-artifact@v4
        with:
          name: frontend-performance-results
          path: |
            packages/frontend/performance-reports/
            apps/web-*/bundle-analysis/
            apps/web-*/.next/analyze/
          retention-days: 30

  integration-performance-test:
    name: Integration Performance Testing
    runs-on: ubuntu-latest
    needs: setup-services
    if: ${{ github.event.inputs.test_type == 'integration_only' || github.event.inputs.test_type == 'comprehensive' || github.event.inputs.test_type == '' }}
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schlep_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pnpm install
          cd apps/api
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx selenium redis asyncpg psutil

      - name: Install Chrome for Selenium
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install google-chrome-stable
          
          # Install ChromeDriver
          CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')
          CHROMEDRIVER_VERSION=$(curl -sS chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_VERSION)
          wget -O /tmp/chromedriver.zip http://chromedriver.storage.googleapis.com/$CHROMEDRIVER_VERSION/chromedriver_linux64.zip
          sudo unzip /tmp/chromedriver.zip chromedriver -d /usr/local/bin/
          sudo chmod +x /usr/local/bin/chromedriver

      - name: Build and start all services
        run: |
          # Build frontend
          pnpm run build
          
          # Start API
          cd apps/api
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          
          # Start frontend applications
          cd ../..
          pnpm --filter @igris-inertial/web-landing start &
          
          # Wait for services to be ready
          sleep 20

      - name: Run integration performance tests
        run: |
          cd apps/api
          pytest tests/integration_performance_baseline.py -v --tb=short -s
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          API_BASE_URL: ${{ env.API_BASE_URL }}
          FRONTEND_URL: ${{ env.FRONTEND_URL }}

      - name: Upload integration performance results
        uses: actions/upload-artifact@v4
        with:
          name: integration-performance-results
          path: |
            apps/api/integration_performance_reports/
          retention-days: 30

  backend-performance-test:
    name: Backend Performance Testing
    runs-on: ubuntu-latest
    needs: setup-services
    if: ${{ github.event.inputs.test_type == 'backend_only' || github.event.inputs.test_type == 'comprehensive' || github.event.inputs.test_type == '' }}
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schlep_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
          
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx redis asyncpg psutil memory-profiler pandas numpy

      - name: Start API server
        run: |
          cd apps/api
          uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 10

      - name: Run backend performance tests
        run: |
          cd apps/api
          pytest tests/backend_performance_validation.py -v --tb=short
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          REDIS_URL: ${{ env.REDIS_URL }}
          API_BASE_URL: ${{ env.API_BASE_URL }}

      - name: Upload backend performance results
        uses: actions/upload-artifact@v4
        with:
          name: backend-performance-results
          path: |
            apps/api/backend_performance_reports/
          retention-days: 30

  performance-analysis:
    name: Performance Analysis & Reporting
    runs-on: ubuntu-latest
    needs: [api-performance-test, frontend-performance-test, integration-performance-test, backend-performance-test]
    if: always()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install analysis dependencies
        run: |
          pip install pandas numpy matplotlib seaborn jinja2

      - name: Download all performance results
        uses: actions/download-artifact@v3
        with:
          path: performance-results/

      - name: Create performance analysis script
        run: |
          cat > performance_analyzer.py << 'EOF'
          import json
          import os
          from pathlib import Path
          from datetime import datetime
          import pandas as pd
          import matplotlib.pyplot as plt
          import seaborn as sns
          from typing import Dict, Any, List
          
          def analyze_performance_results(results_dir: str) -> Dict[str, Any]:
              """Analyze all performance test results"""
              
              analysis = {
                  'timestamp': datetime.now().isoformat(),
                  'summary': {
                      'overall_score': 0,
                      'api_score': 0,
                      'frontend_score': 0,
                      'integration_score': 0,
                      'backend_score': 0
                  },
                  'recommendations': [],
                  'regression_detected': False,
                  'performance_trends': {}
              }
              
              results_path = Path(results_dir)
              
              # Analyze API performance
              api_results = self._find_json_files(results_path / "api-performance-results")
              if api_results:
                  analysis['summary']['api_score'] = self._analyze_api_results(api_results)
              
              # Analyze frontend performance
              frontend_results = self._find_json_files(results_path / "frontend-performance-results")
              if frontend_results:
                  analysis['summary']['frontend_score'] = self._analyze_frontend_results(frontend_results)
              
              # Analyze integration performance
              integration_results = self._find_json_files(results_path / "integration-performance-results")
              if integration_results:
                  analysis['summary']['integration_score'] = self._analyze_integration_results(integration_results)
              
              # Analyze backend performance
              backend_results = self._find_json_files(results_path / "backend-performance-results")
              if backend_results:
                  analysis['summary']['backend_score'] = self._analyze_backend_results(backend_results)
              
              # Calculate overall score
              scores = [score for score in analysis['summary'].values() if isinstance(score, (int, float)) and score > 0]
              analysis['summary']['overall_score'] = sum(scores) / len(scores) if scores else 0
              
              # Check for regressions
              analysis['regression_detected'] = self._check_regression(analysis)
              
              # Generate recommendations
              analysis['recommendations'] = self._generate_recommendations(analysis)
              
              return analysis
          
          def _find_json_files(self, directory: Path) -> List[Dict]:
              """Find and load JSON result files"""
              results = []
              if directory.exists():
                  for file_path in directory.rglob("*.json"):
                      try:
                          with open(file_path, 'r') as f:
                              data = json.load(f)
                              results.append(data)
                      except Exception as e:
                          print(f"Error loading {file_path}: {e}")
              return results
          
          def _analyze_api_results(self, results: List[Dict]) -> float:
              """Analyze API performance results"""
              if not results:
                  return 0
              
              scores = []
              for result in results:
                  summary = result.get('summary', {})
                  if 'performance_score' in summary:
                      scores.append(summary['performance_score'])
              
              return sum(scores) / len(scores) if scores else 0
          
          def _analyze_frontend_results(self, results: List[Dict]) -> float:
              """Analyze frontend performance results"""
              # Simplified frontend analysis
              return 75  # Placeholder
          
          def _analyze_integration_results(self, results: List[Dict]) -> float:
              """Analyze integration performance results"""
              if not results:
                  return 0
              
              scores = []
              for result in results:
                  summary = result.get('summary', {})
                  if 'integration_score' in summary:
                      scores.append(summary['integration_score'])
              
              return sum(scores) / len(scores) if scores else 0
          
          def _analyze_backend_results(self, results: List[Dict]) -> float:
              """Analyze backend performance results"""
              if not results:
                  return 0
              
              scores = []
              for result in results:
                  summary = result.get('summary', {})
                  if 'backend_score' in summary:
                      scores.append(summary['backend_score'])
              
              return sum(scores) / len(scores) if scores else 0
          
          def _check_regression(self, analysis: Dict) -> bool:
              """Check for performance regression"""
              overall_score = analysis['summary']['overall_score']
              
              # Load baseline if exists
              baseline_path = Path("performance_baselines/baseline.json")
              if baseline_path.exists():
                  try:
                      with open(baseline_path, 'r') as f:
                          baseline = json.load(f)
                      
                      baseline_score = baseline.get('overall_score', 0)
                      regression_threshold = 0.1  # 10% regression threshold
                      
                      return (baseline_score - overall_score) / baseline_score > regression_threshold
                  except Exception:
                      pass
              
              return False
          
          def _generate_recommendations(self, analysis: Dict) -> List[str]:
              """Generate performance recommendations"""
              recommendations = []
              
              if analysis['summary']['overall_score'] < 60:
                  recommendations.append("Overall performance is below acceptable threshold")
              
              if analysis['summary']['api_score'] < 70:
                  recommendations.append("API performance needs optimization")
              
              if analysis['summary']['integration_score'] < 60:
                  recommendations.append("Integration performance requires attention")
              
              if analysis['summary']['backend_score'] < 70:
                  recommendations.append("Backend performance optimization needed")
              
              if analysis['regression_detected']:
                  recommendations.append("Performance regression detected - investigate recent changes")
              
              return recommendations
          
          def generate_performance_report(analysis: Dict) -> str:
              """Generate HTML performance report"""
              
              html = f"""
              <!DOCTYPE html>
              <html>
              <head>
                  <title>Schlep-Engine Performance Baseline Report</title>
                  <style>
                      body {{ font-family: Arial, sans-serif; margin: 40px; }}
                      .header {{ background: #f8f9fa; padding: 20px; border-radius: 8px; }}
                      .score {{ font-size: 24px; font-weight: bold; }}
                      .good {{ color: #28a745; }}
                      .warning {{ color: #ffc107; }}
                      .danger {{ color: #dc3545; }}
                      .metrics {{ display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin: 20px 0; }}
                      .metric-card {{ background: #f8f9fa; padding: 20px; border-radius: 8px; }}
                      .recommendations {{ background: #fff3cd; padding: 20px; border-radius: 8px; margin: 20px 0; }}
                  </style>
              </head>
              <body>
                  <div class="header">
                      <h1>Performance Baseline Report</h1>
                      <p>Generated: {analysis['timestamp']}</p>
                      <div class="score {'good' if analysis['summary']['overall_score'] >= 80 else 'warning' if analysis['summary']['overall_score'] >= 60 else 'danger'}">
                          Overall Score: {analysis['summary']['overall_score']:.1f}/100
                      </div>
                  </div>
                  
                  <div class="metrics">
                      <div class="metric-card">
                          <h3>API Performance</h3>
                          <div class="score {'good' if analysis['summary']['api_score'] >= 80 else 'warning' if analysis['summary']['api_score'] >= 60 else 'danger'}">
                              {analysis['summary']['api_score']:.1f}/100
                          </div>
                      </div>
                      <div class="metric-card">
                          <h3>Frontend Performance</h3>
                          <div class="score {'good' if analysis['summary']['frontend_score'] >= 80 else 'warning' if analysis['summary']['frontend_score'] >= 60 else 'danger'}">
                              {analysis['summary']['frontend_score']:.1f}/100
                          </div>
                      </div>
                      <div class="metric-card">
                          <h3>Integration Performance</h3>
                          <div class="score {'good' if analysis['summary']['integration_score'] >= 80 else 'warning' if analysis['summary']['integration_score'] >= 60 else 'danger'}">
                              {analysis['summary']['integration_score']:.1f}/100
                          </div>
                      </div>
                      <div class="metric-card">
                          <h3>Backend Performance</h3>
                          <div class="score {'good' if analysis['summary']['backend_score'] >= 80 else 'warning' if analysis['summary']['backend_score'] >= 60 else 'danger'}">
                              {analysis['summary']['backend_score']:.1f}/100
                          </div>
                      </div>
                  </div>
              """
              
              if analysis['recommendations']:
                  html += """
                  <div class="recommendations">
                      <h3>Recommendations</h3>
                      <ul>
                  """
                  for rec in analysis['recommendations']:
                      html += f"<li>{rec}</li>"
                  html += "</ul></div>"
              
              if analysis['regression_detected']:
                  html += """
                  <div class="recommendations" style="background: #f8d7da; border-color: #f5c6cb;">
                      <h3 style="color: #721c24;">Performance Regression Detected</h3>
                      <p>The current performance is significantly worse than the baseline. Please investigate recent changes.</p>
                  </div>
                  """
              
              html += """
              </body>
              </html>
              """
              
              return html
          
          if __name__ == "__main__":
              analysis = analyze_performance_results("performance-results")
              
              # Save analysis
              with open("performance_analysis.json", "w") as f:
                  json.dump(analysis, f, indent=2)
              
              # Generate HTML report
              html_report = generate_performance_report(analysis)
              with open("performance_report.html", "w") as f:
                  f.write(html_report)
              
              # Update baseline if performance is good
              if analysis['summary']['overall_score'] >= 70:
                  os.makedirs("performance_baselines", exist_ok=True)
                  with open("performance_baselines/baseline.json", "w") as f:
                      json.dump(analysis['summary'], f, indent=2)
              
              print(f"Performance Analysis Complete")
              print(f"Overall Score: {analysis['summary']['overall_score']:.1f}/100")
              
              if analysis['regression_detected']:
                  print("⚠️  Performance regression detected!")
                  exit(1)
              elif analysis['summary']['overall_score'] < 50:
                  print("❌ Performance below acceptable threshold!")
                  exit(1)
              else:
                  print("✅ Performance within acceptable range")
          EOF

      - name: Run performance analysis
        run: python performance_analyzer.py

      - name: Upload performance analysis
        uses: actions/upload-artifact@v4
        with:
          name: performance-analysis
          path: |
            performance_analysis.json
            performance_report.html
            performance_baselines/
          retention-days: 90

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            try {
              const analysisData = fs.readFileSync('performance_analysis.json', 'utf8');
              const analysis = JSON.parse(analysisData);
              
              let comment = `## 📊 Performance Baseline Report\n\n`;
              comment += `**Overall Score:** ${analysis.summary.overall_score.toFixed(1)}/100\n\n`;
              
              comment += `| Component | Score | Status |\n`;
              comment += `|-----------|-------|--------|\n`;
              comment += `| API | ${analysis.summary.api_score.toFixed(1)}/100 | ${analysis.summary.api_score >= 80 ? '✅' : analysis.summary.api_score >= 60 ? '⚠️' : '❌'} |\n`;
              comment += `| Frontend | ${analysis.summary.frontend_score.toFixed(1)}/100 | ${analysis.summary.frontend_score >= 80 ? '✅' : analysis.summary.frontend_score >= 60 ? '⚠️' : '❌'} |\n`;
              comment += `| Integration | ${analysis.summary.integration_score.toFixed(1)}/100 | ${analysis.summary.integration_score >= 80 ? '✅' : analysis.summary.integration_score >= 60 ? '⚠️' : '❌'} |\n`;
              comment += `| Backend | ${analysis.summary.backend_score.toFixed(1)}/100 | ${analysis.summary.backend_score >= 80 ? '✅' : analysis.summary.backend_score >= 60 ? '⚠️' : '❌'} |\n\n`;
              
              if (analysis.regression_detected) {
                comment += `⚠️ **Performance regression detected!**\n\n`;
              }
              
              if (analysis.recommendations && analysis.recommendations.length > 0) {
                comment += `### Recommendations:\n`;
                analysis.recommendations.forEach(rec => {
                  comment += `- ${rec}\n`;
                });
              }
              
              comment += `\n[View Full Report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.error('Error creating performance comment:', error);
            }

      - name: Fail on regression
        run: |
          if [ -f performance_analysis.json ]; then
            REGRESSION=$(cat performance_analysis.json | jq -r '.regression_detected')
            SCORE=$(cat performance_analysis.json | jq -r '.summary.overall_score')
            
            if [ "$REGRESSION" = "true" ]; then
              echo "❌ Performance regression detected!"
              exit 1
            elif [ "$(echo "$SCORE < 50" | bc)" = "1" ]; then
              echo "❌ Performance score too low: $SCORE"
              exit 1
            else
              echo "✅ Performance acceptable: $SCORE"
            fi
          fi