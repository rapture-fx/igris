name: 🚀 Go Gateway CI/CD

on:
  push:
    branches: [main, develop]
    paths:
      - 'go_gateway/**'
      - '.github/workflows/go-gateway-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'go_gateway/**'
      - '.github/workflows/go-gateway-ci.yml'

env:
  GO_VERSION: "1.21"

jobs:
  test:
    name: 🧪 Test Go Gateway
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go_gateway/go.sum

      - name: 📦 Download dependencies
        working-directory: ./go_gateway
        run: go mod download

      - name: 🔍 Run go vet
        working-directory: ./go_gateway
        run: go vet ./...

      - name: 🎯 Run tests
        working-directory: ./go_gateway
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: 📊 Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./go_gateway/coverage.out
          flags: go-gateway
          name: go-gateway-coverage

  lint:
    name: 🔍 Lint Go Code
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 🔍 golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          working-directory: go_gateway
          args: --timeout=5m

  build:
    name: 🏗️ Build Go Gateway
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go_gateway/go.sum

      - name: 🏗️ Build binary
        working-directory: ./go_gateway
        run: |
          go build -v -o bin/gateway ./cmd/api/

      - name: 📦 Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: go-gateway-binary
          path: go_gateway/bin/gateway
          retention-days: 7

  benchmark:
    name: ⚡ Benchmark Go Gateway
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: go_gateway/go.sum

      - name: ⚡ Run benchmarks
        working-directory: ./go_gateway
        run: |
          go test -bench=. -benchmem -run=^$ ./... > benchmark-results.txt
          cat benchmark-results.txt

      - name: 📊 Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: go_gateway/benchmark-results.txt
          retention-days: 30

  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐹 Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: 🔒 Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out gosec-results.sarif ./go_gateway/...'

      - name: 📊 Upload SARIF results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: gosec-results.sarif
