name: Docs Quality

on:
  pull_request:
    paths:
      - ".github/workflows/docs-quality.yml"
      - "web/wrangler.toml"
      - "web/apps/web-landing/wrangler.toml"
      - "web/apps/web-docs-hub/**"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
      - "web/pnpm-workspace.yaml"
      - "igris-overture/**"
      - "igris-runtime/**"
      - "igris-javascript-sdk/**"
      - "igris-go-sdk/**"
      - "igris-rust-sdk/**"
      - "rust-core/**"
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/docs-quality.yml"
      - "web/wrangler.toml"
      - "web/apps/web-landing/wrangler.toml"
      - "web/apps/web-docs-hub/**"
      - "web/package.json"
      - "web/pnpm-lock.yaml"
      - "web/pnpm-workspace.yaml"
      - "igris-overture/**"
      - "igris-runtime/**"
      - "igris-javascript-sdk/**"
      - "igris-go-sdk/**"
      - "igris-rust-sdk/**"
      - "rust-core/**"

jobs:
  pages-config-guard:
    # `web` is the Root directory of BOTH the landing and the docs Cloudflare
    # Pages projects. A wrangler.toml there is discovered by Pages git builds
    # and its `pages_build_output_dir` overrides the dashboard output dir for
    # whichever project is building — this broke docs deploys in Jun 2026
    # (docs built fine, then Pages tried to publish apps/web-landing/out).
    # Per-app wrangler configs live in web/apps/<app>/wrangler.toml instead.
    name: No wrangler.toml at shared Pages root (web/)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail if web/wrangler.toml exists
        run: |
          if [ -e web/wrangler.toml ] || [ -e web/wrangler.json ] || [ -e web/wrangler.jsonc ]; then
            echo "::error::web/ is the shared Cloudflare Pages Root directory for the landing AND docs projects."
            echo "::error::A wrangler config here overrides the dashboard build output dir for BOTH projects and breaks docs deploys."
            echo "::error::Put per-app config in web/apps/web-landing/wrangler.toml or web/apps/web-docs-hub/wrangler.toml instead. See DEPLOY.md, 'Docs site on Cloudflare Pages'."
            exit 1
          fi
          echo "OK: no wrangler config at web/ — Pages dashboard settings are honored for landing and docs."

  docs-quality:
    name: pnpm --filter @igris/web-docs-hub build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache: true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: Build docs quality gate
        working-directory: web
        run: pnpm --filter @igris/web-docs-hub build
