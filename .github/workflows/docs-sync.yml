name: Documentation Sync

on:
  push:
    branches:
      - main
    paths:
      - 'internal/**/*.go'
      - 'cmd/**/*.go'
      - 'config/**/*.yaml'
      - 'config/**/*.yml'
      - 'docs_int/**/*.md'
      - 'README.md'
      - '.github/workflows/docs-sync.yml'

  workflow_dispatch:
    inputs:
      force:
        description: 'Force documentation regeneration'
        required: false
        default: 'false'

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./scripts/docs
        run: |
          npm install

      - name: Extract metrics from codebase
        id: extract
        run: |
          node ./scripts/docs/extract-metrics.js > ./web/apps/web-docs/docs/.generated/metrics.json
          node ./scripts/docs/extract-config.js > ./web/apps/web-docs/docs/.generated/config.json

      - name: Update documentation files
        run: |
          node ./scripts/docs/update-docs.js

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code web/apps/web-docs/docs/ || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "docs-sync-bot"
          git config user.email "bot@igris-inertial.com"
          git add web/apps/web-docs/docs/
          git commit -m "docs: auto-sync documentation from codebase

          Extracted from:
          - internal/observability/metrics.go
          - config/tier_config.yaml
          - docs_int/ARCHITECTURE_*.md

          Generated by: .github/workflows/docs-sync.yml"
          git push

      - name: Create summary
        if: always()
        run: |
          echo "## Documentation Sync Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.git-check.outputs.changed }}" == "true" ]; then
            echo "✅ **Documentation updated and committed**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Changed files:" >> $GITHUB_STEP_SUMMARY
            git diff --name-only HEAD~1 web/apps/web-docs/docs/ | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ **Documentation is up to date**" >> $GITHUB_STEP_SUMMARY
          fi
