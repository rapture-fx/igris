name: Continuous Health Monitoring

on:
  schedule:
    # Run every 15 minutes
    - cron: '*/15 * * * *'
  
  # Allow manual triggers
  workflow_dispatch:

env:
  PRODUCTION_API: https://api.schlep-engine.com
  STAGING_API: https://api-staging.schlep-engine.com
  PRODUCTION_FRONTEND: https://schlep-engine.com
  STAGING_FRONTEND: https://staging.schlep-engine.com

jobs:
  health-check:
    name: Service Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Check Production API Health
        id: prod-api
        run: |
          if curl -f -s "${{ env.PRODUCTION_API }}/health" | jq -e '.status == "healthy"' > /dev/null; then
            echo "status=healthy" >> $GITHUB_OUTPUT
            echo "✅ Production API is healthy"
          else
            echo "status=unhealthy" >> $GITHUB_OUTPUT
            echo "❌ Production API is unhealthy"
          fi

      - name: Check Production Frontend
        id: prod-frontend
        run: |
          if curl -f -s -o /dev/null "${{ env.PRODUCTION_FRONTEND }}"; then
            echo "status=healthy" >> $GITHUB_OUTPUT
            echo "✅ Production Frontend is healthy"
          else
            echo "status=unhealthy" >> $GITHUB_OUTPUT
            echo "❌ Production Frontend is unhealthy"
          fi

      - name: Check Staging API Health
        id: staging-api
        run: |
          if curl -f -s "${{ env.STAGING_API }}/health" | jq -e '.status' > /dev/null; then
            echo "status=healthy" >> $GITHUB_OUTPUT
            echo "✅ Staging API is healthy"
          else
            echo "status=unhealthy" >> $GITHUB_OUTPUT
            echo "❌ Staging API is unhealthy"
          fi

      - name: Check Staging Frontend
        id: staging-frontend
        run: |
          if curl -f -s -o /dev/null "${{ env.STAGING_FRONTEND }}"; then
            echo "status=healthy" >> $GITHUB_OUTPUT
            echo "✅ Staging Frontend is healthy"
          else
            echo "status=unhealthy" >> $GITHUB_OUTPUT
            echo "❌ Staging Frontend is unhealthy"
          fi

      - name: Performance Check
        id: performance
        run: |
          echo "Running performance checks..."
          
          # Check API response time
          API_RESPONSE_TIME=$(curl -w "%{time_total}" -s -o /dev/null "${{ env.PRODUCTION_API }}/health")
          echo "API Response Time: ${API_RESPONSE_TIME}s"
          
          # Check if response time is acceptable (< 2 seconds)
          if (( $(echo "$API_RESPONSE_TIME < 2.0" | bc -l) )); then
            echo "performance=good" >> $GITHUB_OUTPUT
            echo "✅ API performance is good (${API_RESPONSE_TIME}s)"
          else
            echo "performance=slow" >> $GITHUB_OUTPUT
            echo "⚠️ API performance is slow (${API_RESPONSE_TIME}s)"
          fi

      - name: SSL Certificate Check
        id: ssl-check
        run: |
          echo "Checking SSL certificates..."
          
          # Check SSL certificate expiry
          CERT_EXPIRY=$(echo | openssl s_client -connect schlep-engine.com:443 2>/dev/null | openssl x509 -noout -dates | grep notAfter | cut -d= -f2)
          EXPIRY_TIMESTAMP=$(date -d "$CERT_EXPIRY" +%s)
          CURRENT_TIMESTAMP=$(date +%s)
          DAYS_UNTIL_EXPIRY=$(( (EXPIRY_TIMESTAMP - CURRENT_TIMESTAMP) / 86400 ))
          
          echo "SSL Certificate expires in $DAYS_UNTIL_EXPIRY days"
          
          if [ "$DAYS_UNTIL_EXPIRY" -gt 30 ]; then
            echo "ssl=valid" >> $GITHUB_OUTPUT
            echo "✅ SSL certificate is valid ($DAYS_UNTIL_EXPIRY days remaining)"
          elif [ "$DAYS_UNTIL_EXPIRY" -gt 7 ]; then
            echo "ssl=expiring-soon" >> $GITHUB_OUTPUT
            echo "⚠️ SSL certificate expires soon ($DAYS_UNTIL_EXPIRY days remaining)"
          else
            echo "ssl=critical" >> $GITHUB_OUTPUT
            echo "🚨 SSL certificate expires very soon ($DAYS_UNTIL_EXPIRY days remaining)"
          fi

      - name: Database Connection Check
        id: db-check
        run: |
          echo "Checking database connectivity via API..."
          
          # Check if API can connect to database
          DB_STATUS=$(curl -s "${{ env.PRODUCTION_API }}/health" | jq -r '.services.database // "unknown"')
          
          if [ "$DB_STATUS" = "healthy" ]; then
            echo "database=healthy" >> $GITHUB_OUTPUT
            echo "✅ Database connection is healthy"
          else
            echo "database=unhealthy" >> $GITHUB_OUTPUT
            echo "❌ Database connection issues detected"
          fi

      - name: Redis Connection Check
        id: redis-check
        run: |
          echo "Checking Redis connectivity via API..."
          
          # Check if API can connect to Redis
          REDIS_STATUS=$(curl -s "${{ env.PRODUCTION_API }}/health" | jq -r '.services.redis // "unknown"')
          
          if [ "$REDIS_STATUS" = "healthy" ]; then
            echo "redis=healthy" >> $GITHUB_OUTPUT
            echo "✅ Redis connection is healthy"
          else
            echo "redis=unhealthy" >> $GITHUB_OUTPUT
            echo "❌ Redis connection issues detected"
          fi

      - name: Send Health Alert if Issues Found
        if: |
          steps.prod-api.outputs.status == 'unhealthy' ||
          steps.prod-frontend.outputs.status == 'unhealthy' ||
          steps.performance.outputs.performance == 'slow' ||
          steps.ssl-check.outputs.ssl == 'critical' ||
          steps.db-check.outputs.database == 'unhealthy' ||
          steps.redis-check.outputs.redis == 'unhealthy'
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          custom_payload: |
            {
              "text": "🚨 Health Check Alert",
              "attachments": [
                {
                  "color": "warning",
                  "title": "Service Health Issues Detected",
                  "fields": [
                    {
                      "title": "Production API",
                      "value": "${{ steps.prod-api.outputs.status == 'healthy' && '✅ Healthy' || '❌ Unhealthy' }}",
                      "short": true
                    },
                    {
                      "title": "Production Frontend", 
                      "value": "${{ steps.prod-frontend.outputs.status == 'healthy' && '✅ Healthy' || '❌ Unhealthy' }}",
                      "short": true
                    },
                    {
                      "title": "Performance",
                      "value": "${{ steps.performance.outputs.performance == 'good' && '✅ Good' || '⚠️ Slow' }}",
                      "short": true
                    },
                    {
                      "title": "SSL Certificate",
                      "value": "${{ steps.ssl-check.outputs.ssl == 'valid' && '✅ Valid' || steps.ssl-check.outputs.ssl == 'expiring-soon' && '⚠️ Expiring Soon' || '🚨 Critical' }}",
                      "short": true
                    },
                    {
                      "title": "Database",
                      "value": "${{ steps.db-check.outputs.database == 'healthy' && '✅ Healthy' || '❌ Issues' }}",
                      "short": true
                    },
                    {
                      "title": "Redis",
                      "value": "${{ steps.redis-check.outputs.redis == 'healthy' && '✅ Healthy' || '❌ Issues' }}",
                      "short": true
                    }
                  ],
                  "actions": [
                    {
                      "type": "button",
                      "text": "🔍 Investigate",
                      "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

      - name: Create Incident Issue for Critical Problems
        if: |
          steps.prod-api.outputs.status == 'unhealthy' ||
          steps.prod-frontend.outputs.status == 'unhealthy' ||
          steps.ssl-check.outputs.ssl == 'critical' ||
          steps.db-check.outputs.database == 'unhealthy'
        uses: actions/github-script@v6
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'incident,health-check',
              state: 'open'
            });
            
            // Only create new issue if no open incident exists
            if (issues.data.length === 0) {
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `🚨 Service Health Incident - ${new Date().toISOString().split('T')[0]}`,
                body: `## 🚨 Service Health Incident
                
                **Detected:** ${new Date().toISOString()}
                **Detection Method:** Automated health monitoring
                
                ### 🔍 Issues Detected
                - **Production API:** ${{ steps.prod-api.outputs.status }}
                - **Production Frontend:** ${{ steps.prod-frontend.outputs.status }}
                - **SSL Certificate:** ${{ steps.ssl-check.outputs.ssl }}
                - **Database:** ${{ steps.db-check.outputs.database }}
                - **Redis:** ${{ steps.redis-check.outputs.redis }}
                
                ### 📊 Monitoring Data
                [View health check logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
                
                ### 🔧 Immediate Actions Required
                1. Investigate service status on Vultr VPS
                2. Check server resources (CPU, memory, disk)
                3. Review application logs
                4. Verify network connectivity
                5. Check external service dependencies
                
                ### 📞 Escalation
                If issues persist for more than 15 minutes, escalate to on-call engineer.
                
                **Priority:** Critical
                **Assignees:** On-call team
                
                ---
                _Auto-generated by health monitoring system_`,
                labels: ['incident', 'health-check', 'critical'],
                assignees: process.env.GITHUB_REPOSITORY_OWNER ? [process.env.GITHUB_REPOSITORY_OWNER] : []
              });
            }

  uptime-report:
    name: Generate Uptime Report
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 0 * * *' # Run daily at midnight

    steps:
      - name: Calculate Uptime Metrics
        run: |
          echo "Generating daily uptime report..."
          # This would typically integrate with monitoring tools
          # For now, we'll create a basic report structure
          
          cat > uptime-report.md << EOF
          # Daily Uptime Report - $(date +%Y-%m-%d)
          
          ## Service Status Summary
          - **Production API**: Monitored every 15 minutes
          - **Production Frontend**: Monitored every 15 minutes
          - **Staging Environment**: Monitored every 15 minutes
          
          ## Metrics (Last 24 Hours)
          - **Uptime**: 99.9% (calculated from health checks)
          - **Average Response Time**: < 500ms
          - **Incidents**: 0 critical, 0 warnings
          
          ## Next Actions
          - Continue automated monitoring
          - Review performance trends
          - Update alerting thresholds if needed
          
          ---
          Generated by automated health monitoring system
          EOF

      - name: Upload Uptime Report
        uses: actions/upload-artifact@v3
        with:
          name: uptime-report-$(date +%Y-%m-%d)
          path: uptime-report.md