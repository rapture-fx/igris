name: Dependency Security Scanning

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**/package.json'
      - '**/pnpm-lock.yaml'
      - '**/requirements.txt'
      - '**/poetry.lock'
      - '**/Pipfile.lock'
  pull_request:
    branches: [ main ]
    paths:
      - '**/package.json'
      - '**/pnpm-lock.yaml'
      - '**/requirements.txt'
      - '**/poetry.lock'
      - '**/Pipfile.lock'
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write
  issues: write

jobs:
  dependency-check:
    name: Check Dependency Consistency
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'pnpm'

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Check dependency consistency
      run: pnpm deps:check
      continue-on-error: true
      id: dep-check

    - name: Generate dependency report
      if: always()
      run: |
        echo "## Dependency Consistency Report" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.dep-check.outcome }}" = "success" ]; then
          echo "✅ All dependencies are consistent across the monorepo" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ Dependency inconsistencies found" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Run \`pnpm deps:sync\` to synchronize versions" >> $GITHUB_STEP_SUMMARY
        fi

  security-scan-js:
    name: JavaScript Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'pnpm'

    - name: Install pnpm
      uses: pnpm/action-setup@v2
      with:
        version: 8

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Run security audit
      run: pnpm security:scan
      continue-on-error: true
      id: security-scan

    - name: Upload security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports-js
        path: security-reports/
        retention-days: 30

    - name: Snyk security scan
      uses: snyk/actions/node@master
      continue-on-error: true
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        args: --severity-threshold=high

    - name: Upload Snyk results to GitHub Code Scanning
      if: env.SNYK_TOKEN != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: snyk.sarif

  security-scan-python:
    name: Python Security Scan
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      working-directory: ./apps/api
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit semgrep
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Safety check
      working-directory: ./apps/api
      run: |
        safety check --json --output safety-report.json || true

    - name: Run Bandit security check
      working-directory: ./apps/api
      run: |
        bandit -r app/ -f json -o bandit-report.json || true

    - name: Run Semgrep security scan
      run: |
        semgrep --config=auto --json --output=semgrep-report.json apps/api/ || true

    - name: Upload Python security reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-reports-python
        path: |
          apps/api/safety-report.json
          apps/api/bandit-report.json
          semgrep-report.json
        retention-days: 30

  dependabot-auto-merge:
    name: Auto-merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    needs: [dependency-check, security-scan-js, security-scan-python]

    steps:
    - name: Dependabot metadata
      id: metadata
      uses: dependabot/fetch-metadata@v1
      with:
        github-token: "${{ secrets.GITHUB_TOKEN }}"

    - name: Auto-merge minor and patch updates
      if: steps.metadata.outputs.update-type != 'version-update:semver-major'
      run: gh pr merge --auto --squash "$PR_URL"
      env:
        PR_URL: ${{github.event.pull_request.html_url}}
        GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

  vulnerability-alert:
    name: Security Alert
    runs-on: ubuntu-latest
    needs: [security-scan-js, security-scan-python]
    if: failure()

    steps:
    - name: Create security issue
      uses: actions/github-script@v7
      with:
        script: |
          const title = '🚨 Security Vulnerabilities Detected';
          const body = `
          Security vulnerabilities have been detected in the dependency scan.

          **Action Required:**
          1. Review the security reports in the workflow artifacts
          2. Update vulnerable dependencies
          3. Re-run security scans to verify fixes

          **Workflow:** ${{ github.workflow }}
          **Run:** ${{ github.run_id }}
          **Commit:** ${{ github.sha }}

          This issue was automatically created by the security scanning workflow.
          `;

          // Check if issue already exists
          const issues = await github.rest.issues.listForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            state: 'open',
            labels: 'security,automated'
          });

          const existingIssue = issues.data.find(issue => issue.title === title);

          if (!existingIssue) {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'automated', 'priority:high']
            });
          }

  update-security-dashboard:
    name: Update Security Dashboard
    runs-on: ubuntu-latest
    needs: [dependency-check, security-scan-js, security-scan-python]
    if: always()

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Generate security badge
      run: |
        if [ "${{ needs.security-scan-js.result }}" = "success" ] && [ "${{ needs.security-scan-python.result }}" = "success" ]; then
          echo "SECURITY_STATUS=passing" >> $GITHUB_ENV
          echo "SECURITY_COLOR=brightgreen" >> $GITHUB_ENV
        else
          echo "SECURITY_STATUS=vulnerabilities_found" >> $GITHUB_ENV
          echo "SECURITY_COLOR=red" >> $GITHUB_ENV
        fi

    - name: Update README badge
      if: github.ref == 'refs/heads/main'
      run: |
        # This would update security badges in README.md
        echo "Security Status: ${{ env.SECURITY_STATUS }}"