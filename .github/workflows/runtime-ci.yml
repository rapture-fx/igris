name: Runtime CI

on:
  pull_request:
    branches:
      - "**"
    paths:
      - ".github/workflows/runtime-ci.yml"
      - ".github/workflows/igris-runtime-release.yml"
      - "igris-runtime/**"
  merge_group:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/runtime-ci.yml"
      - ".github/workflows/igris-runtime-release.yml"
      - "igris-runtime/**"

jobs:
  runtime-tests:
    name: Rust runtime workspace tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: igris-runtime

      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang pkg-config

      - name: Run core runtime redaction and WAL tests
        run: cargo test --manifest-path igris-runtime/Cargo.toml -p igris-tools -p igris-wal --lib

      - name: Run runtime workspace unit and integration tests
        run: cargo test --manifest-path igris-runtime/Cargo.toml --workspace --lib --bins --tests -- --test-threads=1
