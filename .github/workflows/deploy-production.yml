name: Deploy to Production (Vultr VPS)

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  
  # Allow manual triggers
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        required: false
        default: 'false'
        type: boolean
      force_deploy:
        description: 'Force deployment even if tests fail'
        required: false
        default: 'false'
        type: boolean

env:
  VPS_HOST: ${{ secrets.VPS_HOST }}
  VPS_USER: ${{ secrets.VPS_USER }}
  DEPLOY_PATH: /home/deploy/igris-inertial
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: igris-inertial

jobs:
  # ==================================================
  # TESTING STAGE
  # ==================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: '**/pnpm-lock.yaml'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install Python dependencies
        working-directory: apps/api
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Python tests
        working-directory: apps/api
        env:
          TESTING: true
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
          python test_api_performance.py

      - name: Run Frontend tests
        working-directory: apps/web-landing
        run: |
          pnpm test --passWithNoTests

      - name: Upload test coverage
        uses: codecov/codecov-action@v3
        with:
          file: ./apps/api/coverage.xml
          flags: api-tests
          name: codecov-api

  # ==================================================
  # SECURITY SCANNING
  # ==================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    if: ${{ always() && (needs.test.result == 'success' || github.event.inputs.force_deploy == 'true') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Python security audit
        working-directory: apps/api
        run: |
          pip install safety bandit
          safety check --json || true
          bandit -r app/ -f json || true

  # ==================================================
  # BUILD AND DEPLOY STAGE
  # ==================================================
  deploy:
    name: Deploy to Vultr VPS
    runs-on: ubuntu-latest
    needs: [test, security]
    if: ${{ always() && (needs.test.result == 'success' || github.event.inputs.force_deploy == 'true') }}
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better context

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push API Docker image
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          file: apps/api/Dockerfile.production
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-api:latest
            ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Frontend Docker images
        run: |
          # Build landing page
          docker build -t ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-landing:latest \
                       -t ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-landing:${{ github.sha }} \
                       apps/web-landing/
          docker push ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-landing:latest
          docker push ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-landing:${{ github.sha }}
          
          # Build admin dashboard
          docker build -t ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-admin:latest \
                       -t ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-admin:${{ github.sha }} \
                       apps/web-admin/
          docker push ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-admin:latest
          docker push ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-admin:${{ github.sha }}
          
          # Build docs
          docker build -t ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-docs:latest \
                       -t ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-docs:${{ github.sha }} \
                       apps/web-docs/
          docker push ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-docs:latest
          docker push ${{ env.DOCKER_REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}-docs:${{ github.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Create deployment package
        run: |
          mkdir -p deployment-package
          
          # Copy deployment files
          cp infrastructure/vultr/docker-compose.production.yml deployment-package/
          cp infrastructure/vultr/deploy.sh deployment-package/
          cp -r infrastructure/vultr/nginx deployment-package/
          
          # Copy environment template
          cp apps/api/env.production.template deployment-package/.env.production.template
          
          # Create deployment info
          cat > deployment-package/deployment-info.json << EOF
          {
            "commit_sha": "${{ github.sha }}",
            "commit_message": "${{ github.event.head_commit.message }}",
            "deployed_by": "${{ github.actor }}",
            "deployed_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "workflow_run": "${{ github.run_id }}",
            "branch": "${{ github.ref_name }}"
          }
          EOF

      - name: Upload deployment package to VPS
        run: |
          rsync -avz --progress \
            --delete-after \
            deployment-package/ \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/tmp/igris-inertial-deploy/

      - name: Deploy to Vultr VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e
            
            echo "🚀 Starting automated deployment..."
            
            # Create deployment directory if it doesn't exist
            sudo mkdir -p ${{ env.DEPLOY_PATH }}
            sudo chown -R ${{ secrets.VPS_USER }}:${{ secrets.VPS_USER }} ${{ env.DEPLOY_PATH }}
            
            # Backup current deployment
            if [ -d "${{ env.DEPLOY_PATH }}/current" ]; then
              echo "📦 Creating backup of current deployment..."
              sudo mv ${{ env.DEPLOY_PATH }}/current ${{ env.DEPLOY_PATH }}/backup-$(date +%Y%m%d-%H%M%S)
              
              # Keep only last 3 backups
              cd ${{ env.DEPLOY_PATH }}
              ls -t backup-* 2>/dev/null | tail -n +4 | xargs -r sudo rm -rf
            fi
            
            # Copy new deployment
            echo "📁 Copying new deployment files..."
            cp -r /tmp/igris-inertial-deploy ${{ env.DEPLOY_PATH }}/current
            cd ${{ env.DEPLOY_PATH }}/current
            
            # Make scripts executable
            chmod +x deploy.sh
            
            # Login to GitHub Container Registry
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Update environment file if it exists
            if [ -f "${{ env.DEPLOY_PATH }}/.env.production" ]; then
              echo "🔧 Using existing environment configuration..."
              cp ${{ env.DEPLOY_PATH }}/.env.production .env.production
            else
              echo "⚠️  No environment file found. Creating from template..."
              cp .env.production.template .env.production
              echo "Please configure .env.production file manually"
            fi
            
            # Run deployment
            echo "🔄 Running deployment script..."
            ./deploy.sh
            
            echo "✅ Deployment completed successfully!"
          ENDSSH

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          
          # Wait for services to start
          sleep 30
          
          # Check API health
          API_URL="https://api.igris-inertial.com/health"
          echo "Checking API health at $API_URL"
          
          for i in {1..10}; do
            if curl -f -s "$API_URL" | jq -e '.status == "healthy"' > /dev/null 2>&1; then
              echo "✅ API health check passed"
              break
            else
              echo "⏳ API health check failed, attempt $i/10"
              sleep 10
            fi
            
            if [ $i -eq 10 ]; then
              echo "❌ API health check failed after 10 attempts"
              exit 1
            fi
          done
          
          # Check frontend
          FRONTEND_URL="https://igris-inertial.com"
          echo "Checking frontend at $FRONTEND_URL"
          
          if curl -f -s -o /dev/null "$FRONTEND_URL"; then
            echo "✅ Frontend health check passed"
          else
            echo "❌ Frontend health check failed"
            exit 1
          fi

      - name: Run post-deployment tests
        run: |
          echo "🧪 Running post-deployment tests..."
          
          # Run API performance tests against live environment
          curl -f -s "https://api.igris-inertial.com/metrics" | jq '.'
          
          # Test key endpoints
          curl -f -s "https://api.igris-inertial.com/" | jq '.status'
          curl -f -s "https://api.igris-inertial.com/docs" > /dev/null
          
          echo "✅ Post-deployment tests passed"

      - name: Update deployment status
        if: always()
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            cd ${{ env.DEPLOY_PATH }}/current
            
            # Update deployment info with status
            jq --arg status "${{ job.status }}" '. + {deployment_status: $status}' deployment-info.json > deployment-info.tmp
            mv deployment-info.tmp deployment-info.json
            
            # Log deployment
            echo "$(date -u +%Y-%m-%dT%H:%M:%SZ) - Deployment ${{ job.status }} - SHA: ${{ github.sha }} - By: ${{ github.actor }}" >> ${{ env.DEPLOY_PATH }}/deployment.log
          ENDSSH

  # ==================================================
  # ROLLBACK JOB (Manual Trigger Only)
  # ==================================================
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: ${{ failure() && github.event_name == 'workflow_dispatch' }}
    needs: [deploy]
    environment: production

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Rollback to previous version
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'ENDSSH'
            set -e
            
            echo "🔄 Rolling back deployment..."
            
            cd ${{ env.DEPLOY_PATH }}
            
            # Find latest backup
            LATEST_BACKUP=$(ls -t backup-* 2>/dev/null | head -n 1)
            
            if [ -z "$LATEST_BACKUP" ]; then
              echo "❌ No backup found for rollback"
              exit 1
            fi
            
            echo "📦 Rolling back to: $LATEST_BACKUP"
            
            # Stop current services
            if [ -d "current" ]; then
              cd current
              docker-compose -f docker-compose.production.yml down || true
              cd ..
            fi
            
            # Move current to failed
            if [ -d "current" ]; then
              mv current failed-$(date +%Y%m%d-%H%M%S)
            fi
            
            # Restore backup
            mv $LATEST_BACKUP current
            cd current
            
            # Start services
            docker-compose -f docker-compose.production.yml up -d
            
            echo "✅ Rollback completed successfully"
          ENDSSH

  # ==================================================
  # NOTIFICATION JOB
  # ==================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy]
    if: always()

    steps:
      - name: Send Slack notification
        if: ${{ vars.SLACK_WEBHOOK_URL }}
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ needs.deploy.result }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
          custom_payload: |
            {
              "text": "${{ needs.deploy.result == 'success' && '✅' || '❌' }} Deployment ${{ needs.deploy.result }}",
              "attachments": [{
                "color": "${{ needs.deploy.result == 'success' && 'good' || 'danger' }}",
                "fields": [
                  {
                    "title": "Repository",
                    "value": "${{ github.repository }}",
                    "short": true
                  },
                  {
                    "title": "Environment", 
                    "value": "Production (Vultr VPS)",
                    "short": true
                  },
                  {
                    "title": "Commit",
                    "value": "${{ github.sha }}",
                    "short": true
                  },
                  {
                    "title": "Author",
                    "value": "${{ github.actor }}",
                    "short": true
                  },
                  {
                    "title": "Status",
                    "value": "🌐 https://igris-inertial.com\n🔗 https://api.igris-inertial.com",
                    "short": false
                  }
                ]
              }]
            }

      - name: Send email notification
        if: ${{ vars.NOTIFICATION_EMAIL }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "🚀 Igris Overture Deployment ${{ needs.deploy.result }}"
          to: ${{ vars.NOTIFICATION_EMAIL }}
          from: Igris Overture CI/CD <${{ secrets.EMAIL_USERNAME }}>
          html_body: |
            <h2>${{ needs.deploy.result == 'success' && '✅ Deployment Successful' || '❌ Deployment Failed' }}</h2>
            <p><strong>Repository:</strong> ${{ github.repository }}</p>
            <p><strong>Commit:</strong> ${{ github.sha }}</p>
            <p><strong>Author:</strong> ${{ github.actor }}</p>
            <p><strong>Message:</strong> ${{ github.event.head_commit.message }}</p>
            <p><strong>Environment:</strong> Production (Vultr VPS)</p>
            
            ${{ needs.deploy.result == 'success' && '<p><strong>Services:</strong></p>
            <ul>
              <li><a href="https://igris-inertial.com">🌐 Landing Page</a></li>
              <li><a href="https://api.igris-inertial.com">🔗 API Backend</a></li>
              <li><a href="https://admin.igris-inertial.com">👤 Admin Dashboard</a></li>
              <li><a href="https://docs.igris-inertial.com">📚 Documentation</a></li>
            </ul>' || '<p>Please check the GitHub Actions logs for error details.</p>' }}
            
            <p><a href="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}">View deployment logs</a></p>