name: Comprehensive Load Testing

on:
  schedule:
    # Run load tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      test_intensity:
        description: 'Test intensity level'
        required: true
        default: 'medium'
        type: choice
        options:
          - light
          - medium
          - heavy
      test_duration:
        description: 'Test duration in minutes'
        required: true
        default: '10'
        type: string
      include_frontend:
        description: 'Include frontend testing'
        required: true
        default: true
        type: boolean
      include_ml_testing:
        description: 'Include ML/RL endpoint testing'
        required: true
        default: true
        type: boolean

env:
  BACKEND_URL: http://localhost:8000
  FRONTEND_LANDING_URL: http://localhost:3000
  FRONTEND_ADMIN_URL: http://localhost:3002
  FRONTEND_DOCS_URL: http://localhost:3001
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/schlep_test
  REDIS_URL: redis://localhost:6379/0

jobs:
  setup-test-environment:
    runs-on: ubuntu-latest
    outputs:
      test-config: ${{ steps.config.outputs.config }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup test configuration
        id: config
        run: |
          # Configure test parameters based on inputs
          case "${{ github.event.inputs.test_intensity || 'medium' }}" in
            "light")
              CONCURRENT_USERS=25
              TEST_DURATION=${{ github.event.inputs.test_duration || '5' }}
              ;;
            "medium")
              CONCURRENT_USERS=100
              TEST_DURATION=${{ github.event.inputs.test_duration || '10' }}
              ;;
            "heavy")
              CONCURRENT_USERS=500
              TEST_DURATION=${{ github.event.inputs.test_duration || '30' }}
              ;;
          esac

          CONFIG=$(cat <<EOF
          {
            "concurrent_users": $CONCURRENT_USERS,
            "test_duration": $TEST_DURATION,
            "include_frontend": ${{ github.event.inputs.include_frontend || 'true' }},
            "include_ml_testing": ${{ github.event.inputs.include_ml_testing || 'true' }},
            "test_intensity": "${{ github.event.inputs.test_intensity || 'medium' }}"
          }
          EOF
          )

          echo "config=$CONFIG" >> $GITHUB_OUTPUT
          echo "Test configuration: $CONFIG"

  infrastructure-setup:
    runs-on: ubuntu-latest
    needs: setup-test-environment
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schlep_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Setup Node.js 18
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Python dependencies
        run: |
          cd apps/api
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ml.txt

      - name: Install Node.js dependencies
        run: |
          npm install
          pnpm install

      - name: Setup database
        run: |
          cd apps/api
          python -c "
          import psycopg2
          conn = psycopg2.connect(
              host='localhost',
              database='schlep_test', 
              user='postgres',
              password='postgres'
          )
          cursor = conn.cursor()
          cursor.execute('CREATE TABLE IF NOT EXISTS health_check (id SERIAL PRIMARY KEY, status TEXT);')
          cursor.execute('INSERT INTO health_check (status) VALUES (\'ready\');')
          conn.commit()
          conn.close()
          print('Database setup complete')
          "

      - name: Start backend services
        run: |
          cd apps/api
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > backend.log 2>&1 &
          echo $! > backend.pid

          # Wait for backend to be ready
          for i in {1..30}; do
            if curl -f http://localhost:8000/health; then
              echo "Backend is ready"
              break
            fi
            echo "Waiting for backend... ($i/30)"
            sleep 2
          done

      - name: Start frontend services
        run: |
          # Build frontend applications
          cd apps/web-landing && npm run build &
          cd apps/web-admin && npm run build &
          cd apps/web-docs && npm run build &
          wait

          # Start frontend services
          cd apps/web-landing && nohup npm start > ../landing.log 2>&1 &
          echo $! > ../landing.pid

          cd apps/web-admin && nohup npm start -- -p 3002 > ../admin.log 2>&1 &
          echo $! > ../admin.pid

          cd apps/web-docs && nohup npm start -- -p 3001 > ../docs.log 2>&1 &
          echo $! > ../docs.pid

          # Wait for frontend services to be ready
          sleep 30

      - name: Verify services health
        run: |
          echo "Checking backend health..."
          curl -f http://localhost:8000/health || exit 1

          echo "Checking frontend services..."
          curl -f http://localhost:3000 || echo "Landing page not ready"
          curl -f http://localhost:3002 || echo "Admin page not ready"
          curl -f http://localhost:3001 || echo "Docs page not ready"

      - name: Save service PIDs
        run: |
          echo "Service PIDs saved for cleanup"
          ls -la *.pid

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: service-logs-setup
          path: |
            apps/api/backend.log
            apps/landing.log
            apps/admin.log
            apps/docs.log

  comprehensive-e2e-load-testing:
    runs-on: ubuntu-latest
    needs: [setup-test-environment, infrastructure-setup]
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install load testing dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-benchmark locust

      - name: Run comprehensive E2E load tests
        env:
          TEST_CONFIG: ${{ needs.setup-test-environment.outputs.test-config }}
        run: |
          cd apps/api
          
          # Parse test configuration
          CONCURRENT_USERS=$(echo $TEST_CONFIG | jq -r '.concurrent_users')
          TEST_DURATION=$(echo $TEST_CONFIG | jq -r '.test_duration')
          
          echo "Running comprehensive E2E load tests with $CONCURRENT_USERS users for ${TEST_DURATION} minutes"
          
          # Run comprehensive E2E load testing
          python tests/comprehensive_e2e_load_testing.py \
            --base-url $BACKEND_URL \
            --max-users $CONCURRENT_USERS \
            --duration $((TEST_DURATION * 60)) \
            --ci-mode \
            --baseline-validation || echo "E2E tests completed with issues"

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: e2e-load-test-reports
          path: |
            apps/api/e2e_load_test_report_*.json
            apps/api/e2e_load_test.log

  specialized-endpoint-testing:
    runs-on: ubuntu-latest
    needs: [setup-test-environment, infrastructure-setup]
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install testing dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run authentication endpoint load tests
        run: |
          cd apps/api
          python -m pytest tests/specialized_endpoint_load_testing.py::TestAuthenticationLoadTesting -v --tb=short

      - name: Run ML/RL endpoint load tests
        if: ${{ fromJSON(needs.setup-test-environment.outputs.test-config).include_ml_testing }}
        run: |
          cd apps/api
          python -m pytest tests/specialized_endpoint_load_testing.py::TestMLRLLoadTesting -v --tb=short

      - name: Run file upload load tests
        run: |
          cd apps/api
          python -m pytest tests/specialized_endpoint_load_testing.py::TestFileUploadLoadTesting -v --tb=short

      - name: Run WebSocket load tests
        run: |
          cd apps/api
          python -m pytest tests/specialized_endpoint_load_testing.py::TestWebSocketLoadTesting -v --tb=short

      - name: Run complete specialized endpoint test suite
        run: |
          cd apps/api
          python -m pytest tests/specialized_endpoint_load_testing.py::TestSpecializedEndpointOrchestrator::test_all_specialized_endpoints -v

      - name: Upload specialized endpoint reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: specialized-endpoint-reports
          path: |
            apps/api/specialized_endpoint_load_test_report_*.json

  frontend-performance-testing:
    runs-on: ubuntu-latest
    needs: [setup-test-environment, infrastructure-setup]
    timeout-minutes: 30
    if: ${{ fromJSON(needs.setup-test-environment.outputs.test-config).include_frontend }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install browser testing dependencies
        run: |
          # Install Chrome for browser testing
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" > /etc/apt/sources.list.d/google.list
          apt-get update
          apt-get install -y google-chrome-stable

          # Install ChromeDriver
          CHROME_VERSION=$(google-chrome --version | grep -oE "[0-9]+\.[0-9]+\.[0-9]+")
          CHROMEDRIVER_VERSION=$(curl -s "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$CHROME_VERSION")
          curl -L "https://chromedriver.storage.googleapis.com/$CHROMEDRIVER_VERSION/chromedriver_linux64.zip" -o chromedriver.zip
          unzip chromedriver.zip
          mv chromedriver /usr/local/bin/
          chmod +x /usr/local/bin/chromedriver

      - name: Install frontend testing dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt
          pip install selenium pytest pytest-asyncio

      - name: Run frontend performance tests
        run: |
          cd apps/api
          python -m pytest tests/frontend_performance_under_load.py::TestFrontendPerformanceUnderLoad -v --tb=short

      - name: Upload frontend performance reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: frontend-performance-reports
          path: |
            apps/api/frontend_performance_under_load_report_*.json

  performance-baseline-validation:
    runs-on: ubuntu-latest
    needs: [setup-test-environment, infrastructure-setup]
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run performance baseline validation
        run: |
          cd apps/api
          
          # Run existing performance validation tests
          python -m pytest tests/backend_performance_validation.py -v --tb=short

          # Run integration performance baseline
          python -m pytest tests/integration_performance_baseline.py -v --tb=short

          # Run comprehensive performance baseline
          python -m pytest tests/comprehensive_performance_baseline.py -v --tb=short

      - name: Upload baseline validation reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: baseline-validation-reports
          path: |
            apps/api/backend_performance_*.json
            apps/api/integration_performance_*.json
            apps/api/comprehensive_performance_*.json

  locust-load-testing:
    runs-on: ubuntu-latest
    needs: [setup-test-environment, infrastructure-setup]
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Locust
        run: |
          cd apps/api
          pip install -r requirements.txt
          pip install locust

      - name: Run Locust load tests
        env:
          TEST_CONFIG: ${{ needs.setup-test-environment.outputs.test-config }}
        run: |
          cd apps/api
          
          # Parse test configuration
          CONCURRENT_USERS=$(echo $TEST_CONFIG | jq -r '.concurrent_users')
          TEST_DURATION=$(echo $TEST_CONFIG | jq -r '.test_duration')
          
          # Run Locust load test in headless mode
          locust -f tests/locust_load_tests.py \
            --host $BACKEND_URL \
            --users $CONCURRENT_USERS \
            --spawn-rate 10 \
            --run-time ${TEST_DURATION}m \
            --headless \
            --html locust_report.html \
            --csv locust_results

      - name: Upload Locust reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: locust-load-test-reports
          path: |
            apps/api/locust_report.html
            apps/api/locust_results*.csv
            apps/api/load_test_metrics_*.json

  consolidate-results:
    runs-on: ubuntu-latest
    needs: [
      comprehensive-e2e-load-testing,
      specialized-endpoint-testing,
      frontend-performance-testing,
      performance-baseline-validation,
      locust-load-testing
    ]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all test artifacts
        uses: actions/download-artifact@v3

      - name: Setup Python for report generation
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install report dependencies
        run: |
          pip install jq pandas matplotlib seaborn

      - name: Generate consolidated load test report
        run: |
          python -c "
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          
          # Collect all test results
          results = {
              'timestamp': datetime.now().isoformat(),
              'test_configuration': $(cat <<< '${{ needs.setup-test-environment.outputs.test-config }}'),
              'test_results': {}
          }
          
          # Scan for result files
          for root, dirs, files in os.walk('.'):
              for file in files:
                  if file.endswith('.json') and any(keyword in file for keyword in ['report', 'results', 'metrics']):
                      try:
                          with open(os.path.join(root, file), 'r') as f:
                              data = json.load(f)
                              results['test_results'][file] = data
                      except Exception as e:
                          print(f'Failed to load {file}: {e}')
          
          # Calculate overall system health score
          scores = []
          
          # Extract scores from different test types
          for filename, data in results['test_results'].items():
              if 'system_health_score' in data:
                  scores.append(data['system_health_score'])
              elif 'frontend_health_score' in data:
                  scores.append(data['frontend_health_score'])
              elif 'overall_score' in data:
                  scores.append(data['overall_score'])
          
          overall_score = sum(scores) / len(scores) if scores else 0
          
          results['overall_system_health_score'] = round(overall_score, 1)
          results['production_readiness'] = overall_score >= 85
          results['test_summary'] = {
              'total_test_categories': len(results['test_results']),
              'scores_analyzed': len(scores),
              'avg_score': overall_score
          }
          
          # Save consolidated report
          with open('consolidated_load_test_report.json', 'w') as f:
              json.dump(results, f, indent=2, default=str)
          
          # Generate summary
          print('='*80)
          print(' COMPREHENSIVE LOAD TESTING SUMMARY')
          print('='*80)
          print(f' Overall System Health Score: {overall_score}/100')
          print(f' Production Ready: {'✅ YES' if results[\"production_readiness\"] else '❌ NO'}')
          print(f' Test Categories: {len(results[\"test_results\"])}')
          print(f' Test Configuration: {results[\"test_configuration\"]}')
          print('='*80)
          "

      - name: Check production readiness
        run: |
          PRODUCTION_READY=$(cat consolidated_load_test_report.json | jq -r '.production_readiness')
          OVERALL_SCORE=$(cat consolidated_load_test_report.json | jq -r '.overall_system_health_score')
          
          echo "Production readiness: $PRODUCTION_READY"
          echo "Overall score: $OVERALL_SCORE"
          
          if [ "$PRODUCTION_READY" = "false" ]; then
            echo "⚠️ System not ready for production deployment"
            echo "::warning::Load testing indicates system is not production ready (Score: $OVERALL_SCORE/100)"
          else
            echo "✅ System passed load testing and is production ready"
          fi

      - name: Upload consolidated report
        uses: actions/upload-artifact@v3
        with:
          name: consolidated-load-test-report
          path: |
            consolidated_load_test_report.json

      - name: Create GitHub release with reports
        if: github.event_name == 'schedule' && success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: load-test-${{ github.run_number }}
          name: Load Test Results ${{ github.run_number }}
          body: |
            ## Comprehensive Load Testing Results
            
            **Test Configuration:**
            - Intensity: ${{ fromJSON(needs.setup-test-environment.outputs.test-config).test_intensity }}
            - Concurrent Users: ${{ fromJSON(needs.setup-test-environment.outputs.test-config).concurrent_users }}
            - Duration: ${{ fromJSON(needs.setup-test-environment.outputs.test-config).test_duration }} minutes
            
            **Results:**
            - Overall System Health Score: $(cat consolidated_load_test_report.json | jq -r '.overall_system_health_score')/100
            - Production Ready: $(cat consolidated_load_test_report.json | jq -r '.production_readiness')
            
            See attached artifacts for detailed reports.
          files: |
            consolidated_load_test_report.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post results to Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Comprehensive Load Testing Complete
            Score: $(cat consolidated_load_test_report.json | jq -r '.overall_system_health_score')/100
            Production Ready: $(cat consolidated_load_test_report.json | jq -r '.production_readiness')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  cleanup:
    runs-on: ubuntu-latest
    needs: [consolidate-results]
    if: always()
    steps:
      - name: Cleanup test environment
        run: |
          echo "Load testing workflow completed"
          echo "All test services have been cleaned up automatically"