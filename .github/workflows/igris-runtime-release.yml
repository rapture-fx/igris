name: Release Igris Runtime

on:
  push:
    tags:
      - 'runtime-v*'  # Trigger on tags like runtime-v1.6.0

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x64
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-arm64
            use_cross: true
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            name: linux-armv7
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-arm64
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-13
            name: macos-x64
            use_cross: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false  # Don't need llama.cpp for just binary

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (Linux targets only)
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (Linux with cross)
        if: matrix.use_cross == true
        working-directory: igris-runtime
        run: cross build --release --target ${{ matrix.target }} --bin igris-runtime

      - name: Build (macOS native)
        if: matrix.use_cross == false
        working-directory: igris-runtime
        run: cargo build --release --target ${{ matrix.target }} --bin igris-runtime

      - name: Package binary
        shell: bash
        run: |
          cd igris-runtime/target/${{ matrix.target }}/release
          tar czf ../../../../igris-runtime-${{ matrix.name }}.tar.gz igris-runtime
          cd -
          sha256sum igris-runtime-${{ matrix.name }}.tar.gz | awk '{print $1}' > igris-runtime-${{ matrix.name }}.tar.gz.sha256
          ls -lh igris-runtime-${{ matrix.name }}.tar.gz
          cat igris-runtime-${{ matrix.name }}.tar.gz.sha256

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            igris-runtime-${{ matrix.name }}.tar.gz
            igris-runtime-${{ matrix.name }}.tar.gz.sha256
          name: Igris Runtime ${{ github.ref_name }}
          body: |
            # Igris Runtime ${{ github.ref_name }}

            Production-ready AI routing engine with automatic local LLM fallback.

            ## Installation

            ```bash
            curl -sSL igrisinertial.com/install | bash
            ```

            ## Platforms

            - Linux x64 (x86_64-unknown-linux-musl)
            - Linux ARM64 (aarch64-unknown-linux-musl)
            - macOS ARM64 (Apple Silicon M1/M2/M3/M4)

            ## What's Included

            - Single static binary (`igris-runtime`)
            - No dependencies required
            - Offline-capable with local LLM fallback
            - OpenAI-compatible API

            ## Quick Start

            After installation:

            ```bash
            # Download a model
            ./download-model.sh

            # Configure
            cp config.json5.example config.json5

            # Run
            igris-runtime serve
            ```

            For detailed documentation, see the [README](https://github.com/Igris-inertial/Igris/tree/main/igris-runtime).
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Create installation scripts in release
  create-installer:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload install script
        uses: softprops/action-gh-release@v2
        with:
          files: igris-runtime/install.sh
          name: Igris Runtime ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
