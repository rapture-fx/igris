name: Release Igris Runtime

on:
  push:
    tags:
      - 'runtime-v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    env:
      RUNTIME_FEATURES: agent-platform
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-x64
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            name: linux-arm64
            use_cross: true
          - target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            name: linux-armv7
            use_cross: true
          - target: aarch64-apple-darwin
            os: macos-latest
            name: macos-arm64
            use_cross: false
          - target: x86_64-apple-darwin
            os: macos-14
            name: macos-x64
            use_cross: false

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux host)
        if: matrix.use_cross == true
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Diagnose OpenSSL dependency chain (Linux only)
        if: matrix.use_cross == true
        working-directory: igris-runtime
        continue-on-error: true
        run: |
          echo "=== Checking for openssl-sys in dependency tree ==="
          cargo tree -e features --target ${{ matrix.target }} -i openssl-sys 2>&1 || echo "openssl-sys not found in tree (good)"
          echo ""
          echo "=== Checking for native-tls in dependency tree ==="
          cargo tree -e features --target ${{ matrix.target }} -i native-tls 2>&1 || echo "native-tls not found in tree (good)"
          echo ""
          echo "=== All TLS-related deps ==="
          cargo tree --target ${{ matrix.target }} 2>&1 | grep -E "openssl|native-tls|rustls|ring|aws-lc" || echo "none found"

      - name: Install cross (Linux targets only)
        if: matrix.use_cross == true
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build (Linux with cross)
        if: matrix.use_cross == true
        working-directory: igris-runtime
        run: cross build --release --target ${{ matrix.target }} --bin igris-runtime --features $RUNTIME_FEATURES

      - name: Build (macOS native)
        if: matrix.use_cross == false
        working-directory: igris-runtime
        run: cargo build --release --target ${{ matrix.target }} --bin igris-runtime --features $RUNTIME_FEATURES

      - name: Package binary
        shell: bash
        run: |
          cd igris-runtime/target/${{ matrix.target }}/release
          tar czf ../../../../igris-runtime-${{ matrix.name }}.tar.gz igris-runtime
          cd ../../../../

          # Portable SHA-256: macOS uses shasum, Linux uses sha256sum
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum igris-runtime-${{ matrix.name }}.tar.gz | awk '{print $1}' > igris-runtime-${{ matrix.name }}.tar.gz.sha256
          else
            shasum -a 256 igris-runtime-${{ matrix.name }}.tar.gz | awk '{print $1}' > igris-runtime-${{ matrix.name }}.tar.gz.sha256
          fi

          echo "=== Package complete ==="
          ls -lh igris-runtime-${{ matrix.name }}.tar.gz
          echo "SHA256: $(cat igris-runtime-${{ matrix.name }}.tar.gz.sha256)"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            igris-runtime-${{ matrix.name }}.tar.gz
            igris-runtime-${{ matrix.name }}.tar.gz.sha256
          name: Igris Runtime ${{ github.ref_name }}
          body: |
            # Igris Runtime ${{ github.ref_name }}

            ## Installation

            Requires an active Igris subscription. Get your API key at https://console.igrisinertial.com/settings/keys

            ```bash
            curl -fsSL https://igrisinertial.com/install | bash
            ```

            Or with API key pre-set:
            ```bash
            IGRIS_API_KEY=igris_xxx curl -fsSL https://igrisinertial.com/install | bash
            ```

            ## Platforms

            | Platform | Target |
            |----------|--------|
            | Linux x64 | x86_64-unknown-linux-musl |
            | Linux ARM64 | aarch64-unknown-linux-musl |
            | Linux ARMv7 | armv7-unknown-linux-musleabihf |
            | macOS ARM64 | aarch64-apple-darwin (Apple Silicon) |
            | macOS x64 | x86_64-apple-darwin (Intel) |

            ## Verify installation

            ```bash
            igris-runtime --version
            ```

            ## Compiled profile

            These release binaries are built with the `agent-platform` feature set.
            ROS2 and full robotics adapters require a dedicated Linux build with
            `--features robotics-platform` or `--features full-platform` in an environment
            that provides ROS2 dependencies.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ⚠️ LEGACY (disabled by default) — mirrors release binaries to the Hetzner box
  # at /opt/igris-binaries. The runtime binary SOURCE OF TRUTH is GitHub Releases,
  # published by the build-and-release job above; the API serves downloads by
  # redirecting to those assets via RUNTIME_BINARIES_URL. This Hetzner mirror is
  # only used by the legacy local-disk serving mode (RUNTIME_BINARIES_DIR) in
  # docker-compose.production.yml. It is gated OFF so runtime releases keep
  # succeeding after Hetzner is decommissioned (a false `if` skips the job — it
  # does not fail the run). To temporarily restore the mirror set repo variable
  # ENABLE_HETZNER_BINARY_MIRROR=true. Delete this job once Hetzner is gone.
  deploy-to-vps:
    name: Deploy binaries to Overture VPS (legacy Hetzner mirror — disabled by default)
    needs: build-and-release
    if: ${{ vars.ENABLE_HETZNER_BINARY_MIRROR == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ github.ref_name }} \
            --repo ${{ github.repository }} \
            --pattern '*.tar.gz' \
            --pattern '*.sha256' \
            --dir ./dist
          echo "=== Downloaded artifacts ==="
          ls -lh ./dist/

      - name: Setup SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          ssh-keyscan -H overture.igrisinertial.com >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Create staging directory on VPS
        run: |
          ssh -i ~/.ssh/vps_key igris@overture.igrisinertial.com \
            "mkdir -p /opt/igris-binaries/staging/${{ github.ref_name }}"

      - name: Upload binaries to VPS
        run: |
          scp -i ~/.ssh/vps_key ./dist/* \
            igris@overture.igrisinertial.com:/opt/igris-binaries/staging/${{ github.ref_name }}/
          echo "=== Upload complete ==="

      - name: Organize binaries on VPS
        run: |
          ssh -i ~/.ssh/vps_key igris@overture.igrisinertial.com \
            "/opt/igris-binaries/organize.sh ${{ github.ref_name }}"

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/vps_key igris@overture.igrisinertial.com \
            "ls -lh /opt/igris-binaries/linux-amd64/ && ls -lh /opt/igris-binaries/linux-arm64/ && ls -lh /opt/igris-binaries/macos-arm64/"
