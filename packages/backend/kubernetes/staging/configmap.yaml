apiVersion: v1
kind: ConfigMap
metadata:
  name: schlep-staging-config
  namespace: schlep-staging
  labels:
    app: schlep-engine
    environment: staging
data:
  # Environment configuration
  ENVIRONMENT: "staging"
  APP_VERSION: "1.0.0"
  DEBUG: "false"
  
  # Server configuration
  HOST: "0.0.0.0"
  PORT: "8000"
  WORKERS: "4"
  RELOAD: "false"
  
  # Database configuration
  STAGING_DB_HOST: "staging-postgresql"
  STAGING_DB_PORT: "5432"
  STAGING_DB_NAME: "schlep_engine_staging"
  STAGING_DB_USER: "schlep_staging"
  
  # Redis configuration
  STAGING_REDIS_HOST: "staging-redis"
  STAGING_REDIS_PORT: "6379"
  STAGING_REDIS_DB: "0"
  
  # Storage configuration
  STAGING_STORAGE_PROVIDER: "gcs"
  STAGING_STORAGE_BUCKET: "schlep-engine-staging"
  STAGING_STORAGE_REGION: "us-central1"
  
  # Security configuration
  ALGORITHM: "HS256"
  ACCESS_TOKEN_EXPIRE_MINUTES: "30"
  REFRESH_TOKEN_EXPIRE_DAYS: "7"
  PASSWORD_MIN_LENGTH: "8"
  MAX_LOGIN_ATTEMPTS: "5"
  LOCKOUT_DURATION_MINUTES: "15"
  
  # Monitoring configuration
  SENTRY_ENVIRONMENT: "staging"
  LOG_LEVEL: "INFO"
  LOG_FILE: "/var/log/schlep-engine/app.log"
  PROMETHEUS_ENABLED: "true"
  METRICS_RETENTION_DAYS: "30"
  
  # Celery configuration
  STAGING_CELERY_TASK_SERIALIZER: "json"
  STAGING_CELERY_ACCEPT_CONTENT: '["json"]'
  STAGING_CELERY_RESULT_SERIALIZER: "json"
  STAGING_CELERY_TIMEZONE: "UTC"
  STAGING_CELERY_ENABLE_UTC: "true"
  STAGING_CELERY_TASK_TRACK_STARTED: "true"
  STAGING_CELERY_TASK_TIME_LIMIT: "1800"
  STAGING_CELERY_TASK_SOFT_TIME_LIMIT: "1500"
  
  # External services
  STAGING_ML_SERVICE_URL: "https://staging-ml.schlep-engine.com"
  STAGING_EMAIL_SERVICE_URL: "https://staging-email.schlep-engine.com"
  STAGING_NOTIFICATION_SERVICE_URL: "https://staging-notifications.schlep-engine.com"
  
  # CORS configuration
  STAGING_ALLOWED_ORIGINS: "http://localhost:3001,https://staging.schlep-engine.com"
  STAGING_ALLOWED_HOSTS: "staging.schlep-engine.com,localhost"
  
  # Rate limiting
  RATE_LIMIT_REQUESTS: "100"
  RATE_LIMIT_WINDOW: "60"
  
  # File upload
  MAX_FILE_SIZE: "100000000"
  ALLOWED_FILE_TYPES: "csv,json,xlsx,parquet"
  
  # Feature flags
  ENABLE_ADVANCED_AI: "true"
  ENABLE_ML_PIPELINE: "true"
  ENABLE_DATA_PROCESSING: "true"
  ENABLE_STORAGE: "true"
  ENABLE_MONITORING: "true"
  ENABLE_SECURITY: "true" 