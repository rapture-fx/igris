apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: staging-postgresql
  namespace: schlep-staging
  labels:
    app: postgresql
    environment: staging
spec:
  serviceName: staging-postgresql
  replicas: 1
  selector:
    matchLabels:
      app: postgresql
      environment: staging
  template:
    metadata:
      labels:
        app: postgresql
        environment: staging
    spec:
      containers:
      - name: postgresql
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_DB
          value: "schlep_engine_staging"
        - name: POSTGRES_USER
          value: "schlep_staging"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: schlep-staging-secrets
              key: STAGING_DB_PASSWORD
        - name: POSTGRES_INITDB_ARGS
          value: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
        volumeMounts:
        - name: postgresql-data
          mountPath: /var/lib/postgresql/data
        - name: postgresql-init
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - schlep_staging
            - -d
            - schlep_engine_staging
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - schlep_staging
            - -d
            - schlep_engine_staging
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: postgresql-init
        configMap:
          name: staging-postgresql-init
  volumeClaimTemplates:
  - metadata:
      name: postgresql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: staging-postgresql
  namespace: schlep-staging
  labels:
    app: postgresql
    environment: staging
spec:
  ports:
  - port: 5432
    targetPort: 5432
  selector:
    app: postgresql
    environment: staging
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: staging-postgresql-init
  namespace: schlep-staging
data:
  init.sql: |
    -- Staging Database Initialization
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";
    
    -- Create staging metadata table
    CREATE TABLE IF NOT EXISTS staging_metadata (
        id SERIAL PRIMARY KEY,
        environment VARCHAR(50) NOT NULL DEFAULT 'staging',
        created_at TIMESTAMP WITH TIME ZONE DEFAULT NOW(),
        updated_at TIMESTAMP WITH TIME ZONE DEFAULT NOW()
    );
    
    -- Insert staging metadata
    INSERT INTO staging_metadata (environment) VALUES ('staging') ON CONFLICT DO NOTHING; 