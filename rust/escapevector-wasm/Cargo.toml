[package]
name = "escapevector-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Schlep Engineering <eng@schlep.ai>"]
description = "Rust WASM EscapeVector Module - <180KB, 5x faster Thompson Sampling"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = { version = "0.2", features = ["js"] }

# Crypto - use lightweight implementations
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable Link Time Optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations
panic = "abort"     # Abort on panic (smaller binary)
strip = true        # Strip symbols
