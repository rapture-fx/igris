services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"  # Bind to localhost only
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
    env_file:
      - .env.production
    volumes:
      - ./apps/api:/app
      - /var/log/schlep:/var/log/schlep
    depends_on:
      - postgres
      - redis
    networks:
      - schlep-engine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./apps/web-frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"  # Bind to localhost only
    environment:
      - NODE_ENV=production
      - VITE_API_URL=https://your-domain.com/api
    networks:
      - schlep-engine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=schlep_engine
      - POSTGRES_USER=postgres
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /var/log/schlep:/var/log/schlep
    networks:
      - schlep-engine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - schlep-engine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  schlep-engine:
    driver: bridge

volumes:
  postgres_data:
  redis_data: