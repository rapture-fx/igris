version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: schlep_postgres
    environment:
      POSTGRES_DB: schlep_engine
      POSTGRES_USER: schlep_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - schlep_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schlep_user -d schlep_engine"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: schlep_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - schlep_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: schlep_backend
    environment:
      - DATABASE_URL=postgresql://schlep_user:${POSTGRES_PASSWORD}@postgres:5432/schlep_engine
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENVIRONMENT=production
      - DEBUG=false
      - ALLOWED_ORIGINS=https://schlep-engine.com,https://admin.schlep-engine.com,https://docs.schlep-engine.com
      - ALLOWED_HOSTS=api.schlep-engine.com,45.77.44.216
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
    ports:
      - "3001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - schlep_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - backend_logs:/app/logs

  # Next.js Landing Page
  landing:
    build:
      context: ./apps/web-landing
      dockerfile: Dockerfile
    container_name: schlep_landing
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.schlep-engine.com
      - NEXT_PUBLIC_DOCS_URL=https://docs.schlep-engine.com
      - NEXT_PUBLIC_ADMIN_URL=https://admin.schlep-engine.com
    ports:
      - "3000:3000"
    networks:
      - schlep_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Admin Dashboard
  admin:
    build:
      context: ./apps/web-admin
      dockerfile: Dockerfile
    container_name: schlep_admin
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.schlep-engine.com
      - NEXT_PUBLIC_BYPASS_AUTH=${BYPASS_AUTH:-false}
    ports:
      - "3002:3000"
    networks:
      - schlep_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Documentation
  docs:
    build:
      context: ./apps/web-docs
      dockerfile: Dockerfile
    container_name: schlep_docs
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.schlep-engine.com
    ports:
      - "3003:3000"
    networks:
      - schlep_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: schlep_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - landing
      - admin
      - docs
    networks:
      - schlep_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot for SSL
  certbot:
    image: certbot/certbot
    container_name: schlep_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email admin@schlep-engine.com --agree-tos --no-eff-email -d schlep-engine.com -d api.schlep-engine.com -d admin.schlep-engine.com -d docs.schlep-engine.com
    depends_on:
      - nginx

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  nginx_logs:
    driver: local

networks:
  schlep_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16