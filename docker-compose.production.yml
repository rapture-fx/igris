version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: igris-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-igris_overture}
      POSTGRES_USER: ${POSTGRES_USER:-igris_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-igris_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - igris-network

  # Dragonfly Cache (Redis-compatible, 25× faster)
  # Replaces Redis with 200k+ RPS capacity (was 8k RPS)
  cache:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: igris-dragonfly
    restart: unless-stopped
    command: >
      dragonfly
      --logtostderr
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 4gb
      --cache_mode
      --proactor_threads 8
      --snapshot_cron "0 */6 * * *"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - igris-network

  # Igris Overture API
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: igris-overture
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      # Server Configuration
      PORT: 8080
      HOST: 0.0.0.0
      ENV: production

      # Database Configuration
      DATABASE_URL: postgres://${POSTGRES_USER:-igris_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-igris_overture}?sslmode=disable
      ENABLE_PERSISTENCE: "true"
      DB_MAX_OPEN_CONNS: 25
      DB_MAX_IDLE_CONNS: 5

      # Dragonfly Cache Configuration (Redis-compatible)
      USE_REDIS: "true"
      REDIS_URL: ${REDIS_URL:-redis://:changeme@cache:6379/0}

      # Multi-Tenancy
      ENABLE_MULTI_TENANCY: ${ENABLE_MULTI_TENANCY:-true}
      REQUIRE_AUTH_FOR_INFERENCE: ${REQUIRE_AUTH_FOR_INFERENCE:-false}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret}
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:-please-change-this-vault-key}

      # Better Auth (session validation for web console)
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}

      # Clerk Authentication (legacy, unused)
      CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
      CLERK_FRONTEND_API: ${CLERK_FRONTEND_API:-}

      # Provider Configuration
      PROVIDER_MODE: ${PROVIDER_MODE:-benchmark}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Safety Configuration
      MAX_MONTHLY_COST_USD: ${MAX_MONTHLY_COST_USD:-100.00}
      MAX_TOKENS_PER_REQUEST: ${MAX_TOKENS_PER_REQUEST:-4096}
      ENABLE_BUDGET_LIMIT: "true"
      ENABLE_TOKEN_LIMIT: "true"
      FALLBACK_ON_BUDGET_BREACH: "true"
      ENABLE_BENCHMARK_FALLBACK: "true"

      # State Persistence
      USE_PG_OPTIMIZER_STATE: "true"
      USE_DISTRIBUTED_LOCK: "true"

      # Runtime Binary Distribution
      RUNTIME_BINARIES_DIR: /opt/igris-binaries
      RUNTIME_BINARY_VERSION: ${RUNTIME_BINARY_VERSION:-latest}

      # Polar.sh Billing
      POLAR_ACCESS_TOKEN: ${POLAR_ACCESS_TOKEN:-}
      POLAR_WEBHOOK_SECRET: ${POLAR_WEBHOOK_SECRET:-}

      # Resend Email
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-noreply@igrisinertial.com}

      # Observability
      METRICS_ENABLED: "true"
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      JAEGER_ENDPOINT: ${JAEGER_ENDPOINT:-http://jaeger:14268/api/traces}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: json

    volumes:
      - /opt/igris-binaries:/opt/igris-binaries:ro

    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - igris-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Igris Console (Next.js)
  console:
    build:
      context: .
      dockerfile: web/Dockerfile.console
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://overture.igrisinertial.com}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://console.igrisinertial.com}
        NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL:-https://igrisinertial.com}
        NEXT_PUBLIC_API_HEALTH_CHECK_URL: /healthz
        NEXT_PUBLIC_ENV: production
        NEXT_PUBLIC_ENABLE_ANALYTICS: "true"
        NEXT_PUBLIC_ENABLE_MONITORING: "true"
        NEXT_PUBLIC_ENABLE_MOCK_DATA: "false"
        NEXT_PUBLIC_DEV_MODE: "false"
    container_name: igris-console
    restart: unless-stopped
    expose:
      - "3005"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://overture.igrisinertial.com}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://console.igrisinertial.com}
      NEXT_PUBLIC_LANDING_URL: ${NEXT_PUBLIC_LANDING_URL:-https://igrisinertial.com}
      NEXT_PUBLIC_API_HEALTH_CHECK_URL: /healthz
      NEXT_PUBLIC_ENABLE_ANALYTICS: "true"
      NEXT_PUBLIC_ENABLE_MONITORING: "true"
      NEXT_PUBLIC_ENABLE_MOCK_DATA: "false"
      NEXT_PUBLIC_DEV_MODE: "false"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_API_KEY: ${BETTER_AUTH_API_KEY}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-https://console.igrisinertial.com}
      DATABASE_URL: postgres://${POSTGRES_USER:-igris_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-igris_overture}?sslmode=disable
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-igrisinertial.com}
      RESEND_API_KEY: ${RESEND_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3005/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - igris-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Caddy Reverse Proxy
  caddy:
    image: caddy:2-alpine
    container_name: igris-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - igris-network
    depends_on:
      - api
      - console

  # Prometheus (Optional - for metrics)
  prometheus:
    image: prom/prometheus:latest
    container_name: igris-prometheus
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - igris-network
    profiles:
      - monitoring

  # Grafana (Optional - for visualization)
  grafana:
    image: grafana/grafana:latest
    container_name: igris-grafana
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: ""
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./infra/grafana/datasources:/etc/grafana/provisioning/datasources
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - igris-network
    profiles:
      - monitoring

  # Jaeger (Distributed Tracing)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: igris-jaeger
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"        # Jaeger UI
      - "${JAEGER_COLLECTOR_PORT:-14268}:14268" # Jaeger collector HTTP
      - "${JAEGER_AGENT_PORT:-6831}:6831/udp"   # Jaeger agent (UDP)
      - "${JAEGER_ZIPKIN_PORT:-9411}:9411"      # Zipkin compatible endpoint
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: ":9411"
      COLLECTOR_OTLP_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:14269/"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - igris-network
    profiles:
      - monitoring

networks:
  igris-network:
    driver: bridge

volumes:
  postgres_data:
  dragonfly_data:
  prometheus_data:
  grafana_data:
  caddy_data:
  caddy_config:
