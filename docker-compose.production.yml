services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"  # Bind to localhost only
    environment:
      - PYTHONPATH=/app
      - ENVIRONMENT=production
    env_file:
      - .env.production
    volumes:
      - ./apps/api:/app
      - /var/log/schlep:/var/log/schlep
    depends_on:
      - postgres
      - redis
    networks:
      - schlep-engine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  web-landing:
    build:
      context: ./apps/web-landing
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.schlep-engine.com
    networks:
      - schlep-engine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  web-admin:
    build:
      context: ./apps/web-admin
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3002:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.schlep-engine.com
    networks:
      - schlep-engine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  web-docs:
    build:
      context: ./apps/web-docs
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3003:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.schlep-engine.com
    networks:
      - schlep-engine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"

  nginx:
    image: nginx:1.26.2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api
      - web-landing
      - web-admin
      - web-docs
    networks:
      - schlep-engine
    restart: unless-stopped

  postgres:
    image: postgres:15.8-alpine
    environment:
      - POSTGRES_DB=schlep_engine
      - POSTGRES_USER=postgres
    env_file:
      - .env.production
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - /var/log/schlep:/var/log/schlep
    networks:
      - schlep-engine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7.4.1-alpine
    volumes:
      - redis_data:/data
    networks:
      - schlep-engine
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  schlep-engine:
    driver: bridge

volumes:
  postgres_data:
  redis_data: