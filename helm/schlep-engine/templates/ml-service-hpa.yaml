{{- if and .Values.mlService.enabled .Values.mlService.autoscaling.enabled -}}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "schlep-engine.fullname" . }}-ml-service
  labels:
    {{- include "schlep-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "schlep-engine.fullname" . }}-ml-service
  minReplicas: {{ .Values.mlService.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.mlService.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.mlService.autoscaling.targetCPUUtilizationPercentage }}
  {{- if .Values.mlService.autoscaling.customMetrics }}
  {{- range .Values.mlService.autoscaling.customMetrics }}
  - type: {{ .type }}
    pods:
      metric:
        name: {{ .pods.metric.name }}
      target:
        type: {{ .pods.target.type }}
        averageValue: {{ .pods.target.averageValue }}
  {{- end }}
  {{- end }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 3
        periodSeconds: 15
      selectPolicy: Max
{{- end }}
