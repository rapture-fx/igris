events {
    worker_connections 4096;
}

http {
    upstream go_gateway {
        least_conn;
        server go-gateway:8080 max_fails=3 fail_timeout=30s;
    }

    upstream python_api {
        least_conn;
        server python-api-legacy:8000 max_fails=3 fail_timeout=30s;
    }

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream: $upstream_addr rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name localhost;

        # Health check endpoint (direct to Go)
        location /health {
            proxy_pass http://go_gateway/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
        }

        # Metrics endpoint (direct to Go)
        location /metrics {
            proxy_pass http://go_gateway/metrics;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Feature flag: Route specific paths to Go gateway
        # Phase 1: Health & Metrics (already Go-native)
        location ~ ^/api/v1/(health|metrics|ready) {
            proxy_pass http://go_gateway;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;
        }

        # Phase 2: Auth endpoints (can be enabled via feature flag)
        # Uncomment to route auth to Go gateway
        # location ~ ^/api/v1/auth {
        #     proxy_pass http://go_gateway;
        #     proxy_http_version 1.1;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # }

        # Default: Route everything else to legacy Python API
        location / {
            proxy_pass http://python_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;

            # Timeouts for Python API (longer for ML operations)
            proxy_connect_timeout 30s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
        }

        # WebSocket support (for streaming endpoints)
        location /api/v1/websocket {
            proxy_pass http://python_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;
        }
    }
}
