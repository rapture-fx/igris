# Prometheus Configuration for Schlep-Engine Hybrid Architecture

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'schlep-engine-hybrid'
    environment: 'development'

# Alertmanager configuration (optional)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # Go API Gateway metrics
  - job_name: 'go-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['go-gateway:8080']
        labels:
          service: 'go-gateway'
          language: 'go'
          component: 'api-gateway'
    metric_relabel_configs:
      # Keep only relevant metrics
      - source_labels: [__name__]
        regex: '(http_.*|go_.*|rust_ffi_.*|grpc_client_.*|db_.*)'
        action: keep

  # Python ML Service metrics (if exposed)
  - job_name: 'python-ml'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['python-ml:50051']
        labels:
          service: 'python-ml'
          language: 'python'
          component: 'ml-service'

  # Legacy Python API metrics - REMOVED (October 2025)
  # FastAPI service fully migrated to Go Gateway
  # See: docs/LEGACY/fastapi-archive.md for rollback
  # - job_name: 'python-api-legacy'
  #   metrics_path: '/metrics'
  #   static_configs:
  #     - targets: ['python-api-legacy:8000']
  #       labels:
  #         service: 'python-api-legacy'
  #         language: 'python'
  #         component: 'api-monolith'

  # PostgreSQL exporter (optional - requires postgres_exporter)
  # - job_name: 'postgres'
  #   static_configs:
  #     - targets: ['postgres-exporter:9187']
  #       labels:
  #         service: 'postgres'

  # Redis exporter (optional - requires redis_exporter)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  #       labels:
  #         service: 'redis'

  # NATS monitoring
  - job_name: 'nats'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['nats:8222']
        labels:
          service: 'nats'
          component: 'messaging'

# Recording rules for aggregation
# rule_files:
#   - '/etc/prometheus/rules/*.yml'
