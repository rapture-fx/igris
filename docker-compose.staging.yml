version: '3.8'

services:
  # PostgreSQL Database (Staging)
  postgres:
    image: postgres:15-alpine
    container_name: schlep-postgres-staging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-igris_overture_staging}
      POSTGRES_USER: ${POSTGRES_USER:-schlep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schlep_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - schlep-staging-network

  # Dragonfly Cache (Redis-compatible, 25× faster) - Staging
  cache:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    container_name: schlep-dragonfly-staging
    restart: unless-stopped
    command: >
      dragonfly
      --logtostderr
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 4gb
      --cache_mode
      --proactor_threads 8
      --snapshot_cron "0 */6 * * *"
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - dragonfly_staging_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - schlep-staging-network

  # Schlep-Engine API (Staging)
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: igris-overture-staging
    restart: unless-stopped
    ports:
      - "${API_PORT:-8081}:8080"
    environment:
      # Server Configuration
      PORT: 8080
      HOST: 0.0.0.0
      ENV: staging

      # Database Configuration
      DATABASE_URL: postgres://${POSTGRES_USER:-schlep_user}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-igris_overture_staging}?sslmode=disable
      ENABLE_PERSISTENCE: "true"
      DB_MAX_OPEN_CONNS: 25
      DB_MAX_IDLE_CONNS: 5

      # Dragonfly Cache Configuration (Redis-compatible)
      USE_REDIS: "true"
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme}@cache:6379/0

      # Multi-Tenancy
      ENABLE_MULTI_TENANCY: ${ENABLE_MULTI_TENANCY:-true}
      REQUIRE_AUTH_FOR_INFERENCE: ${REQUIRE_AUTH_FOR_INFERENCE:-false}
      JWT_SECRET: ${JWT_SECRET:-staging-jwt-secret}
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:-staging-vault-key}

      # Provider Configuration
      PROVIDER_MODE: ${PROVIDER_MODE:-benchmark}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # Safety Configuration
      MAX_MONTHLY_COST_USD: ${MAX_MONTHLY_COST_USD:-50.00}
      MAX_TOKENS_PER_REQUEST: ${MAX_TOKENS_PER_REQUEST:-4096}
      ENABLE_BUDGET_LIMIT: "true"
      ENABLE_TOKEN_LIMIT: "true"
      FALLBACK_ON_BUDGET_BREACH: "true"
      ENABLE_BENCHMARK_FALLBACK: "true"

      # State Persistence
      USE_PG_OPTIMIZER_STATE: "true"
      USE_DISTRIBUTED_LOCK: "true"

      # Observability
      METRICS_ENABLED: "true"
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      LOG_FORMAT: json

    depends_on:
      postgres:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - schlep-staging-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  schlep-staging-network:
    driver: bridge

volumes:
  postgres_staging_data:
  dragonfly_staging_data:
