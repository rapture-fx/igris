[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "igris-cli"
version = "1.0.0-rc1"
description = "Official Igris Overture CLI for onboarding, key management, and inference testing"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Igris Overture Team", email = "hello@igris-overture.com"}
]
keywords = [
    "igris",
    "igris-overture",
    "cli",
    "ai-routing",
    "llm",
    "devops"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
igris = "igris_cli.main:cli"

[project.urls]
Homepage = "https://github.com/Schlep-engine/igris-inertial"
Documentation = "https://github.com/Schlep-engine/igris-inertial/blob/main/igris-overture/cli/README.md"
Repository = "https://github.com/Schlep-engine/igris-inertial"

[tool.setuptools.packages.find]
where = ["."]
include = ["igris_cli*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
