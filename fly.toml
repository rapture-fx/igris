# Igris Inertial — Overture API (Fly.io deployment)
# Deploy: fly deploy
# Logs:   fly logs
# SSH:    fly ssh console

app = "igris-overture"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  ENABLE_PERSISTENCE = "true"
  ENABLE_MULTI_TENANCY = "true"
  USE_REDIS = "true"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/v1/health"
  timeout = "5s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[metrics]
  port = 8080
  path = "/metrics"
