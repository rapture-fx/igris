# Phase 12 Validation Plan Implementation
# Staged rollout with automated checkpoints and safety controls

apiVersion: v1
kind: ConfigMap
metadata:
  name: validation-plan-config
  namespace: schlep-system
data:
  rollout_plan.json: |
    {
      "phases": [
        {
          "name": "integration_testing_ci",
          "duration_hours": 24,
          "traffic_percentage": 0,
          "autonomous_enabled": false,
          "actions": [
            "Run full integration suite in staging (100 scenarios)",
            "Block merges on any new integration regressions",
            "Verify 100% test pass rate",
            "Validate all 11 metric dimensions within SLA"
          ],
          "success_criteria": {
            "test_pass_rate": 1.0,
            "p99_latency_ms": 150,
            "integration_regressions": 0
          },
          "on_failure": "abort_rollout"
        },
        {
          "name": "shadow_observation",
          "duration_hours": 72,
          "traffic_percentage": 0.5,
          "autonomous_enabled": false,
          "shadow_mode": true,
          "actions": [
            "Collect decision traces, SLO events, and audit logs",
            "Run offline replay analysis against Phase 11.1 simulator",
            "Verify 100% audit coverage with HMAC signatures",
            "Monitor false positive rate < 2%"
          ],
          "success_criteria": {
            "audit_coverage": 1.0,
            "false_positive_rate": 0.02,
            "decision_trace_count": ">1000",
            "hmac_verification_rate": 1.0
          },
          "on_failure": "extend_shadow_period"
        },
        {
          "name": "canary_1pct",
          "duration_hours": 24,
          "traffic_percentage": 1,
          "autonomous_enabled": true,
          "hold_checks": [
            "No SLO breaches for 1h",
            "Rollback if drift_score > 5%",
            "Rollback if p99 > 150ms twice in a row"
          ],
          "success_criteria": {
            "slo_breaches": 0,
            "drift_score": 0.05,
            "p99_latency_ms": 150,
            "autonomous_action_rate": ">0"
          },
          "on_failure": "rollback_to_shadow"
        },
        {
          "name": "canary_5pct",
          "duration_hours": 24,
          "traffic_percentage": 5,
          "autonomous_enabled": true,
          "hold_checks": [
            "No SLO breaches for 1h",
            "Rollback if drift_score > 5%",
            "Rollback if p99 > 150ms twice in a row"
          ],
          "success_criteria": {
            "slo_breaches": 0,
            "drift_score": 0.05,
            "p99_latency_ms": 150,
            "recovery_time_seconds": 2.0
          },
          "on_failure": "rollback_to_previous_stage"
        },
        {
          "name": "canary_25pct",
          "duration_hours": 48,
          "traffic_percentage": 25,
          "autonomous_enabled": true,
          "hold_checks": [
            "No SLO breaches for 1h",
            "Rollback if drift_score > 5%",
            "Rollback if p99 > 150ms twice in a row"
          ],
          "success_criteria": {
            "slo_breaches": 0,
            "drift_score": 0.05,
            "p99_latency_ms": 150,
            "cache_hit_rate": ">0.85"
          },
          "on_failure": "rollback_to_previous_stage"
        },
        {
          "name": "canary_50pct",
          "duration_hours": 72,
          "traffic_percentage": 50,
          "autonomous_enabled": true,
          "hold_checks": [
            "No SLO breaches for 1h",
            "Rollback if drift_score > 5%",
            "Rollback if p99 > 150ms twice in a row"
          ],
          "success_criteria": {
            "slo_breaches": 0,
            "drift_score": 0.05,
            "p99_latency_ms": 150,
            "throughput_rps": ">10000"
          },
          "on_failure": "rollback_to_previous_stage"
        },
        {
          "name": "full_rollout_soak",
          "duration_hours": 336,
          "traffic_percentage": 100,
          "autonomous_enabled": true,
          "actions": [
            "Run chaos harness weekly",
            "Monitor audit logs and recovery times",
            "Track error budget consumption",
            "Continuous SLO validation"
          ],
          "success_criteria": {
            "slo_violation_count": 1,
            "p99_latency_ms": 150,
            "recovery_time_seconds": 2.0,
            "autonomous_action_rate": ">0",
            "audit_coverage": 1.0
          },
          "on_failure": "partial_rollback"
        }
      ],
      "metrics_to_monitor": [
        "p99_latency_ms",
        "p95_latency_ms",
        "throughput_rps",
        "cache_hit_rate",
        "recovery_time_seconds",
        "autonomous_action_rate",
        "false_positive_rate",
        "slo_violation_count",
        "policy_commit_rate",
        "system_cpu_percent",
        "system_mem_mb"
      ],
      "safety_controls": {
        "manual": {
          "kill_switch": "vault:manual_kill_switch -> immediate stop all autonomous actions",
          "pause_autonomy": "ops:pause_autonomy -> shadow only"
        },
        "automated": {
          "auto_rollback_drift": "drift > 5% over configured window",
          "cooldown_windows": "10m for repeated actions",
          "rate_limit_actions_per_hour": 10,
          "max_concurrent_actions": 3
        },
        "audit": {
          "checkpoint_id_required": true,
          "hmac_signature_required": true,
          "immutable_runbook_entries": true
        }
      }
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: safety-controls-config
  namespace: schlep-system
data:
  kill_switch.sh: |
    #!/bin/bash
    # Manual Kill Switch - Immediately stop all autonomous actions
    echo "EMERGENCY: Activating kill switch..."
    vault write secret/schlep/kill_switch enabled=true timestamp=$(date -u +%s)
    kubectl scale deployment schlep-autonomous-controller --replicas=0 -n schlep-system
    kubectl annotate deployment schlep-gateway kill-switch=active -n schlep-system
    echo "Kill switch activated. All autonomous actions stopped."

  pause_autonomy.sh: |
    #!/bin/bash
    # Pause Autonomy - Switch to shadow mode only
    echo "Pausing autonomous actions, switching to shadow mode..."
    kubectl set env deployment/schlep-autonomous-controller SHADOW_MODE=true -n schlep-system
    kubectl set env deployment/schlep-autonomous-controller AUTONOMOUS_COMMIT_ENABLED=false -n schlep-system
    echo "Autonomy paused. System in shadow observation mode."

  resume_autonomy.sh: |
    #!/bin/bash
    # Resume Autonomy - Exit shadow mode
    echo "Resuming autonomous actions..."
    vault write secret/schlep/kill_switch enabled=false
    kubectl set env deployment/schlep-autonomous-controller SHADOW_MODE=false -n schlep-system
    kubectl set env deployment/schlep-autonomous-controller AUTONOMOUS_COMMIT_ENABLED=true -n schlep-system
    kubectl scale deployment schlep-autonomous-controller --replicas=3 -n schlep-system
    echo "Autonomy resumed. System active."

  auto_rollback.sh: |
    #!/bin/bash
    # Automated Rollback Trigger
    DRIFT_THRESHOLD=0.05
    P99_THRESHOLD=150
    WINDOW_SEC=300

    check_drift() {
      drift=$(curl -s http://localhost:8081/policy/drift_score | jq '.drift_score')
      if (( $(echo "$drift > $DRIFT_THRESHOLD" | bc -l) )); then
        echo "DRIFT ALERT: $drift > $DRIFT_THRESHOLD"
        return 1
      fi
      return 0
    }

    check_p99() {
      p99=$(curl -s http://localhost:8081/metrics | grep p99_latency_ms | awk '{print $2}')
      if (( $(echo "$p99 > $P99_THRESHOLD" | bc -l) )); then
        echo "P99 ALERT: $p99 > $P99_THRESHOLD"
        return 1
      fi
      return 0
    }

    trigger_rollback() {
      echo "TRIGGERING AUTOMATED ROLLBACK..."
      kubectl set env deployment/schlep-autonomous-controller AUTONOMOUS_COMMIT_ENABLED=false -n schlep-system
      kubectl rollout undo deployment/schlep-autonomous-controller -n schlep-system

      # Alert SRE
      curl -X POST https://hooks.slack.com/services/WEBHOOK_URL \
        -d "{\"text\":\"AUTOMATED ROLLBACK TRIGGERED: Drift or SLO breach detected\"}"

      # Collect forensic traces
      kubectl logs deployment/schlep-autonomous-controller -n schlep-system --tail=1000 > /var/log/schlep/rollback_forensics_$(date +%s).log
    }

    # Main monitoring loop
    consecutive_failures=0
    while true; do
      if ! check_drift || ! check_p99; then
        ((consecutive_failures++))
        if [ $consecutive_failures -ge 2 ]; then
          trigger_rollback
          exit 1
        fi
      else
        consecutive_failures=0
      fi
      sleep 60
    done

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: validation-controller
  namespace: schlep-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: validation-controller
  template:
    metadata:
      labels:
        app: validation-controller
    spec:
      serviceAccountName: schlep-shadow-sa
      containers:
      - name: validation-controller
        image: schlep/validation-controller:latest
        env:
        - name: VALIDATION_PLAN_PATH
          value: "/etc/schlep/rollout_plan.json"
        - name: CURRENT_PHASE
          valueFrom:
            configMapKeyRef:
              name: validation-state
              key: current_phase
        - name: METRICS_EXPORT_INTERVAL_SEC
          value: "30"

        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"

        volumeMounts:
        - name: validation-plan
          mountPath: /etc/schlep
        - name: safety-controls
          mountPath: /usr/local/bin/safety

      - name: auto-rollback-monitor
        image: schlep/auto-rollback-monitor:latest
        env:
        - name: DRIFT_THRESHOLD
          value: "0.05"
        - name: P99_THRESHOLD
          value: "150"
        - name: MONITORING_WINDOW_SEC
          value: "300"
        - name: CONSECUTIVE_FAILURES_TRIGGER
          value: "2"

        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"

        volumeMounts:
        - name: safety-controls
          mountPath: /usr/local/bin/safety

      volumes:
      - name: validation-plan
        configMap:
          name: validation-plan-config
      - name: safety-controls
        configMap:
          name: safety-controls-config
          defaultMode: 0755

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: validation-state
  namespace: schlep-system
data:
  current_phase: "integration_testing_ci"
  phase_start_time: ""
  last_health_check: ""
  rollback_count: "0"

---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: phase12-validation-alerts
  namespace: schlep-system
spec:
  groups:
  - name: phase12_validation
    interval: 30s
    rules:
    - alert: SLOBreach
      expr: slo_breach_count > 0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "SLO breach detected during validation"
        description: "{{ $labels.slo_type }} breached threshold"

    - alert: DriftExceedsThreshold
      expr: policy_drift_score > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "Policy drift exceeds 5% threshold"
        description: "Drift score: {{ $value }}"

    - alert: P99LatencyExceeded
      expr: p99_latency_ms > 150
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "P99 latency exceeds 150ms SLA"
        description: "Current p99: {{ $value }}ms"

    - alert: RecoveryTimeExceeded
      expr: recovery_time_seconds > 2.0
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: "Recovery time exceeds 2.0s SLA"
        description: "Current recovery time: {{ $value }}s"

    - alert: FalsePositiveRateHigh
      expr: false_positive_rate > 0.02
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: "False positive rate exceeds 2%"
        description: "Current rate: {{ $value }}"

    - alert: AuditCoverageIncomplete
      expr: audit_coverage_rate < 1.0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: "Audit coverage below 100%"
        description: "Coverage: {{ $value }}"
