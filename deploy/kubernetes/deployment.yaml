apiVersion: apps/v1
kind: Deployment
metadata:
  name: schlep-engine-inference
  namespace: ml-platform
  labels:
    app: schlep-engine
    component: inference
    version: v1.0.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: schlep-engine
      component: inference
  template:
    metadata:
      labels:
        app: schlep-engine
        component: inference
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # GPU Node Selection
      nodeSelector:
        accelerator: nvidia-tesla-v100
        node-type: gpu-inference

      # Tolerations for GPU nodes
      tolerations:
      - key: nvidia.com/gpu
        operator: Equal
        value: present
        effect: NoSchedule

      # Anti-affinity for high availability
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - schlep-engine
              topologyKey: kubernetes.io/hostname

      # Service Account
      serviceAccountName: schlep-engine-inference

      # Init Container - Model Download
      initContainers:
      - name: model-downloader
        image: google/cloud-sdk:alpine
        command:
        - sh
        - -c
        - |
          echo "Downloading models..."
          gsutil -m cp -r gs://schlep-models/production/* /models/
          echo "Models downloaded successfully"
        volumeMounts:
        - name: model-storage
          mountPath: /models
        env:
        - name: GOOGLE_APPLICATION_CREDENTIALS
          value: /var/secrets/google/key.json
        volumeMounts:
        - name: gcp-credentials
          mountPath: /var/secrets/google
          readOnly: true

      containers:
      # Main Inference Container
      - name: inference-server
        image: schlep-engine/inference:v1.0.0-gpu
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: grpc
          containerPort: 50051
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        - name: websocket
          containerPort: 8081
          protocol: TCP

        # Resource Limits
        resources:
          requests:
            cpu: "2000m"
            memory: "4Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4000m"
            memory: "8Gi"
            nvidia.com/gpu: "1"

        # Environment Variables
        env:
        - name: GPU_ENABLED
          value: "true"
        - name: CUDA_DEVICE_ID
          value: "0"
        - name: ONNX_OPTIMIZATION_LEVEL
          value: "3"
        - name: TENSORRT_ENABLED
          value: "false"
        - name: TENSORRT_FP16
          value: "false"
        - name: MIN_WORKERS
          value: "5"
        - name: MAX_WORKERS
          value: "50"
        - name: MULTI_MODEL_ENABLED
          value: "true"
        - name: THOMPSON_SAMPLING_EXPLORATION
          value: "0.1"
        - name: DRIFT_THRESHOLD
          value: "0.15"
        - name: PROMETHEUS_PORT
          value: "9090"
        - name: LOG_LEVEL
          value: "info"
        - name: MODEL_PATH
          value: "/models"

        # Volume Mounts
        volumeMounts:
        - name: model-storage
          mountPath: /models
          readOnly: true
        - name: config
          mountPath: /etc/schlep-engine
          readOnly: true
        - name: cache
          mountPath: /cache

        # Health Probes
        livenessProbe:
          httpGet:
            path: /health/live
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health/ready
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

        startupProbe:
          httpGet:
            path: /health/startup
            port: 8080
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30

        # Lifecycle Hooks
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - |
                echo "Graceful shutdown initiated..."
                kill -TERM 1
                sleep 30

      # Sidecar - Prometheus Exporter (if needed)
      - name: prometheus-exporter
        image: prom/statsd-exporter:v0.24.0
        ports:
        - name: metrics
          containerPort: 9102
        args:
        - --statsd.listen-udp=:9125
        - --web.listen-address=:9102

      # Volumes
      volumes:
      - name: model-storage
        emptyDir:
          sizeLimit: 20Gi
      - name: config
        configMap:
          name: schlep-engine-config
      - name: cache
        emptyDir:
          sizeLimit: 5Gi
      - name: gcp-credentials
        secret:
          secretName: gcp-credentials

      # DNS Config
      dnsPolicy: ClusterFirst

      # Termination Grace Period
      terminationGracePeriodSeconds: 60

---
apiVersion: v1
kind: Service
metadata:
  name: schlep-engine-inference
  namespace: ml-platform
  labels:
    app: schlep-engine
    component: inference
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  selector:
    app: schlep-engine
    component: inference
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  - name: grpc
    port: 50051
    targetPort: 50051
    protocol: TCP
  - name: websocket
    port: 8081
    targetPort: 8081
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 300

---
apiVersion: v1
kind: Service
metadata:
  name: schlep-engine-inference-headless
  namespace: ml-platform
  labels:
    app: schlep-engine
    component: inference
spec:
  clusterIP: None
  selector:
    app: schlep-engine
    component: inference
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: grpc
    port: 50051
    targetPort: 50051

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: schlep-engine-inference-pdb
  namespace: ml-platform
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: schlep-engine
      component: inference

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: schlep-engine-inference-hpa
  namespace: ml-platform
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: schlep-engine-inference
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "10000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Max

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: schlep-engine-config
  namespace: ml-platform
data:
  config.yaml: |
    server:
      http_port: 8080
      grpc_port: 50051
      websocket_port: 8081
      metrics_port: 9090

    gpu:
      enabled: true
      device_ids: [0]
      cuda_device_id: 0
      onnx_optimization_level: 3
      tensorrt_enabled: false
      tensorrt_fp16: false
      memory_limit_gb: 2.0

    adaptive_pool:
      min_workers: 5
      max_workers: 50
      scale_up_threshold: 10
      scale_down_delay: 30s
      target_latency: 40ms
      queue_size: 1000

    multi_model:
      enabled: true
      exploration_rate: 0.1

    feedback:
      window_duration: 5m
      drift_threshold: 0.15
      enable_alerts: true

    streaming:
      max_connections: 1000
      stream_timeout: 5m
      batch_size: 10

    observability:
      prometheus_enabled: true
      tracing_enabled: true
      log_level: info

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: schlep-engine-inference
  namespace: ml-platform
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/schlep-engine-inference
