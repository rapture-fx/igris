version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: schlep-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-schlep_engine}
      POSTGRES_USER: ${POSTGRES_USER:-schlep_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
      - ./backups:/backups
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-schlep_user} -d ${POSTGRES_DB:-schlep_engine}"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - schlep-network
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: schlep-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    networks:
      - schlep-network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # HashiCorp Vault
  vault:
    image: hashicorp/vault:1.15
    container_name: schlep-vault
    restart: unless-stopped
    environment:
      VAULT_ADDR: 'https://127.0.0.1:8200'
      VAULT_API_ADDR: 'https://127.0.0.1:8200'
      VAULT_CLUSTER_ADDR: 'https://127.0.0.1:8201'
    ports:
      - "127.0.0.1:8200:8200"
      - "127.0.0.1:8201:8201"
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - ./vault-config.hcl:/vault/config/vault-config.hcl:ro
      - ./certs:/vault/certs:ro
    command: vault server -config=/vault/config/vault-config.hcl
    cap_add:
      - IPC_LOCK
    networks:
      - schlep-network
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Go Gateway API
  go-gateway:
    build:
      context: ../../go_gateway
      dockerfile: Dockerfile
    container_name: schlep-go-gateway
    restart: unless-stopped
    environment:
      # Core Configuration
      ENVIRONMENT: ${ENVIRONMENT:-production}
      PORT: ${GO_GATEWAY_PORT:-8080}
      
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-schlep_engine}
      DB_USER: ${POSTGRES_USER:-schlep_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: postgres://${POSTGRES_USER:-schlep_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-schlep_engine}
      
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      
      # Vault Configuration
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      VAULT_ROLE: go-gateway
      
      # ML Service
      ML_SERVICE_HOST: python-ml-service
      ML_SERVICE_PORT: 50051
      
      # Secrets
      JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY: ${SECRET_KEY}
      
      # Monitoring
      PROMETHEUS_ENABLED: true
      PROMETHEUS_PORT: 9090
      
      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://schlep-engine.com,https://admin.schlep-engine.com}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-schlep-engine.com}
    
    volumes:
      - go_gateway_logs:/app/logs
      - ./data:/app/data
    
    ports:
      - "8080:8080"
      - "9090:9090"  # Metrics
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    
    networks:
      - schlep-network
    
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # Python ML Service
  python-ml-service:
    build:
      context: ../../apps/python-ml-service
      dockerfile: Dockerfile
    container_name: schlep-ml-service
    restart: unless-stopped
    environment:
      # Core Configuration
      PORT: 50051
      ENVIRONMENT: ${ENVIRONMENT:-production}
      
      # Database (for model metadata)
      DATABASE_URL: postgres://${POSTGRES_USER:-schlep_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-schlep_engine}
      
      # Redis (for caching)
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      
      # Models Directory
      MODELS_DIR: /app/models
      MODEL_CACHE_SIZE: ${MODEL_CACHE_SIZE:-10}
      
      # Performance
      MAX_CONCURRENT_PREDICTIONS: 50
      BATCH_SIZE_LIMIT: 1000
      
      # Monitoring
      PROMETHEUS_ENABLED: true
      PROMETHEUS_PORT: 50052
    
    volumes:
      - python_ml_models:/app/models
      - python_ml_logs:/app/logs
      - ../../rust_kernel/target/release:/usr/local/lib:ro  # Rust FFI
    
    ports:
      - "50051:50051"
      - "50052:50052"  # Metrics
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr", "localhost:50051"]
      interval: 30s
      timeout: 10s
      retries: 5
    
    networks:
      - schlep-network
    
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # AlertManager
  alertmanager:
    image: prom/alertmanager:v0.25.0
    container_name: schlep-alertmanager
    restart: unless-stopped
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - schlep-network
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--cluster.listen-address=0.0.0.0:9094'
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Prometheus
  prometheus:
    image: prom/prometheus:v2.40.0
    container_name: schlep-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - schlep-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=50GB'
      - '--web.enable-lifecycle'
    depends_on:
      - go-gateway
      - python-ml-service
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Grafana
  grafana:
    image: grafana/grafana:9.3.0
    container_name: schlep-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SECURITY_ALLOW_EMBEDDING: true
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - schlep-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Web Admin Dashboard
  web-admin:
    build:
      context: ../../apps/web-admin
      dockerfile: Dockerfile
    container_name: schlep-web-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL:-https://api.schlep-engine.com}
      NEXT_PUBLIC_ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "3002:3000"
    networks:
      - schlep-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Web Landing Page
  web-landing:
    build:
      context: ../../apps/web-landing
      dockerfile: Dockerfile
    container_name: schlep-web-landing
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL:-https://api.schlep-engine.com}
      NEXT_PUBLIC_ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "3000:3000"
    networks:
      - schlep-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Web Documentation
  web-docs:
    build:
      context: ../../apps/web-docs
      dockerfile: Dockerfile
    container_name: schlep-web-docs
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${API_URL:-https://api.schlep-engine.com}
    ports:
      - "3003:3000"
    networks:
      - schlep-network
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: schlep-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - nginx_logs:/var/log/nginx
    depends_on:
      - go-gateway
      - web-admin
      - web-landing
      - web-docs
    networks:
      - schlep-network
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Certbot for SSL certificates
  certbot:
    image: certbot/certbot
    container_name: schlep-certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - nginx
    command: >
      sh -c "
      while :; do
        certbot renew --webroot -w /var/www/certbot
        sleep 12h
      done"
    networks:
      - schlep-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  vault_data:
    driver: local
  vault_logs:
    driver: local
  go_gateway_logs:
    driver: local
  python_ml_models:
    driver: local
  python_ml_logs:
    driver: local
  alertmanager_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_logs:
    driver: local

networks:
  schlep-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
