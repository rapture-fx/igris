# Shadow Observation Job for Phase 12
# Run 72h shadow mode capturing full audit trail and decision traces

apiVersion: batch/v1
kind: Job
metadata:
  name: shadow-observation
  namespace: schlep-system
  labels:
    app: schlep
    phase: phase12
    component: shadow-observation
spec:
  ttlSecondsAfterFinished: 604800  # Keep for 7 days
  backoffLimit: 0  # No retries - manual intervention required on failure
  template:
    metadata:
      labels:
        app: schlep
        component: shadow-observation
    spec:
      restartPolicy: Never
      serviceAccountName: schlep-shadow-sa
      containers:
      - name: shadow-observer
        image: schlep/shadow-observer:latest
        env:
        - name: SHADOW_MODE
          value: "true"
        - name: SHADOW_DURATION_HOURS
          value: "72"
        - name: SHADOW_TRAFFIC_PCT
          value: "0.5"
        - name: TRACE_CAPTURE_ENABLED
          value: "true"
        - name: AUTONOMOUS_COMMIT_ENABLED
          value: "false"  # NO commits in shadow mode
        - name: AUDIT_LOG_PATH
          value: "/data/shadow/audit.log"
        - name: DECISION_TRACE_PATH
          value: "/data/shadow/decisions.jsonl"
        - name: METRICS_EXPORT_INTERVAL_SEC
          value: "30"
        - name: ELASTICSEARCH_HOST
          value: "elasticsearch:9200"
        - name: POLICY_CHECKPOINT_PATH
          value: "/data/shadow/checkpoints"

        resources:
          requests:
            cpu: "2000m"
            memory: "4Gi"
          limits:
            cpu: "4000m"
            memory: "8Gi"

        volumeMounts:
        - name: shadow-data
          mountPath: /data/shadow
        - name: shadow-config
          mountPath: /etc/schlep/shadow

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 60

        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30

      - name: trace-analyzer
        image: schlep/trace-analyzer:latest
        env:
        - name: TRACE_SOURCE_PATH
          value: "/data/shadow/decisions.jsonl"
        - name: ANALYSIS_OUTPUT_PATH
          value: "/data/shadow/analysis"
        - name: REPLAY_SIMULATION_ENABLED
          value: "true"
        - name: PHASE_11_SIMULATOR_HOST
          value: "policy-simulator:8082"

        resources:
          requests:
            cpu: "1000m"
            memory: "2Gi"
          limits:
            cpu: "2000m"
            memory: "4Gi"

        volumeMounts:
        - name: shadow-data
          mountPath: /data/shadow

      - name: dashboard-exporter
        image: schlep/dashboard-exporter:latest
        env:
        - name: SHADOW_DATA_PATH
          value: "/data/shadow"
        - name: DASHBOARD_PORT
          value: "3000"
        - name: GRAFANA_HOST
          value: "grafana:3000"
        - name: DASHBOARD_UPDATE_INTERVAL_SEC
          value: "60"

        ports:
        - containerPort: 3000
          name: dashboard
          protocol: TCP

        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1000m"
            memory: "2Gi"

        volumeMounts:
        - name: shadow-data
          mountPath: /data/shadow

      volumes:
      - name: shadow-data
        persistentVolumeClaim:
          claimName: shadow-observation-pvc
      - name: shadow-config
        configMap:
          name: shadow-observation-config

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shadow-observation-pvc
  namespace: schlep-system
spec:
  accessModes:
  - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: fast-ssd

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shadow-observation-config
  namespace: schlep-system
data:
  shadow_config.json: |
    {
      "shadow_mode": true,
      "duration_hours": 72,
      "traffic_percentage": 0.5,
      "autonomous_actions": {
        "enabled": false,
        "dry_run": true,
        "trace_all_decisions": true
      },
      "slo_enforcement": {
        "enabled": true,
        "trigger_remediation": false,
        "log_violations_only": true
      },
      "scheduler": {
        "enabled": true,
        "execute_tasks": false,
        "simulate_execution": true
      },
      "audit": {
        "capture_all_events": true,
        "hmac_signing_enabled": true,
        "export_to_elasticsearch": true
      },
      "metrics": {
        "capture_interval_sec": 30,
        "export_to_prometheus": true,
        "dimensions": [
          "p99_latency_ms",
          "p95_latency_ms",
          "throughput_rps",
          "cache_hit_rate",
          "autonomous_action_rate",
          "false_positive_rate",
          "slo_violation_count",
          "policy_drift_score",
          "system_cpu_percent",
          "system_mem_mb"
        ]
      },
      "analysis": {
        "offline_replay_enabled": true,
        "simulator_integration": true,
        "regression_detection": true,
        "baseline_comparison": true
      },
      "alerting": {
        "enabled": true,
        "alert_on_anomaly": true,
        "alert_channels": ["slack", "pagerduty"],
        "anomaly_threshold": 0.1
      }
    }

---
apiVersion: v1
kind: Service
metadata:
  name: shadow-observation-dashboard
  namespace: schlep-system
spec:
  type: LoadBalancer
  selector:
    app: schlep
    component: shadow-observation
  ports:
  - port: 3000
    targetPort: 3000
    name: dashboard

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: schlep-shadow-sa
  namespace: schlep-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: shadow-observer-role
  namespace: schlep-system
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["batch"]
  resources: ["jobs"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: shadow-observer-binding
  namespace: schlep-system
subjects:
- kind: ServiceAccount
  name: schlep-shadow-sa
  namespace: schlep-system
roleRef:
  kind: Role
  name: shadow-observer-role
  apiGroup: rbac.authorization.k8s.io

---
# CronJob for scheduled shadow runs
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shadow-observation-weekly
  namespace: schlep-system
spec:
  schedule: "0 2 * * 0"  # Every Sunday at 2 AM
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: schlep
            component: shadow-observation
        spec:
          restartPolicy: Never
          serviceAccountName: schlep-shadow-sa
          containers:
          - name: shadow-trigger
            image: schlep/shadow-observer:latest
            env:
            - name: SHADOW_MODE
              value: "true"
            - name: SHADOW_DURATION_HOURS
              value: "72"
            command: ["/bin/sh"]
            args:
            - -c
            - |
              echo "Starting weekly shadow observation run..."
              kubectl apply -f /etc/schlep/shadow_observation_job.yaml
              echo "Shadow observation job submitted successfully"
