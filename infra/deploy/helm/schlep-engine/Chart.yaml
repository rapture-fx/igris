apiVersion: v2
name: schlep-engine
description: Production-grade ML inference engine with GPU acceleration and multi-model routing
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - machine-learning
  - inference
  - gpu
  - onnx
  - tensorrt
  - streaming

home: https://github.com/schlep-engine/schlep-engine
sources:
  - https://github.com/schlep-engine/schlep-engine

maintainers:
  - name: Schlep Engine Team
    email: team@schlep-engine.io

dependencies:
  - name: prometheus
    version: "15.x.x"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled

  - name: grafana
    version: "6.x.x"
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
