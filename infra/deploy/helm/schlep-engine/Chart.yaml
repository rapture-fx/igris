apiVersion: v2
name: igris-inertial
description: Production-grade ML inference engine with GPU acceleration and multi-model routing
type: application
version: 1.0.0
appVersion: "1.0.0"

keywords:
  - machine-learning
  - inference
  - gpu
  - onnx
  - tensorrt
  - streaming

home: https://github.com/igris-inertial/igris-inertial
sources:
  - https://github.com/igris-inertial/igris-inertial

maintainers:
  - name: Igris Overture Team
    email: team@igris-inertial.io

dependencies:
  - name: prometheus
    version: "15.x.x"
    repository: https://prometheus-community.github.io/helm-charts
    condition: prometheus.enabled

  - name: grafana
    version: "6.x.x"
    repository: https://grafana.github.io/helm-charts
    condition: grafana.enabled
