## Default values for igris-inertial
## This is a YAML-formatted file.

## Global settings
global:
  imageRegistry: ""
  imagePullSecrets: []

## Image configuration
image:
  registry: docker.io
  repository: igris-inertial/inference
  tag: "v1.0.0-gpu"
  pullPolicy: IfNotPresent

## Deployment configuration
replicaCount: 3

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

## Resource limits and requests
resources:
  requests:
    cpu: 2000m
    memory: 4Gi
    nvidia.com/gpu: 1
  limits:
    cpu: 4000m
    memory: 8Gi
    nvidia.com/gpu: 1

## GPU configuration
gpu:
  enabled: true
  deviceIds: [0]
  cudaDeviceId: 0
  onnxOptimizationLevel: 3
  tensorrtEnabled: false
  tensorrtFP16: false
  memoryLimitGB: 2.0
  # Node selector for GPU nodes
  nodeSelector:
    accelerator: nvidia-tesla-v100
    node-type: gpu-inference
  tolerations:
    - key: nvidia.com/gpu
      operator: Equal
      value: present
      effect: NoSchedule

## Service configuration
service:
  type: LoadBalancer
  annotations: {}
  http:
    port: 80
    targetPort: 8080
  grpc:
    port: 50051
    targetPort: 50051
  websocket:
    port: 8081
    targetPort: 8081
  metrics:
    port: 9090
    targetPort: 9090
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 300

## Ingress configuration
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/rate-limit: "1000"
  hosts:
    - host: inference.igris-inertial.io
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: igris-inertial-tls
      hosts:
        - inference.igris-inertial.io

## Adaptive Pool configuration
adaptivePool:
  minWorkers: 5
  maxWorkers: 50
  scaleUpThreshold: 10
  scaleDownDelay: 30s
  targetLatency: 40ms
  queueSize: 1000

## Multi-Model Router configuration
multiModel:
  enabled: true
  explorationRate: 0.1
  defaultAlpha: 1.0
  defaultBeta: 1.0

## Feedback Monitor configuration
feedback:
  windowDuration: 5m
  driftThreshold: 0.15
  enableAlerts: true
  maxSignals: 10000

## Streaming configuration
streaming:
  maxConnections: 1000
  streamTimeout: 5m
  batchSize: 10
  heartbeatInterval: 30s

## Circuit Breaker configuration
circuitBreaker:
  maxRequests: 3
  interval: 10s
  timeout: 30s
  threshold: 0.5

## Health Probes
healthProbes:
  liveness:
    enabled: true
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
    path: /health/live
  readiness:
    enabled: true
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 2
    path: /health/ready
  startup:
    enabled: true
    initialDelaySeconds: 0
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 30
    path: /health/startup

## Autoscaling
autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
    - type: Pods
      pods:
        metric:
          name: http_requests_per_second
        target:
          type: AverageValue
          averageValue: "10000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 30
        - type: Pods
          value: 2
          periodSeconds: 30
      selectPolicy: Max

## Pod Disruption Budget
podDisruptionBudget:
  enabled: true
  minAvailable: 2

## Pod Anti-Affinity
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - igris-inertial
          topologyKey: kubernetes.io/hostname

## Model Storage
modelStorage:
  enabled: true
  type: emptyDir  # emptyDir, persistentVolumeClaim, gcs, s3
  emptyDir:
    sizeLimit: 20Gi
  persistentVolumeClaim:
    storageClass: fast-ssd
    size: 50Gi
    accessMode: ReadOnlyMany
  gcs:
    bucket: schlep-models
    path: production/
    credentialsSecret: gcp-credentials
  s3:
    bucket: schlep-models
    region: us-west-2
    path: production/
    credentialsSecret: aws-credentials

## Observability
observability:
  prometheus:
    enabled: true
    port: 9090
    path: /metrics
    scrapeInterval: 15s
    scrapeTimeout: 10s
  grafana:
    enabled: true
    dashboards:
      enabled: true
  tracing:
    enabled: true
    endpoint: jaeger-collector:14268
    samplingRate: 0.1
  logging:
    level: info
    format: json

## Security
security:
  serviceAccount:
    create: true
    annotations: {}
    name: igris-inertial-inference
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: false  # GPU runtime needs write access

## Network Policies
networkPolicy:
  enabled: true
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53  # DNS
    - to:
        - podSelector:
            matchLabels:
              app: ml-service
      ports:
        - protocol: TCP
          port: 50051

## Init Containers
initContainers:
  modelDownloader:
    enabled: true
    image: google/cloud-sdk:alpine
    command:
      - sh
      - -c
      - |
        echo "Downloading models..."
        gsutil -m cp -r gs://{{ .Values.modelStorage.gcs.bucket }}/{{ .Values.modelStorage.gcs.path }}* /models/
        echo "Models downloaded successfully"

## Sidecar Containers
sidecars: []

## Environment Variables
env:
  - name: GPU_ENABLED
    value: "true"
  - name: LOG_LEVEL
    value: "info"
  - name: PROMETHEUS_PORT
    value: "9090"

## Extra environment variables from secrets/configmaps
envFrom: []

## Termination
terminationGracePeriodSeconds: 60

## DNS
dnsPolicy: ClusterFirst

## Priority
priorityClassName: ""

## Node Selector
nodeSelector: {}

## Tolerations
tolerations: []

## Volumes
volumes: []

## Volume Mounts
volumeMounts: []

## Prometheus Operator integration
serviceMonitor:
  enabled: true
  interval: 15s
  scrapeTimeout: 10s
  labels: {}
  relabelings: []

## Prometheus Rules
prometheusRule:
  enabled: true
  labels: {}
  rules:
    - alert: HighErrorRate
      expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High error rate detected"
        description: "Error rate is {{ $value | humanizePercentage }}"

    - alert: HighLatency
      expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High latency detected"
        description: "P99 latency is {{ $value }}s"

    - alert: GPUMemoryHigh
      expr: gpu_memory_usage_mb / 16384 > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "GPU memory usage high"
        description: "GPU memory usage is {{ $value | humanizePercentage }}"

    - alert: DriftDetected
      expr: model_drift_score > 0.2
      for: 10m
      labels:
        severity: info
      annotations:
        summary: "Model drift detected"
        description: "Drift score is {{ $value }}"
