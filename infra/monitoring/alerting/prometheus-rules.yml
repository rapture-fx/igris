# Prometheus Alert Rules for Schlep-engine
# Business Impact-Based Alert Definitions

groups:
  # =====================================
  # CRITICAL BUSINESS IMPACT ALERTS
  # =====================================
  - name: critical_business_impact
    interval: 30s
    rules:
      - alert: APICompleteOutage
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[2m])) /
            sum(rate(http_requests_total[2m]))
          ) > 0.5
        for: 2m
        labels:
          severity: critical
          service: api
          business_impact: "high"
          customer_facing: "true"
        annotations:
          summary: "API experiencing > 50% error rate"
          description: "The API is experiencing a {{ $value | humanizePercentage }} error rate over the last 2 minutes"
          business_impact: "Complete service outage affecting all customers and revenue"
          estimated_revenue_loss: "$10000/hour"
          affected_users: "all_users"
          runbook_url: "https://docs.igris-inertial.com/runbooks/api-outage"

      - alert: DatabaseConnectionFailure
        expr: |
          postgres_up == 0
        for: 1m
        labels:
          severity: critical
          service: database
          business_impact: "high"
          customer_facing: "true"
        annotations:
          summary: "Database is completely unavailable"
          description: "PostgreSQL database has been down for more than 1 minute"
          business_impact: "Complete service outage - all data operations failed"
          affected_services: "api,auth,ml-pipeline,data-processing"
          runbook_url: "https://docs.igris-inertial.com/runbooks/database-down"

      - alert: AuthenticationSystemDown
        expr: |
          (
            sum(rate(http_requests_total{endpoint="/api/v1/auth/login",status=~"5.."}[5m])) /
            sum(rate(http_requests_total{endpoint="/api/v1/auth/login"}[5m]))
          ) > 0.8
        for: 5m
        labels:
          severity: critical
          service: auth
          business_impact: "high"
          customer_facing: "true"
        annotations:
          summary: "Authentication system experiencing critical failures"
          description: "More than 80% of login attempts are failing"
          business_impact: "Users cannot login - complete access denial"
          customer_impact: "100% of new sessions blocked"
          runbook_url: "https://docs.igris-inertial.com/runbooks/auth-down"

      - alert: PaymentProcessingDown
        expr: |
          (
            sum(rate(payment_transactions_total{status="failed"}[10m])) /
            sum(rate(payment_transactions_total[10m]))
          ) > 0.5
        for: 5m
        labels:
          severity: critical
          service: payments
          business_impact: "high"
          customer_facing: "true"
        annotations:
          summary: "Payment processing failure rate above 50%"
          description: "{{ $value | humanizePercentage }} of payments are failing"
          business_impact: "Direct revenue loss - customers cannot pay for services"
          estimated_revenue_loss: "$5000/hour"
          runbook_url: "https://docs.igris-inertial.com/runbooks/payments-down"

      - alert: SecurityBreachDetected
        expr: |
          increase(security_events_total{type="breach_attempt"}[1m]) > 10
        for: 0m
        labels:
          severity: critical
          service: security
          business_impact: "high"
          customer_facing: "false"
        annotations:
          summary: "Potential security breach detected"
          description: "{{ $value }} security breach attempts detected in the last minute"
          business_impact: "Data security compromise - reputation and compliance risk"
          compliance_impact: "GDPR/SOC2 violation risk"
          runbook_url: "https://docs.igris-inertial.com/runbooks/security-incident"

  # =====================================
  # HIGH BUSINESS IMPACT ALERTS
  # =====================================
  - name: high_business_impact
    interval: 60s
    rules:
      - alert: APIPerformanceDegraded
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[10m])) > 10
        for: 10m
        labels:
          severity: high
          service: api
          business_impact: "medium"
          customer_facing: "true"
        annotations:
          summary: "API response time severely degraded"
          description: "95th percentile API response time is {{ $value }}s"
          business_impact: "Poor customer experience leading to potential churn"
          customer_impact: "Slow user experience affecting satisfaction"
          sla_impact: "Response time SLA breach (< 5s target)"
          runbook_url: "https://docs.igris-inertial.com/runbooks/slow-api"

      - alert: MLPipelineFailures
        expr: |
          (
            sum(rate(ml_pipeline_jobs_total{status="failed"}[30m])) /
            sum(rate(ml_pipeline_jobs_total[30m]))
          ) > 0.3
        for: 15m
        labels:
          severity: high
          service: ml-pipeline
          business_impact: "medium"
          customer_facing: "true"
        annotations:
          summary: "ML Pipeline failure rate above 30%"
          description: "{{ $value | humanizePercentage }} of ML pipeline jobs are failing"
          business_impact: "Core AI features unavailable - competitive disadvantage"
          feature_impact: "AI-enhanced data processing unavailable"
          runbook_url: "https://docs.igris-inertial.com/runbooks/ml-pipeline-failures"

      - alert: HighMemoryUsage
        expr: |
          (
            (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) /
            node_memory_MemTotal_bytes
          ) > 0.85
        for: 10m
        labels:
          severity: high
          service: infrastructure
          business_impact: "medium"
          customer_facing: "false"
        annotations:
          summary: "High memory usage detected"
          description: "Memory usage is at {{ $value | humanizePercentage }}"
          business_impact: "Risk of service instability and potential crashes"
          stability_risk: "high"
          runbook_url: "https://docs.igris-inertial.com/runbooks/high-memory"

      - alert: DataProcessingBacklog
        expr: |
          data_processing_queue_length > 1000
        for: 30m
        labels:
          severity: high
          service: data-processing
          business_impact: "medium"
          customer_facing: "true"
        annotations:
          summary: "Data processing queue backing up"
          description: "{{ $value }} jobs in processing queue"
          business_impact: "Delayed data processing affecting customer workflows"
          customer_impact: "Processing delays beyond SLA (< 1 hour)"
          runbook_url: "https://docs.igris-inertial.com/runbooks/processing-backlog"

  # =====================================
  # MEDIUM BUSINESS IMPACT ALERTS
  # =====================================
  - name: medium_business_impact
    interval: 5m
    rules:
      - alert: ElevatedErrorRate
        expr: |
          (
            sum(rate(http_requests_total{status=~"5.."}[15m])) /
            sum(rate(http_requests_total[15m]))
          ) > 0.05
        for: 15m
        labels:
          severity: medium
          service: api
          business_impact: "low"
          customer_facing: "true"
        annotations:
          summary: "Elevated API error rate"
          description: "API error rate is {{ $value | humanizePercentage }}"
          business_impact: "Minor customer experience degradation"
          customer_impact: "Some users experiencing intermittent issues"
          runbook_url: "https://docs.igris-inertial.com/runbooks/elevated-errors"

      - alert: OAuthProviderSlow
        expr: |
          histogram_quantile(0.95, rate(oauth_request_duration_seconds_bucket[10m])) > 30
        for: 10m
        labels:
          severity: medium
          service: auth
          business_impact: "low"
          customer_facing: "true"
        annotations:
          summary: "OAuth provider responding slowly"
          description: "OAuth requests taking {{ $value }}s at 95th percentile"
          business_impact: "Login delays affecting user experience"
          customer_impact: "Slow social login experience"
          runbook_url: "https://docs.igris-inertial.com/runbooks/oauth-slow"

      - alert: DiskSpaceWarning
        expr: |
          (
            (node_filesystem_size_bytes - node_filesystem_avail_bytes) /
            node_filesystem_size_bytes
          ) > 0.75
        for: 15m
        labels:
          severity: medium
          service: infrastructure
          business_impact: "low"
          customer_facing: "false"
        annotations:
          summary: "Disk space usage above 75%"
          description: "Disk usage is {{ $value | humanizePercentage }}"
          business_impact: "Risk of service disruption if storage fills up"
          preventive_action: "required"
          runbook_url: "https://docs.igris-inertial.com/runbooks/disk-space"

      - alert: BackgroundJobDelays
        expr: |
          background_job_queue_age_seconds > 3600
        for: 30m
        labels:
          severity: medium
          service: background-jobs
          business_impact: "low"
          customer_facing: "false"
        annotations:
          summary: "Background jobs experiencing delays"
          description: "Oldest job in queue is {{ $value | humanizeDuration }} old"
          business_impact: "Delayed notifications and background processing"
          feature_impact: "Email notifications, reports, cleanup tasks delayed"
          runbook_url: "https://docs.igris-inertial.com/runbooks/job-delays"

  # =====================================
  # LOW BUSINESS IMPACT ALERTS
  # =====================================
  - name: low_business_impact
    interval: 15m
    rules:
      - alert: LowCacheHitRate
        expr: |
          (
            sum(rate(redis_keyspace_hits_total[1h])) /
            (sum(rate(redis_keyspace_hits_total[1h])) + sum(rate(redis_keyspace_misses_total[1h])))
          ) < 0.7
        for: 1h
        labels:
          severity: low
          service: cache
          business_impact: "minimal"
          customer_facing: "false"
        annotations:
          summary: "Cache hit rate below optimal"
          description: "Redis cache hit rate is {{ $value | humanizePercentage }}"
          business_impact: "Performance optimization opportunity"
          optimization_potential: "true"
          runbook_url: "https://docs.igris-inertial.com/runbooks/cache-optimization"

      - alert: SSLCertificateExpiry
        expr: |
          ssl_certificate_expiry_days < 30
        for: 24h
        labels:
          severity: low
          service: infrastructure
          business_impact: "minimal"
          customer_facing: "false"
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate expires in {{ $value }} days"
          business_impact: "Future service disruption if not renewed"
          action_required: "certificate_renewal"
          runbook_url: "https://docs.igris-inertial.com/runbooks/cert-renewal"

      - alert: LogIngestionSlow
        expr: |
          rate(log_ingestion_events_total[1h]) < 100
        for: 1h
        labels:
          severity: low
          service: logging
          business_impact: "minimal"
          customer_facing: "false"
        annotations:
          summary: "Log ingestion rate below normal"
          description: "Only {{ $value }} logs per second being ingested"
          business_impact: "Reduced monitoring and debugging capabilities"
          operational_impact: "true"
          runbook_url: "https://docs.igris-inertial.com/runbooks/slow-logging"

  # =====================================
  # BUSINESS METRICS ALERTS
  # =====================================
  - name: business_metrics
    interval: 5m
    rules:
      - alert: RevenueDropDetected
        expr: |
          (
            revenue_per_hour -
            revenue_per_hour offset 24h
          ) / revenue_per_hour offset 24h < -0.2
        for: 1h
        labels:
          severity: high
          service: business
          business_impact: "high"
          customer_facing: "false"
        annotations:
          summary: "Significant revenue drop detected"
          description: "Revenue down {{ $value | humanizePercentage }} compared to same time yesterday"
          business_impact: "Direct revenue impact - immediate investigation required"
          escalation: "business_leadership"

      - alert: UserChurnRateHigh
        expr: |
          user_churn_rate_daily > 0.05
        for: 6h
        labels:
          severity: medium
          service: business
          business_impact: "medium"
          customer_facing: "false"
        annotations:
          summary: "Daily user churn rate elevated"
          description: "{{ $value | humanizePercentage }} of users churned today"
          business_impact: "Customer retention concern - product/service issues"
          investigation_priority: "high"

      - alert: ConversionRateDrop
        expr: |
          (
            conversion_rate_hourly -
            avg_over_time(conversion_rate_hourly[24h])
          ) / avg_over_time(conversion_rate_hourly[24h]) < -0.3
        for: 2h
        labels:
          severity: medium
          service: business
          business_impact: "medium"
          customer_facing: "false"
        annotations:
          summary: "Conversion rate significantly below average"
          description: "Conversion rate down {{ $value | humanizePercentage }} from daily average"
          business_impact: "Revenue optimization opportunity - user experience issue"

  # =====================================
  # SLA COMPLIANCE ALERTS
  # =====================================
  - name: sla_compliance
    interval: 5m
    rules:
      - alert: UptimeSLABreach
        expr: |
          avg_over_time(up[30d]) < 0.999
        for: 1h
        labels:
          severity: high
          service: sla
          business_impact: "high"
          customer_facing: "true"
        annotations:
          summary: "Monthly uptime SLA breached"
          description: "30-day uptime is {{ $value | humanizePercentage }}"
          business_impact: "SLA breach - potential contract penalties and customer credits"
          sla_target: "99.9%"
          compliance_impact: "true"

      - alert: ResponseTimeSLABreach
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[1h])) > 5
        for: 30m
        labels:
          severity: medium
          service: sla
          business_impact: "medium"
          customer_facing: "true"
        annotations:
          summary: "Response time SLA breached"
          description: "95th percentile response time is {{ $value }}s"
          business_impact: "Performance SLA breach - customer satisfaction impact"
          sla_target: "< 5s"

  # =====================================
  # DEPENDENCY HEALTH ALERTS
  # =====================================
  - name: dependency_health
    interval: 2m
    rules:
      - alert: ExternalAPIDown
        expr: |
          external_api_up{service="stripe"} == 0
        for: 5m
        labels:
          severity: critical
          service: payments
          business_impact: "high"
          customer_facing: "true"
        annotations:
          summary: "Critical external API dependency down"
          description: "{{ $labels.service }} API is unavailable"
          business_impact: "Payment processing completely unavailable"
          dependency: "{{ $labels.service }}"

      - alert: ExternalAPIPerformanceDegraded
        expr: |
          external_api_response_time{service="google-oauth"} > 10
        for: 10m
        labels:
          severity: medium
          service: auth
          business_impact: "medium"
          customer_facing: "true"
        annotations:
          summary: "External API performance degraded"
          description: "{{ $labels.service }} API response time is {{ $value }}s"
          business_impact: "OAuth login delays affecting user experience"
          dependency: "{{ $labels.service }}"