# Prometheus configuration for Hybrid ML Pipeline metrics
# Scrapes metrics from FastAPI, Axum/Tokio streaming workers, and Rust kernels

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'schlep-engine-hybrid-ml'
    environment: 'production'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Rule files for alerts
rule_files:
  - "hybrid_ml_rules.yml"

# Scrape configurations
scrape_configs:
  # FastAPI Batch API metrics
  - job_name: 'batch-api'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # Axum/Tokio Streaming Worker metrics
  - job_name: 'streaming-worker'
    static_configs:
      - targets: ['localhost:9000']
    metrics_path: '/metrics'
    scrape_interval: 5s  # More frequent for real-time streaming

  # Rust Kernels performance metrics
  - job_name: 'rust-kernels'
    static_configs:
      - targets: ['localhost:8000']
    metrics_path: '/api/v1/metrics/rust-kernels'
    scrape_interval: 30s

  # NATS JetStream metrics
  - job_name: 'nats-streaming'
    static_configs:
      - targets: ['localhost:8222']
    metrics_path: '/metrics'
    scrape_interval: 15s

  # PostgreSQL metrics (data storage)
  - job_name: 'postgresql'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Redis metrics (caching layer)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # Node exporter for system metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 15s

# Remote write for long-term storage (optional)
# remote_write:
#   - url: "http://cortex:9009/api/v1/push"
