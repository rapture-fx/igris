# Schlep-Engine Phase 2 Prometheus Alert Rules
# Monitoring cost forecasting, policy routing, and Redis performance

groups:
  - name: schlep_cost_forecasting
    interval: 30s
    rules:
      - alert: HighCostForecastError
        expr: histogram_quantile(0.95, rate(schlep_cost_forecast_accuracy[5m])) < 0.9
        for: 5m
        labels:
          severity: warning
          component: cost_forecasting
        annotations:
          summary: "Cost forecast accuracy below 90%"
          description: "P95 forecast accuracy is {{ $value }}, below threshold of 0.9. This may indicate token estimation issues or pricing changes."

      - alert: CostForecastAccuracyDegrading
        expr: rate(schlep_cost_forecast_accuracy[5m]) < rate(schlep_cost_forecast_accuracy[30m])
        for: 10m
        labels:
          severity: info
          component: cost_forecasting
        annotations:
          summary: "Cost forecast accuracy degrading over time"
          description: "Recent forecast accuracy is lower than historical average. Review token estimation algorithm."

      - alert: HighProviderCost
        expr: rate(schlep_estimated_cost_usd_total[1h]) > 10
        for: 5m
        labels:
          severity: warning
          component: cost_tracking
        annotations:
          summary: "High inference cost detected"
          description: "Provider {{ $labels.provider }} cost rate is ${{ $value }}/hour. Review usage patterns."

  - name: schlep_redis_performance
    interval: 15s
    rules:
      - alert: RedisLatencySpike
        expr: histogram_quantile(0.99, rate(schlep_redis_latency_ms[5m])) > 50
        for: 2m
        labels:
          severity: critical
          component: redis
        annotations:
          summary: "Redis P99 latency exceeded 50ms"
          description: "Redis {{ $labels.operation }} P99 latency is {{ $value }}ms. Target is <5ms. Check connection pool and network."

      - alert: RedisLatencyHigh
        expr: histogram_quantile(0.95, rate(schlep_redis_latency_ms[5m])) > 10
        for: 5m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis P95 latency above 10ms"
          description: "Redis {{ $labels.operation }} P95 latency is {{ $value }}ms. Consider increasing pool size or optimizing queries."

      - alert: RedisPoolExhaustion
        expr: schlep_redis_pool_active_connections / 100 > 0.9
        for: 2m
        labels:
          severity: warning
          component: redis
        annotations:
          summary: "Redis connection pool near exhaustion"
          description: "{{ $value | humanizePercentage }} of Redis pool connections in use. Consider increasing max_active_conns."

      - alert: RedisConnectionFailures
        expr: rate(redis_connection_errors_total[5m]) > 0.1
        for: 1m
        labels:
          severity: critical
          component: redis
        annotations:
          summary: "Redis connection failures detected"
          description: "Redis connection error rate is {{ $value }}/sec. Check Redis server health."

  - name: schlep_policy_routing
    interval: 30s
    rules:
      - alert: HighCostBasedFallbacks
        expr: rate(schlep_cost_based_fallbacks_total[5m]) > 10
        for: 5m
        labels:
          severity: info
          component: routing
        annotations:
          summary: "High rate of cost-based provider fallbacks"
          description: "{{ $value }} cost-based fallbacks/min for {{ $labels.provider }}. Review policy max_cost_usd constraints."

      - alert: PolicyRoutingFailures
        expr: rate(schlep_policy_route_decisions_total{strategy="default"}[5m]) / rate(schlep_policy_route_decisions_total[5m]) > 0.5
        for: 10m
        labels:
          severity: warning
          component: routing
        annotations:
          summary: "High default routing rate (policies not matching)"
          description: "{{ $value | humanizePercentage }} of requests using default routing. Review tenant policies."

  - name: schlep_provider_health
    interval: 1m
    rules:
      - alert: ProviderHighErrorRate
        expr: rate(infer_requests_total{status="error"}[5m]) / rate(infer_requests_total[5m]) > 0.05
        for: 3m
        labels:
          severity: warning
          component: provider
        annotations:
          summary: "High error rate for provider"
          description: "Provider {{ $labels.provider }} error rate is {{ $value | humanizePercentage }}. Check provider API status."

      - alert: ProviderLatencyDegraded
        expr: histogram_quantile(0.95, rate(infer_request_latency_ms[5m])) > 2000
        for: 5m
        labels:
          severity: warning
          component: provider
        annotations:
          summary: "Provider latency degraded"
          description: "Provider {{ $labels.provider }} P95 latency is {{ $value }}ms. Consider failover."

  - name: schlep_system_health
    interval: 1m
    rules:
      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / 1024 / 1024 / 1024 > 2
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High memory usage"
          description: "Process using {{ $value }}GB RAM. Investigate memory leaks."

      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) > 0.8
        for: 5m
        labels:
          severity: warning
          component: system
        annotations:
          summary: "High CPU usage"
          description: "CPU usage at {{ $value | humanizePercentage }}. Review performance bottlenecks."
