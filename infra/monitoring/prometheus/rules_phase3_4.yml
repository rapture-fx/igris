groups:
  # ============================================================================
  # Phase 3: Semantic Routing & Adaptive Learning Alerts
  # ============================================================================

  - name: semantic_classification_alerts
    interval: 30s
    rules:
      # Classification confidence degradation
      - alert: LowClassificationConfidence
        expr: |
          (
            histogram_quantile(0.5,
              rate(schlep_semantic_classification_confidence_bucket[5m])
            ) < 0.6
          )
        for: 10m
        labels:
          severity: warning
          component: semantic_classifier
        annotations:
          summary: "Low classification confidence detected"
          description: "Median classification confidence ({{ $value }}) has been below 0.6 for 10 minutes. This may indicate classifier degradation or ambiguous prompts."

      # High classification latency
      - alert: HighClassificationLatency
        expr: |
          (
            histogram_quantile(0.95,
              rate(schlep_semantic_classification_latency_ms_bucket{cache_hit="false"}[5m])
            ) > 50
          )
        for: 5m
        labels:
          severity: warning
          component: semantic_classifier
        annotations:
          summary: "High classification latency (cache miss)"
          description: "p95 classification latency for cache misses is {{ $value }}ms, exceeding 50ms threshold."

      # Low cache hit rate
      - alert: LowCacheHitRate
        expr: |
          (
            sum(rate(schlep_semantic_classifications_total{cache_hit="true"}[10m]))
            /
            sum(rate(schlep_semantic_classifications_total[10m]))
          ) < 0.3
        for: 15m
        labels:
          severity: info
          component: semantic_cache
        annotations:
          summary: "Low semantic classification cache hit rate"
          description: "Cache hit rate ({{ $value | humanizePercentage }}) has been below 30% for 15 minutes. Consider increasing cache TTL or investigating cache invalidation."

  - name: bandit_algorithm_alerts
    interval: 30s
    rules:
      # Bandit update failures
      - alert: BanditUpdateFailures
        expr: |
          (
            sum(rate(schlep_bandit_reward_updates_total{status="error"}[5m]))
            /
            sum(rate(schlep_bandit_reward_updates_total[5m]))
          ) > 0.05
        for: 10m
        labels:
          severity: critical
          component: bandit_engine
        annotations:
          summary: "High bandit reward update failure rate"
          description: "Bandit update failure rate ({{ $value | humanizePercentage }}) exceeds 5% for 10 minutes. Check database connectivity and stored procedure integrity."

      # Slow bandit updates
      - alert: SlowBanditUpdates
        expr: |
          (
            histogram_quantile(0.95,
              rate(schlep_feedback_latency_ms_bucket[5m])
            ) > 15
          )
        for: 10m
        labels:
          severity: warning
          component: bandit_engine
        annotations:
          summary: "Bandit reward updates exceeding latency target"
          description: "p95 bandit update latency is {{ $value }}ms, exceeding 15ms target. Database optimization may be needed."

      # Reward distribution anomaly (too narrow)
      - alert: RewardDistributionAnomaly
        expr: |
          (
            stddev(schlep_provider_reward_mean) < 0.05
          )
        for: 30m
        labels:
          severity: info
          component: bandit_engine
        annotations:
          summary: "Narrow reward distribution detected"
          description: "Standard deviation of provider rewards is {{ $value }}, indicating limited exploration or convergence. Consider adjusting exploration rate."

  - name: feedback_processing_alerts
    interval: 30s
    rules:
      # Feedback processing backlog
      - alert: FeedbackProcessingBacklog
        expr: |
          (
            sum(rate(schlep_feedback_events_total[5m]))
            -
            sum(rate(schlep_feedback_processed_total[5m]))
          ) > 10
        for: 10m
        labels:
          severity: warning
          component: feedback_processor
        annotations:
          summary: "Feedback processing backlog detected"
          description: "Feedback events are accumulating faster than processing rate. Backlog delta: {{ $value }} events/sec."

      # Low feedback submission rate (may indicate integration issues)
      - alert: LowFeedbackRate
        expr: |
          sum(rate(schlep_feedback_events_total[10m])) < 0.1
        for: 30m
        labels:
          severity: info
          component: feedback_api
        annotations:
          summary: "Low feedback submission rate"
          description: "Feedback submission rate ({{ $value }} events/min) is below expected threshold. Verify feedback API integration."

  # ============================================================================
  # Phase 4: Adaptive Governance & SLA Alerts
  # ============================================================================

  - name: sla_violation_alerts
    interval: 30s
    rules:
      # Critical SLA violations
      - alert: CriticalSLAViolation
        expr: |
          sum(increase(schlep_sla_violations_total{severity="critical"}[10m])) > 0
        for: 1m
        labels:
          severity: critical
          component: sla_manager
        annotations:
          summary: "Critical SLA violation detected"
          description: "{{ $value }} critical SLA violation(s) detected in the last 10 minutes for tenant {{ $labels.tenant_id }}."

      # Tenant compliance degraded
      - alert: TenantComplianceDegraded
        expr: |
          schlep_sla_compliance_status < 1
        for: 15m
        labels:
          severity: warning
          component: sla_manager
        annotations:
          summary: "Tenant SLA compliance degraded"
          description: "Tenant {{ $labels.tenant_id }} compliance status is {{ if eq $value 0.5 }}WARNING{{ else }}CRITICAL{{ end }}."

      # Provider degraded due to SLA violations
      - alert: ProviderDegraded
        expr: |
          increase(schlep_provider_degraded_total[1h]) > 0
        for: 1m
        labels:
          severity: warning
          component: sla_manager
        annotations:
          summary: "Provider marked as degraded"
          description: "Provider {{ $labels.provider }} has been degraded due to SLA violations ({{ $labels.reason }})."

      # SLA measured value drift
      - alert: SLALatencyDrift
        expr: |
          (
            (schlep_sla_measured_value{metric_type="latency_p95"}
             - schlep_sla_target_value{metric_type="latency_p95"})
            /
            schlep_sla_target_value{metric_type="latency_p95"}
          ) > 0.5
        for: 15m
        labels:
          severity: warning
          component: sla_manager
        annotations:
          summary: "SLA latency p95 drifting from target"
          description: "Latency p95 for {{ $labels.provider }} is {{ $value | humanizePercentage }} above target for tenant {{ $labels.tenant_id }}."

  - name: policy_management_alerts
    interval: 30s
    rules:
      # Policy reload failures
      - alert: PolicyReloadFailure
        expr: |
          (
            sum(rate(schlep_policy_reload_total{status="error"}[5m]))
            /
            sum(rate(schlep_policy_reload_total[5m]))
          ) > 0.1
        for: 5m
        labels:
          severity: critical
          component: policy_engine
        annotations:
          summary: "High policy reload failure rate"
          description: "Policy reload failure rate ({{ $value | humanizePercentage }}) exceeds 10% for tenant {{ $labels.tenant_id }}."

      # Slow policy reloads
      - alert: SlowPolicyReload
        expr: |
          (
            histogram_quantile(0.95,
              rate(schlep_policy_reload_latency_seconds_bucket[5m])
            ) > 1
          )
        for: 10m
        labels:
          severity: warning
          component: policy_engine
        annotations:
          summary: "Policy reload latency exceeding 1s target"
          description: "p95 policy reload latency is {{ $value }}s, exceeding 1s target. Check Redis connectivity."

      # No active policy version
      - alert: NoActivePolicyVersion
        expr: |
          sum(schlep_policy_version_active) == 0
        for: 30m
        labels:
          severity: warning
          component: policy_engine
        annotations:
          summary: "No active policy version for tenant"
          description: "Tenant {{ $labels.tenant_id }} has no active policy version. Default routing will be used."

  - name: self_tuning_alerts
    interval: 60s
    rules:
      # Self-tuning optimization failures
      - alert: SelfTuningOptimizationFailed
        expr: |
          increase(schlep_self_tuning_optimizations_total{status="rejected"}[24h]) > 10
        for: 1h
        labels:
          severity: info
          component: self_tuner
        annotations:
          summary: "High self-tuning optimization rejection rate"
          description: "{{ $value }} self-tuning optimizations rejected in 24h for class {{ $labels.class }}. Review confidence thresholds."

      # Negative performance improvements
      - alert: NegativePerformanceImprovement
        expr: |
          (
            histogram_quantile(0.5,
              rate(schlep_self_tuning_performance_improvement_bucket[24h])
            ) < 0
          )
        for: 2h
        labels:
          severity: warning
          component: self_tuner
        annotations:
          summary: "Self-tuning suggesting negative improvements"
          description: "Median performance improvement for {{ $labels.class }} is {{ $value }}%, suggesting potential issues with correlation analysis."

      # Low self-tuning confidence
      - alert: LowSelfTuningConfidence
        expr: |
          (
            histogram_quantile(0.5,
              rate(schlep_self_tuning_confidence_bucket[7d])
            ) < 0.5
          )
        for: 1d
        labels:
          severity: info
          component: self_tuner
        annotations:
          summary: "Low self-tuning confidence scores"
          description: "Median self-tuning confidence for {{ $labels.class }} is {{ $value }}, below 0.5 threshold. May need more data."

  # ============================================================================
  # Cross-Phase Composite Alerts
  # ============================================================================

  - name: system_health_alerts
    interval: 30s
    rules:
      # Overall system degradation
      - alert: SystemDegradation
        expr: |
          (
            (sum(rate(schlep_sla_violations_total[10m])) > 5)
            and
            (sum(schlep_sla_compliance_status < 1) > 2)
          )
        for: 15m
        labels:
          severity: critical
          component: system
        annotations:
          summary: "System-wide degradation detected"
          description: "Multiple SLA violations ({{ $value }}) and compliance issues detected. Immediate investigation required."

      # Audit log integrity
      - alert: AuditLogGap
        expr: |
          (
            rate(schlep_audit_log_entries_total[10m]) == 0
            and
            rate(schlep_semantic_classifications_total[10m]) > 0
          )
        for: 30m
        labels:
          severity: warning
          component: audit_logger
        annotations:
          summary: "Audit log entries not being recorded"
          description: "Classifications are occurring but no audit log entries in 30 minutes. Check audit logger integration."

      # Metrics collection issues
      - alert: MetricsCollectionDegraded
        expr: |
          up{job="schlep-engine-api"} == 0
        for: 5m
        labels:
          severity: critical
          component: monitoring
        annotations:
          summary: "Metrics collection down"
          description: "Unable to scrape metrics from schlep-engine-api. Check service health."

  # ============================================================================
  # Performance Regression Alerts
  # ============================================================================

  - name: performance_regression_alerts
    interval: 60s
    rules:
      # Classification latency regression
      - alert: ClassificationLatencyRegression
        expr: |
          (
            histogram_quantile(0.95,
              rate(schlep_semantic_classification_latency_ms_bucket[1h])
            )
            /
            histogram_quantile(0.95,
              rate(schlep_semantic_classification_latency_ms_bucket[24h] offset 24h)
            )
          ) > 1.5
        for: 30m
        labels:
          severity: warning
          component: semantic_classifier
        annotations:
          summary: "Classification latency regression detected"
          description: "p95 latency is {{ $value }}x higher than 24h ago. Investigation needed."

      # Feedback processing regression
      - alert: FeedbackProcessingRegression
        expr: |
          (
            histogram_quantile(0.95,
              rate(schlep_feedback_latency_ms_bucket[1h])
            )
            /
            histogram_quantile(0.95,
              rate(schlep_feedback_latency_ms_bucket[24h] offset 24h)
            )
          ) > 2
        for: 30m
        labels:
          severity: warning
          component: feedback_processor
        annotations:
          summary: "Feedback processing latency regression"
          description: "p95 feedback latency is {{ $value }}x higher than 24h ago."

  # ============================================================================
  # Recording Rules (for dashboards)
  # ============================================================================

  - name: semantic_recording_rules
    interval: 30s
    rules:
      # Overall classification rate
      - record: job:schlep_classifications:rate5m
        expr: |
          sum(rate(schlep_semantic_classifications_total[5m]))

      # Cache hit rate
      - record: job:schlep_cache_hit_rate:rate5m
        expr: |
          sum(rate(schlep_semantic_classifications_total{cache_hit="true"}[5m]))
          /
          sum(rate(schlep_semantic_classifications_total[5m]))

      # Bandit update success rate
      - record: job:schlep_bandit_success_rate:rate5m
        expr: |
          sum(rate(schlep_bandit_reward_updates_total{status="success"}[5m]))
          /
          sum(rate(schlep_bandit_reward_updates_total[5m]))

      # SLA compliance rate
      - record: job:schlep_sla_compliance_rate:gauge
        expr: |
          sum(schlep_sla_compliance_status == 1)
          /
          count(schlep_sla_compliance_status)

      # Average composite reward by class
      - record: job:schlep_avg_reward_by_class:gauge
        expr: |
          avg(schlep_provider_reward_mean) by (class)
