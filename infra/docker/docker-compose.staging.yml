version: '3.8'

services:
  # PostgreSQL Database
  staging-db:
    image: postgres:15-alpine
    container_name: schlep-staging-db
    environment:
      POSTGRES_DB: igris_overture_staging
      POSTGRES_USER: schlep_staging
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:-staging_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - schlep-staging-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schlep_staging -d igris_overture_staging"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Redis Cache
  staging-redis:
    image: redis:7-alpine
    container_name: schlep-staging-redis
    command: redis-server --requirepass ${STAGING_REDIS_PASSWORD:-staging_redis_password}
    volumes:
      - staging_redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - schlep-staging-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Backend API
  staging-backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: staging
    container_name: schlep-staging-backend
    environment:
      # Environment
      ENVIRONMENT: staging
      APP_VERSION: ${APP_VERSION:-1.0.0}
      DEBUG: "false"
      
      # Server
      HOST: 0.0.0.0
      PORT: 8000
      WORKERS: 4
      RELOAD: "false"
      
      # Database
      STAGING_DB_HOST: staging-db
      STAGING_DB_PORT: 5432
      STAGING_DB_NAME: igris_overture_staging
      STAGING_DB_USER: schlep_staging
      STAGING_DB_PASSWORD: ${STAGING_DB_PASSWORD:-staging_password}
      
      # Redis
      STAGING_REDIS_HOST: staging-redis
      STAGING_REDIS_PORT: 6379
      STAGING_REDIS_PASSWORD: ${STAGING_REDIS_PASSWORD:-staging_redis_password}
      
      # Storage
      STAGING_STORAGE_PROVIDER: ${STAGING_STORAGE_PROVIDER:-gcs}
      STAGING_STORAGE_BUCKET: ${STAGING_STORAGE_BUCKET:-igris-inertial-staging}
      STAGING_STORAGE_CREDENTIALS_PATH: ${STAGING_STORAGE_CREDENTIALS_PATH}
      STAGING_STORAGE_REGION: ${STAGING_STORAGE_REGION:-us-central1}
      STAGING_CDN_URL: ${STAGING_CDN_URL}
      
      # Security
      STAGING_SECRET_KEY: ${STAGING_SECRET_KEY:-staging-secret-key-change-in-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      PASSWORD_MIN_LENGTH: 8
      MAX_LOGIN_ATTEMPTS: 5
      LOCKOUT_DURATION_MINUTES: 15
      
      # Monitoring
      STAGING_SENTRY_DSN: ${STAGING_SENTRY_DSN}
      SENTRY_ENVIRONMENT: staging
      LOG_LEVEL: INFO
      LOG_FILE: /var/log/igris-inertial/app.log
      PROMETHEUS_ENABLED: "true"
      METRICS_RETENTION_DAYS: 30
      
      # Celery
      STAGING_CELERY_BROKER_URL: redis://:${STAGING_REDIS_PASSWORD:-staging_redis_password}@staging-redis:6379/0
      STAGING_CELERY_RESULT_BACKEND: redis://:${STAGING_REDIS_PASSWORD:-staging_redis_password}@staging-redis:6379/0
      
      # External Services
      STAGING_ML_SERVICE_URL: ${STAGING_ML_SERVICE_URL}
      STAGING_EMAIL_SERVICE_URL: ${STAGING_EMAIL_SERVICE_URL}
      STAGING_NOTIFICATION_SERVICE_URL: ${STAGING_NOTIFICATION_SERVICE_URL}
      
      # CORS
      ALLOWED_ORIGINS: ${STAGING_ALLOWED_ORIGINS:-http://localhost:3001,https://staging.igris-inertial.com}
      ALLOWED_HOSTS: ${STAGING_ALLOWED_HOSTS:-staging.igris-inertial.com,localhost}
      
      # Rate Limiting
      RATE_LIMIT_REQUESTS: 100
      RATE_LIMIT_WINDOW: 60
      
      # File Upload
      MAX_FILE_SIZE: 100000000
      ALLOWED_FILE_TYPES: csv,json,xlsx,parquet
    volumes:
      - staging_logs:/var/log/igris-inertial
      - staging_uploads:/app/uploads
      - ./alembic.ini:/app/alembic.ini
      - ./alembic:/app/alembic
    ports:
      - "8001:8000"
    networks:
      - schlep-staging-network
    depends_on:
      staging-db:
        condition: service_healthy
      staging-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/simple"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Celery Worker
  staging-celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: staging
    container_name: schlep-staging-celery-worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    environment:
      # Environment
      ENVIRONMENT: staging
      
      # Database
      STAGING_DB_HOST: staging-db
      STAGING_DB_PORT: 5432
      STAGING_DB_NAME: igris_overture_staging
      STAGING_DB_USER: schlep_staging
      STAGING_DB_PASSWORD: ${STAGING_DB_PASSWORD:-staging_password}
      
      # Redis
      STAGING_REDIS_HOST: staging-redis
      STAGING_REDIS_PORT: 6379
      STAGING_REDIS_PASSWORD: ${STAGING_REDIS_PASSWORD:-staging_redis_password}
      
      # Storage
      STAGING_STORAGE_PROVIDER: ${STAGING_STORAGE_PROVIDER:-gcs}
      STAGING_STORAGE_BUCKET: ${STAGING_STORAGE_BUCKET:-igris-inertial-staging}
      STAGING_STORAGE_CREDENTIALS_PATH: ${STAGING_STORAGE_CREDENTIALS_PATH}
      STAGING_STORAGE_REGION: ${STAGING_STORAGE_REGION:-us-central1}
      
      # Security
      STAGING_SECRET_KEY: ${STAGING_SECRET_KEY:-staging-secret-key-change-in-production}
      
      # Monitoring
      STAGING_SENTRY_DSN: ${STAGING_SENTRY_DSN}
      SENTRY_ENVIRONMENT: staging
      LOG_LEVEL: INFO
      LOG_FILE: /var/log/igris-inertial/celery.log
      
      # Celery
      STAGING_CELERY_BROKER_URL: redis://:${STAGING_REDIS_PASSWORD:-staging_redis_password}@staging-redis:6379/0
      STAGING_CELERY_RESULT_BACKEND: redis://:${STAGING_REDIS_PASSWORD:-staging_redis_password}@staging-redis:6379/0
    volumes:
      - staging_logs:/var/log/igris-inertial
      - staging_uploads:/app/uploads
    networks:
      - schlep-staging-network
    depends_on:
      staging-db:
        condition: service_healthy
      staging-redis:
        condition: service_healthy
    restart: unless-stopped

  # Celery Beat (Scheduler)
  staging-celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: staging
    container_name: schlep-staging-celery-beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    environment:
      # Environment
      ENVIRONMENT: staging
      
      # Database
      STAGING_DB_HOST: staging-db
      STAGING_DB_PORT: 5432
      STAGING_DB_NAME: igris_overture_staging
      STAGING_DB_USER: schlep_staging
      STAGING_DB_PASSWORD: ${STAGING_DB_PASSWORD:-staging_password}
      
      # Redis
      STAGING_REDIS_HOST: staging-redis
      STAGING_REDIS_PORT: 6379
      STAGING_REDIS_PASSWORD: ${STAGING_REDIS_PASSWORD:-staging_redis_password}
      
      # Storage
      STAGING_STORAGE_PROVIDER: ${STAGING_STORAGE_PROVIDER:-gcs}
      STAGING_STORAGE_BUCKET: ${STAGING_STORAGE_BUCKET:-igris-inertial-staging}
      STAGING_STORAGE_CREDENTIALS_PATH: ${STAGING_STORAGE_CREDENTIALS_PATH}
      STAGING_STORAGE_REGION: ${STAGING_STORAGE_REGION:-us-central1}
      
      # Security
      STAGING_SECRET_KEY: ${STAGING_SECRET_KEY:-staging-secret-key-change-in-production}
      
      # Monitoring
      STAGING_SENTRY_DSN: ${STAGING_SENTRY_DSN}
      SENTRY_ENVIRONMENT: staging
      LOG_LEVEL: INFO
      LOG_FILE: /var/log/igris-inertial/celery-beat.log
      
      # Celery
      STAGING_CELERY_BROKER_URL: redis://:${STAGING_REDIS_PASSWORD:-staging_redis_password}@staging-redis:6379/0
      STAGING_CELERY_RESULT_BACKEND: redis://:${STAGING_REDIS_PASSWORD:-staging_redis_password}@staging-redis:6379/0
    volumes:
      - staging_logs:/var/log/igris-inertial
    networks:
      - schlep-staging-network
    depends_on:
      staging-db:
        condition: service_healthy
      staging-redis:
        condition: service_healthy
    restart: unless-stopped

  # Flower (Celery Monitoring)
  staging-flower:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: staging
    container_name: schlep-staging-flower
    command: celery -A app.tasks.celery_app flower --port=5555
    environment:
      # Redis
      STAGING_REDIS_HOST: staging-redis
      STAGING_REDIS_PORT: 6379
      STAGING_REDIS_PASSWORD: ${STAGING_REDIS_PASSWORD:-staging_redis_password}
      
      # Celery
      STAGING_CELERY_BROKER_URL: redis://:${STAGING_REDIS_PASSWORD:-staging_redis_password}@staging-redis:6379/0
      STAGING_CELERY_RESULT_BACKEND: redis://:${STAGING_REDIS_PASSWORD:-staging_redis_password}@staging-redis:6379/0
    ports:
      - "5556:5555"
    networks:
      - schlep-staging-network
    depends_on:
      staging-redis:
        condition: service_healthy
    restart: unless-stopped

  # Nginx Reverse Proxy
  staging-nginx:
    image: nginx:alpine
    container_name: schlep-staging-nginx
    volumes:
      - ./nginx/nginx.staging.conf:/etc/nginx/nginx.conf
      - staging_logs:/var/log/nginx
    ports:
      - "8081:80"
      - "8444:443"
    networks:
      - schlep-staging-network
    depends_on:
      - staging-backend
    restart: unless-stopped

  # Prometheus
  staging-prometheus:
    image: prom/prometheus:latest
    container_name: schlep-staging-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    volumes:
      - ./prometheus.staging.yml:/etc/prometheus/prometheus.yml
      - staging_prometheus_data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - schlep-staging-network
    restart: unless-stopped

  # Grafana
  staging-grafana:
    image: grafana/grafana:latest
    container_name: schlep-staging-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel,grafana-worldmap-panel
    volumes:
      - staging_grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3001:3000"
    networks:
      - schlep-staging-network
    restart: unless-stopped

  # AlertManager
  staging-alertmanager:
    image: prom/alertmanager:latest
    container_name: schlep-staging-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./alertmanager.staging.yml:/etc/alertmanager/alertmanager.yml
      - staging_alertmanager_data:/alertmanager
    ports:
      - "9094:9093"
    networks:
      - schlep-staging-network
    restart: unless-stopped

volumes:
  staging_postgres_data:
    driver: local
  staging_redis_data:
    driver: local
  staging_logs:
    driver: local
  staging_uploads:
    driver: local
  staging_prometheus_data:
    driver: local
  staging_grafana_data:
    driver: local
  staging_alertmanager_data:
    driver: local

networks:
  schlep-staging-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 