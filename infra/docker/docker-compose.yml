version: '3.8'

services:
  # Development environment configuration
  # For detailed configuration, see infrastructure/docker/docker-compose.dev.yml
  
  # API Backend
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
    volumes:
      - ./apps/api:/app
    depends_on:
      - postgres
      - redis

  # Admin Dashboard
  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
    ports:
      - "3002:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./apps/admin:/app
      - /app/node_modules

  # Landing Page
  landing:
    build:
      context: ./apps/landing
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./apps/landing:/app
      - /app/node_modules

  # API Documentation
  docs:
    build:
      context: ./apps/docs
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./apps/docs:/app
      - /app/node_modules

  # PostgreSQL Database
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: schlep_engine
      POSTGRES_USER: schlep_user
      POSTGRES_PASSWORD: schlep_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Redis Cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: 