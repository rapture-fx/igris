# Redis configuration optimized for ML model caching on Railway
# Based on validated performance requirements from Phase 2 testing

# Memory Management (Railway Redis optimized)
maxmemory 1gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Persistence for ML model caching
# Note: Railway Redis handles persistence, these are recommendations
save 900 1     # Save if at least 1 key changed in 900 seconds
save 300 10    # Save if at least 10 keys changed in 300 seconds  
save 60 10000  # Save if at least 10000 keys changed in 60 seconds

# Network optimization for ML workloads
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Client connection limits (Railway will override based on plan)
maxclients 10000

# Performance tuning for ML data
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Memory efficiency for large ML datasets
hll-sparse-max-bytes 3000

# Logging (Railway handles log aggregation)
loglevel notice
syslog-enabled no

# Security (Railway manages authentication)
protected-mode yes

# Performance for ML workloads
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# I/O threads for better performance
io-threads 4
io-threads-do-reads yes

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command DEBUG ""
rename-command CONFIG ""

# Memory usage tracking
memory-usage-sample-interval 1000

# Slow log for performance monitoring
slowlog-log-slower-than 10000  # 10ms
slowlog-max-len 128

# Client output buffer limits for ML streaming data
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60