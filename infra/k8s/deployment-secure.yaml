apiVersion: apps/v1
kind: Deployment
metadata:
  name: schlep-go-gateway
  namespace: default
  labels:
    app: schlep-gateway
    version: v2.0
    tier: api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: schlep-gateway
  template:
    metadata:
      labels:
        app: schlep-gateway
        version: v2.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: igris-inertial-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
      - name: gateway
        image: igris-inertial/go-gateway:v2.0
        imagePullPolicy: Always

        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: https
          containerPort: 8443
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP

        env:
        # Load from ConfigMap
        - name: SERVER_PORT
          valueFrom:
            configMapKeyRef:
              name: igris-inertial-config
              key: SERVER_PORT

        - name: TLS_PORT
          valueFrom:
            configMapKeyRef:
              name: igris-inertial-config
              key: TLS_PORT

        - name: TLS_ENABLED
          valueFrom:
            configMapKeyRef:
              name: igris-inertial-config
              key: TLS_ENABLED

        - name: ML_SERVICE_URL
          valueFrom:
            configMapKeyRef:
              name: igris-inertial-config
              key: ML_SERVICE_URL

        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: igris-inertial-config
              key: POSTGRES_HOST

        - name: REDIS_URL
          valueFrom:
            configMapKeyRef:
              name: igris-inertial-config
              key: REDIS_URL

        - name: NATS_URL
          valueFrom:
            configMapKeyRef:
              name: igris-inertial-config
              key: NATS_URL

        - name: JAEGER_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: igris-inertial-config
              key: JAEGER_ENDPOINT

        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: igris-inertial-config
              key: LOG_LEVEL

        # Load secrets from Kubernetes Secret
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: igris-inertial-secrets
              key: jwt-secret-key

        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: igris-inertial-secrets
              key: postgres-user

        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: igris-inertial-secrets
              key: postgres-password

        - name: POSTGRES_DB
          valueFrom:
            secretKeyRef:
              name: igris-inertial-secrets
              key: postgres-db

        # TLS certificate paths
        - name: TLS_CERT_FILE
          value: "/certs/tls.crt"

        - name: TLS_KEY_FILE
          value: "/certs/tls.key"

        volumeMounts:
        - name: tls-certs
          mountPath: /certs
          readOnly: true

        - name: tmp
          mountPath: /tmp

        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi

        livenessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health
            port: 8080
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 2

        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL

      volumes:
      - name: tls-certs
        secret:
          secretName: schlep-tls-certs
          defaultMode: 0400

      - name: tmp
        emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: schlep-gateway-service
  namespace: default
  labels:
    app: schlep-gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-ssl-cert: "${AWS_ACM_CERT_ARN}"
spec:
  type: LoadBalancer
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP

  - name: https
    port: 443
    targetPort: 8443
    protocol: TCP

  selector:
    app: schlep-gateway

  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: igris-inertial-sa
  namespace: default
  annotations:
    eks.amazonaws.com/role-arn: "${AWS_IAM_ROLE_ARN}"

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: schlep-gateway-pdb
  namespace: default
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: schlep-gateway

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: schlep-gateway-hpa
  namespace: default
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: schlep-go-gateway
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70

  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "1000"

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
