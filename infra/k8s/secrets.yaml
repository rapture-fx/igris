apiVersion: v1
kind: Secret
metadata:
  name: igris-inertial-secrets
  namespace: default
type: Opaque
stringData:
  # JWT Configuration
  jwt-secret-key: "${JWT_SECRET_KEY}"  # Replace with actual secret via sealed-secrets

  # Database Credentials
  postgres-user: "${POSTGRES_USER}"
  postgres-password: "${POSTGRES_PASSWORD}"
  postgres-db: "${POSTGRES_DB}"

  # Redis Configuration
  redis-password: "${REDIS_PASSWORD}"

  # ML Service Configuration
  ml-api-key: "${ML_API_KEY}"

  # Observability
  grafana-admin-password: "${GRAFANA_PASSWORD}"

---
apiVersion: v1
kind: Secret
metadata:
  name: schlep-tls-certs
  namespace: default
type: kubernetes.io/tls
data:
  # TLS certificate and key (base64 encoded)
  tls.crt: "${TLS_CERT_BASE64}"
  tls.key: "${TLS_KEY_BASE64}"

---
# SealedSecret example for production (requires sealed-secrets controller)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: igris-inertial-secrets-sealed
  namespace: default
spec:
  encryptedData:
    jwt-secret-key: "AgBx..." # Encrypted with kubeseal
    postgres-password: "AgBy..." # Encrypted with kubeseal
    redis-password: "AgBz..." # Encrypted with kubeseal
  template:
    metadata:
      name: igris-inertial-secrets
      namespace: default
    type: Opaque

---
# ConfigMap for non-sensitive configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: igris-inertial-config
  namespace: default
data:
  # Server Configuration
  SERVER_PORT: "8080"
  TLS_PORT: "8443"
  TLS_ENABLED: "true"

  # Service URLs
  ML_SERVICE_URL: "python-ml-service:50051"
  POSTGRES_HOST: "postgres-service"
  POSTGRES_PORT: "5432"
  REDIS_URL: "redis://redis-service:6379/0"
  NATS_URL: "nats://nats-service:4222"

  # Observability
  JAEGER_ENDPOINT: "http://jaeger-collector:14268/api/traces"
  PROMETHEUS_URL: "http://prometheus:9090"

  # Feature Flags
  ENABLE_METRICS: "true"
  ENABLE_TRACING: "true"
  ENABLE_ADAPTIVE_ROUTING: "true"
  ENABLE_INFERENCE_MESH: "true"

  # Performance Tuning
  ML_RETRY_MAX: "3"
  ML_RETRY_DELAY_MS: "100"
  ML_CONNECTION_TIMEOUT_SEC: "5"
  ML_REQUEST_TIMEOUT_SEC: "10"
  ML_CIRCUIT_BREAKER_ENABLED: "true"
  ML_CIRCUIT_BREAKER_FAILURE_THRESHOLD: "5"

  # Logging
  LOG_LEVEL: "INFO"
  LOG_FORMAT: "json"

---
# External Secrets Operator example (if using external secret manager)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: igris-inertial-external-secrets
  namespace: default
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: igris-inertial-secrets
    creationPolicy: Owner
  data:
    - secretKey: jwt-secret-key
      remoteRef:
        key: igris-inertial/jwt
        property: secret_key

    - secretKey: postgres-password
      remoteRef:
        key: igris-inertial/postgres
        property: password

    - secretKey: redis-password
      remoteRef:
        key: igris-inertial/redis
        property: password

---
# Secret Store configuration for Vault
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: default
spec:
  provider:
    vault:
      server: "https://vault.igris-inertial.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "igris-inertial"
          serviceAccountRef:
            name: "igris-inertial-sa"
