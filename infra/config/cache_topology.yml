# Cache Topology Configuration
# Supports multi-region cache routing with automatic failover

# Global cache settings
global:
  default_ttl: 3600  # Default TTL in seconds (1 hour)
  enable_geo_routing: false  # Enable geographic routing (requires X-Client-Region header)
  fallback_strategy: "nearest_first"  # Strategy: nearest_first, round_robin, random

# Regional cache nodes
# Each region has primary and backup cache nodes for high availability
regions:
  us-east:
    name: "US East"
    primary:
      host: "redis-us-east-1.internal"
      port: 6379
      db: 0
      pool_size: 20
      ttl: 3600
    backup:
      host: "redis-us-east-2.internal"
      port: 6379
      db: 0
      pool_size: 10
      ttl: 3600
    coordinates:
      latitude: 40.7128
      longitude: -74.0060

  us-west:
    name: "US West"
    primary:
      host: "redis-us-west-1.internal"
      port: 6379
      db: 0
      pool_size: 20
      ttl: 3600
    backup:
      host: "redis-us-west-2.internal"
      port: 6379
      db: 0
      pool_size: 10
      ttl: 3600
    coordinates:
      latitude: 37.7749
      longitude: -122.4194

  eu-west:
    name: "EU West"
    primary:
      host: "redis-eu-west-1.internal"
      port: 6379
      db: 0
      pool_size: 20
      ttl: 3600
    backup:
      host: "redis-eu-west-2.internal"
      port: 6379
      db: 0
      pool_size: 10
      ttl: 3600
    coordinates:
      latitude: 51.5074
      longitude: -0.1278

  ap-southeast:
    name: "Asia Pacific Southeast"
    primary:
      host: "redis-ap-southeast-1.internal"
      port: 6379
      db: 0
      pool_size: 20
      ttl: 3600
    backup:
      host: "redis-ap-southeast-2.internal"
      port: 6379
      db: 0
      pool_size: 10
      ttl: 3600
    coordinates:
      latitude: 1.3521
      longitude: 103.8198

# Central/fallback cache (used when region is unknown or unavailable)
central:
  name: "Central Cache"
  host: "localhost"  # Default to localhost for development
  port: 6379
  db: 0
  pool_size: 30
  ttl: 3600
  max_retries: 3

# Health check settings
health_check:
  enabled: true
  interval: 30  # seconds
  timeout: 5    # seconds
  failure_threshold: 3  # Mark node as unhealthy after N failures

# Region affinity rules
# Maps client regions to cache regions
affinity:
  us-east-1: "us-east"
  us-east-2: "us-east"
  us-west-1: "us-west"
  us-west-2: "us-west"
  eu-west-1: "eu-west"
  eu-west-2: "eu-west"
  eu-central-1: "eu-west"
  ap-southeast-1: "ap-southeast"
  ap-southeast-2: "ap-southeast"
  ap-northeast-1: "ap-southeast"

# Performance tuning
performance:
  connection_pool_min_idle: 5
  connection_pool_max_idle: 20
  connection_pool_max_active: 100
  connection_timeout_ms: 5000
  read_timeout_ms: 3000
  write_timeout_ms: 3000
  dial_timeout_ms: 5000

# Monitoring
monitoring:
  enable_metrics: true
  metrics_port: 9090
  prometheus_path: "/metrics"
  log_cache_hits: false  # Set to true for debugging
  log_cache_misses: false  # Set to true for debugging
