global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'igris-inertial-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules
rule_files:
  - '/etc/prometheus/rules.yml'

# Scrape configurations
scrape_configs:
  # =====================================================
  # Application Services
  # =====================================================

  # Go API Gateway (5 replicas)
  - job_name: 'go-gateway'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'go-gateway-1:8080'
          - 'go-gateway-2:8080'
          - 'go-gateway-3:8080'
          - 'go-gateway-4:8080'
          - 'go-gateway-5:8080'
        labels:
          service: 'go-gateway'
          layer: 'api'

  # Python ML Service (3 replicas)
  - job_name: 'python-ml'
    scrape_interval: 10s
    scrape_timeout: 5s
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'python-ml-1:9090'
          - 'python-ml-2:9090'
          - 'python-ml-3:9090'
        labels:
          service: 'python-ml'
          layer: 'ml'

  # =====================================================
  # Infrastructure Services
  # =====================================================

  # PostgreSQL
  - job_name: 'postgres'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'postgres:5432'
        labels:
          service: 'postgres'
          layer: 'database'

  # Redis
  - job_name: 'redis'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'redis:6379'
        labels:
          service: 'redis'
          layer: 'cache'

  # NATS
  - job_name: 'nats'
    scrape_interval: 30s
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'nats:8222'
        labels:
          service: 'nats'
          layer: 'messaging'

  # Nginx
  - job_name: 'nginx'
    scrape_interval: 30s
    metrics_path: '/nginx-status'
    static_configs:
      - targets:
          - 'nginx:80'
        labels:
          service: 'nginx'
          layer: 'loadbalancer'

  # =====================================================
  # System Monitoring
  # =====================================================

  # Node Exporter (host system metrics)
  - job_name: 'node-exporter'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'node-exporter:9100'
        labels:
          service: 'node-exporter'
          layer: 'system'

  # cAdvisor (container metrics)
  - job_name: 'cadvisor'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'cadvisor:8080'
        labels:
          service: 'cadvisor'
          layer: 'containers'

  # =====================================================
  # Observability Stack
  # =====================================================

  # Prometheus itself
  - job_name: 'prometheus'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'localhost:9090'
        labels:
          service: 'prometheus'
          layer: 'observability'

  # Alertmanager
  - job_name: 'alertmanager'
    scrape_interval: 30s
    static_configs:
      - targets:
          - 'alertmanager:9093'
        labels:
          service: 'alertmanager'
          layer: 'observability'

  # Jaeger
  - job_name: 'jaeger'
    scrape_interval: 30s
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - 'jaeger:14269'
        labels:
          service: 'jaeger'
          layer: 'observability'
