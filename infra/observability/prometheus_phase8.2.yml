# Prometheus Configuration for Phase 8.2 Production Hardening
# Scrapes metrics from Rust kernel, Go gateway, and Python ML services

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'schlep-engine-prod'
    phase: '8.2-canary'
    environment: 'production'

# Alerting configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']

# Rule files for alerting
rule_files:
  - '/etc/prometheus/rules/phase8.2_alerts.yml'

# Scrape configurations
scrape_configs:
  # Rust Kernel Metrics (Phase 10 Orchestration)
  - job_name: 'schlep-kernel-rust'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9100']
        labels:
          service: 'rust-kernel'
          component: 'adaptive-orchestration'
    metrics_path: '/metrics'

  # Policy Engine Metrics
  - job_name: 'policy-engine'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9101']
        labels:
          service: 'policy-engine'
          component: 'orchestration'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Feedback Loop Metrics
  - job_name: 'feedback-loop'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:9102']
        labels:
          service: 'feedback-loop'
          component: 'reinforcement-learning'

  # Drift Monitor Metrics
  - job_name: 'drift-monitor'
    scrape_interval: 5s  # More frequent for rapid drift detection
    static_configs:
      - targets: ['localhost:9103']
        labels:
          service: 'drift-monitor'
          component: 'anomaly-detection'

  # Go Gateway Metrics (Control Surface + Telemetry)
  - job_name: 'go-gateway'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:8081']  # Control Surface API
        labels:
          service: 'go-gateway'
          component: 'control-surface'
      - targets: ['localhost:8082']  # Telemetry Synthesizer
        labels:
          service: 'go-gateway'
          component: 'telemetry-synthesizer'
    metrics_path: '/metrics'

  # Python ML Service Metrics
  - job_name: 'python-ml'
    scrape_interval: 15s
    static_configs:
      - targets: ['localhost:8000']
        labels:
          service: 'python-ml'
          component: 'inference'
    metrics_path: '/metrics'

  # Cache Metrics (Phase 8 Prefetching)
  - job_name: 'cache-layer'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9104']
        labels:
          service: 'cache'
          component: 'prefetch-predictor'

  # Node Exporter (System Metrics)
  - job_name: 'node-exporter'
    scrape_interval: 30s
    static_configs:
      - targets: ['localhost:9100']
        labels:
          component: 'system'

  # Canary vs Stable Comparison
  - job_name: 'inference-canary'
    scrape_interval: 10s
    static_configs:
      - targets: ['inference-canary-phase10:8080']
        labels:
          endpoint: 'canary'
          phase: '10'
      - targets: ['inference-prod-stable:8080']
        labels:
          endpoint: 'stable'
          phase: '8'
    metrics_path: '/metrics'

# Remote write configuration (optional - for long-term storage)
remote_write:
  - url: 'http://localhost:9009/api/v1/write'
    queue_config:
      capacity: 10000
      max_shards: 5
      min_shards: 1
      max_samples_per_send: 1000
      batch_send_deadline: 5s
