version: '3.8'

services:
  # Production Go Gateway with full orchestration
  go-gateway:
    build:
      context: .
      dockerfile: docker/go-gateway/Dockerfile
      target: production
    image: igris-inertial/go-gateway:production
    container_name: schlep_gateway_prod
    environment:
      # Service Configuration
      APP_ENV: production
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      
      # Authentication & Security
      JWT_SECRET: ${JWT_SECRET}
      API_KEY_MASTER: ${API_KEY_MASTER}
      ENABLE_AUTH: "true"
      AUTH_TYPE: "jwt"
      
      # ML Service Configuration
      ML_SERVICE_URL: "python-ml:50051"
      ML_ENABLE_AUTH: "true"
      ML_JWT_SECRET: ${JWT_SECRET}
      
      # Database Configuration
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      DB_POOL_SIZE: "20"
      DB_MAX_OVERFLOW: "30"
      
      # Redis Configuration
      REDIS_URL: "redis://redis:6379/0"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      
      # Cache Configuration
      CACHE_TTL: "3600"
      MULTI_TIER_CACHE_ENABLED: "true"
      CACHE_COHERENCE_INTERVAL: "60"
      
      # Monitoring & Metrics
      ENABLE_METRICS: "true"
      PROMETHEUS_ENABLED: "true"
      JAEGER_ENABLED: "true"
      JAEGER_ENDPOINT: "http://jaeger:14268"
      LOG_LEVEL: "info"
      
      # Performance Configuration
      RATE_LIMIT_ENABLED: "true"
      RATE_LIMIT_PER_MIN: "1000"
      RATE_LIMIT_PER_HOUR: "50000"
      
      # Circuit Breaker Configuration
      CIRCUIT_BREAKER_ENABLED: "true"
      CIRCUIT_BREAKER_THRESHOLD: "5"
      CIRCUIT_BREAKER_TIMEOUT: "30s"
      
      # Adaptive Pool Configuration
      ML_POOL_MIN_WORKERS: "5"
      ML_POOL_MAX_WORKERS: "50"
      ML_POOL_SCALE_UP_THRESHOLD: "10"
      ML_POOL_TARGET_LATENCY: "40ms"
      
      # Cost Optimization
      COST_ROUTING_ENABLED: "true"
      TOKEN_COST_PER_1K: "0.002"
      
    ports:
      - "8080:8080"
    networks:
      - schlep_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      python-ml:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
      replicas: 2

  # Production Python ML Service with authentication
  python-ml:
    build:
      context: ./python_ml
      dockerfile: Dockerfile.production
    image: igris-inertial/python-ml:production
    container_name: schlep_ml_prod
    environment:
      # Service Configuration
      GRPC_PORT: "50051"
      MAX_WORKERS: "10"
      
      # Authentication
      ENABLE_AUTH: "true"
      JWT_SECRET: ${JWT_SECRET}
      AUTH_TYPE: "jwt"
      
      # Performance Configuration
      GRPC_MAX_SEND_LENGTH: "52428800"  # 50MB
      GRPC_MAX_RECV_LENGTH: "52428800"  # 50MB
      GRPC_KEEPALIVE_TIME: "30000"
      GRPC_KEEPALIVE_TIMEOUT: "10000"
      
      # Model Configuration
      DEFAULT_MODEL_PATH: "/models/default_model.pt"
      MODEL_CACHE_SIZE: "10"
      INFERENCE_TIMEOUT: "10s"
      
      # Monitoring
      LOG_LEVEL: "info"
      PROMETHELES_ENABLED: "true"
      
    ports:
      - "50051:50051"
    networks:
      - schlep_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import grpc; channel = grpc.insecure_channel('localhost:50051'); stub = ml_service_pb2_grpc.MLServiceStub(channel); response = stub.HealthCheck(ml_service_pb2.HealthCheckRequest(), timeout=5); exit(0 if response.status.startswith('healthy') else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
        reservations:
          memory: 1G
          cpus: '1.0'
    volumes:
      - ./models:/models:ro
      - ./logs:/var/log/ml

  # Production PostgreSQL with optimized configuration
  postgres:
    image: postgres:15-alpine
    container_name: schlep_postgres_prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-production.sql:/docker-entrypoint-initdb.d/init.sql
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    networks:
      - schlep_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    command: postgres -c max_connections=200 -c shared_buffers=256MB -c effective_cache_size=1GB -c maintenance_work_mem=64MB -c checkpoint_completion_target=0.9 -c wal_buffers=16MB -c default_statistics_target=100

  # Production Redis with persistence and optimizations
  redis:
    image: redis:7-alpine
    container_name: schlep_redis_prod
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis_data:/data
      - ./redis/redis-production.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "6379:6379"
    networks:
      - schlep_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Monitoring Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: schlep_prometheus_prod
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=10GB'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - schlep_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  grafana:
    image: grafana/grafana:latest
    container_name: schlep_grafana_prod
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    ports:
      - "3001:3000"
    networks:
      - schlep_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: schlep_jaeger_prod
    environment:
      COLLECTOR_ZIPKIN_HOST_PORT: "9411"
    ports:
      - "16686:16686"
      - "9411:9411"
    networks:
      - schlep_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Rust Kernel Service (optional for advanced features)
  rust-kernel:
    build:
      context: ./rust_kernel
      dockerfile: Dockerfile.production
    image: igris-inertial/rust-kernel:production
    container_name: schlep_rust_prod
    environment:
      RUST_LOG: "info"
      CACHE_COHERENCE_INTERVAL: "60"
      MEMORY_POOL_SIZE: "1000"
    networks:
      - schlep_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: schlep_nginx_prod
    volumes:
      - ./nginx/nginx.production.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/ssl:/etc/nginx/ssl
    ports:
      - "443:443"
      - "80:80"
    networks:
      - schlep_network
    depends_on:
      - go-gateway
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  schlep_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
