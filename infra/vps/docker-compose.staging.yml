services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - "8001:8000"  # Different port for staging
    environment:
      - PYTHONPATH=/app
      - DATABASE_URL=postgresql://postgres:password@postgres-staging:5432/igris_overture_staging
      - ENVIRONMENT=staging
    volumes:
      - ./apps/api:/app
    depends_on:
      - postgres-staging
    networks:
      - igris-inertial-staging

  postgres-staging:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=igris_overture_staging
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # Different port for staging
    networks:
      - igris-inertial-staging

  frontend:
    build:
      context: ./apps/web-frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"  # Different port for staging
    environment:
      - VITE_API_URL=http://45.77.44.216:8001
      - ENVIRONMENT=staging
    networks:
      - igris-inertial-staging

networks:
  igris-inertial-staging:
    driver: bridge

volumes:
  postgres_staging_data: