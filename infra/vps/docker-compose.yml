version: '3.9'

services:
  schlep-api:
    build:
      context: ../../
      dockerfile: Dockerfile
    command: ["/app/schlep-api"]
    ports:
      - "8080:8080"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - schlep-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - schlep-network

networks:
  schlep-network:
    driver: bridge

volumes:
  redis-data:
