version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: schlep_postgres
    environment:
      POSTGRES_DB: igris_overture
      POSTGRES_USER: schlep_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    networks:
      - schlep_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schlep_user -d igris_overture"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Streams - Optimized for Real-Time Processing
  redis:
    image: redis:7-alpine
    container_name: schlep_redis
    command: redis-server /etc/redis/redis.conf
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis-streams.conf:/etc/redis/redis.conf:ro
    networks:
      - schlep_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # FastAPI Backend with Real-Time Streaming
  backend:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: schlep_backend
    environment:
      - DATABASE_URL=postgresql://schlep_user:${POSTGRES_PASSWORD}@postgres:5432/igris_overture
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ENVIRONMENT=production
      - DEBUG=false
      - ALLOWED_ORIGINS=https://igris-inertial.com,https://admin.igris-inertial.com,https://docs.igris-inertial.com
      - ALLOWED_HOSTS=api.igris-inertial.com,45.77.44.216
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      # Real-time streaming configuration
      - ENABLE_STREAM_PRODUCERS=true
      - ENABLE_STREAM_CONSUMERS=true
      - ENABLE_NOTIFICATIONS=true
      - STREAM_PRODUCER_RATE_LIMIT=100
      - SMTP_SERVER=${SMTP_SERVER:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - FROM_EMAIL=${FROM_EMAIL:-notifications@igris-inertial.com}
    ports:
      - "3001:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis_streams_init:
        condition: service_completed_successfully
    networks:
      - schlep_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - backend_logs:/app/logs

  # Next.js Landing Page
  landing:
    build:
      context: ./apps/web-landing
      dockerfile: Dockerfile
    container_name: schlep_landing
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.igris-inertial.com
      - NEXT_PUBLIC_DOCS_URL=https://docs.igris-inertial.com
      - NEXT_PUBLIC_ADMIN_URL=https://admin.igris-inertial.com
    ports:
      - "3000:3000"
    networks:
      - schlep_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Admin Dashboard
  admin:
    build:
      context: ./apps/web-admin
      dockerfile: Dockerfile
    container_name: schlep_admin
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.igris-inertial.com
      - NEXT_PUBLIC_BYPASS_AUTH=${BYPASS_AUTH:-false}
    ports:
      - "3002:3000"
    networks:
      - schlep_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Next.js Documentation
  docs:
    build:
      context: ./apps/web-docs
      dockerfile: Dockerfile
    container_name: schlep_docs
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://api.igris-inertial.com
    ports:
      - "3003:3000"
    networks:
      - schlep_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: schlep_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - landing
      - admin
      - docs
    networks:
      - schlep_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Streams Initialization
  redis_streams_init:
    image: redis:7-alpine
    container_name: schlep_redis_init
    networks:
      - schlep_network
    depends_on:
      redis:
        condition: service_healthy
    command: >
      sh -c "
        redis-cli -h redis -p 6379 -a ${REDIS_PASSWORD} XGROUP CREATE iot_sensors iot_processing 0 MKSTREAM || true &&
        redis-cli -h redis -p 6379 -a ${REDIS_PASSWORD} XGROUP CREATE financial_transactions financial_processing 0 MKSTREAM || true &&
        redis-cli -h redis -p 6379 -a ${REDIS_PASSWORD} XGROUP CREATE ecommerce_events ecommerce_processing 0 MKSTREAM || true &&
        redis-cli -h redis -p 6379 -a ${REDIS_PASSWORD} XGROUP CREATE domain_events event_processing 0 MKSTREAM || true &&
        echo 'Redis Streams initialized successfully'
      "
    restart: "no"

  # Stream Producer Service
  stream_producer:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: schlep_stream_producer
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - STREAM_SERVICE_MODE=producer
      - IOT_PRODUCER_RATE=5
      - FINANCIAL_PRODUCER_RATE=20
      - ECOMMERCE_PRODUCER_RATE=50
      - LOG_LEVEL=INFO
    depends_on:
      redis_streams_init:
        condition: service_completed_successfully
    networks:
      - schlep_network
    restart: unless-stopped
    command: ["python", "-m", "app.services"]
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # Stream Consumer Service
  stream_consumer:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: schlep_stream_consumer
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - DATABASE_URL=postgresql://schlep_user:${POSTGRES_PASSWORD}@postgres:5432/igris_overture
      - STREAM_SERVICE_MODE=consumer
      - LOG_LEVEL=INFO
    depends_on:
      redis_streams_init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      - schlep_network
    restart: unless-stopped
    command: ["python", "-m", "app.services"]
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Certbot for SSL
  certbot:
    image: certbot/certbot
    container_name: schlep_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    command: certonly --webroot --webroot-path=/var/www/certbot --email admin@igris-inertial.com --agree-tos --no-eff-email -d igris-inertial.com -d api.igris-inertial.com -d admin.igris-inertial.com -d docs.igris-inertial.com
    depends_on:
      - nginx

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  nginx_logs:
    driver: local

networks:
  schlep_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16