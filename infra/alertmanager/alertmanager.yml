global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: slack-warnings
  routes:
    - match:
        severity: critical
      receiver: slack-pagerduty
      continue: false
    - match:
        severity: warning
      receiver: slack-warnings

receivers:
  - name: slack-warnings
    slack_configs:
      - api_url: '{{ env "SLACK_ALERTS_WEBHOOK" }}'
        channel: '#alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

  - name: slack-pagerduty
    slack_configs:
      - api_url: '{{ env "SLACK_ALERTS_WEBHOOK" }}'
        channel: '#alerts'
        send_resolved: true
        title: ':fire: [CRITICAL] {{ .CommonAnnotations.summary }}'
        text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
    pagerduty_configs:
      - routing_key: '{{ env "PAGERDUTY_KEY" }}'
        description: '{{ .CommonAnnotations.summary }}'
        details:
          description: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ['alertname']
