{{- if .Values.gateway.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "igris-inertial.fullname" . }}-gateway
  labels:
    {{- include "igris-inertial.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  {{- if not .Values.gateway.autoscaling.enabled }}
  replicas: {{ .Values.gateway.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "igris-inertial.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "igris-inertial.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: gateway
        version: {{ .Values.gateway.image.tag | quote }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "igris-inertial.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: gateway
        image: "{{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}"
        imagePullPolicy: {{ .Values.gateway.image.pullPolicy }}
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        env:
        {{- range .Values.gateway.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        - name: REDIS_ADDRESS
          value: "{{ .Release.Name }}-redis-master:6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "igris-inertial.fullname" . }}-secrets
              key: redis-password
        - name: DB_HOST
          value: "{{ .Release.Name }}-postgresql"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{ include "igris-inertial.fullname" . }}-secrets
              key: db-password
        - name: JAEGER_AGENT_HOST
          value: "{{ .Release.Name }}-jaeger-agent"
        - name: JAEGER_AGENT_PORT
          value: "6831"
        livenessProbe:
          {{- toYaml .Values.gateway.livenessProbe | nindent 10 }}
        readinessProbe:
          {{- toYaml .Values.gateway.readinessProbe | nindent 10 }}
        resources:
          {{- toYaml .Values.gateway.resources | nindent 10 }}
        volumeMounts:
        - name: config
          mountPath: /etc/igris-inertial
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: {{ include "igris-inertial.fullname" . }}-config
{{- end }}
