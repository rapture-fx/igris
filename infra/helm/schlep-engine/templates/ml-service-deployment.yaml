{{- if .Values.mlService.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "igris-inertial.fullname" . }}-ml-service
  labels:
    {{- include "igris-inertial.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml-service
spec:
  {{- if not .Values.mlService.autoscaling.enabled }}
  replicas: {{ .Values.mlService.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "igris-inertial.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ml-service
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "50051"
        prometheus.io/path: "/metrics"
      labels:
        {{- include "igris-inertial.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ml-service
        version: {{ .Values.mlService.image.tag | quote }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "igris-inertial.serviceAccountName" . }}
      containers:
      - name: ml-service
        image: "{{ .Values.mlService.image.repository }}:{{ .Values.mlService.image.tag }}"
        imagePullPolicy: {{ .Values.mlService.image.pullPolicy }}
        ports:
        - name: grpc
          containerPort: 50051
          protocol: TCP
        env:
        - name: MODEL_STORAGE_PATH
          value: "/models"
        - name: METRICS_ENABLED
          value: "true"
        livenessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          grpc:
            port: 50051
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          {{- toYaml .Values.mlService.resources | nindent 10 }}
        volumeMounts:
        - name: model-storage
          mountPath: /models
          readOnly: true
      volumes:
      - name: model-storage
        persistentVolumeClaim:
          claimName: {{ include "igris-inertial.fullname" . }}-models
{{- end }}
