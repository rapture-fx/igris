# Default values for schlep-engine
# This is a YAML-formatted file.

global:
  imageRegistry: ""
  imagePullSecrets: []

# Go Gateway Configuration
gateway:
  enabled: true
  replicaCount: 3
  image:
    repository: schlep-engine/go-gateway
    pullPolicy: IfNotPresent
    tag: "2.0.0"

  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
    annotations: {}

  ingress:
    enabled: true
    className: "nginx"
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/rate-limit: "100"
    hosts:
      - host: api.schlep-engine.com
        paths:
          - path: /
            pathType: Prefix
    tls:
      - secretName: schlep-engine-tls
        hosts:
          - api.schlep-engine.com

  resources:
    limits:
      cpu: 1000m
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

  livenessProbe:
    httpGet:
      path: /health
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  readinessProbe:
    httpGet:
      path: /ready
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

  env:
    - name: LOG_LEVEL
      value: "info"
    - name: METRICS_ENABLED
      value: "true"
    - name: TRACING_ENABLED
      value: "true"
    - name: CACHE_L1_CAPACITY
      value: "1000"
    - name: CACHE_L1_TTL
      value: "5m"

# Rust Kernel Configuration (FFI worker)
rustKernel:
  enabled: true
  replicaCount: 2
  image:
    repository: schlep-engine/rust-kernel
    pullPolicy: IfNotPresent
    tag: "2.0.0"

  service:
    type: ClusterIP
    port: 50051
    targetPort: 50051

  resources:
    limits:
      cpu: 2000m
      memory: 2Gi
    requests:
      cpu: 1000m
      memory: 1Gi

  autoscaling:
    enabled: false

# ML Service Configuration (Python inference)
mlService:
  enabled: true
  replicaCount: 5
  image:
    repository: schlep-engine/ml-service
    pullPolicy: IfNotPresent
    tag: "2.0.0"

  service:
    type: ClusterIP
    port: 50051
    targetPort: 50051

  resources:
    limits:
      cpu: 2000m
      memory: 4Gi
    requests:
      cpu: 1000m
      memory: 2Gi

  autoscaling:
    enabled: true
    minReplicas: 5
    maxReplicas: 20
    targetCPUUtilizationPercentage: 75
    # Custom metrics from Phase 4
    customMetrics:
      - type: Pods
        pods:
          metric:
            name: ml_inference_latency_p99
          target:
            type: AverageValue
            averageValue: "100"  # 100ms P99 threshold

# Redis Cache (L2 tier from Phase 3)
redis:
  enabled: true
  auth:
    enabled: true
    password: "schlep-redis-secret"
  master:
    persistence:
      enabled: true
      size: 10Gi
  replica:
    replicaCount: 2
    persistence:
      enabled: true
      size: 10Gi
  metrics:
    enabled: true

# PostgreSQL Database (Model Registry from Phase 2)
postgresql:
  enabled: true
  auth:
    username: schlep
    password: "schlep-db-secret"
    database: schlep_engine
  primary:
    persistence:
      enabled: true
      size: 20Gi
  metrics:
    enabled: true

# Prometheus Monitoring (Phase 4)
prometheus:
  enabled: true
  server:
    retention: "30d"
    persistentVolume:
      enabled: true
      size: 50Gi
  alertmanager:
    enabled: true
  pushgateway:
    enabled: true

# Jaeger Tracing (Phase 4)
jaeger:
  enabled: true
  collector:
    replicaCount: 2
  query:
    enabled: true
  agent:
    enabled: true

# ConfigMaps
configMaps:
  cacheTopology:
    enabled: true
    data:
      cache_topology.yml: |
        # From Phase 3
        global:
          enable_geo_routing: true
          fallback_strategy: "nearest_first"
        regions:
          us-east:
            name: "US East"
            primary:
              host: "redis-master.default.svc.cluster.local"
              port: 6379

# Secrets (externalize in production)
secrets:
  enabled: true
  data:
    redis-password: "c2NobGVwLXJlZGlzLXNlY3JldA=="  # base64: schlep-redis-secret
    db-password: "c2NobGVwLWRiLXNlY3JldA=="        # base64: schlep-db-secret

# Persistent Volume Claims
persistence:
  modelStorage:
    enabled: true
    storageClass: "standard"
    accessMode: ReadWriteMany
    size: 100Gi

  dataStorage:
    enabled: true
    storageClass: "standard"
    accessMode: ReadWriteMany
    size: 50Gi

# Service Account
serviceAccount:
  create: true
  annotations: {}
  name: "schlep-engine"

# Network Policies
networkPolicy:
  enabled: false

# Pod Security Policies
podSecurityPolicy:
  enabled: false

# Canary Deployment (Task 5.3)
canary:
  enabled: false
  steps:
    - setWeight: 10
    - pause: {duration: 5m}
    - setWeight: 25
    - pause: {duration: 5m}
    - setWeight: 50
    - pause: {duration: 10m}
    - setWeight: 75
    - pause: {duration: 5m}
  analysis:
    interval: 1m
    threshold: 3
    metrics:
      - name: error-rate
        interval: 1m
        successCondition: result < 0.05  # <5% error rate
      - name: latency-p99
        interval: 1m
        successCondition: result < 100  # <100ms P99
