# Schlep-engine Automated Secret Rotation Configuration
# Comprehensive secret management and rotation system

# =====================================
# GLOBAL CONFIGURATION
# =====================================

global:
  rotation_schedule: "0 2 * * 0"  # Weekly at 2 AM UTC on Sundays
  backup_retention_days: 90
  notification_channels: ["slack-security", "email-security"]
  dry_run_mode: false
  encryption_key_id: "igris-inertial-master-key"
  vault_endpoint: "https://vault.igris-inertial.com"

# =====================================
# SECRET CATEGORIES AND ROTATION POLICIES
# =====================================

secret_categories:
  database_credentials:
    description: "Database connection credentials"
    rotation_frequency: "weekly"
    grace_period_hours: 24
    validation_required: true
    backup_required: true

  api_keys:
    description: "External API keys and tokens"
    rotation_frequency: "monthly"
    grace_period_hours: 72
    validation_required: true
    backup_required: true

  jwt_secrets:
    description: "JWT signing and encryption keys"
    rotation_frequency: "monthly"
    grace_period_hours: 48
    validation_required: true
    backup_required: true

  oauth_credentials:
    description: "OAuth client secrets"
    rotation_frequency: "quarterly"
    grace_period_hours: 168  # 1 week
    validation_required: true
    backup_required: true

  encryption_keys:
    description: "Data encryption keys"
    rotation_frequency: "monthly"
    grace_period_hours: 24
    validation_required: true
    backup_required: true

  certificates:
    description: "SSL/TLS certificates"
    rotation_frequency: "annually"
    auto_renew_days_before: 30
    validation_required: true
    backup_required: true

# =====================================
# SECRET DEFINITIONS
# =====================================

secrets:
  # Database Credentials
  postgres_master_password:
    category: "database_credentials"
    type: "password"
    length: 32
    complexity: "high"
    environments: ["production", "staging"]
    services: ["api", "ml-pipeline", "data-processor"]
    vault_path: "secret/database/postgres/master"
    k8s_secret: "postgres-credentials"
    validation:
      - type: "connection_test"
        endpoint: "${DATABASE_HOST}:5432"
        timeout: 30
    post_rotation:
      - type: "update_k8s_secret"
      - type: "restart_deployments"
        deployments: ["api", "ml-pipeline"]
      - type: "notify_teams"

  postgres_app_password:
    category: "database_credentials"
    type: "password"
    length: 24
    complexity: "medium"
    environments: ["production", "staging"]
    services: ["api"]
    vault_path: "secret/database/postgres/app"
    k8s_secret: "postgres-app-credentials"
    validation:
      - type: "connection_test"
        endpoint: "${DATABASE_HOST}:5432"
    dependencies: ["postgres_master_password"]

  redis_password:
    category: "database_credentials"
    type: "password"
    length: 20
    complexity: "medium"
    environments: ["production", "staging"]
    services: ["api", "cache-service"]
    vault_path: "secret/database/redis/auth"
    k8s_secret: "redis-credentials"
    validation:
      - type: "connection_test"
        endpoint: "${REDIS_HOST}:6379"

  # JWT and Encryption Secrets
  jwt_signing_key:
    category: "jwt_secrets"
    type: "rsa_key"
    key_size: 2048
    environments: ["production", "staging"]
    services: ["api", "auth-service"]
    vault_path: "secret/auth/jwt/signing"
    k8s_secret: "jwt-keys"
    validation:
      - type: "key_validation"
      - type: "jwt_test"
    post_rotation:
      - type: "gradual_rollout"
        rollout_strategy: "blue_green"

  jwt_encryption_key:
    category: "jwt_secrets"
    type: "symmetric_key"
    length: 32
    encoding: "base64"
    environments: ["production", "staging"]
    services: ["api"]
    vault_path: "secret/auth/jwt/encryption"
    k8s_secret: "jwt-encryption"
    validation:
      - type: "encryption_test"

  data_encryption_key:
    category: "encryption_keys"
    type: "aes_key"
    length: 32
    environments: ["production", "staging"]
    services: ["api", "data-processor"]
    vault_path: "secret/encryption/data"
    k8s_secret: "data-encryption-key"
    validation:
      - type: "encryption_test"
      - type: "decryption_test"
    post_rotation:
      - type: "key_migration"
        migration_strategy: "dual_key"

  # OAuth Credentials
  google_oauth_secret:
    category: "oauth_credentials"
    type: "external_managed"
    provider: "google"
    environments: ["production", "staging"]
    services: ["api", "auth-service"]
    vault_path: "secret/oauth/google/client_secret"
    k8s_secret: "oauth-google"
    validation:
      - type: "oauth_flow_test"
        provider: "google"
    rotation_method: "manual_with_notification"

  github_oauth_secret:
    category: "oauth_credentials"
    type: "external_managed"
    provider: "github"
    environments: ["production", "staging"]
    services: ["api", "auth-service"]
    vault_path: "secret/oauth/github/client_secret"
    k8s_secret: "oauth-github"
    validation:
      - type: "oauth_flow_test"
        provider: "github"
    rotation_method: "manual_with_notification"

  # External API Keys
  stripe_api_key:
    category: "api_keys"
    type: "external_managed"
    provider: "stripe"
    environments: ["production", "staging"]
    services: ["api", "payment-service"]
    vault_path: "secret/external/stripe/api_key"
    k8s_secret: "stripe-credentials"
    validation:
      - type: "api_test"
        endpoint: "https://api.stripe.com/v1/account"
    rotation_method: "provider_api"

  sendgrid_api_key:
    category: "api_keys"
    type: "external_managed"
    provider: "sendgrid"
    environments: ["production", "staging"]
    services: ["api", "notification-service"]
    vault_path: "secret/external/sendgrid/api_key"
    k8s_secret: "sendgrid-credentials"
    validation:
      - type: "api_test"
        endpoint: "https://api.sendgrid.com/v3/user/account"

  # SSL Certificates
  api_tls_certificate:
    category: "certificates"
    type: "tls_certificate"
    domains: ["api.igris-inertial.com", "*.api.igris-inertial.com"]
    ca_provider: "letsencrypt"
    environments: ["production"]
    services: ["ingress-controller", "api"]
    vault_path: "secret/tls/api"
    k8s_secret: "api-tls-cert"
    validation:
      - type: "certificate_validation"
      - type: "ssl_test"
        endpoint: "https://api.igris-inertial.com"
    auto_renewal: true

  app_tls_certificate:
    category: "certificates"
    type: "tls_certificate"
    domains: ["app.igris-inertial.com"]
    ca_provider: "letsencrypt"
    environments: ["production"]
    services: ["ingress-controller"]
    vault_path: "secret/tls/app"
    k8s_secret: "app-tls-cert"
    validation:
      - type: "certificate_validation"
      - type: "ssl_test"
        endpoint: "https://app.igris-inertial.com"
    auto_renewal: true

# =====================================
# ROTATION STRATEGIES
# =====================================

rotation_strategies:
  blue_green:
    description: "Blue-green deployment for zero-downtime rotation"
    steps:
      - name: "generate_new_secret"
        action: "create_new_secret_version"
      - name: "deploy_green"
        action: "deploy_with_new_secret"
        target: "green_environment"
      - name: "validate_green"
        action: "run_validation_tests"
        target: "green_environment"
      - name: "switch_traffic"
        action: "update_load_balancer"
        percentage: 100
      - name: "cleanup_blue"
        action: "cleanup_old_environment"
        delay: "1h"

  gradual_rollout:
    description: "Gradual rollout with canary deployment"
    steps:
      - name: "generate_new_secret"
        action: "create_new_secret_version"
      - name: "deploy_canary"
        action: "deploy_with_new_secret"
        target: "canary_pods"
        percentage: 10
      - name: "validate_canary"
        action: "run_validation_tests"
        target: "canary_pods"
      - name: "scale_deployment"
        action: "increase_new_version"
        percentages: [25, 50, 75, 100]
        interval: "15m"
      - name: "cleanup_old"
        action: "remove_old_secret"
        delay: "24h"

  dual_key:
    description: "Dual key strategy for encryption key rotation"
    steps:
      - name: "generate_new_key"
        action: "create_new_encryption_key"
      - name: "deploy_dual_keys"
        action: "deploy_both_keys"
        mode: "read_new_write_old"
      - name: "migrate_data"
        action: "re_encrypt_data"
        batch_size: 1000
      - name: "switch_mode"
        action: "change_mode"
        mode: "read_old_write_new"
      - name: "complete_migration"
        action: "finalize_migration"
      - name: "remove_old_key"
        action: "cleanup_old_key"
        delay: "7d"

# =====================================
# VALIDATION TESTS
# =====================================

validation_tests:
  connection_test:
    timeout: 30
    retry_attempts: 3
    retry_delay: 5
    success_criteria:
      - "connection_established"
      - "authentication_successful"

  api_test:
    timeout: 60
    retry_attempts: 3
    retry_delay: 10
    success_criteria:
      - "http_status_200"
      - "valid_response_format"
      - "authentication_successful"

  oauth_flow_test:
    timeout: 120
    retry_attempts: 2
    retry_delay: 30
    success_criteria:
      - "authorization_url_generated"
      - "token_exchange_successful"
      - "user_info_retrieved"

  encryption_test:
    timeout: 30
    test_data: "test_encryption_string_123"
    success_criteria:
      - "encryption_successful"
      - "data_integrity_maintained"

  jwt_test:
    timeout: 30
    test_payload: {"sub": "test", "exp": "future"}
    success_criteria:
      - "token_generation_successful"
      - "token_validation_successful"
      - "signature_verification_passed"

  certificate_validation:
    timeout: 60
    checks:
      - "certificate_validity"
      - "certificate_chain"
      - "expiration_date"
      - "domain_matching"

  ssl_test:
    timeout: 30
    checks:
      - "ssl_handshake"
      - "certificate_trust"
      - "cipher_strength"

# =====================================
# NOTIFICATION CONFIGURATION
# =====================================

notifications:
  channels:
    slack-security:
      type: "slack"
      webhook_url: "${SLACK_SECURITY_WEBHOOK}"
      channel: "#security-alerts"
      mention_users: ["@security-team"]

    email-security:
      type: "email"
      smtp_host: "${SMTP_HOST}"
      recipients: ["security@igris-inertial.com", "devops@igris-inertial.com"]

  events:
    rotation_started:
      message: "🔄 Secret rotation started for {{ secret_name }}"
      channels: ["slack-security"]
      severity: "info"

    rotation_completed:
      message: "✅ Secret rotation completed successfully for {{ secret_name }}"
      channels: ["slack-security", "email-security"]
      severity: "info"

    rotation_failed:
      message: "❌ Secret rotation failed for {{ secret_name }}: {{ error_message }}"
      channels: ["slack-security", "email-security"]
      severity: "error"
      escalation: true

    validation_failed:
      message: "⚠️ Secret validation failed for {{ secret_name }}: {{ validation_error }}"
      channels: ["slack-security", "email-security"]
      severity: "warning"

    certificate_expiry_warning:
      message: "⏰ Certificate {{ certificate_name }} expires in {{ days_remaining }} days"
      channels: ["slack-security", "email-security"]
      severity: "warning"
      advance_notice_days: [30, 14, 7, 1]

# =====================================
# COMPLIANCE AND AUDIT
# =====================================

compliance:
  audit_logging:
    enabled: true
    retention_days: 2555  # 7 years for compliance
    log_level: "detailed"
    include_secret_metadata: true
    exclude_secret_values: true

  access_controls:
    require_approval: true
    approval_workflows:
      - environment: "production"
        approvers: ["security-team", "devops-lead"]
        approval_timeout: "24h"
      - environment: "staging"
        approvers: ["devops-team"]
        approval_timeout: "4h"

  compliance_frameworks:
    - name: "SOC2"
      requirements:
        - "access_logging"
        - "separation_of_duties"
        - "change_management"
    - name: "GDPR"
      requirements:
        - "data_encryption"
        - "access_controls"
        - "audit_trails"

# =====================================
# DISASTER RECOVERY
# =====================================

disaster_recovery:
  backup_strategy:
    frequency: "daily"
    retention_policy: "90d"
    encryption: "enabled"
    storage_locations:
      - "primary_vault"
      - "backup_vault_region"
      - "offline_backup"

  recovery_procedures:
    rto: "4h"  # Recovery Time Objective
    rpo: "1h"  # Recovery Point Objective

    steps:
      - name: "assess_impact"
        timeout: "30m"
      - name: "restore_from_backup"
        timeout: "2h"
      - name: "validate_secrets"
        timeout: "1h"
      - name: "update_services"
        timeout: "30m"

  emergency_contacts:
    - role: "Security Lead"
      contact: "+1-555-0101"
      email: "security-lead@igris-inertial.com"
    - role: "DevOps Lead"
      contact: "+1-555-0102"
      email: "devops-lead@igris-inertial.com"
    - role: "CTO"
      contact: "+1-555-0103"
      email: "cto@igris-inertial.com"

# =====================================
# MONITORING AND METRICS
# =====================================

monitoring:
  metrics:
    - name: "secret_rotation_success_rate"
      type: "gauge"
      labels: ["secret_name", "environment"]
    - name: "secret_rotation_duration"
      type: "histogram"
      labels: ["secret_name", "rotation_strategy"]
    - name: "secret_validation_failures"
      type: "counter"
      labels: ["secret_name", "validation_type"]
    - name: "certificate_expiry_days"
      type: "gauge"
      labels: ["certificate_name", "domain"]

  alerts:
    - name: "SecretRotationFailed"
      condition: "secret_rotation_success_rate < 1"
      for: "1m"
      severity: "critical"
    - name: "SecretValidationFailing"
      condition: "secret_validation_failures > 0"
      for: "5m"
      severity: "high"
    - name: "CertificateExpiryWarning"
      condition: "certificate_expiry_days < 30"
      for: "1h"
      severity: "medium"

# =====================================
# ENVIRONMENT-SPECIFIC OVERRIDES
# =====================================

environments:
  production:
    rotation_approval_required: true
    backup_required: true
    validation_required: true
    notification_level: "all"

  staging:
    rotation_approval_required: false
    backup_required: true
    validation_required: true
    notification_level: "errors_only"

  development:
    rotation_approval_required: false
    backup_required: false
    validation_required: false
    notification_level: "none"