version: '3.8'

services:
  vault:
    image: hashicorp/vault:1.15
    container_name: schlep_vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
      - vault_logs:/vault/logs
      - ./vault-config.hcl:/vault/config/vault-config.hcl:ro
      - ./certs:/vault/certs:ro
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_ADDR: 'https://127.0.0.1:8200'
      VAULT_API_ADDR: 'https://vault.igris-inertial.internal:8200'
    command: server
    networks:
      - schlep_network
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Vault auto-unsealer (optional - for production automation)
  vault-init:
    image: hashicorp/vault:1.15
    container_name: schlep_vault_init
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - ./scripts:/scripts:ro
      - vault_keys:/vault/keys
    environment:
      VAULT_ADDR: 'https://vault:8200'
      VAULT_SKIP_VERIFY: 'true'  # Only for initial setup
    command: /scripts/vault-init.sh
    networks:
      - schlep_network
    restart: "no"

volumes:
  vault_data:
    driver: local
  vault_logs:
    driver: local
  vault_keys:
    driver: local

networks:
  schlep_network:
    external: true
