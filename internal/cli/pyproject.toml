[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schlep-cli"
version = "0.1.0"
description = "Official Schlep-engine CLI for onboarding, key management, and inference testing"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Schlep-engine Team", email = "hello@schlep-engine.com"}
]
keywords = [
    "schlep",
    "schlep-engine",
    "cli",
    "ai-routing",
    "llm",
    "devops"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities"
]
requires-python = ">=3.8"
dependencies = [
    "click>=8.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]

[project.scripts]
schlep = "schlep_cli.main:cli"

[project.urls]
Homepage = "https://github.com/schlep-engine/schlep-engine"
Documentation = "https://github.com/schlep-engine/schlep-engine/blob/main/internal/cli/README.md"
Repository = "https://github.com/schlep-engine/schlep-engine"

[tool.setuptools.packages.find]
where = ["."]
include = ["schlep_cli*"]

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
